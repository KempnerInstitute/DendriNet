[mypy]
# Basic mypy configuration for dendritic_modeling project

# Python version
python_version = 3.11

# Import discovery
ignore_missing_imports = True
follow_imports = silent

# Error reporting
show_error_codes = True
pretty = True
color_output = True

# Strictness levels (start moderate, can increase over time)
warn_return_any = False
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True

# Disable some checks for third-party libraries
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# Enable some useful checks
no_implicit_optional = True
strict_optional = True

# Exclude problematic directories for now
exclude = (^tests/.*$|^scripts/.*$|^docs/.*$|^results/.*$)

# Per-module settings for gradual adoption
[mypy-dendritic_modeling.utils.gpu_estimation]
ignore_errors = True

[mypy-dendritic_modeling.utils.information.*]
ignore_errors = True

[mypy-dendritic_modeling.utils.math.*]
ignore_errors = True

[mypy-dendritic_modeling.plotting.*]
ignore_errors = True

[mypy-dendritic_modeling.analysis.*]
ignore_errors = True 