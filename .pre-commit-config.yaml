repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        entry: python -m pytest
        language: system
        args: ["-m", "not slow and not requires_gpu", "--maxfail=3", "-q"]
        pass_filenames: false
        always_run: false
        stages: [commit]

      - id: test-imports
        name: test-imports
        entry: python
        language: system
        args: ["-c", "import dendritic_modeling; print(' Package imports successfully')"]
        pass_filenames: false
        always_run: true
        stages: [commit]
        