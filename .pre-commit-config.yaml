repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '^external/'
      - id: ruff-format
        exclude: '^external/'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: '^external/'

  - repo: local
    hooks:
      - id: test-imports
        name: test-imports
        entry: python
        language: system
        args: ["-c", "import dendritic_modeling; print(' Package imports successfully')"]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
