repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '^external/'

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: '^external/'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: '^external/'

  - repo: local
    hooks:
      - id: pytest-validator-guard
        name: pytest validator guardrails
        entry: >
          bash -c 'PYTHONPATH=src MPLBACKEND=Agg CUDA_VISIBLE_DEVICES=""
          python -m pytest
          tests/test_training_stability_validator.py
          tests/test_config_validation_utils.py
          tests/test_model_architecture_validator_utils.py
          -q --no-cov'
        language: system
        pass_filenames: false
        stages: [pre-commit]
