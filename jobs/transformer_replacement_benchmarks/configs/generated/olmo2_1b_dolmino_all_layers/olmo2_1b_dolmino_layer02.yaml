# OLMo-2 1B dendritic MLP replacement, layer 2
#
# Data: allenai/dolmino-mix-1124, streamed from Hugging Face.
# Target MLP layers: [2]

experiment:
  seed: 612

model:
  task: "language_modeling"
  transformer_replacement:
    enabled: true
    model_name: "allenai/OLMo-2-0425-1B"
    layers: [2]
    target_module: "mlp"
    layers_attr: "model.layers"
    input_transform: "signed_split"
    preserve_device_dtype: true
    model_kwargs:
      trust_remote_code: true
      torch_dtype: "auto"
    replacement_kwargs:
      output_init_std: 0.02

  core:
    type: "dendritic_ffn"
    architecture:
      excitatory_layer_sizes: [1024]
      excitatory_branch_factors: [2, 2]
    connectivity:
      ee_synapses_per_branch_per_layer: [64]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [0]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_transform: "signed_split"
    morphology:
      use_shunting: false
      weight_transform: "softplus"
    sparsity:
      type: "indexed_dynamic"
      init_method: "xavier_normal"
      temperature: 0.25
      indexed:
        candidate_size: 256
        selection: "standard"
        seed: 612
        output_chunk_size: 2048
    reactivation:
      enabled: true
      type: "param_tanh"
      init_policy: "occupancy_quantile"

training:
  main:
    optimizer:
      name: "adamw"
      lr: 0.0007
      weight_decay: 0.0001

  transformer_replacement:
    enabled: true
    mode: "layerwise_distillation"
    teacher_source: "hf_text"
    train_target: "replacement_only"
    layers: [2]
    device: "auto"
    dtype: "float32"
    use_amp: true
    sequence_length: 128
    train_samples: 8192
    valid_samples: 64
    batch_size: 4
    max_steps: 800
    eval_every: 100
    log_every: 25
    loss: "mse"
    save_dir: "results/transformer_replacement_benchmarks/olmo2_1b_dolmino_all_layers/layer_02"
    save_replacements: true
    text:
      dataset_name: "allenai/dolmino-mix-1124"
      dataset_config: "default"
      split: "train"
      text_field: "text"
      streaming: true
      max_documents: 1200
      tokenizer_name: "allenai/OLMo-2-0425-1B"
      max_tokens: 200000
