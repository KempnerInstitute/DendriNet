# Exact 500,000-neuron / 5,000-contact-per-neuron target.
#
# IMPORTANT: this file is an editable target contract, not yet a safe job.
# Load-only validation is safe.  Do not construct or submit this model until
# the blockers documented in README.md have been fixed and benchmarked.
experiment:
  seed: 510000
  dataset_seed: 510001
  split_seed: 510002
  model_seed: 510003
  topology_seed: 510004
  loader_seed: 510005
  evaluation_seed: 510006
  probe_seed: 510007
  train_valid_split: 1.0
  fast_mode: false
  deterministic: false
  strict_deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  float32_matmul_precision: high
  enable_amp: false
  enable_profiling: false
  enable_hooks: false
  sealed_test: true
  allow_test_data: false
  max_test_samples: 4
  record_dataset_fingerprints: true
  checkpointing:
    enabled: false
    save_every_n_epochs: 1
    checkpoint_dir: results/dendritic_rnn/scale_5k_5k/checkpoints

# A deliberately small, fixed-delay Romo pilot.  First establish that the
# target model can initialize and take optimization steps; only then increase
# samples, delay range, and epochs for a scientific training run.
data:
  dataset_name: romo_delay_comparison_positive
  base_dir: ''
  processing:
    flatten: false
    normalize: false
  dataset_params:
    romo_delay_comparison_positive:
      train:
        frequency_values: &frequency_values
        - 2.0
        - 2.8
        - 3.6
        - 4.4
        - 5.2
        - 6.0
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 64
        min_delay: 10
        max_delay: 10
      valid:
        frequency_values: *frequency_values
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 32
        min_delay: 10
        max_delay: 10
      test:
        frequency_values: *frequency_values
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 4
        min_delay: 10
        max_delay: 10

model:
  task: classification
  learned_output_scale: false
  fixed_output_scale: 1.0
  output_scale_mode: fixed
  encoder:
    type: identity
    params:
      input_dim: 11
      input_shape: null
  core:
    type: ei_unified
    unified_ei:
      output_mode: last
      store_routing: false
      input_projection_dims:
      - 64
      layers:
      - recurrent: true
        dt: 1.0
        excitatory:
          n_neurons: 4000
          # Level order is distal -> intermediate -> soma.  This resolves to
          # [10,000,000, 2,000,000, 400,000] E compartments.
          branch_factors:
          - 5
          - 5
          ff_excitatory_synapses_by_level:
          - 0
          - 0
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          - 0
          - 0
          rec_excitatory_synapses_by_level:
          - 64
          - 240
          - 1168
          rec_inhibitory_synapses_by_level:
          - 16
          - 60
          - 300
          level_taus:
          - 125.0
          - 25.0
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 510004
          indexed_selection: standard
          indexed_output_chunk_size: 65536
          # Gather kernels (precedence cuda -> triton -> fused -> loop; each guarded,
          # default-off elsewhere). At this recurrent width (in_features ~500k) the
          # CUDA path uses the no-in_features-limit v2 fallback; wpo engages once the
          # large-in_features kernel lands. Dtype-safe: fp32 compute, bf16 in/out.
          indexed_use_fused_gather: false
          indexed_use_triton_gather: true
          indexed_use_cuda_gather: false
          blocklinear_strategy: none
          efficient_blocklinear: true
          # Required by the current indexed implementation.  Turning this off
          # creates a dense allowed-connectivity mask at this scale.
          allow_self_recurrence: true
          structured_connectivity: {}
          initialization_seed: 510003
          initialization_namespace: large_scale_500k_5k.excitatory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: fixed
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          adaptive_initialization: false
          dbl_init_method: mechanism_neutral
          learnable_tau: false
          use_noise: false
          dynamics_mode: rate
          dendritic_spikes_enabled: false
          soma_feedback_enabled: false
          synapse_types: {}
        inhibitory:
          n_neurons: 1000
          # Point inhibitory cells: one somatic level.
          branch_factors: []
          ff_excitatory_synapses_by_level:
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          rec_excitatory_synapses_by_level:
          - 3968
          rec_inhibitory_synapses_by_level:
          - 1000
          level_taus:
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 510008
          indexed_selection: standard
          indexed_output_chunk_size: 65536
          # Gather kernels (see excitatory block). Point-I in_features ~500k -> v2
          # fallback for now; dtype-safe under FSDP bf16.
          indexed_use_fused_gather: false
          indexed_use_triton_gather: true
          indexed_use_cuda_gather: false
          blocklinear_strategy: none
          efficient_blocklinear: true
          allow_self_recurrence: true
          structured_connectivity: {}
          initialization_seed: 510003
          initialization_namespace: large_scale_500k_5k.inhibitory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: fixed
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          adaptive_initialization: false
          dbl_init_method: mechanism_neutral
          learnable_tau: false
          use_noise: false
          dynamics_mode: rate
          dendritic_spikes_enabled: false
          soma_feedback_enabled: false
          synapse_types: {}
  decoder:
    type: MLP
    params:
      hidden_dims:
      - 32
      activation: relu
      output_dim: 2

training:
  encoder:
    strategy: standard
    common:
      epochs: 0
  main:
    strategy: recurrent
    pruning:
      enabled: false
    optimizer:
      name: adam
      lr: 0.0003
      weight_decay: 0.0
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
    common:
      epochs: 1
      batch_size: 1
      shuffle: true
      grad_clip_value: 1.0
      loss_function: ce
      early_stopping: false
      patience: 1
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 1
      num_workers: 0
      pin_memory: true
      persistent_workers: false
      in_order: true
      # FSDP supplies BF16.  The trainer's separate AMP flag currently opens
      # an FP16 autocast context, so it must remain false here.
      use_amp: false
      lr_schedule: none
      lr_warmup_epochs: 0
      weight_decay_rate: 0.0
      weight_boosting: false
      recalibrate_reactivation_every: 0
      reactivation_update_mode: backprop
      param_groups:
        lr: 0.0003
        split_params: false

analysis: {}
wandb:
  use_wandb: false
outputs:
  run_name: scale_5k_5k
  results_dir: results/dendritic_rnn/scale_5k_5k
  exact_run_dir: true
distributed:
  mode: fsdp
  fsdp:
    sharding_strategy: FULL_SHARD
    mixed_precision: true
    mixed_precision_dtype: bf16
    param_dtype: bf16
    reduce_dtype: fp32
    buffer_dtype: bf16
    cpu_offload: false
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: false
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: BACKWARD_POST
    # This expresses the required runtime policy, but the current recurrent
    # sparse path is not yet reached by the checkpoint wrapper (README.md).
    gradient_checkpointing: true
