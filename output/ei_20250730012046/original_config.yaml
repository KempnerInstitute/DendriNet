output_dir: output
slurm_config:
  job_name: ei_sweep_run
  account: kempner_dev
  partition: kempner
  time: 02:00:00
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 32GB
  modules_to_load:
  - python/3.12.5-fasrc01
  - cuda/12.4.1-fasrc01
  - cudnn/8.9.2.26_cuda12-fasrc01
experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
sweep_config:
  model.network.parameters.ee_synapses_per_branch_per_layer:
  - 5
  - 10
  - 15
  - 20
  model.network.parameters.ie_synapses_per_branch_per_layer:
  - 2
  - 5
  - 8
  - 10
  model.network.parameters.use_shunting:
  - true
  - false
filter_config:
  mode: all
base_config:
  task:
    dataset: multixor
    num_classes: 2
    input_dim: 4
  model:
    network:
      type: EINet
      parameters:
        input_dim: 4
        excitatory_layer_sizes:
        - 32
        - 16
        inhibitory_layer_sizes:
        - 16
        - 8
        excitatory_branch_factors:
        - 2
        - 2
        inhibitory_branch_factors:
        - 1
        - 1
        ee_synapses_per_branch_per_layer:
        - 10
        ei_synapses_per_branch_per_layer:
        - 5
        ie_synapses_per_branch_per_layer:
        - 3
        ii_synapses_per_branch_per_layer:
        - 2
        use_shunting: true
        somatic_synapses: true
        reactivate: false
        activation: relu
  train:
    strategy: standard
    epochs: 50
    batch_size: 128
    optimizer:
      type: adam
      lr: 0.001
      weight_decay: 1.0e-05
    loss_function: cross_entropy
    early_stopping:
      patience: 10
      min_delta: 0.001
    scheduler:
      type: reduce_on_plateau
      factor: 0.5
      patience: 5
  analysis:
    performance_metrics: true
    information_analysis: false
    save_activations: false
    plot_results: true
  outputs:
    save_model: false
    save_predictions: false
    save_config: true
    save_metrics: true
