output_dir: output
slurm_config:
  job_name: ei_sweep_run
  account: kempner_dev
  partition: kempner
  time: 02:00:00
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 8
  mem: 32GB
  modules_to_load:
  - python/3.12.5-fasrc01
  - cuda/12.4.1-fasrc01
  - cudnn/8.9.2.26_cuda12-fasrc01
  conda_env_path: /n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py
experiment_settings:
  seeds_per_condition: 3
  base_seed: 42
sweep_config:
  model.core_network.parameters.ee_synapses_per_branch_per_layer:
  - 5
  - 10
  - 15
  - 20
  - 25
  model.core_network.parameters.ie_synapses_per_branch_per_layer:
  - 2
  - 5
  - 8
  - 10
  - 12
  model.core_network.parameters.use_shunting:
  - true
  - false
filter_config:
  mode: all
base_config:
  model:
    task: classification
    encoder_network:
      type: identity
      parameters:
        input_dim: null
        input_shape:
        - 3
        - 32
        - 32
        encoder_hidden_dims:
        - 128
        - 64
        latent_dim: null
        activation: relu
    core_network:
      type: EINet
      parameters:
        transfer_params:
          input_mode: 1
          independent_pathways: false
          excitatory_dim: null
          inhibitory_dim: null
          output_activation: null
        excitatory_layer_sizes:
        - 64
        - 32
        - 16
        inhibitory_layer_sizes:
        - 32
        - 16
        - 8
        excitatory_branch_factors:
        - 2
        - 2
        - 1
        inhibitory_branch_factors:
        - 1
        - 1
        - 1
        ee_synapses_per_branch_per_layer:
        - 10
        ei_synapses_per_branch_per_layer:
        - 8
        ie_synapses_per_branch_per_layer:
        - 5
        ii_synapses_per_branch_per_layer:
        - 3
        somatic_synapses: true
        use_shunting: true
        topk_init_method: xavier_normal
        topk_noise_level: 0.0
        topk_type: standard
        topk_temperature: 0.0
        topk_strategy: conductance_dynamic
        reactivate: true
        reactivation_type: param_tanh
        reactivation_init_m: 1.5
        reactivation_init_b: 0.5
        reactivation_strategy: inverse
        blocklinear_strategy: conductance_dynamic
        efficient_blocklinear: false
        adaptive_initialization: false
        print_hooks: false
    decoder_network:
      type: MLP
      parameters:
        input_dim: null
        hidden_dims:
        - 32
        - 16
        activation: relu
        output_dim: 10
train:
  seed: 0
  train_valid_split: 0.8
  enable_amp: false
  enable_profiling: false
  enable_hooks: true
  checkpointing:
    enabled: false
    save_every_n_epochs: 10
    checkpoint_dir: outputs/checkpoints/
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 50
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.0001
    trainer:
      loss_function: ce
      epochs: 100
      early_stopping: false
      patience: 15
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false
task:
  dataset: cifar10
  data_path: ''
  parameters:
    flatten: true
    normalize: false
wandb:
  entity: null
  project: null
  group: null
  tags: []
  use_wandb: false
analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean
  synapse_turnover_analysis:
    enabled: false
    training: true
    snapshot_interval: 5
  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes:
      - 0.1
      - 0.2
      gaussian_noise: true
      gaussian_sdevs:
      - 0.1
      - 0.2
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: false
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true
outputs:
  run_name: ei_sweep_run
  dir: results/
