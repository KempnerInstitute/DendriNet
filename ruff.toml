# Ruff configuration for dendritic-modeling project

# Target Python 3.9+ (minimum supported version)
target-version = "py39"

# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default
# Add isort (`I`), pydocstyle (`D`), and other useful rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "RUF",  # Ruff-specific rules
]

# Never enforce these rules
ignore = [
    "E501",   # Line too long (handled by black)
    "E203",   # Whitespace before ':' (conflicts with black)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Within an `except` clause, raise exceptions with `raise ... from err`
    "N803",   # Argument name should be lowercase (for mathematical variables)
    "N806",   # Variable in function should be lowercase (for mathematical variables)
]

# Allow fix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv", 
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.ipynb",  # Ignore Jupyter notebooks
]

# Same as Black
line-length = 88

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[per-file-ignores]
# Tests can use magic values and have longer lines
"tests/**" = ["PLR2004", "S101", "D"]
# Config files can have longer lines
"**/config.py" = ["E501"]
# __init__.py files can have unused imports
"__init__.py" = ["F401"]

[mccabe]
# Cyclomatic complexity threshold
max-complexity = 10

[isort]
# Use black-compatible isort settings
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true 