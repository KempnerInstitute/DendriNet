<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660">
  <defs>
    <style>
      .title { font: 700 29px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 500 18px "DejaVu Sans", Arial, sans-serif; fill: #45637a; }
      .panel { fill: #f8fbfd; stroke: #8eafc3; stroke-width: 2.0; }
      .poplabel { font: 700 19px "DejaVu Sans", Arial, sans-serif; fill: #153450; }
      .body { font: 400 14px "DejaVu Sans", Arial, sans-serif; fill: #2d4b62; }
      .small { font: 400 13px "DejaVu Sans", Arial, sans-serif; fill: #51697d; }
      .esoma { fill: #cfe0f5; stroke: #2f6fb0; stroke-width: 2.4; }
      .isoma { fill: #f7d6d2; stroke: #b0433a; stroke-width: 2.4; }
      .dend  { stroke: #2f6fb0; stroke-width: 2.2; fill: none; }
      .exc { stroke: #2f6fb0; stroke-width: 2.6; fill: none; }
      .inh { stroke: #b0433a; stroke-width: 2.6; fill: none; }
      .rec { stroke: #2f6fb0; stroke-width: 2.4; fill: none; stroke-dasharray: 7 5; }
    </style>
    <marker id="ce" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2f6fb0"/></marker>
    <marker id="ci" markerWidth="12" markerHeight="12" refX="2" refY="5" orient="auto"><rect x="0" y="1" width="3.4" height="9" fill="#b0433a"/></marker>
  </defs>

  <text class="title" x="40" y="42">Population-network layer - distinct populations (Pyr / PV / SST)</text>
  <text class="subtitle" x="40" y="70">Each named population has its own polarity, dendritic morphology (branch_factors), dynamics, and targeting</text>

  <!-- PYR (excitatory, pyramidal, 2-layer dendrites) -->
  <rect class="panel" x="470" y="120" width="300" height="430" rx="20"/>
  <text class="poplabel" x="490" y="152">pyr — excitatory</text>
  <text class="small" x="490" y="172">n=32 · branch_factors [2,2] · rate soma</text>
  <!-- apical dendrite tree -->
  <path class="dend" d="M620,230 L620,300 M620,250 L585,210 M620,250 L655,210 M585,210 L568,185 M585,210 L602,185 M655,210 L638,185 M655,210 L672,185"/>
  <!-- pyramidal soma (triangle) -->
  <path class="esoma" d="M620,300 L598,340 L642,340 Z"/>
  <!-- basal dendrites -->
  <path class="dend" d="M606,338 L580,360 M634,338 L660,360"/>
  <text class="small" x="620" y="372" text-anchor="middle">apical + basal dendrites</text>
  <text class="body" x="490" y="420">branch_factors [2, 2]: a two-level</text>
  <text class="body" x="490" y="440">dendritic tree. It is the layer&#8217;s</text>
  <text class="body" x="490" y="460">readout population.</text>

  <!-- PV (inhibitory, basket, perisomatic) -->
  <rect class="panel" x="120" y="150" width="280" height="180" rx="18"/>
  <text class="poplabel" x="140" y="182">pv — inhibitory</text>
  <text class="small" x="140" y="202">n=8 · branch_factors [1] · fast</text>
  <circle class="isoma" cx="200" cy="262" r="26"/>
  <text class="body" x="250" y="250">basket-like:</text>
  <text class="body" x="250" y="270">perisomatic</text>
  <text class="body" x="250" y="290">inhibition → Pyr soma</text>

  <!-- SST (inhibitory, Martinotti, dendrite-targeting) -->
  <rect class="panel" x="120" y="360" width="280" height="180" rx="18"/>
  <text class="poplabel" x="140" y="392">sst — inhibitory</text>
  <text class="small" x="140" y="412">n=8 · branch_factors [1] · slow</text>
  <circle class="isoma" cx="200" cy="472" r="26"/>
  <text class="body" x="250" y="460">Martinotti-like:</text>
  <text class="body" x="250" y="480">dendrite-targeting</text>
  <text class="body" x="250" y="500">inhibition → Pyr dendrites</text>

  <!-- decoder -->
  <rect class="panel" x="900" y="300" width="150" height="70" rx="14"/>
  <text class="poplabel" x="975" y="333" text-anchor="middle">decoder</text>
  <text class="small" x="975" y="354" text-anchor="middle">readout_population: pyr</text>

  <!-- connections -->
  <!-- Pyr -> PV (excitatory drive, delayed: PV also inhibits Pyr in the same step) -->
  <path class="rec" d="M598,318 C470,300 360,262 402,262" marker-end="url(#ce)"/>
  <!-- Pyr -> SST (delayed) -->
  <path class="rec" d="M600,330 C460,440 360,472 402,472" marker-end="url(#ce)"/>
  <!-- PV -> Pyr soma (perisomatic inhibition) -->
  <path class="inh" d="M226,278 C360,330 520,330 612,326" marker-end="url(#ci)"/>
  <!-- SST -> Pyr dendrites (dendritic inhibition, targets apical) -->
  <path class="inh" d="M224,455 C360,420 520,250 614,236" marker-end="url(#ci)"/>
  <!-- Pyr -> Pyr recurrent -->
  <path class="rec" d="M700,300 C760,270 760,360 700,330" marker-end="url(#ce)"/>
  <text class="small" x="724" y="276">pyr&#8594;pyr (recurrent)</text>
  <!-- Pyr -> decoder -->
  <path class="exc" d="M642,330 C800,332 850,335 898,335" marker-end="url(#ce)"/>

  <!-- legend -->
  <line class="exc" x1="900" y1="470" x2="940" y2="470" marker-end="url(#ce)"/>
  <text class="small" x="948" y="475">excitatory projection</text>
  <line class="inh" x1="900" y1="498" x2="938" y2="498" marker-end="url(#ci)"/>
  <text class="small" x="948" y="503">inhibitory projection</text>
  <line class="rec" x1="900" y1="526" x2="940" y2="526" marker-end="url(#ce)"/>
  <text class="small" x="948" y="531">delayed (previous step)</text>
  <text class="small" x="900" y="560">Per-population overrides go in each populations[].population block.</text>
</svg>
