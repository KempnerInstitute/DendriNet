<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
  <defs>
    <style>
      .title { font: 700 36px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 600 22px "DejaVu Sans", Arial, sans-serif; fill: #33556f; }
      .label { font: 600 20px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .body { font: 400 17px "DejaVu Sans", Arial, sans-serif; fill: #284b63; }
      .small { font: 400 15px "DejaVu Sans", Arial, sans-serif; fill: #486172; }
      .panel { fill: #f8fbfd; stroke: #89a9bf; stroke-width: 2.5; rx: 22; }
      .accent { fill: #e8f3f8; stroke: #4b8aa8; stroke-width: 2.5; rx: 22; }
      .exc { fill: #eef7ec; stroke: #6aa56a; stroke-width: 2.5; rx: 22; }
      .inh { fill: #fff3f1; stroke: #c06a5b; stroke-width: 2.5; rx: 22; }
      .formula { fill: #fff8ec; stroke: #c18b3b; stroke-width: 2.5; rx: 18; }
      .arrow { stroke: #4b6f88; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-thin { stroke: #4b6f88; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 11 9; }
      .line { stroke: #7ca0b8; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4b6f88"/>
    </marker>
  </defs>

  <rect width="1320" height="860" fill="#ffffff"/>
  <text x="60" y="70" class="title">Excitation-Inhibition Core: Network-Level Dataflow</text>
  <text x="60" y="106" class="subtitle">How encoder output becomes E and I pathways, then passes through stacked dendritic populations.</text>

  <rect x="60" y="150" width="240" height="120" class="accent"/>
  <text x="88" y="194" class="label">Encoder</text>
  <text x="88" y="224" class="body">Identity / MLP / CNN</text>
  <text x="88" y="250" class="small">raw input x</text>

  <rect x="360" y="138" width="290" height="144" class="accent"/>
  <text x="388" y="182" class="label">TransferLayer</text>
  <text x="388" y="212" class="body">input_mode</text>
  <text x="388" y="238" class="body">independent_pathways</text>
  <text x="388" y="264" class="body">output_activation</text>

  <rect x="720" y="150" width="210" height="112" class="exc"/>
  <text x="748" y="194" class="label">x_E</text>
  <text x="748" y="224" class="body">excitatory pathway</text>
  <text x="748" y="248" class="small">shape [B, d_E]</text>

  <rect x="970" y="150" width="210" height="112" class="inh"/>
  <text x="998" y="194" class="label">x_I</text>
  <text x="998" y="224" class="body">inhibitory pathway</text>
  <text x="998" y="248" class="small">shape [B, d_I]</text>

  <path d="M300 210 L360 210" class="arrow"/>
  <path d="M650 194 L720 194" class="arrow"/>
  <path d="M650 246 L970 246" class="arrow"/>

  <rect x="90" y="360" width="520" height="206" class="panel"/>
  <text x="120" y="404" class="label">ExcitationInhibitionLayer 1</text>
  <rect x="130" y="434" width="190" height="96" class="inh"/>
  <text x="156" y="472" class="label">inhibitory_cells</text>
  <text x="156" y="500" class="body">DendriNet or MLP</text>
  <text x="156" y="522" class="small">uses EI or signed synapse mode</text>
  <rect x="380" y="434" width="190" height="96" class="exc"/>
  <text x="406" y="472" class="label">excitatory_cells</text>
  <text x="406" y="500" class="body">DendriNet</text>
  <text x="406" y="522" class="small">returns h_E^(1)</text>
  <path d="M225 530 L225 586 L475 586 L475 530" class="line"/>
  <text x="236" y="608" class="small">inhibitory output modulates the excitatory population</text>

  <rect x="90" y="620" width="520" height="176" class="panel"/>
  <text x="120" y="664" class="label">ExcitationInhibitionLayer 2 ... L</text>
  <rect x="130" y="692" width="190" height="72" class="inh"/>
  <text x="156" y="734" class="label">h_I^(l)</text>
  <rect x="380" y="692" width="190" height="72" class="exc"/>
  <text x="406" y="734" class="label">h_E^(l)</text>
  <text x="120" y="786" class="small">Each layer repeats the same rule with new layer sizes, branch factors, and synapse counts.</text>

  <rect x="700" y="360" width="560" height="214" class="formula"/>
  <text x="730" y="404" class="label">Forward Rule</text>
  <text x="730" y="446" class="body">(x_E, x_I) = TransferLayer(x)</text>
  <text x="730" y="480" class="body">h_I^(l) = inhibitory_cells(h_E^(l-1), h_I^(l-1))</text>
  <text x="730" y="514" class="body">h_E^(l) = excitatory_cells(h_E^(l-1), h_I^(l))</text>
  <text x="730" y="548" class="body">y_core = h_E^(L)</text>

  <rect x="700" y="620" width="260" height="176" class="accent"/>
  <text x="726" y="664" class="label">Connectivity Config</text>
  <text x="726" y="696" class="body">ee_synapses_per_branch</text>
  <text x="726" y="722" class="body">ei_synapses_per_branch</text>
  <text x="726" y="748" class="body">ie_synapses_per_branch</text>
  <text x="726" y="774" class="body">ii_synapses_per_branch</text>

  <rect x="1000" y="620" width="260" height="176" class="accent"/>
  <text x="1026" y="664" class="label">Morphology + Sparsity</text>
  <text x="1026" y="696" class="body">excitatory_branch_factors</text>
  <text x="1026" y="722" class="body">inhibitory_branch_factors</text>
  <text x="1026" y="748" class="body">somatic_synapses, use_shunting</text>
  <text x="1026" y="774" class="body">topk type, gamma, weight_transform</text>

  <path d="M790 262 L790 330 L250 330 L250 360" class="arrow-thin"/>
  <path d="M1075 262 L1075 330 L250 330 L250 360" class="arrow-thin"/>
  <path d="M790 262 L790 330 L470 330 L470 360" class="arrow-thin dashed"/>
  <path d="M1075 262 L1075 330 L470 330 L470 360" class="arrow-thin dashed"/>

  <path d="M350 566 L350 620" class="arrow"/>
  <path d="M540 728 L630 728 L630 730" class="arrow"/>

  <rect x="700" y="150" width="560" height="120" class="panel"/>
  <text x="730" y="194" class="label">What stays constant across layers</text>
  <text x="730" y="224" class="body">Each excitatory or inhibitory population is a DendriNet built from DendriticBranchLayer blocks.</text>
  <text x="730" y="250" class="small">The next figure shows one such dendritic population at single-neuron resolution.</text>

  <text x="60" y="834" class="small">The core network output is always the final excitatory population. Inhibitory states are internal modulators unless a downstream analysis reads them explicitly.</text>
</svg>
