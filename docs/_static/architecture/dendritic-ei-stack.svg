<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="930" viewBox="0 0 1320 930">
  <defs>
    <style>
      .title { font: 700 36px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 500 21px "DejaVu Sans", Arial, sans-serif; fill: #45637a; }
      .chip { fill: #edf4fa; stroke: #9bb7ca; stroke-width: 1.6; rx: 16; }
      .chiptext { font: 600 14px "DejaVu Sans", Arial, sans-serif; fill: #36556d; letter-spacing: 0.08em; text-transform: uppercase; }
      .label { font: 600 20px "DejaVu Sans", Arial, sans-serif; fill: #153450; }
      .body { font: 400 17px "DejaVu Sans", Arial, sans-serif; fill: #284b63; }
      .small { font: 400 15px "DejaVu Sans", Arial, sans-serif; fill: #516b7d; }
      .panel { fill: #f8fbfd; stroke: #8eafc3; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .accent { fill: #e8f3f8; stroke: #4f89a8; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .exc { fill: #eef7ec; stroke: #69a768; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .inh { fill: #fff2ef; stroke: #c36b5d; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .formula { fill: #fff8ed; stroke: #c18b3b; stroke-width: 2.2; rx: 18; filter: url(#shadow); }
      .takeaway { fill: #f2f7fb; stroke: #9db7c8; stroke-width: 1.8; rx: 18; }
      .arrow { stroke: #4c7088; stroke-width: 3.6; fill: none; marker-end: url(#arrowhead); }
      .arrow-thin { stroke: #6f94aa; stroke-width: 2.6; fill: none; marker-end: url(#arrowheadThin); }
      .dashed { stroke-dasharray: 8 7; }
      .line { stroke: #7ea2b9; stroke-width: 2.8; fill: none; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9fb5c4" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4c7088"/>
    </marker>
    <marker id="arrowheadThin" markerWidth="12" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#6f94aa"/>
    </marker>
  </defs>

  <rect width="1320" height="930" fill="#fbfcfe"/>
  <text x="60" y="72" class="title">Structured E/I core</text>
  <text x="60" y="108" class="subtitle">encoder -&gt; transfer -&gt; x_E, x_I -&gt; E/I layers -&gt; y</text>

  <rect x="60" y="132" width="128" height="34" class="chip"/>
  <text x="92" y="154" class="chiptext">System</text>
  <rect x="200" y="132" width="166" height="34" class="chip"/>
  <text x="222" y="154" class="chiptext">Stacked E/I layers</text>

  <rect x="60" y="188" width="220" height="114" class="accent"/>
  <text x="88" y="230" class="label">Encoder</text>
  <text x="88" y="258" class="body">identity, router or autoencoder</text>
  <text x="88" y="282" class="small">raw input x</text>

  <rect x="334" y="178" width="308" height="132" class="accent"/>
  <text x="362" y="220" class="label">TransferLayer</text>
  <text x="362" y="250" class="body">pathway split / remap</text>
  <text x="362" y="276" class="small">independent_pathways,</text>
  <text x="362" y="294" class="small">output_activation</text>

  <rect x="716" y="188" width="214" height="108" class="exc"/>
  <text x="744" y="230" class="label">x_E</text>
  <text x="744" y="258" class="body">excitatory pathway</text>
  <text x="744" y="282" class="small">shape [B, d_E]</text>

  <rect x="968" y="188" width="214" height="108" class="inh"/>
  <text x="996" y="230" class="label">x_I</text>
  <text x="996" y="258" class="body">inhibitory pathway</text>
  <text x="996" y="282" class="small">shape [B, d_I]</text>

  <path d="M280 244 L334 244" class="arrow"/>
  <path d="M642 226 L716 226" class="arrow"/>
  <path d="M642 270 L968 270" class="arrow"/>

  <rect x="680" y="334" width="580" height="98" class="panel"/>
  <text x="710" y="374" class="label">Population template</text>
  <text x="710" y="404" class="body">each population = DendriNet</text>
  <text x="710" y="428" class="small">stacked DendriticBranchLayer blocks</text>

  <rect x="80" y="468" width="540" height="220" class="panel"/>
  <text x="110" y="510" class="label">ExcitationInhibitionLayer 1</text>

  <rect x="118" y="544" width="182" height="92" class="inh"/>
  <text x="144" y="580" class="label">inhibitory_cells</text>
  <text x="144" y="606" class="body">DendriNet or MLP</text>
  <text x="144" y="628" class="small">returns h_I^(1)</text>

  <rect x="400" y="544" width="182" height="92" class="exc"/>
  <text x="426" y="580" class="label">excitatory_cells</text>
  <text x="426" y="606" class="body">DendriNet</text>
  <text x="426" y="628" class="small">returns h_E^(1)</text>

  <path d="M210 636 L210 660 L490 660 L490 636" class="line"/>
  <text x="232" y="676" class="small">h_I^(1) gates h_E^(1)</text>

  <rect x="80" y="720" width="540" height="138" class="panel"/>
  <text x="110" y="762" class="label">ExcitationInhibitionLayer 2 ... L</text>
  <rect x="118" y="788" width="182" height="50" class="inh"/>
  <text x="182" y="821" class="label">h_I^(l)</text>
  <rect x="400" y="788" width="182" height="50" class="exc"/>
  <text x="464" y="821" class="label">h_E^(l)</text>
  <text x="110" y="848" class="small">repeat with chosen sizes, branch_factors, and synapse budgets</text>

  <rect x="680" y="468" width="580" height="200" class="formula"/>
  <text x="710" y="510" class="label">Layer update</text>
  <text x="710" y="548" class="body">(x_E, x_I) = TransferLayer(x)</text>
  <text x="710" y="580" class="body">h_I^(l) = inhibitory_cells(..., x_I)</text>
  <text x="710" y="612" class="body">h_E^(l) = excitatory_cells(..., h_I^(l), x_E)</text>
  <text x="710" y="644" class="body">y_core = h_E^(L)</text>

  <rect x="680" y="708" width="270" height="150" class="accent"/>
  <text x="706" y="748" class="label">Connectivity</text>
  <text x="706" y="780" class="body">ee / ei per branch</text>
  <text x="706" y="806" class="body">ie / ii per branch</text>
  <text x="706" y="832" class="small">pathway budgets</text>

  <rect x="990" y="708" width="270" height="150" class="accent"/>
  <text x="1016" y="748" class="label">Morphology</text>
  <text x="1016" y="778" class="body">branch_factors, layer sizes</text>
  <text x="1016" y="802" class="body">somatic_synapses</text>
  <text x="1016" y="822" class="body">use_shunting</text>
  <text x="1016" y="846" class="small">weight_transform, dbl_init_method</text>

  <path d="M824 296 L824 448 L490 448 L490 468" class="arrow-thin dashed"/>
  <path d="M1074 296 L1074 458 L210 458 L210 468" class="arrow-thin"/>
  <path d="M350 688 L350 720" class="arrow"/>

  <rect x="60" y="882" width="1200" height="30" class="takeaway"/>
  <text x="84" y="902" class="small">The core output is the final excitatory population; inhibitory populations act inside each layer.</text>
</svg>
