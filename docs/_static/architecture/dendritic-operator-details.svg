<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
  <defs>
    <style>
      .title { font: 700 36px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 600 22px "DejaVu Sans", Arial, sans-serif; fill: #33556f; }
      .label { font: 600 20px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .body { font: 400 17px "DejaVu Sans", Arial, sans-serif; fill: #284b63; }
      .small { font: 400 15px "DejaVu Sans", Arial, sans-serif; fill: #486172; }
      .panel { fill: #f8fbfd; stroke: #89a9bf; stroke-width: 2.5; rx: 22; }
      .accent { fill: #e8f3f8; stroke: #4b8aa8; stroke-width: 2.5; rx: 22; }
      .exc { fill: #eef7ec; stroke: #6aa56a; stroke-width: 2.5; rx: 22; }
      .formula { fill: #fff8ec; stroke: #c18b3b; stroke-width: 2.5; rx: 18; }
      .arrow { stroke: #4b6f88; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .grid { stroke: #9ab3c5; stroke-width: 2; fill: none; }
      .fill { fill: #dfeaf2; }
      .hot { fill: #82c58b; }
      .cold { fill: #f3c1b8; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4b6f88"/>
    </marker>
  </defs>

  <rect width="1320" height="760" fill="#ffffff"/>
  <text x="60" y="70" class="title">Operator View: TopKLinear and BlockLinear</text>
  <text x="60" y="106" class="subtitle">Two different sparsity controls shape the dendritic core.</text>

  <rect x="60" y="150" width="560" height="540" class="panel"/>
  <text x="90" y="194" class="label">TopKLinear: sparse external synapses</text>
  <text x="90" y="224" class="body">One row per branch. Keep only the K strongest inputs in that row.</text>

  <rect x="94" y="256" width="132" height="70" class="accent"/>
  <text x="116" y="298" class="label">x</text>
  <text x="116" y="320" class="small">[B, d_in]</text>

  <rect x="268" y="240" width="144" height="104" class="accent"/>
  <text x="292" y="280" class="label">pre_w</text>
  <text x="292" y="308" class="body">raw parameters</text>
  <text x="292" y="332" class="small">[n_branches, d_in]</text>

  <rect x="446" y="256" width="138" height="70" class="accent"/>
  <text x="470" y="298" class="label">transform</text>
  <text x="470" y="320" class="small">exp / softplus / relu / identity</text>

  <path d="M226 291 L268 291" class="arrow"/>
  <path d="M412 291 L446 291" class="arrow"/>

  <rect x="90" y="382" width="500" height="260" class="formula"/>
  <text x="120" y="424" class="label">Row-wise masking rule</text>
  <text x="120" y="458" class="body">W = weight_transform(pre_w)</text>
  <text x="120" y="490" class="body">M = weight_mask(pre_w)</text>
  <text x="120" y="522" class="body">W_pruned = M ⊙ W</text>
  <text x="120" y="554" class="body">TopKLinear(x) = x W_pruned^T</text>
  <text x="120" y="594" class="small">K is per branch, not per layer. Different branches can keep different input coordinates.</text>

  <rect x="366" y="362" width="190" height="134" class="exc"/>
  <text x="392" y="396" class="label">example row mask</text>
  <rect x="392" y="418" width="20" height="20" class="fill"/>
  <rect x="414" y="418" width="20" height="20" class="hot"/>
  <rect x="436" y="418" width="20" height="20" class="fill"/>
  <rect x="458" y="418" width="20" height="20" class="hot"/>
  <rect x="480" y="418" width="20" height="20" class="fill"/>
  <rect x="502" y="418" width="20" height="20" class="hot"/>
  <text x="392" y="462" class="small">K = 3 active synapses for this branch</text>

  <rect x="700" y="150" width="560" height="540" class="panel"/>
  <text x="730" y="194" class="label">BlockLinear: tree-structured branch aggregation</text>
  <text x="730" y="224" class="body">Groups consecutive child branches that belong to the same parent branch.</text>

  <rect x="734" y="256" width="152" height="70" class="accent"/>
  <text x="760" y="298" class="label">u</text>
  <text x="760" y="320" class="small">child outputs [B, n_parent x b]</text>

  <rect x="928" y="240" width="162" height="104" class="accent"/>
  <text x="954" y="280" class="label">log_weight</text>
  <text x="954" y="308" class="body">one weight per child slot</text>
  <text x="954" y="332" class="small">[n_parent, b]</text>

  <rect x="1120" y="256" width="108" height="70" class="accent"/>
  <text x="1146" y="298" class="label">g_b</text>
  <text x="1146" y="320" class="small">branch conductance</text>

  <path d="M886 291 L928 291" class="arrow"/>
  <path d="M1090 291 L1120 291" class="arrow"/>

  <rect x="734" y="382" width="500" height="260" class="formula"/>
  <text x="764" y="424" class="label">Grouping rule</text>
  <text x="764" y="458" class="body">u.reshape(B, n_parent, b)</text>
  <text x="764" y="490" class="body">g_b = weight_transform(log_weight)</text>
  <text x="764" y="522" class="body">V_b[j] = sum_k g_b[j, k] u[j, k]</text>
  <text x="764" y="554" class="body">sum_conductances() = sum_k g_b[j, k]</text>
  <text x="764" y="594" class="small">b = input_branch_factor. This controls tree fan-in, not external synaptic sparsity.</text>

  <rect x="988" y="362" width="214" height="134" class="exc"/>
  <text x="1014" y="396" class="label">example grouping</text>
  <rect x="1014" y="420" width="24" height="24" class="cold"/>
  <rect x="1042" y="420" width="24" height="24" class="cold"/>
  <rect x="1070" y="420" width="24" height="24" class="cold"/>
  <text x="1104" y="438" class="small">child group -> parent 0</text>
  <rect x="1014" y="454" width="24" height="24" class="hot"/>
  <rect x="1042" y="454" width="24" height="24" class="hot"/>
  <rect x="1070" y="454" width="24" height="24" class="hot"/>
  <text x="1104" y="472" class="small">child group -> parent 1</text>

  <text x="60" y="730" class="small">TopKLinear decides which external inputs each branch can see. BlockLinear decides how sibling branches are merged on the way to the soma.</text>
</svg>
