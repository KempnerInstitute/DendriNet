<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Extended recurrent dendritic components</title>
  <desc id="desc">Schematic showing sequence input, named cell types, source-target masks, synapse type kinetics, dendritic integration, optional LIF soma, decoder, and analysis readouts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; rx: 8; }
      .soft { fill: #eef7f4; stroke: #1f7a5c; }
      .warm { fill: #fff4e6; stroke: #b76e00; }
      .cool { fill: #eef3ff; stroke: #3e5fa8; }
      .pink { fill: #fff0f5; stroke: #a64d79; }
      .text { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #17202a; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #17202a; }
      .arrow { stroke: #34495e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6c7a89; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="40" width="130" height="72" class="box cool"/>
  <text x="85" y="68" text-anchor="middle" class="title">Sequence</text>
  <text x="85" y="91" text-anchor="middle" class="small">x[t], context,</text>
  <text x="85" y="107" text-anchor="middle" class="small">sensory streams</text>

  <rect x="205" y="24" width="250" height="168" class="box soft"/>
  <text x="330" y="52" text-anchor="middle" class="title">Population Graph</text>
  <rect x="230" y="74" width="60" height="38" class="box"/>
  <text x="260" y="98" text-anchor="middle" class="small">Pyr</text>
  <rect x="315" y="74" width="60" height="38" class="box"/>
  <text x="345" y="98" text-anchor="middle" class="small">PV</text>
  <rect x="400" y="74" width="60" height="38" class="box"/>
  <text x="430" y="98" text-anchor="middle" class="small">SST</text>
  <text x="330" y="139" text-anchor="middle" class="small">Named cell types with</text>
  <text x="330" y="157" text-anchor="middle" class="small">per-population morphology</text>
  <text x="330" y="175" text-anchor="middle" class="small">and recurrent state</text>

  <rect x="205" y="242" width="250" height="116" class="box warm"/>
  <text x="330" y="270" text-anchor="middle" class="title">Connectivity</text>
  <text x="330" y="296" text-anchor="middle" class="small">source -> target rules</text>
  <text x="330" y="314" text-anchor="middle" class="small">probability, fixed indegree,</text>
  <text x="330" y="332" text-anchor="middle" class="small">distance masks, no self loops</text>

  <rect x="515" y="40" width="178" height="118" class="box"/>
  <text x="604" y="68" text-anchor="middle" class="title">Synapse Types</text>
  <text x="604" y="94" text-anchor="middle" class="small">AMPA / NMDA</text>
  <text x="604" y="112" text-anchor="middle" class="small">GABA-A / GABA-B</text>
  <text x="604" y="136" text-anchor="middle" class="small">fraction, tau, Erev</text>

  <rect x="515" y="210" width="178" height="118" class="box"/>
  <text x="604" y="238" text-anchor="middle" class="title">Dendrites</text>
  <text x="604" y="264" text-anchor="middle" class="small">TopK branches</text>
  <text x="604" y="282" text-anchor="middle" class="small">typed traces</text>
  <text x="604" y="306" text-anchor="middle" class="small">shunting or additive</text>

  <rect x="750" y="62" width="170" height="96" class="box pink"/>
  <text x="835" y="90" text-anchor="middle" class="title">Soma Output</text>
  <text x="835" y="116" text-anchor="middle" class="small">rate mode or LIF</text>
  <text x="835" y="134" text-anchor="middle" class="small">spikes, rate trace, membrane</text>

  <rect x="750" y="230" width="170" height="82" class="box cool"/>
  <text x="835" y="258" text-anchor="middle" class="title">Decoder</text>
  <text x="835" y="284" text-anchor="middle" class="small">existing classifier</text>
  <text x="835" y="302" text-anchor="middle" class="small">or regression head</text>

  <rect x="520" y="360" width="385" height="48" class="box soft"/>
  <text x="712" y="390" text-anchor="middle" class="small">Analysis: routing, timetraces, inhibitory motifs, typed traces, spike state</text>

  <path d="M150 76 L205 76" class="arrow"/>
  <path d="M330 192 L330 242" class="dash"/>
  <path d="M455 91 L515 91" class="arrow"/>
  <path d="M604 158 L604 210" class="arrow"/>
  <path d="M693 269 C725 269 725 110 750 110" class="arrow"/>
  <path d="M835 158 L835 230" class="arrow"/>
  <path d="M455 300 C485 300 485 269 515 269" class="arrow"/>
  <path d="M604 328 L604 360" class="dash"/>
  <path d="M835 312 L835 360" class="dash"/>
</svg>
