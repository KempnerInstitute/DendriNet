<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 34px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .label { font: 600 22px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .body { font: 400 18px "DejaVu Sans", Arial, sans-serif; fill: #284b63; }
      .small { font: 400 16px "DejaVu Sans", Arial, sans-serif; fill: #3c5666; }
      .box { fill: #f8fbfd; stroke: #89a9bf; stroke-width: 2.5; rx: 22; }
      .accent { fill: #e8f3f8; stroke: #4b8aa8; stroke-width: 2.5; rx: 22; }
      .artifact { fill: #fff8ec; stroke: #c18b3b; stroke-width: 2.5; rx: 22; }
      .arrow { stroke: #4b6f88; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4b6f88"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="70" class="title">Experiment Lifecycle: Build, Train, Analyze, Save</text>

  <rect x="80" y="140" width="220" height="100" class="accent"/>
  <text x="110" y="185" class="label">Load YAML</text>
  <text x="110" y="216" class="small">OmegaConf + config dataclasses</text>

  <rect x="360" y="140" width="260" height="100" class="box"/>
  <text x="390" y="185" class="label">Canonicalize Flags</text>
  <text x="390" y="216" class="small">config_utils helpers</text>

  <rect x="680" y="140" width="220" height="100" class="box"/>
  <text x="710" y="185" class="label">Build Model</text>
  <text x="710" y="216" class="small">setup_utils + factory</text>

  <rect x="960" y="140" width="200" height="100" class="artifact"/>
  <text x="990" y="185" class="label">Init Stats</text>
  <text x="990" y="216" class="small">init_gate_stats.json</text>

  <rect x="180" y="350" width="240" height="130" class="box"/>
  <text x="210" y="395" class="label">Trainer Setup</text>
  <text x="210" y="424" class="small">strategy, optimizer, loaders</text>
  <text x="210" y="448" class="small">optional calibration</text>

  <rect x="490" y="330" width="260" height="170" class="accent"/>
  <text x="520" y="375" class="label">Training Loop</text>
  <text x="520" y="408" class="body">forward / loss / update</text>
  <text x="520" y="434" class="body">backprop or local rule</text>
  <text x="520" y="460" class="body">checkpoint + metrics</text>

  <rect x="820" y="350" width="260" height="130" class="box"/>
  <text x="850" y="395" class="label">Analysis Manager</text>
  <text x="850" y="424" class="small">routing, spectra, gates, motifs</text>
  <text x="850" y="448" class="small">runtime-controlled analyzers</text>

  <rect x="350" y="580" width="520" height="110" class="artifact"/>
  <text x="380" y="620" class="label">Run Artifacts</text>
  <text x="380" y="650" class="body">config.json, checkpoints, performance,</text>
  <text x="380" y="676" class="body">analyzer JSON, figures, logs</text>

  <path d="M300 190 L360 190" class="arrow"/>
  <path d="M620 190 L680 190" class="arrow"/>
  <path d="M900 190 L960 190" class="arrow"/>
  <path d="M790 240 L790 300 L620 300 L620 330" class="arrow"/>
  <path d="M790 240 L790 300 L300 300 L300 350" class="arrow"/>
  <path d="M420 415 L490 415" class="arrow"/>
  <path d="M750 415 L820 415" class="arrow"/>
  <path d="M620 500 L620 580" class="arrow"/>
  <path d="M950 480 L950 535 L800 535 L800 580" class="arrow"/>

  <text x="85" y="715" class="small">Engineering checkpoints: compare resolved config, init_gate_stats.json,</text>
  <text x="85" y="735" class="small">first epochs, and analyzer outputs when debugging regressions.</text>
</svg>
