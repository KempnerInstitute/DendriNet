<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Population-network connection schema</title>
  <desc id="desc">Named populations are arranged in layers with explicit directed same-step and delayed connections, cross-layer sources, transfer streams, masks, and per-population dendritic parameters.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="eFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#f4f9ff"/>
    </linearGradient>
    <linearGradient id="iFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3e0"/>
      <stop offset="100%" stop-color="#fff7f5"/>
    </linearGradient>
    <linearGradient id="xFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f6ed"/>
      <stop offset="100%" stop-color="#f9fffb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-14%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#173451" flood-opacity="0.13"/>
    </filter>
    <marker id="eArrow" markerWidth="13" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#2f6fb0"/>
    </marker>
    <marker id="dArrow" markerWidth="13" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#7b5aa6"/>
    </marker>
    <marker id="iBar" markerWidth="12" markerHeight="14" refX="2" refY="7" orient="auto">
      <rect x="0" y="1.5" width="4" height="11" rx="1" fill="#b84a43"/>
    </marker>
    <style>
      .title { font: 700 34px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 400 16px "DejaVu Sans", Arial, sans-serif; fill: #4e6678; }
      .layer { fill: url(#panel); stroke: #cad9e5; stroke-width: 2.2; rx: 28; filter: url(#shadow); }
      .layerTitle { font: 700 20px "DejaVu Sans", Arial, sans-serif; fill: #163450; }
      .small { font: 400 13px "DejaVu Sans", Arial, sans-serif; fill: #5b7182; }
      .nodeText { font: 700 17px "DejaVu Sans", Arial, sans-serif; fill: #153450; }
      .nodeSub { font: 400 12.5px "DejaVu Sans", Arial, sans-serif; fill: #526c80; }
      .eNode { fill: url(#eFill); stroke: #2f6fb0; stroke-width: 2.2; rx: 16; filter: url(#shadow); }
      .iNode { fill: url(#iFill); stroke: #b84a43; stroke-width: 2.2; rx: 16; filter: url(#shadow); }
      .input { fill: url(#xFill); stroke: #5b8f6d; stroke-width: 2.1; rx: 16; filter: url(#shadow); }
      .eEdge { stroke: #2f6fb0; stroke-width: 3; fill: none; marker-end: url(#eArrow); }
      .iEdge { stroke: #b84a43; stroke-width: 3; fill: none; marker-end: url(#iBar); }
      .dEdge { stroke: #7b5aa6; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#dArrow); }
      .mEdge { stroke: #5f7f90; stroke-width: 2; stroke-dasharray: 4 5; fill: none; marker-end: url(#eArrow); }
      .callout { fill: #ffffff; stroke: #d3e0ea; stroke-width: 1.8; rx: 16; filter: url(#shadow); }
      .callTitle { font: 700 15px "DejaVu Sans", Arial, sans-serif; fill: #203b52; }
      .code { font: 400 12.5px "DejaVu Sans Mono", Consolas, monospace; fill: #2c4e64; }
      .legendTitle { font: 700 14px "DejaVu Sans", Arial, sans-serif; fill: #203b52; }
    </style>
  </defs>

  <rect width="1500" height="860" fill="#ffffff"/>
  <text class="title" x="46" y="52">population_network: one schema for feedforward and recurrent population layers</text>
  <text class="subtitle" x="46" y="80">Populations define cell identity and dendritic morphology. Connections define explicit source-target routing, timing, probability masks, and cross-layer sources.</text>

  <rect class="input" x="46" y="230" width="136" height="78"/>
  <text class="nodeText" x="114" y="260" text-anchor="middle">input</text>
  <text class="nodeSub" x="114" y="281" text-anchor="middle">encoder output</text>
  <text class="nodeSub" x="114" y="300" text-anchor="middle">or x</text>
  <rect class="input" x="46" y="340" width="136" height="96"/>
  <text class="nodeText" x="114" y="370" text-anchor="middle">transfer</text>
  <text class="nodeSub" x="114" y="392" text-anchor="middle">optional</text>
  <text class="nodeSub" x="114" y="411" text-anchor="middle">input_e, input_i</text>

  <rect class="layer" x="245" y="132" width="390" height="450"/>
  <text class="layerTitle" x="272" y="166">layer0: feedforward E/I circuit</text>
  <text class="small" x="272" y="190">readout_population: e0</text>
  <rect class="eNode" x="286" y="228" width="150" height="90"/>
  <text class="nodeText" x="361" y="260" text-anchor="middle">e0</text>
  <text class="nodeSub" x="361" y="282" text-anchor="middle">excitatory</text>
  <text class="nodeSub" x="361" y="301" text-anchor="middle">branches [3,3]</text>
  <rect class="eNode" x="456" y="228" width="140" height="90"/>
  <text class="nodeText" x="526" y="260" text-anchor="middle">e_flat</text>
  <text class="nodeSub" x="526" y="282" text-anchor="middle">excitatory</text>
  <text class="nodeSub" x="526" y="301" text-anchor="middle">branches [1]</text>
  <rect class="iNode" x="286" y="378" width="140" height="82"/>
  <text class="nodeText" x="356" y="410" text-anchor="middle">pv0</text>
  <text class="nodeSub" x="356" y="432" text-anchor="middle">inhibitory</text>
  <rect class="iNode" x="456" y="378" width="140" height="82"/>
  <text class="nodeText" x="526" y="410" text-anchor="middle">sst0</text>
  <text class="nodeSub" x="526" y="432" text-anchor="middle">inhibitory</text>

  <rect class="layer" x="756" y="132" width="390" height="450"/>
  <text class="layerTitle" x="783" y="166">layer1: explicit cross-layer sources</text>
  <text class="small" x="783" y="190">readout_population: e1</text>
  <rect class="eNode" x="817" y="228" width="170" height="90"/>
  <text class="nodeText" x="902" y="260" text-anchor="middle">e1</text>
  <text class="nodeSub" x="902" y="282" text-anchor="middle">source: layer0.e0</text>
  <text class="nodeSub" x="902" y="301" text-anchor="middle">and layer0.i0</text>
  <rect class="iNode" x="817" y="378" width="170" height="82"/>
  <text class="nodeText" x="902" y="410" text-anchor="middle">i1</text>
  <text class="nodeSub" x="902" y="432" text-anchor="middle">source: layer0.e0</text>
  <rect class="eNode" x="1010" y="378" width="98" height="82"/>
  <text class="nodeText" x="1059" y="410" text-anchor="middle">aux</text>
  <text class="nodeSub" x="1059" y="432" text-anchor="middle">optional</text>

  <rect class="input" x="1238" y="250" width="130" height="78"/>
  <text class="nodeText" x="1303" y="281" text-anchor="middle">decoder</text>
  <text class="nodeSub" x="1303" y="303" text-anchor="middle">final readout</text>

  <path class="eEdge" d="M182,260 C218,252 238,260 284,268"/>
  <path class="eEdge" d="M182,388 C222,378 236,404 284,416"/>
  <path class="eEdge" d="M182,382 C230,350 237,286 284,280"/>
  <path class="iEdge" d="M356,378 C348,350 350,336 358,319"/>
  <path class="iEdge" d="M526,378 C500,340 455,324 405,318"/>

  <path class="eEdge" d="M436,272 C575,255 675,255 815,272"/>
  <path class="eEdge" d="M436,292 C575,330 678,390 815,414"/>
  <path class="iEdge" d="M426,418 C575,520 700,520 817,298"/>
  <path class="iEdge" d="M987,418 L1010,418"/>
  <path class="iEdge" d="M902,378 C902,350 902,337 902,319"/>
  <path class="eEdge" d="M987,273 C1088,273 1146,287 1236,289"/>

  <path class="dEdge" d="M975,226 C1084,118 1072,118 970,228"/>
  <text class="small" x="1012" y="124">timing: delayed</text>
  <text class="small" x="1012" y="143">uses previous state</text>
  <path class="dEdge" d="M902,318 C898,682 394,680 360,319"/>
  <text class="small" x="540" y="704">delayed cross-layer feedback is allowed; same-step feedback is rejected</text>

  <rect class="callout" x="54" y="602" width="316" height="188"/>
  <text class="callTitle" x="78" y="632">Connection contract</text>
  <text class="code" x="78" y="660">source: input | input_e | input_i</text>
  <text class="code" x="78" y="682">source: layer0.e0 | pv0 | sst0</text>
  <text class="code" x="78" y="704">target: named population</text>
  <text class="code" x="78" y="726">timing: same_step | delayed</text>
  <text class="code" x="78" y="748">probability: optional hard mask</text>
  <text class="small" x="78" y="772">Same-step edges form a directed acyclic graph.</text>

  <rect class="callout" x="420" y="602" width="332" height="188"/>
  <text class="callTitle" x="444" y="632">Population contract</text>
  <text class="code" x="444" y="660">name, polarity, n_neurons</text>
  <text class="code" x="444" y="682">branch_factors: morphology</text>
  <text class="code" x="444" y="704">population: PopulationConfig overrides</text>
  <text class="code" x="444" y="726">use_shunting, tau_base, topk_type</text>
  <text class="code" x="444" y="748">synapse_types, dynamics_mode, feedback</text>
  <text class="small" x="444" y="772">E/I polarity selects the target stream.</text>

  <rect class="callout" x="802" y="602" width="292" height="188"/>
  <text class="callTitle" x="826" y="632">Synapse budget vs topology</text>
  <text class="code" x="826" y="660">ff_excitatory_synapses: K_E</text>
  <text class="code" x="826" y="682">ff_inhibitory_synapses: K_I</text>
  <text class="code" x="826" y="704">probability: eligible pairs</text>
  <text class="code" x="826" y="726">topk_type: standard | dense_to_sparse</text>
  <text class="small" x="826" y="754">Masks decide which pairs can connect;</text>
  <text class="small" x="826" y="774">TopK decides how many are active per branch.</text>

  <rect class="callout" x="1144" y="602" width="292" height="188"/>
  <text class="callTitle" x="1168" y="632">Recommended initialization</text>
  <text class="code" x="1168" y="660">reactivation_init_policy:</text>
  <text class="code" x="1168" y="682">  occupancy_quantile</text>
  <text class="code" x="1168" y="704">weight_transform: softplus</text>
  <text class="code" x="1168" y="726">weight_boosting: true</text>
  <text class="small" x="1168" y="754">Use normalized additive only when that</text>
  <text class="small" x="1168" y="774">model is intended explicitly.</text>

  <line class="eEdge" x1="1215" y1="78" x2="1260" y2="78"/>
  <text class="legendTitle" x="1272" y="83">excitatory source</text>
  <line class="iEdge" x1="1215" y1="106" x2="1258" y2="106"/>
  <text class="legendTitle" x="1272" y="111">inhibitory source</text>
  <line class="dEdge" x1="1215" y1="134" x2="1260" y2="134"/>
  <text class="legendTitle" x="1272" y="139">delayed recurrent</text>
</svg>
