<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640">
  <defs>
    <style>
      .title { font: 700 30px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 500 18px "DejaVu Sans", Arial, sans-serif; fill: #45637a; }
      .panel { fill: #f8fbfd; stroke: #8eafc3; stroke-width: 2.2; }
      .layerlabel { font: 700 18px "DejaVu Sans", Arial, sans-serif; fill: #153450; letter-spacing: 0.04em; }
      .epop { fill: #e3eefb; stroke: #2f6fb0; stroke-width: 2.2; }
      .ipop { fill: #fbe6e6; stroke: #b0433a; stroke-width: 2.2; }
      .io   { fill: #eef3f0; stroke: #5b7e6b; stroke-width: 2.2; }
      .nodetext { font: 600 17px "DejaVu Sans", Arial, sans-serif; fill: #173451; }
      .sub { font: 400 13px "DejaVu Sans", Arial, sans-serif; fill: #51697d; }
      .small { font: 400 14px "DejaVu Sans", Arial, sans-serif; fill: #51697d; }
      .ee { stroke: #2f6fb0; stroke-width: 2.4; fill: none; }
      .ii { stroke: #b0433a; stroke-width: 2.4; fill: none; }
      .delay { stroke: #7a5aa6; stroke-width: 2.4; fill: none; stroke-dasharray: 8 6; }
    </style>
    <marker id="aE" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2f6fb0"/></marker>
    <marker id="aD" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#7a5aa6"/></marker>
    <marker id="aI" markerWidth="12" markerHeight="12" refX="2" refY="5" orient="auto"><rect x="0" y="1" width="3" height="9" fill="#b0433a"/></marker>
  </defs>

  <text class="title" x="40" y="44">population_network — populations per layer · multilayer · recurrent routing</text>
  <text class="subtitle" x="40" y="72">Named E/I populations within each layer; solid = same-step (acyclic DAG), dashed = delayed (previous timestep)</text>

  <!-- input -->
  <rect class="io" x="40" y="270" width="92" height="64" rx="12"/>
  <text class="nodetext" x="86" y="299" text-anchor="middle">input</text>
  <text class="sub" x="86" y="319" text-anchor="middle">encoder</text>

  <!-- layer 0 -->
  <rect class="panel" x="210" y="120" width="300" height="380" rx="20"/>
  <text class="layerlabel" x="230" y="152">layer0</text>
  <text class="sub" x="230" y="172">readout_population: e0</text>
  <rect class="ipop" x="250" y="200" width="180" height="74" rx="14"/>
  <text class="nodetext" x="340" y="232" text-anchor="middle">i0  (inhibitory)</text>
  <text class="sub" x="340" y="254" text-anchor="middle">branch_factors:[1]</text>
  <rect class="epop" x="250" y="330" width="180" height="86" rx="14"/>
  <text class="nodetext" x="340" y="366" text-anchor="middle">e0  (excitatory)</text>
  <text class="sub" x="340" y="388" text-anchor="middle">dendritic branches · shunting</text>

  <!-- layer 1 -->
  <rect class="panel" x="620" y="120" width="300" height="380" rx="20"/>
  <text class="layerlabel" x="640" y="152">layer1</text>
  <text class="sub" x="640" y="172">readout_population: e1</text>
  <rect class="ipop" x="660" y="200" width="180" height="74" rx="14"/>
  <text class="nodetext" x="750" y="232" text-anchor="middle">i1  (inhibitory)</text>
  <text class="sub" x="750" y="254" text-anchor="middle">branch_factors:[1]</text>
  <rect class="epop" x="660" y="330" width="180" height="86" rx="14"/>
  <text class="nodetext" x="750" y="366" text-anchor="middle">e1  (excitatory)</text>
  <text class="sub" x="750" y="388" text-anchor="middle">dendritic branches · shunting</text>

  <!-- decoder / output -->
  <rect class="io" x="1010" y="338" width="100" height="64" rx="12"/>
  <text class="nodetext" x="1060" y="367" text-anchor="middle">decoder</text>
  <text class="sub" x="1060" y="387" text-anchor="middle">readout</text>

  <!-- input -> layer0 (same-step) -->
  <path class="ee" d="M132,296 C175,296 180,237 248,237" marker-end="url(#aE)"/>
  <path class="ee" d="M132,308 C175,308 185,373 248,373" marker-end="url(#aE)"/>
  <!-- i0 -> e0 (same-step inhibitory) -->
  <path class="ii" d="M340,274 L340,328" marker-end="url(#aI)"/>

  <!-- cross-layer same-step (layer0 -> layer1), excitatory forward -->
  <path class="ee" d="M430,360 C540,360 545,237 658,237" marker-end="url(#aE)"/>
  <path class="ee" d="M430,373 C540,373 555,373 658,373" marker-end="url(#aE)"/>
  <!-- layer0.i0 -> layer1.e1 (cross-layer inhibitory, same-step) -->
  <path class="ii" d="M430,237 C520,237 540,420 660,400" marker-end="url(#aI)"/>
  <!-- i1 -> e1 same-step inhibitory -->
  <path class="ii" d="M750,274 L750,328" marker-end="url(#aI)"/>

  <!-- e1 -> decoder -->
  <path class="ee" d="M840,373 C920,373 950,370 1008,370" marker-end="url(#aE)"/>

  <!-- delayed recurrent: e1 self-loop -->
  <path class="delay" d="M820,330 C880,300 880,300 820,344" marker-end="url(#aD)"/>
  <text class="small" x="852" y="306">e1&#8594;e1 (delayed)</text>
  <!-- delayed feedback layer1.e1 -> layer0.e0 (previous timestep) -->
  <path class="delay" d="M745,416 C700,560 360,560 340,418" marker-end="url(#aD)"/>
  <text class="small" x="470" y="582" text-anchor="middle">delayed feedback: layer1.e1 &#8594; layer0.e0 (previous timestep)</text>

  <!-- legend -->
  <line class="ee" x1="980" y1="470" x2="1020" y2="470" marker-end="url(#aE)"/>
  <text class="small" x="1028" y="475">excitatory (same-step)</text>
  <line class="ii" x1="980" y1="498" x2="1018" y2="498" marker-end="url(#aI)"/>
  <text class="small" x="1028" y="503">inhibitory (same-step)</text>
  <line class="delay" x1="980" y1="526" x2="1020" y2="526" marker-end="url(#aD)"/>
  <text class="small" x="1028" y="531">delayed (prev timestep)</text>
</svg>
