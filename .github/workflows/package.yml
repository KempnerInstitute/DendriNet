name: Package release

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      distribution:
        description: Package to publish from its release tag
        type: choice
        default: core
        options: [core, studio]
      target:
        description: Build, stage on TestPyPI, or promote the staged files
        type: choice
        default: build-only
        options: [build-only, testpypi, pypi]
      authentication:
        description: Upload credential for the selected package and index
        type: choice
        default: trusted-publisher
        options: [trusted-publisher, project-token]
      staging_run_id:
        description: Successful TestPyPI workflow run ID (required for PyPI)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Build and inspect both distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist/core
          python -m build apps/studio --outdir dist/studio
          python -m twine check --strict dist/{core,studio}/*
          python setup/check_distribution.py dist/core
      - name: Verify staging tag
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        env:
          PACKAGE: ${{ inputs.distribution }}
        run: python setup/verify_release.py "$PACKAGE" "$GITHUB_REF"
      - name: Exercise installed wheels outside the source tree
        env:
          DENDRITIC_MODELING_PLUGINS: '0'
          CUDA_VISIBLE_DEVICES: ''
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/core/*.whl dist/studio/*.whl pytest playwright
          python -m playwright install --with-deps chromium
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          python -m pip check
          python "$GITHUB_WORKSPACE/setup/check_installed.py"
          python "$GITHUB_WORKSPACE/setup/check_installed_sweep.py"
          python -m pytest "$GITHUB_WORKSPACE/apps/studio/tests" -q
          python -m pip install jupyter-server-proxy==4.6.1
          python -m pytest "$GITHUB_WORKSPACE/.binder/test_session.py" -q
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-core
          path: dist/core/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-studio
          path: dist/studio/*
          if-no-files-found: error

  stage:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && inputs.authentication != 'project-token'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-${{ inputs.distribution }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-promotion:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PACKAGE: ${{ inputs.distribution }}
      STAGING_RUN: ${{ inputs.staging_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify source workflow and revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$STAGING_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN" |
            jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_branch == $tag and .head_repository.full_name == $repo and
              .event == "workflow_dispatch" and .path == ".github/workflows/package.yml" and .conclusion == "success"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN/jobs?filter=latest" |
            jq -e --arg token_job "Upload $PACKAGE to testpypi with a project token" '
              any(.jobs[]; (.name == "stage" or .name == $token_job) and .conclusion == "success")'
          python -m pip install packaging
          python setup/verify_release.py "$PACKAGE" "$GITHUB_REF"
      - uses: actions/download-artifact@v4
        with:
          name: qualified-${{ inputs.distribution }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: staged
      - name: Match the staged archives to the files published on TestPyPI
        run: python setup/verify_release.py "$PACKAGE" "$GITHUB_REF" --staged staged
      - uses: actions/upload-artifact@v4
        with:
          name: verified-for-pypi
          path: staged/*
          if-no-files-found: error

  publish:
    needs: verify-promotion
    if: inputs.authentication != 'project-token'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-for-pypi
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  upload-with-project-token:
    name: Upload ${{ inputs.distribution }} to ${{ inputs.target }} with a project token
    needs: [build, verify-promotion]
    # Each target has one producer. Its artifacts must have passed that job.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.authentication == 'project-token' &&
      ((inputs.target == 'testpypi' && needs.build.result == 'success') ||
       (inputs.target == 'pypi' && needs.verify-promotion.result == 'success'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.target == 'testpypi' && format('qualified-{0}', inputs.distribution) || 'verified-for-pypi' }}
          path: dist
      - name: Require the selected project token
        env:
          UPLOAD_TOKEN: ${{ secrets[inputs.distribution == 'core' && 'CORE_PROJECT_TOKEN' || 'STUDIO_PROJECT_TOKEN'] }}
        run: |
          if [[ -z "$UPLOAD_TOKEN" ]]; then
            echo "::error::Set the selected package's project token in the target environment."
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          user: __token__
          password: ${{ secrets[inputs.distribution == 'core' && 'CORE_PROJECT_TOKEN' || 'STUDIO_PROJECT_TOKEN'] }}
          attestations: false
