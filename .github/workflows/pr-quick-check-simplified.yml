name: Quick PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quick-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install ruff

    - name: Quick lint check
      run: |
        echo "Running quick code quality checks..."
        ruff check src/ tests/ --output-format=github

    - name: Import test
      env:
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        echo "Testing core imports..."
        python -c "
        import dendritic_modeling
        import dendritic_modeling.datasets
        import dendritic_modeling.models
        import dendritic_modeling.training
        print('✅ All core imports successful')
        "

    - name: Fast smoke tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
      run: |
        echo "Running smoke tests..."
        python -m pytest tests/ -x --tb=short \
          -k "not slow and not gpu and not data and not integration" \
          --maxfail=3 \
          --durations=5
