name: CI Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  # Fast quality checks - runs first to catch obvious issues
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.15.1" "black==24.10.0" "isort==5.13.2" "mypy>=1.0,<1.4"

    - name: Run code quality checks
      run: |
        echo "::group::Ruff (linting)"
        ruff check src/ tests/ --output-format=github
        echo "::endgroup::"

        echo "::group::Black (formatting)"
        black --check --diff src/ tests/
        echo "::endgroup::"

        echo "::group::isort (import sorting)"
        isort --check-only --diff src/ tests/
        echo "::endgroup::"

        echo "::group::MyPy (type checking)"
        mypy src/dendritic_modeling --ignore-missing-imports || echo "Type checking completed with warnings"
        echo "::endgroup::"

  # Core tests - essential functionality
  test:
    needs: quality
    permissions:
      contents: read
      issues: write  # The coverage action comments on existing PRs via the issue-comments API.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Simplified matrix: test on essential Python versions only (Linux only for SLURM compatibility)
        include:
          - os: ubuntu-latest
            python-version: "3.10"  # Minimum supported, on the pinned core stack
          - os: ubuntu-latest
            python-version: "3.11"  # Primary development version
          - os: ubuntu-latest
            python-version: "3.12"  # Latest stable

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbz2-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Python 3.10 installs the pinned stack the core line is qualified on
        # (setup/constraints); the other versions take the newest releases.
        CONSTRAINTS=""
        if [ "${{ matrix.python-version }}" = "3.10" ]; then
          CONSTRAINTS="-c setup/constraints/core-py310-torch2.9.1.txt"
        fi
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu $CONSTRAINTS
        pip install -e .[dev] $CONSTRAINTS
        pip install \
          "coverage[toml]==7.13.4" \
          "pytest==9.0.2" \
          "pytest-cov==7.0.0" \
          "pytest-timeout==2.4.0" \
          "pytest-xdist==3.8.0"

    - name: Verify installation
      run: |
        python -c "import dendritic_modeling; print('Package installed successfully')"

    - name: Run compatibility tests
      if: matrix.python-version != '3.11'
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
      run: |
        python -m pytest tests/ \
          -n 2 \
          --dist loadfile \
          -m "not multiprocess" \
          --no-cov \
          --timeout=300 \
          --durations=25 \
          --junitxml=pytest-results.xml \
          --maxfail=5 \
          -v

    - name: Run tests with coverage
      if: matrix.python-version == '3.11'
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
        COV_FAIL_UNDER: "30"
      run: |
        python -m pytest tests/ \
          -n 2 \
          --dist loadfile \
          -m "not multiprocess" \
          --cov=src/dendritic_modeling \
          --cov-branch \
          --cov-report=xml \
          --cov-fail-under=${COV_FAIL_UNDER} \
          --timeout=300 \
          --durations=25 \
          --junitxml=pytest-results.xml \
          --maxfail=5 \
          -v

    # Tests that start their own worker processes (distributed training) run
    # one at a time, outside pytest-xdist: on the two-CPU runners a parallel
    # test worker starves them. gloo connects the local processes over the
    # loopback interface.
    - name: Run multi-process tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
        OMP_NUM_THREADS: "1"
        GLOO_SOCKET_IFNAME: lo
      run: |
        python -m pytest tests/ \
          -m multiprocess \
          -p no:xdist \
          --no-cov \
          --timeout=900 \
          --durations=10 \
          --junitxml=pytest-multiprocess-results.xml \
          -v

    # Only upload coverage from one job to avoid duplicates
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage badge for the report
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        python docs/scripts/generate_coverage_badge.py \
          --coverage-xml coverage.xml \
          --output coverage.svg

    - name: Check coverage file exists
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        echo "Checking for coverage.xml file..."
        ls -la coverage.xml || echo " coverage.xml not found"
        if [ -f coverage.xml ]; then
          echo " coverage.xml found!"
          echo "File size: $(du -h coverage.xml)"
          head -n 5 coverage.xml || echo "Could not read file contents"
        else
          echo " coverage.xml missing - tests may have failed"
          exit 1
        fi

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      uses: orgoro/coverage@v3
      with:
        coverageFile: coverage.xml
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          pytest-results.xml
          pytest-multiprocess-results.xml

    - name: Upload coverage report
      if: always() && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          coverage.xml
          coverage.svg

  # Security and documentation - only on PRs to save resources
  extras:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[docs,dev]

    - name: Security scan
      continue-on-error: true
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        inputs: requirements.txt
        ignore-vulns: |
          GHSA-887c-mr87-cxwp

    - name: Build documentation (warnings are errors)
      run: |
        python -m sphinx -b html -W --keep-going docs docs/_build/html

    - name: Check that the command-line reference is current
      run: python docs/scripts/generate_cli_reference.py --check

    - name: Check that the options reference is current
      run: python docs/scripts/generate_options_reference.py --check
