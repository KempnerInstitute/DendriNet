name: Quick PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quick-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-quick-
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbz2-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest pytest-cov ruff black isort

    - name: Run quick linting
      run: |
        echo "🔍 Running quick code quality checks..."
        ruff check src/ tests/ --output-format=github || true
        black --check --diff src/ tests/ || true
        isort --check-only --diff src/ tests/ || true

    - name: Run fast tests only
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
      run: |
        echo "🧪 Running fast unit tests..."
        python -m pytest tests/ \
          -m "not slow and not requires_gpu and not requires_data" \
          --maxfail=3 \
          --tb=short \
          -q

    - name: Test package import
      run: |
        echo "📦 Testing package imports..."
        python -c "
        try:
            import dendritic_modeling
            from dendritic_modeling import models, networks, datasets, config
            print('✅ All core imports successful')
        except Exception as e:
            print(f'❌ Import failed: {e}')
            exit(1)
        "

    - name: Check test runner
      run: |
        echo "🏃 Testing custom test runner..."
        python tests/test_runner.py --check-deps

    - name: PR Status Comment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const { data: checks } = await github.rest.checks.listForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
          });
          
          const conclusion = checks.check_runs.every(check => 
            check.conclusion === 'success' || check.conclusion === 'neutral'
          ) ? '✅ Quick checks passed!' : '❌ Quick checks failed!';
          
          const body = `## 🚀 Quick PR Check Results
          
          ${conclusion}
          
          **Fast tests completed** - Full CI pipeline will run after this check.
          
          📊 **What was checked:**
          - ✅ Package imports
          - ✅ Fast unit tests (no slow/GPU/data tests)  
          - ✅ Basic linting (ruff, black, isort)
          - ✅ Test runner functionality
          
          💡 **Next steps:**
          - Full test suite will run automatically
          - Coverage report will be generated
          - Cross-platform testing will be performed
          `;
          
          // Only comment if this is the first run or if status changed
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          }); 