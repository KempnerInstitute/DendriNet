name: Quick PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quick-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-quick-
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbz2-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest pytest-cov ruff black isort

    - name: Run quick linting
      run: |
        echo "Running quick code quality checks..."
        ruff check src/ tests/ --output-format=github || true
        black --check --diff src/ tests/ || true
        isort --check-only --diff src/ tests/ || true

    - name: Run fast tests only
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        MPLBACKEND: Agg
        CUDA_VISIBLE_DEVICES: ""
      run: |
        echo "Running fast unit tests..."
        python -m pytest tests/ -v --tb=short -x \
          -k "not slow and not gpu and not data and not integration" \
          --durations=10 || exit 1
          
        echo "Quick import tests..."
        python -c "
        try:
            import dendritic_modeling
            print('All core imports successful')
        except Exception as e:
            print(f'Import failed: {e}')
            exit(1)
        "
          
        echo "Basic package structure checks..."
        python -c "
        import dendritic_modeling
        import dendritic_modeling.datasets
        import dendritic_modeling.models
        import dendritic_modeling.training
        print('Package structure OK')
        "

    - name: Comment on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const success = ${{ job.status == 'success' }};
          const statusIcon = success ? 'passed' : 'failed';
          const emoji = success ? 'All core imports successful' : 'Quick checks failed';
          
          const body = `## Quick PR Check Results
          
          **Status**: ${statusIcon}
          
          This is a quick smoke test to catch obvious issues early. The full CI pipeline will run separately.
          
          **What was checked:**
          - Package imports
          - Fast unit tests (no slow/GPU/data tests)
          - Basic linting (ruff, black, isort)
          - Test runner functionality
          
          **Next steps:**
          - If this failed, please fix the issues before requesting review
          - If this passed, wait for the full CI pipeline to complete
          - The full test suite includes GPU tests, integration tests, and more thorough checks
          
          *This comment is automatically generated by the quick PR check workflow.*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          }); 