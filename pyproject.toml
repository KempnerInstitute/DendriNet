[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendritic_modeling"
version = "0.1.0"
description = "package containing artificial neural networks emulating dendritic computation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dendritic Modeling Team", email = "hsafaai@fas.harvard.edu"}
]
requires-python = ">=3.10,<4.0"
keywords = ["dendritic", "neural-networks", "pytorch", "machine-learning", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "torch>=2.0.0,!=2.6.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "torchinfo>=1.7.0",
    "omegaconf>=2.1.0,<3.0.0",
    "PyYAML>=6.0",
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0,<3.0.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0",
    "plotly>=5.0.0",
    "wandb>=0.12.0",
    "tensorboard>=2.10.0",
    "psutil>=5.8.0",
    "tqdm>=4.60.0",
    "python-dateutil",
]

[project.urls]
"Bug Reports" = "https://github.com/kempner-institute/dendritic-modeling/issues"
"Source" = "https://github.com/kempner-institute/dendritic-modeling"
"Documentation" = "https://github.com/kempner-institute/dendritic-modeling/blob/main/README.md"

[project.scripts]
dendritic-train = "dendritic_modeling.scripts.training.train_experiments:cli_main"
dendritic-train-transformer-replacement = "dendritic_modeling.scripts.training.train_transformer_replacement:main"
dendritic-benchmark-transformer-replacement = "dendritic_modeling.scripts.training.benchmark_transformer_replacement:main"
dendritic-profile-transformer-scaling = "dendritic_modeling.scripts.transformer_replacement.profile_scaling:main"
dendritic-benchmark-transformer-operator = "dendritic_modeling.scripts.transformer_replacement.benchmark_operator:main"
dendritic-assemble-transformer-replacements = "dendritic_modeling.scripts.transformer_replacement.assemble_layer_checkpoints:main"
dendritic-compact-transformer-checkpoint = "dendritic_modeling.scripts.transformer_replacement.compact_checkpoint:main"
dendritic-sweep = "dendritic_modeling.scripts.sweeps.sweep_manager:main"
dendritic-analyze = "dendritic_modeling.scripts.sweeps.result_analyzer:main"
dendritic-analyze-checkpoint = "dendritic_modeling.scripts.analysis.run_checkpoint_analysis:main"
dendritic-submit-checkpoint-analysis = "dendritic_modeling.scripts.analysis.submit_checkpoint_analysis:main"
dendritic-collect-representations = "dendritic_modeling.scripts.analysis.collect_representation_accessibility:main"
dendritic-collect-path-interventions = "dendritic_modeling.scripts.analysis.collect_path_matched_intervention:main"
dendritic-collect-path-information = "dendritic_modeling.scripts.analysis.collect_path_matched_information:main"
dendritic-collect-local-i-interventions = "dendritic_modeling.scripts.analysis.collect_layer_population_interventions:main"
dendritic-collect-checkpoint-analysis = "dendritic_modeling.scripts.analysis.collect_checkpoint_analysis:main"
dendritic-collect-reactivation = "dendritic_modeling.scripts.analysis.collect_reactivation_dynamics:main"
dendritic-collect-synaptic-support = "dendritic_modeling.scripts.analysis.collect_synaptic_support:main"
dendritic-summarize-checkpoint-metrics = "dendritic_modeling.scripts.analysis.summarize_checkpoint_metrics:main"
dendritic-poisson-exposure-transfer = "dendritic_modeling.scripts.analysis.run_poisson_exposure_transfer:main"
dendritic-collect-poisson-transfer = "dendritic_modeling.scripts.analysis.collect_poisson_exposure_transfer:main"
dendritic-collect-sweep-metrics = "dendritic_modeling.scripts.sweeps.collect_sweep_metrics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
    "coverage[toml]>=6.5.0",
    "networkx",
    "mock",
]

lint = [
    "ruff==0.15.1",
    "mypy>=1.0,<1.4",
    "black==24.10.0",
    "isort==5.13.2",
    "pre-commit>=3.0.0",
]

dev = [
    "dendritic_modeling[test,lint]",
    "twine>=1.11.0",
    "setuptools",
    "wheel",
    "build",
]

tf = [
    "tensorflow>=2.16.0",
    "tensorflow_probability",
    "tf-keras",
]

train = [
    "jupyter>=1.0.0",
    "ipykernel",
    "ipython>=8.0.0",
]

transformer = [
    "transformers>=4.52,<5",
    "datasets>=2.19",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "myst-parser",
    "nbsphinx",
    "recommonmark",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex",
]

all = [
    "dendritic_modeling[dev,train,docs,tf,transformer]",
]

# Configuration for coverage
[tool.coverage.run]
source = ["src/dendritic_modeling"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == \\.__main\\__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "external/**/*",
    "external/",
    ".git/",
    "__pycache__/",
    ".venv/",
    ".pytest_cache/",
    "build/",
    "dist/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B009",  # do not call getattr with a constant attribute value
    "B010",  # do not call setattr with a constant attribute value
    "B905",  # zip(strict=...) migration deferred for current style
    "UP007",  # keep Optional[...] annotations for consistency
    "UP045",  # keep Optional[...] annotations for consistency with current codebase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Black configuration (keeping for compatibility)
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    external
    | \.git
    | __pycache__
    | \.venv
    | \.pytest_cache
    | build
    | dist
)/
'''

# isort configuration (compatible with Black)
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_single_line = false
combine_as_imports = true
skip = ["external"]
