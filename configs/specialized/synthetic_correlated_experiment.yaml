model:
  task: classification
  encoder_network:
    type: identity
    parameters: {}
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1  # E gets input, I gets network output (creates E/I difference)
        independent_pathways: true  # E and I get different input subsets
        excitatory_dim: 15  # First 15 dimensions for E pathway
        inhibitory_dim: 15  # Last 15 dimensions for I pathway
        # output_activation: sigmoid  # Options: sigmoid, relu, tanh, softplus, none (constrains transfer outputs)
        
      # Network architecture
      excitatory_layer_sizes: [1]  # 1 excitatory neuron
      inhibitory_layer_sizes: [1]  # 1 inhibitory neuron (will process E inputs)
      excitatory_branch_factors: [1]  # No branching for single layer
      inhibitory_branch_factors: []  # No branching for single layer
      
      # Synaptic connectivity
      ee_synapses_per_branch_per_layer: [10]   # E->E connections (max 1 since 1 E neuron)
      ei_synapses_per_branch_per_layer: [1]   # E->I connections (max 1 since 1 E neuron)  
      ie_synapses_per_branch_per_layer: [10]   # I->E connections (max 1 since 1 I neuron)
      ii_synapses_per_branch_per_layer: [0]   # No I->I connections
      somatic_synapses: false
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
      
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [32]
      activation: relu
      output_dim: 2  # Binary classification

train:
  seed: 42
  train_valid_split: 0.8
  
  # Performance optimization settings
  enable_amp: false
  enable_profiling: false
  profiling_output_dir: "outputs/profiling/"
  enable_hooks: true
  use_fsdp: false
  fsdp_config: null
  checkpointing:
    enabled: true
    save_every_n_epochs: 10
    checkpoint_dir: "outputs/checkpoints/"
  
  encoder:
    load_save_root: saved_models/encoder
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0  # Skip encoder training for identity encoder
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll  # Cross entropy for classification
      epochs: 50
      early_stopping: true
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10

task:
  dataset: synthetic_correlated
  data_path:
  parameters:
    train_size: 5000
    valid_size: 1000
    test_size: 1000
    input_dim: 30  # Must be divisible by 3
    corr_min: -0.5
    corr_max: 0.5
    mean_magnitude: 0.1  # Magnitude of mean separation between classes

wandb:
  entity:
  project: "synthetic_correlated_analysis"
  group: "correlation_learning"
  tags: [synthetic, correlation, ei_network]
  use_wandb: false

# Note: visualization is not part of the main Config class
    
analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      auc: true
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  correlation_analysis:
    enabled: true
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true

  information_analysis:
    enabled: true
    training: false
    params:
      method: "copula"
      max_samples: 1000
      n_neighbors: 10
      n_bins: 20
      copula_type: "gaussian"
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      include_vinf: true
      normalize_mi: true
      verbose: true
      compute_per_branch: false
      branch_aggregation: none

outputs:
  run_name: synthetic_correlated_exp
  dir: ./results/synthetic_correlated
  dataset_dir: ""                         # Optional: separate directory for shared datasets 