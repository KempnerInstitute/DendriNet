model:
  task: classification
  
  encoder_network:
    type: Identity  # Process raw ImageNet images
    parameters: {}
    
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters for ImageNet (224x224x3 = 150528 dimensions)
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 2048  # Reduced from 8192
        inhibitory_dim: 2048  # Reduced from 8192
      
      # Large but reasonable network architecture
      excitatory_layer_sizes: [4096, 2048, 1024, 1000]  # 4 layers instead of 5
      inhibitory_layer_sizes: [2048, 1024, 512, 256]    # 4 layers of inhibitory neurons
      
      # Deep dendritic tree but more reasonable
      excitatory_branch_factors: [4, 4, 2, 2]  # 64 branches per neuron (reduced from 512)
      inhibitory_branch_factors: [4, 2, 2]     # 16 branches per inhibitory neuron
      
      # Reduced synapses per branch
      ee_synapses_per_branch_per_layer: [128, 64, 32, 16]   # E→E connections
      ei_synapses_per_branch_per_layer: [64, 32, 16, 8]     # E→I connections
      ie_synapses_per_branch_per_layer: [128, 64, 32, 16]   # I→E connections
      ii_synapses_per_branch_per_layer: [32, 16, 8, 4]      # I→I connections
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      topk_strategy: conductance_dynamic
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: inverse
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
      
      # DEEPST parameters (if using topk_type: deepst)
      excitatory_target_density: 0.1
      inhibitory_target_density: 0.1
      use_noise: true
      noise_std: 0.01
      rewiring_frequency: 10
      use_momentum: true
      momentum_factor: 0.9
    
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [2048, 1024]
      activation: relu
      output_dim: 1000  # ImageNet has 1000 classes

train:
  seed: 42
  train_valid_split: 0.9
  
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      epochs: 0  # No encoder training needed for Identity
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.0005
      blocklinear_lr: 0.0005
      reactivation_lr: 0.0005
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 100
      early_stopping: true
      patience: 10
      batch_size: 256  # 16 per GPU across 16 GPUs
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 50

task:
  dataset: imagenet
  data_path: /path/to/imagenet  # Update with actual path
  parameters:
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: true
    # ImageNet specific parameters
    image_size: 224
    normalize: true
    augment: true
    
wandb:
  entity: ""
  project: "dendritic_imagenet_4nodes"
  group: "large_ei_deep_morphology"
  tags: [imagenet, 4nodes, deep_dendrites]
  use_wandb: false

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      
  information_analysis:
    enabled: true
    training: false
    params:
      method: "kraskov"
      max_samples: 1000
      n_neighbors: 10
      compute_basic_mi: true
      compute_per_branch: true
      branch_aggregation: none

outputs:
  run_name: ei_4nodes_imagenet
  dir: results/ 