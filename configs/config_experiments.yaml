train:
  dataset_name: "mnist"           # "line", "center_surround", "orientation_bars", "multi_xor", or "mnist"
  train_size: 8000
  valid_size: 1000
  test_size: 1000
  image_size: 10
  n_orient_classes: 8
  n_bits: 8
  train_valid_split: 0.9

  batch_size: 64
  lr: 0.001
  epochs: 20
  grad_clip_value: 1

model:
  # Choose "MLP" or "EINet"
  type: "EINet"  

  # ============= If MLP =============
  hidden_dim: 50     # used only if model.type == "MLP"

  # ============= If EINet =============
  excitatory_layer_sizes: [10]
  inhibitory_layer_sizes: [20]
  excitatory_branch_factors: [1,2]
  inhibitory_branch_factors: []

  # synapses
  ee_synapses_per_branch_per_layer: [24]
  ei_synapses_per_branch_per_layer: [200]
  ie_synapses_per_branch_per_layer: [1]
  ii_synapses_per_branch_per_layer: []

  reactivate: True
  somatic_synapses: True
  topk_init_method: "xavier_normal"
  use_shunting: true

wandb:
  entity: "your_wandb_entity"
  project: "dendritic_modeling"   # or any project name
  group: "experiment_group"
  tags: ["line_task", "EINet"]    # or MLP, or any tags