# sweep_params.yaml

slurm_config:
  output_dir: 
  conda_env_path: 
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"]
  max_concurrent_jobs: 8
  training_script: "/" # path of train_experiments.py
  config_filename_init: "test_config"
  account: "kempner_dev"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 200GB
  time: "0:30:00"
  partition: "kempner_h100"
  run_name: "dendritic_model_sweep_job"

train_config:
  model:
    task: "classification"
    probabilistic: True
    network:
      type: "EINet"
      parameters:
        input_dim: 784
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [40]
        excitatory_branch_factors: [5,5,5,5,5]
        inhibitory_branch_factors: [1]
        reactivate: false
        somatic_synapses: false
        ee_synapses_per_branch_per_layer: [100]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
        topk_init_method: "xavier_normal"
        use_shunting: true
        
        reactivation_type: param_tanh
        reactivation_strategy: inverse
        blocklinear_strategy: none
        
        enable_branch_outputs: true
        output_layer: false
        output_dim: 10
        
        input_mode: 0
        input_net_dict:
          type: "MLPInputTransform"
          hidden_dims: []
          output_dim: 128

  train:
    learning_strategy: "freeze_branches"   # Using branch-focused methods only
    run_name: "mnist_einet"
    seed: 0
    train_valid_split: 0.8
    lr: 0.03
    epochs: 20
    batch_size: 100
    grad_clip_value: 5
    epochs_per_layer: 10  # Used as epochs_per_branch for branch-focused methods
    final_tune_epochs: 10  # For final fine-tuning after branch-by-branch training
    pretrain_epochs: 10    # For initial full-network training in strategies with pretraining

  # If you have wandb config:
  wandb:
    entity: 
    project: dendritic_mnist_sweep_learning_strategy
    group: "debug"
    tags: [mnist_sweep]
    use_wandb: true
    
  # task config (for get_unified_datasets):
  task:
    dataset: "random_flip_mnist"
    parameters: {r}


  visualization:
    enabled: true
    save_path: 
    plots:
      #- "weights"
      #- "activations"
      - "dendritic_ablation_all"
      - "dendritic_information"


sweep_config:
  # Example: vary some network parameters
  #model.network.parameters.excitatory_branch_factors: [[5,5,5,5,5], [10,10,10,10,10], [3,3,3,3,3]]
  #model.network.parameters.inhibitory_branch_factors: [[1], [2], [5]]
  #model.network.parameters.use_shunting: [true, false]

  # Vary training parameters
  #train.epochs: [20, 30, 40]
  #train.batch_size: [100, 200, 500]
  #train.lr: [0.01, 0.03, 0.05]
  
  # Vary branch-focused training parameters
  train.epochs_per_layer: [5, 10, 15]
  train.final_tune_epochs: [5, 10, 15]
  train.pretrain_epochs: [5, 10, 15]

  # The most important sweep - learning strategies
  train.learning_strategy: ["mle", "freeze_branches", "freeze_branches_reversed", "freeze_branches_with_pretraining", "freeze_branches_reversed_with_pretraining", "voltage_stabilization"]


#python scripts/generate_sweep_configs.py configs sweep_params.yaml