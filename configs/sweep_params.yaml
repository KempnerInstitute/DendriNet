slurm_config:
  output_dir: "/n/holyscratch01/kempner_dev/Users/nkhoshnevis/projects/dendritic_modeling/results_dir"
  conda_env_path: "/n/holyscratch01/kempner_dev/Users/nkhoshnevis/.conda/envs/dendritic_env"
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"]
  max_concurrent_jobs: 8
  training_script: "scripts/train_mnist.py"
  config_filename_init: "test_config"

  account: "kempner_dev"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 64GB
  time: "1:00:00"
  partition: "kempner"


train_config:
  run_name: "dendritic_modeling_sweep"
  seed: 0
  epochs: 10
  batch_size: 32
  
  wandb:
    entity: naeem_ai  # <---- Add your entity
    project: dendritic_modeling_pr
    group: debug
    tags: [mnist_1]

  optimizer:
    name: "adam"
    learning_rate: 0.001

  scheduler:
    name: "none"
  
  model:
    input_dim: 784
    excitatory_layer_sizes: [10]
    inhibitory_layer_sizes: [20]
    excitatory_branch_factors: [24]
    inhibitory_branch_factors: []
    reactivate: true
    somatic_synapses: true
    ee_synapses_per_branch_per_layer: [24]
    ei_synapses_per_branch_per_layer: [100]
    ie_synapses_per_branch_per_layer: [1]
    ii_synapses_per_branch_per_layer: []
  
sweep_config:
  optimizer:
    learning_rate: [0.001, 0.0001, 0.1]
  model:
    inhibitory_layer_sizes: [[10], [20], [30]]
    ee_synapses_per_branch_per_layer: [[24], [22]]













