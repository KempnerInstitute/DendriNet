# sweep_params.yaml

slurm_config:
  output_dir: /n/netscratch/kempner_dev/hsafaai/results/dendritic_modeling_sweep
  conda_env_path: /n/home13/hsafaai/.conda/envs/dendritic_env
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"]
  max_concurrent_jobs: 8
  training_script: "/n/holylabs/LABS/kempner_dev/Users/hsafaai/Code/dendritic-modeling/scripts/train_experiments.py"
  config_filename_init: "test_config"
  account: "kempner_dev"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 200GB
  time: "0:30:00"
  partition: "kempner_h100"
  run_name: "dendritic_model_sweep_job"

train_config:
  model:
    task: "classification"
    probabilistic: True
    network:
      type: "EINet"
      parameters:
        input_dim: 784
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [20]
        excitatory_branch_factors: [1, 1, 1, 2, 2]
        inhibitory_branch_factors: []
        reactivate: true
        somatic_synapses: true
        ee_synapses_per_branch_per_layer: [24, 24, 24, 24, 24]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [1, 1, 1, 1, 1]
        ii_synapses_per_branch_per_layer: []
        topk_init_method: "xavier_normal"
        use_shunting: true

        # initialization tweaks:
        init_gain: 1.0
        init_inhib_offset: 1.3
        reactivation_initial_m: 3.0
        reactivation_initial_b: 0.5

        # gradient / local learning
        gradient_strategy: none
        gradient_scale_factor: 20

        weight_decay_rate: 0.1

        local_learning: none
        local_loss_weight: 5

  train:
    run_name: "mnist_einet_sweep"
    seed: 0
    train_valid_split: 0.8
    lr: 0.01
    epochs: 50
    batch_size: 1000
    grad_clip_value: 5
    weight_decay: 0.0
    epochs_per_layer: 50

  # If you have wandb config:
  wandb:
    entity: "houman_safaai-harvard-university"
    project: "dendritic_mnist_sweep_2_2_X"
    group: "debug"
    tags: [mnist_sweep]

  # optional analysis config:
  analysis:
    enable_ablation: true
    enable_mutual_info: false

  # task config (for get_unified_datasets):
  task:
    dataset: "mnist"
    parameters: {R}

sweep_config:
  # Example: vary some network parameters
  model.network.parameters.gradient_strategy: ["none", "uniform_scale", "distal_upweight", "distal_upweight_by_idx", "freeze_layer"]
  #model.network.parameters.gradient_scale_factor: [1.0, 2.0]
  #model.network.parameters.init_gain: [0.5, 1.0, 2.0]
  #model.network.parameters.init_inhib_offset: [0.0, 1.0]
  model.network.parameters.local_learning: ["none", "backprop_alignment"]
  #model.network.parameters.local_loss_weight: [0.0, 0.5]
  model.network.parameters.excitatory_branch_factors: [[1, 1, 1, 2, 2],[1, 1, 1, 2, 5],[1, 1, 1, 2, 10],[1, 1, 1, 2, 20],[1, 1, 1, 2, 50]]

  # Possibly vary training as well
  #train.epochs: [50, 100]
  #train.batch_size: [500, 200]

  #model.network.parameters.topk_init_method: ['xavier_normal', 'xavier_uniform', 'normal', 'uniform']
