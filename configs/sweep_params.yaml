# sweep_config.yaml

slurm_config:
  output_dir: /n/netscratch/kempner_dev/hsafaai/dendritic_modeling
  conda_env_path: /n/home13/hsafaai/.conda/envs/dendritic_env
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"]
  max_concurrent_jobs: 8
  training_script: "/n/holylabs/LABS/kempner_dev/Users/hsafaai/Code/dendritic-modeling/scripts/train_experiments.py"
  config_filename_init: "test_config"
  account: "kempner_dev"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 1200GB
  time: "0:30:00"
  partition: "kempner_h100"
  run_name: "dendritic_modeling_sweep_job"

base_config:
  model:
    task: classification
    probabilistic: false
    network:
      type: "einet"
      parameters:
        input_dim: 784
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [20]
        excitatory_branch_factors: [1, 2]
        inhibitory_branch_factors: []
        reactivate: true
        somatic_synapses: true
        ee_synapses_per_branch_per_layer: [24]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [1]
        ii_synapses_per_branch_per_layer: []
        topk_init_method: "xavier_normal"
        use_shunting: true

  train:
    train_valid_split: 0.8
    lr: 0.01
    epochs: 100
    batch_size: 500
    grad_clip_value: 1
    weight_decay: 0.0

  task:
    dataset: "mnist"
    parameters: {}

  wandb:
    entity: houman_safaai-harvard-university
    project: dendritic_modeling_new
    group: "debug"
    tags: ["mnist_1"]

  settings:
    visualizations: false

sweep_config:
  # e.g. we want to sweep topk_init_method over 2 values,
  # and also somatic_synapses over 2 booleans
  model.network.parameters.topk_init_method: ["xavier_uniform","normal"]
  model.network.parameters.somatic_synapses: [true,false]  
  model.network.parameters.use_shunting: [true,false]