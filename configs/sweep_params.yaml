slurm_config:
  output_dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/results/dendritic_modeling # <--- Add your output directory path
  conda_env_path: "/n/home13/hsafaai/.conda/envs/dendritic_env" # <--- Add your conda environment path
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"] # <--- Modify this based on your requirements
  max_concurrent_jobs: 8
  training_script: "scripts/train_mnist_mod.py"
  config_filename_init: "test_config"

  account: "kempner_dev"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 1200GB
  time: "3:00:00"
  partition: "kempner_h100"


train_config:
  train:
    run_name: "dendritic_modeling_sweep"
    seed: 0
    epochs: 100
    batch_size: 1024
    train_valid_split: 0.8
    lr: 0.01
    grad_clip_value: 0.5
    
  wandb:
    entity: houman_safaai-harvard-university # <---- Add your entity
    project: dendritic_modeling_pr_sweep
    group: debug
    tags: [mnist_1]

  optimizer:
    name: "adam"
    learning_rate: 0.01

  scheduler:
    name: "none"
  
  model:
    # input_dim: 784
    # excitatory_layer_sizes: [10]
    # inhibitory_layer_sizes: [20]
    # excitatory_branch_factors: [24]
    # inhibitory_branch_factors: []
    # reactivate: true
    # somatic_synapses: true
    # ee_synapses_per_branch_per_layer: [24]
    # ei_synapses_per_branch_per_layer: [100]
    # ie_synapses_per_branch_per_layer: [1]
    # ii_synapses_per_branch_per_layer: []
    # topk_init_method: "xavier_normal"
    input_dim: 1568
    excitatory_layer_sizes: [10]
    inhibitory_layer_sizes: [100]
    excitatory_branch_factors: [5,5,5,10,20]
    inhibitory_branch_factors: []
    reactivate: true
    somatic_synapses: true
    ee_synapses_per_branch_per_layer: [50,50,50,50,50]
    ei_synapses_per_branch_per_layer: [100]
    ie_synapses_per_branch_per_layer: [1]
    ii_synapses_per_branch_per_layer: []
    topk_init_method: "xavier_uniform"

