# ============================================================================
# ULTRA-MINIMAL TEST: TINY MODEL FOR SPEED
# ============================================================================
model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]

  core_network:
    type: EINet
    parameters:
      input_dim: 784
      transfer_params:
        input_mode: 0
        independent_pathways: false
        output_activation: none
        
      excitatory_layer_sizes: [16, 10]  # TINY MODEL
      inhibitory_layer_sizes: [8, 10]   # TINY MODEL
      excitatory_branch_factors: [1, 1] # MINIMAL BRANCHES
      inhibitory_branch_factors: [1, 1] # MINIMAL BRANCHES
      
      ee_synapses_per_branch_per_layer: [5, 5]  # MINIMAL SYNAPSES
      ei_synapses_per_branch_per_layer: [3, 3]
      ie_synapses_per_branch_per_layer: [2, 2]
      ii_synapses_per_branch_per_layer: [1, 1]
      
      somatic_synapses: true
      use_shunting: true
      reactivate: true
      reactivation_type: param_tanh
      topk_type: standard
      efficient_blocklinear: false
      adaptive_initialization: true

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [16]  # TINY DECODER
      activation: relu
      output_dim: 10

train:
  run_name: "minimal_test"
  seed: 0
  train_valid_split: 0.8
  enable_amp: false
  enable_profiling: false
  enable_hooks: false  # DISABLED FOR SPEED
  use_fsdp: false

  encoder:
    trainer:
      epochs: 0
      batch_size: 128

  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 1  # SINGLE EPOCH ONLY
      batch_size: 256  # LARGE BATCH
      early_stopping: false
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: false

# ANALYSIS DISABLED FOR SPEED
analysis:
  performance_analysis:
    enabled: false
  information_analysis:
    enabled: false
  synapse_turnover_analysis:
    enabled: false
  noise_perturbation_analysis:
    enabled: false
  single_layer_contribution:
    enabled: false
  ablation_analysis:
    enabled: false
  weight_analysis:
    enabled: false
  synaptic_activation_analysis:
    enabled: false
  branch_activation_analysis:
    enabled: false
  correlation_analysis:
    enabled: false

outputs:
  run_name: minimal_test
  dir: outputs/ 