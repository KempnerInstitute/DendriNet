# Configuration for 2 nodes with 8 H100 GPUs (4 per node)
# Designed to fit comfortably within memory limits

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
    
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 1536  # Half of 3072 for CIFAR-10
        inhibitory_dim: 1536  # Half of 3072 for CIFAR-10
      
      # Single layer with moderate number of neurons
      excitatory_layer_sizes: [2048]   # 2K neurons
      inhibitory_layer_sizes: [0]      # No inhibitory neurons
      
      # Moderate dendritic tree - 3 levels
      excitatory_branch_factors: [4, 4, 2]  # 32 branches per neuron
      inhibitory_branch_factors: []
      
      # Moderate synapses per branch
      ee_synapses_per_branch_per_layer: [16]    # 16 synapses
      ei_synapses_per_branch_per_layer: []      # No inhibitory neurons
      ie_synapses_per_branch_per_layer: [16]    # 16 synapses
      ii_synapses_per_branch_per_layer: []      # No inhibitory neurons
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      topk_strategy: standard  # Changed from conductance_dynamic to avoid memory issues
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: inverse
      blocklinear_strategy: standard  # Changed from conductance_dynamic
      print_hooks: false
      
      # DEEPST parameters (if using topk_type: deepst)
      excitatory_target_density: 0.1
      inhibitory_target_density: 0.1
      use_noise: true
      noise_std: 0.01
      rewiring_frequency: 10
      use_momentum: true
      momentum_factor: 0.9
    
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [1024, 512]  # Smaller decoder
      activation: relu
      output_dim: 10  # CIFAR-10 has 10 classes

train:
  seed: 42
  train_valid_split: 0.8
  
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      epochs: 0
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.0002  # Moderate learning rate
      split_params: true
      topk_lr: 0.0001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.0002
    
    trainer:
      loss_function: cat_nll
      epochs: 20
      early_stopping: false
      patience: 10
      batch_size: 16  # Reduced from 256 to avoid memory issues
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 50

task:
  dataset: cifar10
  data_path: 
  parameters: 
    flatten: true
    normalize: true

wandb:
  entity: 
  project: "dendritic_cifar10_2nodes"
  group: "single_layer_2k"
  tags: [cifar10, 2nodes, single_layer, moderate_size]
  use_wandb: false

analysis:
  performance_analysis:
    enabled: true
    training: true  # Enable during training to see plots
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      
  information_analysis:
    enabled: false  # Disabled to avoid analysis overhead
    training: false
    params:
      method: "kraskov"
      max_samples: 1000
      n_neighbors: 10
      compute_basic_mi: true
      compute_per_branch: true
      branch_aggregation: none

outputs:
  run_name: exc_only_2k_2nodes
  dir: results/ 