# Large EI Network for FSDP Testing
# This configuration requires multiple GPUs (4-8 GPUs recommended)

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
  
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 1536  # Half of 3072 (CIFAR10 flattened)
        inhibitory_dim: 1536  # Half of 3072
      
      # Large architecture
      excitatory_layer_sizes: [4096, 2048, 1024, 512, 256, 10]
      inhibitory_layer_sizes: [2048, 1024, 512, 256, 128]
      excitatory_branch_factors: [32, 16, 8, 4, 2, 1]
      inhibitory_branch_factors: [16, 8, 4, 2, 1]
      
      # High synapse counts for rich connectivity
      ee_synapses_per_branch_per_layer: [1000, 500, 300, 200, 100, 50]
      ei_synapses_per_branch_per_layer: [500, 250, 150, 100, 50]
      ie_synapses_per_branch_per_layer: [300, 200, 100, 50, 25]
      ii_synapses_per_branch_per_layer: [200, 100, 50, 25, 10]
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
  
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [128, 64]
      activation: relu
      output_dim: 10

train:
  seed: 0
  train_valid_split: 0.8
  
  encoder: null
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.0005  # Lower LR for larger model
      split_params: true
      topk_lr: 0.0002
      blocklinear_lr: 0.0002
      reactivation_lr: 0.0005
      decoder_lr: 0.0005
    
    trainer:
      loss_function: cat_nll
      epochs: 20
      early_stopping: true
      patience: 5
      batch_size: 32  # Smaller batch size per GPU
      shuffle: true
      grad_clip_value: 1.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10

task:
  dataset: cifar10
  data_path: ./data
  parameters:
    num_classes: 10
    train_size: 40000  # Use more data for larger model
    valid_size: 10000
    test_size: 10000
    flatten: true
    normalize: true

# Enable some analysis for the large model
analysis:
  performance_analysis:
    enabled: true
  information_analysis:
    enabled: false  # Too expensive for large models
  weight_analysis:
    enabled: true
  ablation_analysis:
    enabled: false

outputs:
  run_name: ei_fsdp_large
  dir: results/

wandb:
  use_wandb: false 