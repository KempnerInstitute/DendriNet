# Synthetic transformer replacement benchmark: two-projection GELU MLP.

experiment:
  seed: 202

model:
  task: "language_modeling"
  transformer_replacement:
    enabled: true
    layers: [0]
    target_module: "mlp"
    input_transform: "signed_split"
    replacement_kwargs:
      output_init_std: 0.03
  core:
    type: "dendritic_ffn"
    architecture:
      excitatory_layer_sizes: [128]
      excitatory_branch_factors: [2, 2]
    connectivity:
      ee_synapses_per_branch_per_layer: [8]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [0]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_transform: "signed_split"
    morphology:
      use_shunting: false
      weight_transform: "softplus"
    sparsity:
      type: "indexed_dynamic"
      init_method: "xavier_normal"
      temperature: 0.25
      indexed:
        candidate_size: 32
        selection: "standard"
        seed: 202
        output_chunk_size: 1024
    reactivation:
      enabled: true
      type: "param_tanh"

training:
  main:
    optimizer:
      name: "adamw"
      lr: 0.003
      weight_decay: 0.0001
  transformer_replacement:
    enabled: true
    mode: "layerwise_distillation"
    teacher_source: "synthetic_mlp"
    train_target: "replacement_only"
    layers: [0]
    device: "auto"
    dtype: "float32"
    hidden_size: 128
    intermediate_size: 512
    sequence_length: 8
    train_samples: 4096
    valid_samples: 1024
    batch_size: 64
    max_steps: 1200
    eval_every: 150
    log_every: 50
    loss: "mse"
    save_dir: "results/transformer_replacement_benchmarks/synthetic_gelu_mlp"
    save_replacements: true
    synthetic_teacher:
      kind: "mlp"
      activation: "gelu"
      bias: false
      input_std: 1.0
