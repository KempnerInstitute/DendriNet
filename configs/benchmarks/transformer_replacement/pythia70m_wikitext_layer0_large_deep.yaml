# Real Hugging Face benchmark: larger/deeper dendritic replacement for the
# Pythia-70M layer-0 MLP.
#
# Compared with pythia70m_wikitext_layer0.yaml, this uses more dendritic units,
# one extra branch level, more active synapses per branch, and a larger indexed
# candidate set. It tests whether added dendritic capacity improves the full
# language-model loss after replacement while preserving active sparsity.

experiment:
  seed: 406

model:
  task: "language_modeling"
  transformer_replacement:
    enabled: true
    model_name: "EleutherAI/pythia-70m-deduped"
    layers: [0]
    target_module: "mlp"
    layers_attr: "gpt_neox.layers"
    input_transform: "signed_split"
    preserve_device_dtype: true
    model_kwargs: {}
    replacement_kwargs:
      output_init_std: 0.02

  core:
    type: "dendritic_ffn"
    architecture:
      excitatory_layer_sizes: [512]
      excitatory_branch_factors: [2, 2, 2]
    connectivity:
      ee_synapses_per_branch_per_layer: [32]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [0]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_transform: "signed_split"
    morphology:
      use_shunting: false
      weight_transform: "softplus"
    sparsity:
      type: "indexed_dynamic"
      init_method: "xavier_normal"
      temperature: 0.25
      indexed:
        candidate_size: 128
        selection: "standard"
        seed: 406
        output_chunk_size: 2048
    reactivation:
      enabled: true
      type: "param_tanh"

training:
  main:
    optimizer:
      name: "adamw"
      lr: 0.0007
      weight_decay: 0.0001

  transformer_replacement:
    enabled: true
    mode: "layerwise_distillation"
    teacher_source: "hf_text"
    train_target: "replacement_only"
    layers: [0]
    device: "auto"
    dtype: "float32"
    sequence_length: 64
    train_samples: 4096
    valid_samples: 64
    batch_size: 2
    max_steps: 800
    eval_every: 100
    log_every: 25
    loss: "mse"
    save_dir: "results/transformer_replacement_benchmarks/pythia70m_wikitext_layer0_large_deep"
    save_replacements: true
    text:
      dataset_name: "wikitext"
      dataset_config: "wikitext-2-raw-v1"
      split: "train"
      text_field: "text"
      max_documents: 600
      tokenizer_name: "EleutherAI/pythia-70m-deduped"
      max_tokens: 100000
