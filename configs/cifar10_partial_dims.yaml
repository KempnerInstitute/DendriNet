# CIFAR-10 model configuration demonstrating automatic dimension setting
# When excitatory_dim and inhibitory_dim are not provided (or are 0/None),
# they are automatically set based on input_dim and independent_pathways

model:
  task: classification
  encoder_network:
    type: identity
    parameters: {}
  core_network:
    type: EINet
    parameters:
      # transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        # excitatory_dim and inhibitory_dim are NOT provided
        # They will be automatically set to:
        # - excitatory_dim = input_dim/2 = 3072/2 = 1536
        # - inhibitory_dim = input_dim - excitatory_dim = 1536
      # configuration parameters
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [0]
      excitatory_branch_factors: [4, 3, 2, 2]  # 48 branches total
      inhibitory_branch_factors: []
      ee_synapses_per_branch_per_layer: [20]
      ei_synapses_per_branch_per_layer: []
      ie_synapses_per_branch_per_layer: []
      ii_synapses_per_branch_per_layer: []
      somatic_synapses: true
      use_shunting: true
      # topk parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      # reactivation parameters - USING ORIGINAL DEFAULT VALUES
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5  # Original default value
      reactivation_init_b: 0.5  # Original default value
      # gradient scaling parameters
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      # memory optimization
      efficient_blocklinear: true
      # adaptive initialization - this makes it work with large architectures
      adaptive_initialization: true
  decoder_network:
    type: identity
    parameters: {}

data:
  dataset_name: cifar10
  data_path: /n/holylabs/kempner_dev/Everyone/datasets/cifar10_dendritic_dataset
  train_val_test_split: [0.8, 0.1, 0.1]
  batch_size: 64

train:
  seed: 0
  train_valid_split: 0.8
  
  encoder:
    load_save_root: encoders
    trainer:
      loss_function: mse
      epochs: 20
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      print_every: 10
      save_best_model: true
      save_path: ""

  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001

    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001

    trainer:
      loss_function: cat_nll
      epochs: 100
      early_stopping: false
      patience: 10
      batch_size: 64
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
      save_best_model: true
      save_path: ""

task:
  dataset: cifar10
  parameters:
    normalize: false  # Set to true to use standard CIFAR-10 normalization
    flatten: true     # Already flattened for dendritic model

# Analysis configuration
analysis:
  performance_analysis:
    enabled: false
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      
  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: false
      compute_pid: false
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: false
      branch_aggregation: none
      
  synapse_turnover_analysis:
    enabled: false
    training: false
    
  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      categorical_loglikelihood: true
      
  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      categorical_loglikelihood: true
      
  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      
  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2
      
  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2
      
  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      categorical_loglikelihood: true

outputs:
  run_name: large_cifar10_original_values
  dir: outputs/

wandb:
  use_wandb: false
  project: dendritic-modeling
  entity: null
  group: null
  tags: []

# Note: With adaptive_initialization=true, the network automatically scales
# the TopK weights to prevent overflow, allowing us to use the original
# reactivation values (m=1.5, b=0.5) even with 48 branches. 