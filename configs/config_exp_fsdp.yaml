# ============================================================================
# FSDP EXPERIMENT CONFIGURATION
# ============================================================================
# This configuration file is designed for large dendritic models that require
# multi-GPU distributed training using PyTorch's Fully Sharded Data Parallel (FSDP).
#
# USAGE:
#   Multi-GPU FSDP training:
#   python src/dendritic_modeling/scripts/training/train_experiments_fsdp.py configs/config_exp_fsdp.yaml
#
#   FSDP training typically requires:
#   - Multiple GPUs (2+ recommended)
#   - Large models (>1B parameters)
#   - CUDA-enabled environment
#   - Sufficient GPU memory
#
# REQUIREMENTS:
#   - PyTorch with FSDP support
#   - CUDA toolkit and drivers
#   - Multiple GPUs for optimal performance
#
# NOTE: For single-GPU experiments, use config_exp.yaml instead.
# NOTE: For parameter sweeps, use unified_all_sweeps_example.yaml instead.
# ============================================================================

model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [3, 32, 32]

  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 0
        independent_pathways: false
        excitatory_dim: null
        inhibitory_dim: null
        output_activation: null

      excitatory_layer_sizes: [1000, 1000]
      inhibitory_layer_sizes: [1000, 1000]
      excitatory_branch_factors: [3, 3, 3, 3]
      inhibitory_branch_factors: [3, 3, 3, 3]

      ee_synapses_per_branch_per_layer: [50]
      ei_synapses_per_branch_per_layer: [50]
      ie_synapses_per_branch_per_layer: [50]
      ii_synapses_per_branch_per_layer: [50]

      somatic_synapses: true
      use_shunting: true
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.0
      topk_strategy: none

      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: none

      blocklinear_strategy: none
      efficient_blocklinear: true
      adaptive_initialization: true
      print_hooks: false

  decoder_network:
    type: MLP
    parameters:
      input_dim: null
      hidden_dims: [64, 32]
      activation: relu
      output_dim: 10
      dropout: 0.5

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================

train:
  seed: 0
  train_valid_split: 0.8

  # ==========================================
  # TOP-LEVEL TRAINER CONFIGURATIONS
  # ==========================================
  
  # Input network training configuration (simple, no advanced options)
  encoder_net_trainer:
    # for all learning strategies:
    loss_function: mse
    epochs: 50
    early_stopping: false
    patience: 10
    batch_size: 128
    shuffle: true
    grad_clip_value: 1.0
    load_best_state_dict: true
    plot_losses: true
    suppress_prints: false
    print_every: 5
  
  # Main network training configuration (with advanced iss294 options)
  main_trainer:
    # for all learning strategies:
    loss_function: ce
    epochs: 50
    early_stopping: false
    patience: 10
    batch_size: 128
    shuffle: true
    grad_clip_value: 1.0
    load_best_state_dict: true
    plot_losses: true
    save_path: null
    suppress_prints: false
    print_every: 5
    # Performance optimization flags (disabled by default for speed)
    enable_nan_checking: false      # Enable NaN detection during training (expensive)
    enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)

  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      save_path: null
      suppress_prints: false
      print_every: 10

  main:
    learning_strategy: standard
    weight_decay_rate: 0.01

    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.00005
      blocklinear_lr: 0.00005
      reactivation_lr: 0.0001
      decoder_lr: 0.0001

    trainer:
      loss_function: ce
      epochs: 100
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 1.0
      load_best_state_dict: true
      plot_losses: true
      save_path: null
      suppress_prints: false
      print_every: 5
      # Performance optimization flags (disabled by default for speed)
      enable_nan_checking: false      # Enable NaN detection during training (expensive)
      enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)

    regularization:
      l1_weight: 0.001
      l2_weight: 0.01
      selective:
        layers: []
        branches: []
        weight_types: [all]
      split_params: true
      param_group_weights:
        topk:
          l1_weight: 0.005
          l2_weight: 0.01
        blocklinear:
          l1_weight: 0.001
          l2_weight: 0.005
        reactivation:
          l1_weight: 0.0005
          l2_weight: 0.002
        decoder:
          l1_weight: 0.002
          l2_weight: 0.02

    pruning:
      enabled: false
      threshold: 0.001
      selective:
        layers: []
        branches: []
        weight_types: [excitatory, inhibitory]
      re_evaluate_after: true
      dynamic_pruning: false
      pruning_frequency: 10

    reporting:
      report_non_pruned: false
      save_pruning_stats: false
      detailed_branch_report: false
      redo_analysis_after_pruning: false

  run_name: experiment
  enable_amp: false
  enable_profiling: false
  profiling_output_dir: outputs/profiling/
  enable_hooks: true

  # ==========================================
  # FSDP CONFIGURATION
  # ==========================================
  use_fsdp: true
  fsdp_config:
    sharding_strategy: FULL_SHARD
    mixed_precision: false
    cpu_offload: false
    min_num_params: 10000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: false
    use_orig_params: true
    backward_prefetch: BACKWARD_POST
    gradient_checkpointing: false

  # ==========================================
  # CHECKPOINTING
  # ==========================================
  checkpointing:
    enabled: true
    save_every_n_epochs: 50
    checkpoint_dir: results/fsdp_checkpoints/

# ============================================================================
# WANDB CONFIGURATION
# ============================================================================

wandb:
  entity: null
  project: dendritic-fsdp-experiments
  group: large-scale-ei
  tags: [fsdp, large-model, ei-network, pruning]
  use_wandb: false
  enabled: true
  log_freq: 100
  log_gradients: false
  log_parameters: false
  log_activations: false

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================

analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false
    snapshot_interval: 10
    synaptic_analysis: false
    save_synaptic_report: false

  noise_perturbation_analysis:
    enabled: false
    training: false

  single_layer_contribution:
    enabled: false
    training: false

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: false
      compartment_ablation: false
      ablate_all_synapses: false
      ablate_excitation: false
      ablate_inhibition: false
      ablate_upstream: false
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  weight_analysis:
    enabled: false
    training: false

  synaptic_activation_analysis:
    enabled: false
    training: false

  branch_activation_analysis:
    enabled: false
    training: false

  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: 500
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: false
      compute_conditional_mi: false
      compute_pid: false
      include_vinf: true
      normalize_mi: false
      verbose: false
      
      # Computation Level Control - determines the granularity of information analysis
      computation_level: layer     # Options: "branch", "layer", "network"
                                     # "branch": Individual branches (most granular and accurate)
                                     # "layer": Layer-level aggregation (treats each layer as a unit)
                                     # "network": Full network aggregation (most efficient)
      
      # Branch aggregation method - only used when computation_level is "layer" or "network"
      branch_aggregation: mean       # Options: "mean", "max", "sum"

  correlation_analysis:
    enabled: false
    training: false

# ============================================================================
# DATASET/TASK CONFIGURATION
# ============================================================================

task:
  dataset: cifar10
  data_path: ""
  parameters:
    flatten: true
    normalize: true

# ============================================================================
# SLURM CONFIGURATION
# ============================================================================

slurm_config:
  # Basic resource configuration
  gpu_per_node: 1
  account:  # Your SLURM account

  # Environment setup
  conda_env_path:   # Path to your conda environment
  modules_to_load: []

  # Directory configuration
  project_dir:  # Your project directory
  log_dir: results/fsdp_experiments/logs
  dir: results/fsdp_experiments/

  # Optional overrides (script will auto-determine these based on model requirements)
  # training_script: src/dendritic_modeling/scripts/training/train_experiments_fsdp.py

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================

outputs:
  run_name: fsdp_large_exp
  dir: results/fsdp_experiments/
  dataset_dir: data
