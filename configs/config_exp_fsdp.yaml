# ============================================================================
# DENDRINET ANNOTATED REFERENCE CONFIG (FSDP)
# ============================================================================
# A population network with indexed synapses on CIFAR-10, trained with
# FullyShardedDataParallel (distributed.mode: fsdp). Launch one process per GPU
# on one node from the repository root:
#   torchrun --nproc_per_node=<gpus> \
#     -m dendritic_modeling.scripts.training.train_experiments_fsdp \
#     configs/config_exp_fsdp.yaml
# Add --validate-only to build the datasets and the wrapped model and
# optimizer without training. docs/distributed_training.rst covers multi-node
# launches and every FSDP option.
#
# The sections are in alphabetical order, as in a saved config.json.
# config_exp.yaml describes every option; the comments here explain the
# settings that matter under FSDP. The FSDP trainer trains with
# backpropagation and a plain optimizer step. It rejects LR schedules,
# regularization, pruning, sparse-synapse maintenance (synapse_decay_rate must
# be 0 and weight_boosting false for Top-K and indexed synapses), rewiring
# synapses, and strategies other than "standard" and "recurrent".

config_version: 4

analysis:
  runtime:
    # Same keys as in config_exp.yaml. Under DDP and FSDP an omitted mode is
    # "auto"; "stream" never materializes a split, which suits large datasets.
    training:
      mode: "auto"                      # "auto" materializes splits up to materialize_threshold_mb and streams larger ones
      batch_size: 256
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      in_order: false                   # false: batches arrive as workers finish them
      max_batches: null
      max_samples: null
      materialize_threshold_mb: 1024
    final:
      mode: "stream"                    # Stream every split in batches
      batch_size: 256
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      in_order: false
      max_batches: null
      max_samples: null
      materialize_threshold_mb: 1024
  ablation:
    enabled: false
    params:
      selection:
        levels: ["layer"]              # Levels: "layer", "compartment" (compartment is lesion-only)
        targets: ["excitation", "inhibition"]  # Targets: "all_synapses", "excitation", "inhibition", "upstream"
        metrics: ["accuracy", "auc", "categorical_loglikelihood"]  # Metrics: "accuracy", "auc", "categorical_loglikelihood", "mse", "cosine_similarity", "pred_label_mi_bits"

      methods:
        ablation_methods: ["lesion"]  # Methods: "lesion", "shuffle", "mean_clamp"
        shuffle_seed: 0               # Shuffle seed; a written seed is used as is in every run (null = derived from experiment.probe_seed)
        clamp_statistic: "mean"       # mean_clamp statistic: "mean" (the only supported value)
    training: false
  branch_activation:
    enabled: false
    params:
      branch_activations: true
      branch_summary: true
      downsample: true
      layer_summary: true
      logspace: false
      network_summary: true
      raw_summary: true
      samples: 5
      synapse_activations: true
    training: false
  correlation:
    enabled: false
    params:
      selection:
        components: ["total", "noise", "signal", "tuning"]  # Components: "total", "noise", "signal", "tuning"
        pairs: ["EE", "II", "EI", "E_output", "I_output", "output_output"]  # Pairs: "EE", "II", "EI", "E_output", "I_output", "output_output"
        scopes: ["layer", "einet"]  # Scopes: "layer", "einet", "neuron"

      compute:
        computation_level: "layer_branch"  # Level: "synaptic", "single_branch", "layer_branch", "all_branch"
        max_samples: 5000                 # Max samples (null = all)
        per_layer_analysis: true          # Extra breakdown/plots: per-layer (overridden by selection.scopes if non-empty)
        per_einet_analysis: true          # Extra breakdown/plots: per-E/I-net (overridden by selection.scopes if non-empty)
        per_neuron_analysis: false        # Extra breakdown/plots: per-neuron (expensive; overridden by selection.scopes if non-empty)

      sampling:
        n_synapse_pairs: 10000             # Synaptic-only: number of synapse pairs (int >= 1)
        sampling_strategy: "stratified"    # Sampling: "stratified", "random" (other values raise)
        stratified_categories: ["within_branch", "within_layer"]  # Stratified categories: "within_branch", "within_layer"
        max_pairs_per_category: 1000       # Stratified-only: max pairs per category (int >= 1)
    training: false
  information:
    enabled: false
    params:
      selection:
        components: ["basic", "pairwise", "conditional", "ablation_aligned", "layer_proxies"]  # Components: "basic", "pairwise", "conditional", "gaussian_fisher", "pid", "ablation_aligned", "layer_proxies", "upstream_unique_cmi", "soma_coupling"
        scopes: []                        # Scopes: "layer", "einet", "neuron" (alias: views)
        signal_variants: ["network", "lda"]  # Variants: "network", "lda", "random" (random requires baselines.random_weights.n_shuffles > 0)

      compute:
        max_samples: null                 # Max samples (null = all)
        include_vinf: true                # Include soma activation: true|false
        normalize_mi: false               # Normalize by entropy: true|false
        verbose: false                    # Verbose: true|false
        computation_level: layer_branch   # Level: "single_branch", "layer_branch", "all_branch"
        branch_aggregation: multivariate  # Aggregation: "mean", "multivariate", "sample"
        per_layer_analysis: false         # Extra breakdown/plots: per-layer (overridden by selection.scopes if non-empty)
        per_einet_analysis: false         # Extra breakdown/plots: per-E/I-net (overridden by selection.scopes if non-empty)
        per_neuron_analysis: false        # Extra breakdown/plots: per-neuron (expensive; overridden by selection.scopes if non-empty)
        layer_total_topk: 10              # K for *_topK_sum proxies (int >= 1)
        gaussian_fisher:
          aggregation: "sum"  # Aggregate per-feature F: "sum"|"mean"|"max"
          mi_transform: "half_log1p"  # Transform F→MI proxy: "half_log1p"|"log1p"|"none"
          eps: 1.0e-8  # Denominator stabilizer (alias: ridge) (float > 0)

      pid:
        binarize: false  # Threshold E, I and Vout (never the labels) before PID: true|false
        binarize_method: median  # Binarization: "median"|"mean"|"quantile"
        binarize_threshold: 0.5  # Used only if binarize_method="quantile": q∈[0,1]

      estimator:
        method: kraskov                   # MI estimation: "kraskov", "decoder", "binned", "sklearn", "copula", "auto"
        kraskov:
          n_neighbors: 10                 # Kraskov k-NN (int >= 1)
        binned:
          n_bins: 20                      # Histogram bins of the binned estimator; the sklearn estimator uses it too (int >= 2)
          binning_strategy: "quantile"    # binned: "quantile" or "uniform"
          bias_correction: "none"         # binned: "none" or "miller_madow"
        decoder:
          cv_folds: 5                     # decoder: CV folds (int >= 2)
          C: 1.0                          # decoder: LogisticRegression C (float > 0)
          standardize: true               # decoder: standardize X (true|false)
          seed: 0                         # decoder: CV shuffle seed; a written seed is used as is in every run (null = derived from experiment.probe_seed)
          continuous:
            strategy: "none"              # decoder continuous: "none", "binned", "gaussian"
            max_total_dim: 2              # decoder continuous: max total dim (x+y [+z]); used only if strategy != "none"
            gaussian_ridge: 1e-6          # decoder continuous: gaussian ridge (float > 0)
        copula:
          type: gaussian                  # Copula: "gaussian" (scalars, vectors, labels), "kernel" (two continuous scalars)
        sklearn:                          # Not read: the sklearn estimator takes its bins from estimator.binned.n_bins
          n_bins: 20                      # Not read
          bandwidth: null                 # Not read

      baselines:
        random_weights:
          n_shuffles: 0                   # Random-weight baseline shuffles (int >= 0; produces *_sh metrics)
          seed: 42                        # Random-weight seed; a written seed is used as is in every run (null = derived from experiment.probe_seed)
        label_shuffle_null:
          n_shuffles: 0                   # Null (label-shuffle) baseline shuffles (int >= 0; produces *_null metrics)
          seed: 0                         # Null baseline seed; a written seed is used as is in every run (null = derived from experiment.probe_seed)
          components: ["basic"]           # Null components: "basic", "pairwise", "conditional", "ablation_aligned", "upstream_unique_cmi", "soma_coupling", "all"
    training: false
  noise_perturbation:
    enabled: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      cosine_similarity: false
      gaussian_noise: true
      gaussian_sdevs:
      - 0.1
      - 0.2
      mse: false
      n_samples: 10
      uniform_magnitudes:
      - 0.1
      - 0.2
      uniform_noise: true
    training: false
  performance:
    enabled: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      cosine_similarity: false
      mse: false
    # training: true runs the performance analysis after every epoch on rank 0
    # while the other ranks wait in a collective (distributed.timeout_seconds,
    # default 1800 s under FSDP, bounds the wait).
    training: true
    training_splits: ["train", "validation", "test"]   # use ["validation"] for cheaper training-time checks
    final_splits: ["train", "validation", "test"]
  single_layer_contribution:
    enabled: false
    params:
      accuracy: true
      auc: true
      both_contribution: true
      categorical_loglikelihood: true
      cosine_similarity: false
      excitation_contribution: true
      inhibition_contribution: true
      mse: false
    training: false
  synapse_turnover:
    enabled: false
    training: false                     # Set to true before enabling: turnover compares training snapshots, and training: false raises
    params:
      snapshot_interval: 10
  synaptic_activation:
    enabled: false
    params:
      branch_summary: true
      downsample: true
      layer_summary: true
      logspace: false
      network_summary: true
      raw_summary: true
      samples: 5
    training: false
  weight:
    enabled: false
    params:
      analyze_branch_output: false
      analyze_excitatory: true
      analyze_inhibitory: true
      branch_aggregation: mean
      branch_weights: true
      computation_level: single_branch
      compute_dendritic_strength: true
      compute_mean: true
      compute_min_max: true
      compute_percentiles: false
      compute_variance: true
      per_einet_analysis: true
      per_layer_analysis: true
      per_neuron_analysis: false
      synapse_weights: true
      weight_threshold: 1e-6
    training: false
  compartment_statistics:
    enabled: true                       # Enabled in this example (default false)
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      inputs: true
      activations: true
      global_analysis: true
      layer_analysis: true
      branch_analysis: true
      compute_mean: true
      compute_variance: true
      compute_percentiles: true
      compute_min_max: true
      compute_entropy: true
      per_class_analysis: false
      n_samples: 1000
data:
  base_dir: ''                          # Data root (empty = $DENDRITIC_DATA_DIR, else ~/.cache/dendritic_modeling)
  dataset_name: cifar10
  dataset_params:                       # Only the block named by dataset_name is read; these two are ignored with cifar10
    mnist_modulo10:
      shuffle_iterations: 2
    poisson_generator:
      base_dataset: mnist
  processing:
    flatten: true
    normalize: false
experiment:
  checkpointing:
    enabled: false                      # true: the FSDP trainer saves checkpoints (with optimizer state) under checkpoints/ in the run directory
    save_every_n_epochs: 10
  seed: 42
  train_valid_split: 0.8
distributed:
  mode: fsdp                            # Train with FSDP: launch train_experiments_fsdp under torchrun (see the header)
  fsdp:
    backward_prefetch: BACKWARD_POST    # "BACKWARD_PRE" (default) | "BACKWARD_POST"
    cpu_offload: false
    forward_prefetch: true
    gradient_checkpointing: false
    limit_all_gathers: true
    mixed_precision: false              # Full-precision parameters, reductions and buffers (default true: bf16)
    sharding_strategy: FULL_SHARD       # "FULL_SHARD" | "SHARD_GRAD_OP" | "NO_SHARD" | "HYBRID_SHARD"
    sync_module_states: true
    use_orig_params: true               # Needed for the per-component learning rates (training.main.common.param_groups)
  # Not set here: auto_wrap_policy ("none" makes the whole model one FSDP unit;
  # "indexed_synapses" wraps each indexed synapse module, which bounds the
  # parameter all-gathers of contact-heavy models), mixed_precision_dtype and
  # the per-tensor dtypes, freeze_core, cache_frozen_core_outputs,
  # cached_core_batch_size, and distributed.timeout_seconds.
model:
  core:
    biological_neuron: true   # Enforce the neuronal-core constraint set.
    type: population_network
    population_network:
      input_transform: nonnegative     # Check nonnegative data without changing values or gradients.
      use_transfer: false
      transfer_params: {}
      output_mode: "last"
      input_projection_dims: []
      store_routing: false
      layers:
      - name: layer0
        readout_population: e
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: true
          use_shunting: true
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: occupancy_quantile  # Data-driven gate placement (the default for shunting populations is "analytical")
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          # FSDP has no rewiring step, so rewiring synapses (indexed_rewire,
          # deepst, credit_deepst, dense_to_sparse with advance_on_forward:
          # false) raise ValueError.
          topk_type: indexed                # Indexed synapses store only the active contacts
          topk_init_method: xavier_normal
          indexed_output_chunk_size: 2048
          efficient_blocklinear: true
        populations:
        - name: i
          polarity: inhibitory
          n_neurons: 32
          branch_factors: [1]
          population:
            ff_inhibitory_synapses: 0
        - name: e
          polarity: excitatory
          n_neurons: 128
          branch_factors: [3, 3, 3]
        connections:
        - source: input
          target: i
        - source: input
          target: e
        - source: i
          target: e
  decoder:
    params: {}                          # MLP defaults: hidden_dims [16], output_dim 10; input_dim comes from the core
    type: MLP
  encoder:
    params: {}
    type: identity
  task: classification
outputs:
  results_dir: results
  run_name: fsdp_large_exp
training:
  main:
    common:
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      param_groups: {}
      synapse_decay_rate: 0.0           # Must be 0: FSDP runs no sparse-synapse maintenance (weight_boosting keeps its default, false)
    pruning: {}
    regularization: {}
    strategies:                         # Only the block of the selected strategy is read
      freeze_branch_kl: {}
      freeze_branches: {}
      freeze_layers: {}
      homeostatic_control: {}
      multi_stage: {}
      standard: {}
      voltage_stabilization: {}
    strategy: standard                  # The FSDP trainer runs "standard" or "recurrent"
