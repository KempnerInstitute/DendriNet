data:
  base_dir: ''
  dataset_name: cifar10
  dataset_params:
    mnist_modulo10:
      shuffle_iterations: 2
    multixor:
      n_bits: 8
    orientation_bars:
      n_orient_classes: 8
    orthonet:
      input_dim: 784
      n_layers: 5
      noise_std: 0.1
      nonlinearity: sigmoid
      repeat_layers: false
    poisson_generator:
      base_dataset: mnist
      rate_multiplier: 1.0
    random_flip_mnist:
      flip_probability: 0.5
  processing:
    flatten: true
    normalize: false
experiment:
  checkpointing:
    checkpoint_dir: results/checkpoints/
    enabled: false
    save_every_n_epochs: 10
  enable_amp: false
  enable_hooks: true
  enable_profiling: false
  profiling_output_dir: results/profiling/
  seed: 42
  train_valid_split: 0.8
fsdp:
  backward_prefetch: BACKWARD_POST
  cpu_offload: false
  forward_prefetch: true
  gradient_checkpointing: false
  limit_all_gathers: true
  min_num_params: 10000
  mixed_precision: false
  reduce_communication_overhead: true
  sharding_strategy: FULL_SHARD
  sync_module_states: false
  use_fsdp: true
  use_orig_params: true
model:
  core:
    architecture:
      excitatory_branch_factors:
      - 3
      - 3
      - 3
      - 3
      excitatory_layer_sizes:
      - 20
      inhibitory_branch_factors:
      - 1
      inhibitory_layer_sizes: []

      # Inhibitory network configuration
      inhibitory_network_type: "dendritic"  # Options: "dendritic", "mlp"
      mlp_inhibitory_network_params:     # Parameters for MLP inhibitory network (used when type="mlp")
        hidden_dims: [200]               # Hidden layer dimensions for MLP inhibitory network
        activation: "relu"               # Activation function for MLP inhibitory network
    blocklinear:
      efficient: false
      gradient_scaling: none
    connectivity:
      ee_synapses_per_branch_per_layer:
      - 40
      ei_synapses_per_branch_per_layer:
      - 0
      ie_synapses_per_branch_per_layer:
      - 10
      ii_synapses_per_branch_per_layer:
      - 0
    implementation:
      adaptive_initialization: false
      print_hooks: false
    morphology:
      dbl_init_method: analytical_expectation  # Options: analytical_expectation, default, lda_analytical
      somatic_synapses: false
      use_shunting: true
      weight_transform: softplus
    # LDA-based initialization parameters
    # - LDA weight init: set morphology.dbl_init_method: lda_analytical
    # - LDA sparsity (TopK selection): set sparsity.init_method: lda
    lda_init:
      n_samples: 1000                   # Number of samples to use for LDA fitting
      adaptive: true                    # Use network-aware scaling to prevent overflow
    reactivation:
      enabled: true
      init_b: 0.5
      init_m: 1.5
      gradient_scaling: none
      type: param_tanh
    sparsity:
      deepst:
        excitatory_target_density: 0.1
        freeze_excitatory_connectivity: false
        freeze_inhibitory_connectivity: false
        inhibitory_target_density: 0.1
        init_method: xavier_normal
        rewire_frequency: 1
        rewiring_mode: global
        sigma: 0.05
        synapses_per_branch: null
        use_noise: true
        weight_threshold: 1.0e-06
      init_method: xavier_normal
      noise_level: 0.0
      gradient_scaling: none
      temperature: 0.0
      type: standard
    transfer:
      excitatory_dim: null
      independent_pathways: false
      inhibitory_dim: null
      input_mode: 1
      output_activation: null
    type: EINet
  decoder:
    params: {}
    type: MLP
  encoder:
    load_save_root: ./.trained_encoder_networks/
    params: {}
    type: identity
  task: classification
outputs:
  results_dir: results
  run_name: fsdp_large_exp
training:
  encoder:
    common:
      lr: 0.001
    strategy: standard
  main:
    common:
      param_groups: {}
      weight_decay_rate: 0.0
    pruning: {}
    regularization: {}
    strategies:
      freeze_branch_kl: {}
      freeze_branches: {}
      freeze_layers: {}
      homeostatic_control: {}
      local_ca: {}
      multi_stage: {}
      standard: {}
      voltage_stabilization: {}
    strategy: standard
wandb:
  enabled: true
  entity: null
  group: large-scale-ei
  log_activations: false
  log_freq: 100
  log_gradients: false
  log_parameters: false
  project: dendritic-fsdp-experiments
  tags:
  - fsdp
  - large-model
  - ei-network
  - pruning
  use_wandb: false
