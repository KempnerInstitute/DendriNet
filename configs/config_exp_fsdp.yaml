# ============================================================================
# FSDP EXPERIMENT CONFIGURATION
# ============================================================================
# This configuration file is designed for large dendritic models that require
# multi-GPU distributed training using PyTorch's Fully Sharded Data Parallel (FSDP).
#
# USAGE:
#   Multi-GPU FSDP training:
#   python src/dendritic_modeling/scripts/training/train_experiments_fsdp.py configs/config_exp_fsdp.yaml
#
#   FSDP training typically requires:
#   - Multiple GPUs (2+ recommended)
#   - Large models (>1B parameters)
#   - CUDA-enabled environment
#   - Sufficient GPU memory
#
# REQUIREMENTS:
#   - PyTorch with FSDP support
#   - CUDA toolkit and drivers
#   - Multiple GPUs for optimal performance
#
# NOTE: For single-GPU experiments, use config_exp.yaml instead.
# NOTE: For parameter sweeps, use unified_all_sweeps_example.yaml instead.
# ============================================================================

model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [3, 32, 32]

  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 0
        independent_pathways: false
        excitatory_dim: null
        inhibitory_dim: null
        output_activation: null

      excitatory_layer_sizes: [1000, 1000]
      inhibitory_layer_sizes: [1000, 1000]
      excitatory_branch_factors: [3, 3, 3, 3]
      inhibitory_branch_factors: [3, 3, 3, 3]

      ee_synapses_per_branch_per_layer: [50]
      ei_synapses_per_branch_per_layer: [50]
      ie_synapses_per_branch_per_layer: [50]
      ii_synapses_per_branch_per_layer: [50]

      somatic_synapses: true
      use_shunting: true

      # Weight transformation for positive weights
      weight_transform: exp       # Options: "exp", "relu", "softplus"
      dbl_init_method: analytical_expectation
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.0
      topk_strategy: none

      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: none

      blocklinear_strategy: none
      efficient_blocklinear: true
      adaptive_initialization: true
      print_hooks: false

  decoder_network:
    type: MLP
    parameters:
      input_dim: null
      hidden_dims: [64, 32]
      activation: relu
      output_dim: 10
      dropout: 0.5

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================

train:
  seed: 0
  train_valid_split: 0.8

  # ==========================================
  # PERFORMANCE OPTIMIZATION SETTINGS
  # ==========================================
  enable_amp: false             # Enable automatic mixed precision
  enable_profiling: false       # Enable PyTorch profiler
  profiling_output_dir: "results/profiling/"
  enable_hooks: true            # Enable hooks for analysis (set false for max speed)

  encoder:
    load_save_root: ./.trained_encoder_networks/  # Hash-based encoder model cache directory
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      save_path: null
      suppress_prints: false
      print_every: 10

  main:
    learning_strategy: standard  # Options: "standard", "voltage_stabilization", "homeostatic_control", "freeze_layers", "freeze_branches", "local_ca", "two_step"
    weight_decay_rate: 0.01

    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.00005
      blocklinear_lr: 0.00005
      reactivation_lr: 0.0001
      decoder_lr: 0.0001

    trainer:
      loss_function: ce
      epochs: 100
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 1.0
      load_best_state_dict: true
      plot_losses: true
      save_path: null
      suppress_prints: false
      print_every: 5
      # Performance optimization flags (disabled by default for speed)
      enable_nan_checking: false      # Enable NaN detection during training (expensive)
      enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)
      # Local multi-factor rule configuration (when learning_strategy: local_ca)
      local_rule_config:
        rule_variant: "3f"
        error_mode: "auto"
        error_broadcast_mode: "scalar"  # "scalar", "per_soma", "local_mismatch"
        ema_alpha: 0.05
        use_conductance_scaling: true
        use_driving_force: true
        theta: 0.0
        e_rev_exc: 1.0
        e_rev_inh: 0.0
        clip_grad_value: 5.0
        normalize_by_batch: true
        phi_mode: "conditional"
        phi_ridge_lambda: 0.001
        rho_estimator: "ema"
        phi_estimator: "conditional_ema"
        augment_k: 8
        augment_noise_sigma: 0.01
        rls_forgetting: 0.99
        hsic_enabled: false
        hsic_weight: 0.0
        hsic_self_weight: 1.0
        hsic_target_weight: 1.0
        hsic_target_source: "labels"
        hsic_kernel: "linear"           # "linear", "rbf", "polynomial"
        hsic_sigma: 1.0                 # RBF kernel bandwidth (gamma = 1/(2*sigma^2))
        hsic_degree: 2                  # Polynomial kernel degree
        hsic_coef0: 1.0                 # Polynomial kernel coefficient
        # Morphology correlation options (rho)
        rho_mode: "pearson"            # "pearson", "dot", "none"
        decoder_update_mode: backprop
        freeze_reactivation_epochs: 0
        freeze_decoder_epochs: 0
        training_schedule: []
        update_inactive_weights: false

      # Strategy-specific config blocks
      voltage_stabilization_config:
        pretrain_epochs: 50
        stabilize_mode: vout
        freeze_reactivation: true
        target_voltage: 0.5
        loss_metric: mse

      homeostatic_control_config:
        pretrain_epochs: 50
        stabilize_mode: vinf
        freeze_reactivation: false
        target_voltage: 0.5
        loss_metric: mse

      freeze_layers_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_layer: 50
        final_tune_epochs: 10

      freeze_branches_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_branch: 50
        final_tune_epochs: 10

      freeze_branch_kl_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_branch: 50
        final_tune_epochs: 10
        kl_weight: 0.1

    # Unified regularization configuration
    regularization:
      l1_weight: 0.001
      l2_weight: 0.01
      selective:
        layers: []
        branches: []
        weight_types: [all]
      split_params: true
      param_group_weights:
        topk:
          l1_weight: 0.005
          l2_weight: 0.01
        blocklinear:
          l1_weight: 0.001
          l2_weight: 0.005
        reactivation:
          l1_weight: 0.0005
          l2_weight: 0.002
        decoder:
          l1_weight: 0.002
          l2_weight: 0.02

      # E/I Weight Ratio Regularization
      enforce_ei_weight_ratio: false      # Enable E/I weight ratio regularization
      target_ei_weight_ratio: 1.5         # Target excitatory/inhibitory weight ratio
      ei_ratio_loss_weight: 0.1           # Regularization strength (fraction of total loss)
      ei_ratio_scope: "per_branch"        # Options: "per_branch", "per_layer", "global"
      ei_ratio_metric: "mean"             # Options: "mean", "median", "rms"

    pruning:
      enabled: false
      threshold: 0.001
      selective:
        layers: []
        branches: []
        weight_types: [excitatory, inhibitory]
      re_evaluate_after: true
      dynamic_pruning: false
      pruning_frequency: 10

    reporting:
      report_non_pruned: false
      save_pruning_stats: false
      detailed_branch_report: false
      redo_analysis_after_pruning: false

  # ==========================================
  # FSDP CONFIGURATION
  # ==========================================
  use_fsdp: true
  fsdp_config:
    sharding_strategy: FULL_SHARD
    mixed_precision: false
    cpu_offload: false
    min_num_params: 10000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: false
    use_orig_params: true
    backward_prefetch: BACKWARD_POST
    gradient_checkpointing: false

  # ==========================================
  # CHECKPOINTING
  # ==========================================
  checkpointing:
    enabled: true
    save_every_n_epochs: 50
    checkpoint_dir: results/fsdp_checkpoints/

# ============================================================================
# WANDB CONFIGURATION
# ============================================================================

wandb:
  entity: null
  project: dendritic-fsdp-experiments
  group: large-scale-ei
  tags: [fsdp, large-model, ei-network, pruning]
  use_wandb: false
  enabled: true
  log_freq: 100
  log_gradients: false
  log_parameters: false
  log_activations: false

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================

analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false
    snapshot_interval: 10
    synaptic_analysis: false
    save_synaptic_report: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: false
      compartment_ablation: false
      ablate_all_synapses: false
      ablate_excitation: false
      ablate_inhibition: false
      ablate_upstream: false
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      computation_level: "single_branch"
      branch_aggregation: "mean"
      per_layer_analysis: true
      per_einet_analysis: true
      per_neuron_analysis: false

      analyze_excitatory: true
      analyze_inhibitory: true
      analyze_branch_output: false
      compute_mean: true
      compute_variance: true
      compute_percentiles: false
      compute_min_max: true
      compute_dendritic_strength: true
      weight_threshold: 1e-6

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov           # Options: "kraskov", "sklearn", "copula", "auto"
      max_samples: null         # Limit samples for computation
      n_neighbors: 10           # For kraskov k-NN estimator
      n_bins: 20               # For sklearn histogram
      copula_type: gaussian     # For copula method
      compute_basic_mi: true    # I(E;C), I(I;C), I(Vout;C)
      compute_pairwise_mi: true # I(E;I), I(E;Vout), I(I;Vout)
      compute_conditional_mi: true # I(E;I|C), I(E;Vout|C), etc.
      compute_pid: false        # Partial Information Decomposition
      pid_binarize: true
      pid_binarize_method: median # Options: "median", "mean", "quantile"
      pid_binarize_threshold: 0.5
      include_vinf: true        # Include soma activation
      normalize_mi: false       # Normalize by entropy
      verbose: false

      # Computation Level Control - determines the granularity of information analysis
      computation_level: layer_branch   # Options: "single_branch", "layer_branch", "all_branch"
                                     # "single_branch": Individual branches (most granular and accurate)
                                     # "layer_branch": Layer-level aggregation (treats each layer as a unit)
                                     # "all_branch": Full network aggregation (most efficient)

      # Branch aggregation method - only used when computation_level is "layer_branch" or "all_branch"
      branch_aggregation: multivariate     # Options: "mean", "multivariate", "sample"


      # Enhanced analysis modes
      per_neuron_analysis: false   # If true, compute MI for each neuron separately
      per_einet_analysis: false    # If true, analyze E and I networks separately
      per_layer_analysis: false    # If true, compute enhanced analysis per layer

  correlation_analysis:    ## needs to be tested
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true

# ============================================================================
# DATASET/TASK CONFIGURATION
# ============================================================================

task:
  # Validated dataset options (from datasets/__init__.py and synthetic_datasets.py)
  dataset: cifar10
  # Options:
  # - Standard: "mnist", "cifar10", "imagenet"
  # - Modified MNIST: "mnist_modulo10", "random_flip_mnist"

  data_path: ""  # Custom data path

  # Dataset-specific parameters
  parameters:
    # Common parameters
    # train_size: 8000
    # valid_size: 1000
    # test_size: 1000
    flatten: true
    normalize: true

    # # Synthetic dataset parameters
    # image_size: 16           # For image-based synthetic datasets
    # n_orient_classes: 8      # For orientation_bars
    # n_bits: 8               # For multi_xor

    # # Generated dataset parameters
    # base_dataset: mnist      # For poisson_generator
    # rate_multiplier: 1       # For poisson_generator
    # input_dim: 10           # For orthonet
    # n_layers: 5             # For orthonet
    # nonlinearity: sigmoid   # For orthonet: "sigmoid", "tanh", None
    # repeat_layers: false    # For orthonet
    # noise_std: 0.1          # For orthonet

# ============================================================================
# SLURM CONFIGURATION
# ============================================================================

slurm_config:
  # Basic resource configuration
  gpu_per_node: 1
  account:  # Your SLURM account

  # Environment setup
  conda_env_path:   # Path to your conda environment
  modules_to_load: []

  # Directory configuration
  project_dir:  # Your project directory
  log_dir: results/fsdp_experiments/logs
  dir: results/fsdp_experiments/

  # Optional overrides (script will auto-determine these based on model requirements)
  # training_script: src/dendritic_modeling/scripts/training/train_experiments_fsdp.py

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================

outputs:
  run_name: fsdp_large_exp
  dir: results/fsdp_experiments/
  dataset_dir: data
