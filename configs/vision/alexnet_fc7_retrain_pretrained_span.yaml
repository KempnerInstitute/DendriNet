# Train the exact pretrained AlexNet fc7 Linear+ReLU span in the replacement
# pipeline. This is a training-matched dense control for structured fc7
# replacements: the prefix through fc6 is frozen and fc7 plus fc8 are trained.

experiment:
  seed: 42
  train_valid_split: 0.8
  deterministic: true
  checkpointing:
    enabled: true
    save_every_n_epochs: 10
    checkpoint_dir: outputs/checkpoints

data:
  dataset_name: imagenet
  base_dir: ""  # Set to an ImageNet root.
  processing:
    flatten: false
    normalize: true
  dataset_params:
    imagenet:
      transform_preset: pretrained
      loader_backend: auto
      allow_flatten_materialize: false

model:
  task: classification
  vision_replacement:
    enabled: true
    backbone: alexnet
    weights: IMAGENET1K_V1
    core_source: pretrained_span
    input_shape: [3, 224, 224]
    target_modules: [classifier.4, classifier.5]  # fc7 Linear + ReLU
    omit_layers: [classifier.0, classifier.3]
    trainability:
      encoder:
        mode: frozen
      decoder:
        mode: trainable
  # Ignored for core_source=pretrained_span; the retained target modules are
  # the core. The neutral declaration keeps the general model schema valid.
  core:
    type: identity

training:
  encoder:
    strategy: standard
    common:
      epochs: 0
  main:
    strategy: standard
    common:
      epochs: 50
      batch_size: 256
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      shuffle: true
      loss_function: cat_nll
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      grad_clip_value: 5.0
      use_amp: true
      weight_decay_rate: 0.0
      param_groups:
        # Fine-tune the already pretrained fc7 span conservatively.
        lr: 0.0001
        split_params: true
        decoder_lr: 0.0001
        encoder_lr: 0.0
    optimizer:
      name: adam
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
    final_splits: [valid, test]

wandb:
  use_wandb: false

outputs:
  run_name: alexnet_fc7_retrained_pretrained_span
  results_dir: outputs

distributed:
  mode: none
