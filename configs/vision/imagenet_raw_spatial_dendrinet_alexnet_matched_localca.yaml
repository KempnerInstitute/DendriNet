# Raw ImageNet -> fixed spatial dendritic tree -> linear classifier.
#
# This is the LocalCA counterpart to
# imagenet_raw_spatial_dendrinet_alexnet_matched_bp.yaml. The architecture,
# topology, optimizer groups, data, and decoder are identical. Only the core
# credit-assignment rule changes: dendritic and synaptic parameters use the 5F
# local rule, while the linear decoder uses its exact local output gradient.
# The optimizer family and parameter partition match the BP run. Learning rates
# are calibrated separately because ImageNet has roughly ten times more updates
# per epoch than the smaller local-learning experiments.
#
# Active trainable parameter count:
#   E branch synapses: 38,077,440
#   I branch synapses:  9,519,360
#   axial couplings:    1,189,920
#   reactivation:       2,399,672
#   1000-way readout:   9,917,000
#   total:             61,103,392

experiment:
  seed: 42
  train_valid_split: 0.98
  fast_mode: true
  enable_profiling: false
  enable_hooks: false
  checkpointing:
    enabled: true
    save_every_n_epochs: 10
    checkpoint_dir: "results/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    imagenet:
      transform_preset: "pretrained"
      loader_backend: "imagefolder"
      allow_flatten_materialize: false
      train_samples_per_class: null
      val_samples_per_class: null

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: null

  core:
    type: "tensor_map"
    architecture:
      excitatory_layer_sizes: [9916]
      inhibitory_layer_sizes: []
      excitatory_branch_factors: [3, 3, 3, 3]
      inhibitory_branch_factors: [1]
      inhibitory_network_type: "dendritic"

    connectivity:
      ee_synapses_per_branch_per_layer: [32]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [8]
      ii_synapses_per_branch_per_layer: [0]
      structured:
        enabled: true
        method: "spatial_morphology"
        seed: 42
        spatial:
          input_shape: [3, 224, 224]
          split_axes: ["height", "width", "height", "width"]

    transfer:
      input_mode: 1
      independent_pathways: false
      output_activation: null
      allow_direct_inhibitory_stream: true

    morphology:
      somatic_synapses: false
      use_shunting: true
      weight_transform: "softplus"
      dbl_init_method: "analytical_expectation"

    sparsity:
      init_method: "xavier_normal"
      noise_level: 0.0
      type: "indexed"
      weight_norm_order: null
      gamma: 1.0
      gradient_scaling: "none"
      indexed:
        seed: 42
        index_dtype: "int32"
        output_chunk_size: 8192
        workspace_mb: 256
        cache_transformed_weights: false
        projection_backend: recompute
        persistent_indices: false
        init_mode: "per_rank"

    reactivation:
      enabled: true
      type: "param_tanh"
      init_policy: "analytical"
      init_m: 1.5
      init_b: 0.5
      gradient_scaling: "none"

    blocklinear:
      gradient_scaling: "none"
      efficient: true

    implementation:
      adaptive_initialization: false
      print_hooks: false

  decoder:
    type: "MLP"
    params:
      hidden_dims: []
      activation: "relu"
      output_dim: 1000

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0

  main:
    strategy: "local_ca"
    common:
      epochs: 90
      batch_size: 64
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      profile_dataloader: true
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: false
      load_best_state_dict: false
      plot_losses: true
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      checkpointing: true
      checkpoint_interval: 10
      param_groups:
        lr: 0.00005
        split_params: true
        topk_lr: 0.00005
        blocklinear_lr: 0.00002
        reactivation_lr: 0.00001
        decoder_lr: 0.00003
    optimizer:
      name: "adamw"
      weight_decay: 0.01
    learning_strategy_config:
      rule_variant: "5f"
      error_mode: "auto"
      # One decoder-derived error coordinate per soma, repeated only over the
      # compartments in that soma's anatomical subtree.
      error_broadcast_mode: "per_soma_shared"
      broadcast_bandwidth: "full"
      decoder_update_mode: "local"
      encoder_update_mode: "none"
      update_reactivation: true
      update_inactive_weights: false
      normalize_by_batch: true
      clip_grad_value: 5.0
      three_factor:
        dynamics_mode: "auto"
        use_conductance_scaling: true
        use_driving_force: true
        theta: 0.0
        e_rev_exc: 1.0
        e_rev_inh: 0.0
      four_factor:
        rho_mode: "dot"
        rho_estimator: "ema"
        ema_alpha: 0.1
        layer_wise_rho_scale: 0.0
        augment_k: 8
        augment_noise_sigma: 0.01
      five_factor:
        phi_mode: "conditional"
        phi_estimator: "conditional_ema"
        phi_ridge_lambda: 0.001
        layer_wise_phi_scale: 0.0
        rls_forgetting: 0.99
      morphology_aware:
        use_path_propagation: false
        morphology_modulator_mode: "none"
        morphology_depth_offset: 1.0
        morphology_centrality_metric: "betweenness"
        use_dendritic_normalization: false
        use_branch_type_rules: false
        apical_branch_scale: 1.0
        basal_branch_scale: 1.0
        use_branch_length_modulation: false
      hsic:
        enabled: false
        weight: 0.0

analysis:
  runtime:
    training:
      mode: "stream"
      batch_size: 32
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 2
      max_batches: 20
    final:
      mode: "stream"
      batch_size: 32
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 2
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
    training_splits: ["valid"]
    final_splits: ["valid"]
  information: {enabled: false, training: false, params: {}}
  correlation: {enabled: false, training: false, params: {}}
  ablation: {enabled: false, training: false, params: {}}
  synapse_turnover: {enabled: false, training: false, params: {}}
  noise_perturbation: {enabled: false, training: false, params: {}}
  weight: {enabled: false, training: false, params: {}}
  single_layer_contribution: {enabled: false, training: false, params: {}}
  synaptic_activation: {enabled: false, training: false, params: {}}
  branch_activation: {enabled: false, training: false, params: {}}
  compartment_statistics: {enabled: false, training: false, params: {}}
  compartment_snr: {enabled: false, training: false, params: {}}

wandb:
  use_wandb: false
  project: "dendritic-imagenet"
  group: "raw-spatial-dendrinet"
  tags: ["imagenet", "raw-input", "spatial-morphology", "alexnet-matched", "localca"]

outputs:
  run_name: "imagenet_raw_spatial_dendrinet_alexnet_matched_localca"
  results_dir: "outputs"

distributed:
  mode: "ddp"
