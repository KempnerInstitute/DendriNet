# ============================================================================
# AlexNet K=2: Replace fc6 + fc7 with a dendritic EI layer
# ============================================================================
#
# This config replaces TWO fully-connected layers (fc6 and fc7) inside a
# pretrained AlexNet with a dendritic EI network. The convolutional backbone
# feeds directly into the EINet core, which then feeds into fc8.
#
# See alexnet_k1_einet.yaml for the full AlexNet layer map.
#
# Pipeline after splitting:
#   prefix (encoder)  = features.* + avgpool          → 9216-dim, frozen
#   core (EINet)      = replaces fc6 + ReLU + fc7 + ReLU → 4096-dim, trainable
#   suffix (decoder)  = fc8                            → 1000 classes, trainable
#
# Key difference from K=1:
#   - K=1 replaces only fc7 (4096→4096), so the core sees 4096-dim input
#   - K=2 replaces fc6+fc7 (9216→4096→4096), so the core sees 9216-dim input
#     from the flattened conv features. This is a harder replacement since
#     the EINet must learn the full dimensionality reduction.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/vision/alexnet_k2_einet.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_profiling: false
  profiling_output_dir: "results/profiling/"
  enable_hooks: false
  checkpointing:
    enabled: true
    save_every_n_epochs: 25
    checkpoint_dir: "results/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  processing:
    flatten: false
    normalize: true
  dataset_params: {}

model:
  task: "classification"

  pretrained_replacement:
    enabled: true
    backbone: "alexnet"
    weights: "IMAGENET1K_V1"
    input_shape: [3, 224, 224]

    # Replace fc6 through fc7 (both Linear + ReLU layers).
    replace:
      start: "classifier.1"                        # fc6 Linear(9216 → 4096)
      end: "classifier.5"                          # fc7 ReLU

    omit_layers: ["classifier.0", "classifier.3"]  # skip Dropout layers

    trainability:
      encoder:
        mode: "frozen"                             # freeze conv backbone
      decoder:
        mode: "trainable"                          # train fc8

  # --- Core network: EINet replacing fc6 + fc7 ---
  # Input: 9216-dim (from flattened conv features)
  # Output: 4096-dim (must match fc8 in_features)
  core:
    type: "einet"

    architecture:
      excitatory_layer_sizes: [4096]               # match fc8 input dim
      inhibitory_layer_sizes: [512]
      excitatory_branch_factors: [3, 3]
      inhibitory_branch_factors: [3, 3]
      inhibitory_network_type: "dendritic"
      mlp_inhibitory_network_params:
        hidden_dims: []
        activation: "relu"

    connectivity:
      ee_synapses_per_branch_per_layer: [32]
      ei_synapses_per_branch_per_layer: [16]
      ie_synapses_per_branch_per_layer: [8]
      ii_synapses_per_branch_per_layer: [0]

    transfer:
      input_mode: 0
      independent_pathways: false
      excitatory_dim: null
      inhibitory_dim: null
      output_activation: null

    morphology:
      somatic_synapses: true
      use_shunting: true
      weight_transform: "softplus"
      dbl_init_method: "analytical_expectation"

    sparsity:
      init_method: "xavier_normal"
      noise_level: 0.0
      type: "standard"
      weight_norm_order: null
      gamma: 1.0
      temperature: 0.0
      gradient_scaling: "none"
      deepst:
        excitatory_target_density: 0.1
        inhibitory_target_density: 0.1
        use_noise: true
        sigma: 0.05
        rewiring_mode: "global"
        rewire_frequency: 1
        synapses_per_branch: null
        freeze_excitatory_connectivity: false
        freeze_inhibitory_connectivity: false
        init_method: "xavier_normal"
        weight_threshold: 1.0e-6

    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
      gradient_scaling: "none"

    blocklinear:
      gradient_scaling: "none"
      efficient: false

    implementation:
      adaptive_initialization: true
      print_hooks: false

training:
  encoder:
    strategy: "standard"
    common:
      lr: 0.0
      loss_function: "log_mse"
      epochs: 0
      early_stopping: false
      patience: 100
      batch_size: 256
      shuffle: false
      grad_clip_value: 5.0
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false

  main:
    strategy: "standard"
    common:
      epochs: 500
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: true
      patience: 100
      load_best_state_dict: true
      save_path: null
      plot_losses: true
      suppress_prints: false
      print_every: 10
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.01                           # suffix (fc8) LR
        encoder_lr: 0.0                            # prefix frozen

    regularization:
      l1_weight: 0.0
      l2_weight: 0.0
      selective:
        layers: []
        branches: []
        weight_types: ["all"]
      split_params: false
      param_group_weights:
        topk: { l1_weight: 0.0, l2_weight: 0.0 }
        blocklinear: { l1_weight: 0.0, l2_weight: 0.0 }
        reactivation: { l1_weight: 0.0, l2_weight: 0.0 }
        decoder: { l1_weight: 0.0, l2_weight: 0.0 }
      enforce_ei_weight_ratio: false
      target_ei_weight_ratio: 0.5
      ei_ratio_loss_weight: 0.5
      ei_ratio_scope: "per_branch"
      ei_ratio_metric: "mean"

    pruning:
      enabled: false
      threshold: 2
      selective:
        layers: []
        branches: []
        weight_types: ["excitatory", "inhibitory"]
      re_evaluate_after: false
      dynamic_pruning: false
      pruning_frequency: 10
      report_non_pruned: true
      save_pruning_stats: false
      detailed_branch_report: true
      redo_analysis_after_pruning: false

    strategies:
      standard: {}

analysis:
  # DISABLED: re-enable with training_runtime/final_runtime config once
  # streaming evaluation is validated on ImageNet (see EvaluationRuntimeConfig).
  performance_analysis:
    enabled: false
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  information_analysis: { enabled: false, training: false, params: {} }
  correlation_analysis: { enabled: false, training: false, params: {} }
  ablation_analysis: { enabled: false, training: false, params: {} }
  synapse_turnover_analysis: { enabled: false, training: false, params: {} }
  noise_perturbation_analysis: { enabled: false, training: false, params: {} }
  weight_analysis: { enabled: false, training: false, params: {} }
  single_layer_contribution: { enabled: false, training: false, params: {} }
  synaptic_activation_analysis: { enabled: false, training: false, params: {} }
  branch_activation_analysis: { enabled: false, training: false, params: {} }
  compartment_statistics_analysis: { enabled: false, training: false, params: {} }
  compartment_snr_analysis: { enabled: false, training: false, params: {} }

wandb:
  use_wandb: false
  entity: ""
  project: "dendritic-sweeps"
  group: "alexnet_fc_replacement"
  tags: ["alexnet", "k2", "einet", "imagenet"]

outputs:
  run_name: "alexnet_k2_einet"
  results_dir: "outputs"

# Distributed training mode: none (single GPU), ddp, or fsdp.
# Use scripts/train.sh to auto-select the launcher from this setting.
distributed:
  mode: none
  fsdp:
    sharding_strategy: "FULL_SHARD"
    mixed_precision: true
    cpu_offload: false
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: "BACKWARD_PRE"
    gradient_checkpointing: false
