# ============================================================================
# AlexNet K=1 SMOKE TEST
# ============================================================================
#
# Minimal config for testing the pretrained replacement pipeline end-to-end.
# Same architecture as alexnet_k1_einet.yaml but with:
#   - 1 image per class (train + val) via dataset_params
#   - 1 epoch, small batch size
#   - no checkpointing, no early stopping
#
# Run locally (no SLURM needed):
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/vision/alexnet_k1_einet_smoke.yaml
#
# Or via SLURM:
#   sbatch scripts/test_pretrained_training.sh
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_profiling: false
  profiling_output_dir: "results/profiling/"
  enable_hooks: false
  checkpointing:
    enabled: false
    save_every_n_epochs: 25
    checkpoint_dir: "results/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  processing:
    flatten: false
    normalize: true
  dataset_params:
    imagenet:
      train_samples_per_class: 10                   # 10 images per class = 10000 total
      val_samples_per_class: 5

model:
  task: "classification"

  pretrained_replacement:
    enabled: true
    backbone: "alexnet"
    weights: "IMAGENET1K_V1"
    input_shape: [3, 224, 224]

    replace:
      start: "classifier.4"                        # fc7 Linear(4096 → 4096)
      end: "classifier.5"                          # fc7 ReLU

    omit_layers: ["classifier.0", "classifier.3"]  # skip Dropout

    trainability:
      encoder:
        mode: "frozen"
      decoder:
        mode: "frozen"

  core:
    type: "einet"

    architecture:
      excitatory_layer_sizes: [4096]
      inhibitory_layer_sizes: [820]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [2, 2]
      inhibitory_network_type: "dendritic"
      mlp_inhibitory_network_params:
        hidden_dims: []
        activation: "relu"

    connectivity:
      ee_synapses_per_branch_per_layer: [40]
      ei_synapses_per_branch_per_layer: [10]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]

    transfer:
      input_mode: 0
      independent_pathways: false
      excitatory_dim: null
      inhibitory_dim: null
      output_activation: null

    morphology:
      somatic_synapses: false
      use_shunting: true
      weight_transform: "softplus"
      dbl_init_method: "analytical_expectation"

    sparsity:
      init_method: "xavier_normal"
      noise_level: 0.0
      type: "standard"
      weight_norm_order: null
      gamma: 1.0
      temperature: 0.0
      gradient_scaling: "none"
      deepst:
        excitatory_target_density: 0.1
        inhibitory_target_density: 0.1
        use_noise: true
        sigma: 0.05
        rewiring_mode: "global"
        rewire_frequency: 1
        synapses_per_branch: null
        freeze_excitatory_connectivity: false
        freeze_inhibitory_connectivity: false
        init_method: "xavier_normal"
        weight_threshold: 1.0e-6

    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
      gradient_scaling: "none"

    blocklinear:
      gradient_scaling: "none"
      efficient: false

    implementation:
      adaptive_initialization: false
      print_hooks: false

training:
  encoder:
    strategy: "standard"
    common:
      lr: 0.0
      loss_function: "log_mse"
      epochs: 0
      early_stopping: false
      patience: 100
      batch_size: 128
      shuffle: false
      grad_clip_value: 5.0
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false

  main:
    strategy: "standard"
    common:
      epochs: 200                                   # long training run
      batch_size: 64
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: false
      patience: 50
      load_best_state_dict: false
      save_path: null
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.01
        encoder_lr: 0.0

    regularization:
      l1_weight: 0.0
      l2_weight: 0.0
      selective:
        layers: []
        branches: []
        weight_types: ["all"]
      split_params: false
      param_group_weights:
        topk: { l1_weight: 0.0, l2_weight: 0.0 }
        blocklinear: { l1_weight: 0.0, l2_weight: 0.0 }
        reactivation: { l1_weight: 0.0, l2_weight: 0.0 }
        decoder: { l1_weight: 0.0, l2_weight: 0.0 }
      enforce_ei_weight_ratio: false
      target_ei_weight_ratio: 0.5
      ei_ratio_loss_weight: 0.5
      ei_ratio_scope: "per_branch"
      ei_ratio_metric: "mean"

    pruning:
      enabled: false
      threshold: 2
      selective:
        layers: []
        branches: []
        weight_types: ["excitatory", "inhibitory"]
      re_evaluate_after: false
      dynamic_pruning: false
      pruning_frequency: 10
      report_non_pruned: true
      save_pruning_stats: false
      detailed_branch_report: true
      redo_analysis_after_pruning: false

    strategies:
      standard: {}

analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  information_analysis: { enabled: false, training: false, params: {} }
  correlation_analysis: { enabled: false, training: false, params: {} }
  ablation_analysis: { enabled: false, training: false, params: {} }
  synapse_turnover_analysis: { enabled: false, training: false, params: {} }
  noise_perturbation_analysis: { enabled: false, training: false, params: {} }

outputs:
  run_name: "alexnet_k1_einet_smoke"
  results_dir: "outputs/test_pretrained"
