# ============================================================================
# SWEEP CONFIGURATION TEMPLATE
# ============================================================================
# Annotated template for parameter sweeps with DendriNet. docs/sweeps.rst
# describes every section, option and command.
#
# USAGE:
#   Generate the configs and job scripts without submitting (an empty account
#   or partition becomes PLACEHOLDER):
#     dendritic-sweep --config configs/sweep_config.yaml --generate-only
#
#   Generate the configs and submit the Slurm jobs (account and partition are
#   required, here or in slurm_config):
#     dendritic-sweep --config configs/sweep_config.yaml \
#       --slurm-account ACCOUNT --slurm-partition PARTITION
#
#   Train one generated config without Slurm:
#     dendritic-train <sweep_dir>/configs/unified_config_0.yaml
#
#   Tabulate and plot the finished runs (pass the sweep directory, not its
#   results/ subdirectory):
#     dendritic-analyze <sweep_dir>
#
# WHAT CAN BE SWEPT:
#   - Any option of base_config, through its dot path (sweep_config)
#   - E/I synapse-count pairs that satisfy a constraint (filter_config, A)
#   - Dendritic tree depths and branching patterns (filter_config, B)
#   - Named conditions that change several options together (sweep_variants)
#   All of these combine in one grid.
#
# HOW IT WORKS:
#   The sweep manager takes the Cartesian product of the sweep_config axes and
#   the sweep_variants, applies filter_config, and writes one training config
#   per condition and replicate seed to <sweep_dir>/configs. Every generated
#   config is loaded with the strict config loader before any job script is
#   written; the models are not built. The sections of this file are checked
#   when it loads: an unknown key in slurm_config, experiment_settings,
#   filter_config or outputs raises with the closest valid key, and so does a
#   top-level key that nearly matches a section name. Other top-level keys are
#   reported in a warning and ignored; put annotations under metadata:.
#
# TOP-LEVEL SECTIONS:
#   slurm_config          - Slurm resources, environment and launcher
#   experiment_settings   - Replicate seeds (seeds_per_condition, base_seed, seed_paths)
#   sweep_config          - Axes: dot paths into base_config -> values or ranges
#   sweep_variants        - Optional named conditions that change several paths together
#   filter_config         - E/I pair filter and branch sweeps
#   base_config           - Complete training config shared by all conditions
#   execution_results_dir - Optional separate root for the run outputs
#   sweep_contract        - Optional expected_config_count, checked at generation
#   output_dir, outputs   - Optional base directory (output_dir or outputs.dir;
#                           default base_config.outputs.results_dir) and name
#                           prefix (outputs.run_name; default
#                           base_config.outputs.run_name) of the sweep directory
#   extends               - Optional parent sweep file, relative to this file
#                           (mappings are merged, lists are replaced)
# ============================================================================


# ============================================================================
# 1. SLURM CONFIGURATION
# ============================================================================
# The #SBATCH header, environment and launch command of every job script of
# the sweep. By default all configs run as one array job, one config per array
# task (--split-jobs N writes N sequential jobs instead). The job name is the
# sweep's prefix (base_config.outputs.run_name here).
#
# account, partition: required to submit; set them here or pass
#   --slurm-account and --slurm-partition. They become PLACEHOLDER only with
#   --generate-only or --dry-run. A site policy file
#   (DENDRITIC_SCHEDULER_PROFILES, or
#   $XDG_CONFIG_HOME/dendritic_modeling/scheduler_profiles.yaml) may restrict
#   the allowed account/partition pairs.
# launcher: "torchrun" runs torch.distributed.run --standalone with
#   gpus_per_node processes, one node per config. Use it with
#   base_config.distributed.mode: ddp, or with
#   training_script: src/dendritic_modeling/scripts/training/train_experiments_fsdp.py
#   and distributed.mode: fsdp.
# Every job runs "module purge" and then "module load" for modules_to_load.
# Two more optional keys, qos and constraint, add --qos and --constraint.
# An unknown slurm_config key raises when the sweep loads, naming the closest
# valid key.

slurm_config:
  account: ""                                # Slurm account (required to submit)
  partition: ""                              # Slurm partition (required to submit)
  time: "12:00:00"                           # Per job or array task: quoted HH:MM:SS or D-HH:MM:SS (default 02:00:00)
  nodes: 1                                   # Nodes per job; keep 1
  ntasks_per_node: 1                         # Tasks per node
  gpus_per_node: 1                           # --gres=gpu:N; also the torchrun process count
  launcher: "python"                         # "python" or "torchrun" (see above)
  cpus_per_task: 12                          # CPU cores per array task (default 4)
  mem: 200GB                                 # Memory per node, passed to Slurm as written (default 32G)
  max_concurrent_jobs: 32                    # Max array tasks running at once (default 10)
  exclude_nodes: []                          # Nodes to exclude (e.g., ["node001"]); --exclude-nodes replaces it
  modules_to_load: []                        # Environment modules loaded after "module purge"
  conda_env_path: ""                         # Environment root whose bin/python trains; empty = the "python" on PATH after "module purge"
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"  # Relative to the library checkout


# ============================================================================
# 2. EXPERIMENT SETTINGS
# ============================================================================
# Replicate seeds. Replicate r of every condition gets
# experiment.seed = base_seed + r, so all conditions use the same seeds.
# Total configs = conditions x seeds_per_condition (here 8 x 5 = 40); they run
# as one array job.

experiment_settings:
  seeds_per_condition: 5                     # Replicates per condition (default 1)
  base_seed: 0                               # Seeds 0, 1, ..., 4 (default base_seed 42)
  # Random streams the base config leaves unset (data split, initialization,
  # topology, data order) follow experiment.seed, so replicates also differ in
  # connectivity. Set base_config.experiment.topology_seed to hold the
  # connection masks and indexed-synapse indices fixed. seed_paths writes the
  # replicate seed into further paths, e.g. a component seed the base config
  # pins:
  # seed_paths:
  #   - model.core.population_network.layers.0.population_defaults.indexed_seed

# Optional: keep the sweep files (configs, job scripts, logs) in the sweep
# directory and write the run outputs under this separate root. Each generated
# config writes to <execution_results_dir>/config_<index>, and
# <sweep_dir>/results links to the root. Generation does not create the root.
# execution_results_dir: "/project/results/my_sweep"

# Optional named conditions. Each variant is one condition whose overrides are
# applied together; every variant is crossed with the sweep_config axes. A
# variant may change only paths the base core type reads: a
# population_network base takes overrides under model.core.population_network.
# This pair doubles the grid (2 x 8 = 16 conditions):
# sweep_variants:
#   - name: shunting
#     overrides:
#       model.core.population_network.layers.0.population_defaults.use_shunting: true
#       model.core.population_network.layers.0.population_defaults.use_additive_normalization: false
#   - name: normalized_additive
#     overrides:
#       model.core.population_network.layers.0.population_defaults.use_shunting: false
#       model.core.population_network.layers.0.population_defaults.use_additive_normalization: true


# ============================================================================
# 3. SWEEP CONFIG -- Parameter Grid
# ============================================================================
# Each key is a dot path into base_config. Each value is a list of literal
# values, a scalar (one value), or an explicit range:
#   {range: {start, stop, step}}     start, start + step, ..., up to and including stop
#   {linspace: {start, stop, num}}   num evenly spaced values, both ends included
#   {geomspace: {start, stop, num}}  num geometrically spaced values, both ends included
#   {values: [...]}                  the literal values
# A plain three-number list that reads as [start, stop, step], such as
# [1, 10, 2], is rejected as ambiguous. The sweep manager computes the full
# Cartesian product of the axes.
#
# SYNTAX:
#   dot.path.to.param: [val1, val2, val3]
#
# The dot path mirrors the YAML hierarchy of base_config; numeric components
# index lists. For example:
#   training.main.common.param_groups.topk_lr -> base_config.training.main.common.param_groups.topk_lr
#   data.processing.flatten                   -> base_config.data.processing.flatten
#   model.core.population_network.layers.0.populations.1.n_neurons
#                                             -> n_neurons of population "e" in layer "layer0"
#
# VALUE TYPES (each line works with this file's base_config):
#   Numbers:    training.main.common.param_groups.topk_lr: [0.001, 0.01, 0.1]
#   Strings:    model.core.population_network.layers.0.population_defaults.weight_transform: ["softplus", "exp"]
#   Booleans:   model.core.population_network.layers.0.population_defaults.somatic_synapses: [true, false]
#   Lists:      model.core.population_network.layers.0.populations.1.branch_factors: [[3, 3], [4, 4]]
#   Ranges:     training.main.common.batch_size: {range: {start: 128, stop: 512, step: 128}}
#
# LEARNING RATES: with split_params: true (see base_config), the sparse
# synapses, BlockLinear couplings, reactivation gates and decoder train at
# topk_lr, blocklinear_lr, reactivation_lr and decoder_lr. param_groups.lr
# sets no parameter of this model, so sweep the group rates instead.
#
# EXAMPLES (each replaces the axes below; counts are conditions):
#   # Sweep the sparse-synapse learning rate and batch size (2 x 3 = 6 conditions):
#   # training.main.common.param_groups.topk_lr: [0.001, 0.01]
#   # training.main.common.batch_size: [128, 256, 512]
#
#   # Sweep population size and morphology (2 x 2 = 4 conditions):
#   # model.core.population_network.layers.0.populations.1.n_neurons: [64, 128]
#   # model.core.population_network.layers.0.populations.1.branch_factors: [[3, 3], [4, 4]]
#
#   # Sweep E/I synapse counts in population-network defaults (3 x 3 = 9 conditions):
#   # model.core.population_network.layers.0.population_defaults.ff_excitatory_synapses: [20, 30, 40]
#   # model.core.population_network.layers.0.population_defaults.ff_inhibitory_synapses: [10, 15, 20]

sweep_config:
  # Population-network synapse counts and morphology (2 x 2 x 2 = 8
  # conditions). Numeric path components index YAML lists, so layers.0 is the
  # first population-network layer and populations.1 is the excitatory
  # readout population "e" of the base config.
  model.core.population_network.layers.0.population_defaults.ff_excitatory_synapses:
    - 20
    - 30

  model.core.population_network.layers.0.population_defaults.ff_inhibitory_synapses:
    - 10
    - 15

  model.core.population_network.layers.0.populations.1.branch_factors:
    - [3, 3]
    - [4, 4]


# ============================================================================
# 4. FILTER CONFIG -- E/I Filtering and Branch Sweeps
# ============================================================================
# Two independent mechanisms that can be used alone or combined:
#
# A) E/I FILTERING -- keep only some excitatory/inhibitory synapse-count pairs
# B) BRANCH SWEEP  -- add a dimension of dendritic trees to the grid
#
# --------------------------------------------------------------------------
# A) E/I FILTERING
# --------------------------------------------------------------------------
# sweep_config must contain both E/I axes: the population_defaults
# ff_excitatory_synapses and ff_inhibitory_synapses paths (population
# networks) or model.core.connectivity.ee_synapses_per_branch_per_layer and
# ie_synapses_per_branch_per_layer (structured E/I cores). The other axes are
# crossed with the pairs that remain.
#
#   mode: "all"          - No filtering (the default; "default" is the same)
#   mode: "ei-sum"       - Keep pairs with |E + I - value| <= tolerance
#   mode: "ei-ratio"     - Keep pairs with I > 0 and |E / I - value| <= tolerance
#   mode: "e-const"      - Keep E = value with every I (value must be on the E axis)
#   mode: "i-const"      - Keep I = value with every E (value must be on the I axis)
#   mode: "branch_sweep" - No filtering; required for a branch sweep without
#                          sweep_config axes or sweep_variants
#
#   value: <number>      - Target value; required by the four E/I modes
#   tolerance: <number>  - Required by ei-sum and ei-ratio (0 = exact match)
#   A filter that keeps no pair raises.
#
# EXAMPLES (with E and I axes of [10, 20, 30, 40] each):
#   # Keep the pairs with E + I = 50 (4 pairs):
#   # mode: "ei-sum"
#   # value: 50
#   # tolerance: 0
#
#   # Keep the E/I ratios within 0.5 of 2.0 (3 pairs):
#   # mode: "ei-ratio"
#   # value: 2.0
#   # tolerance: 0.5
#
#   # Hold inhibition at 10 (4 pairs):
#   # mode: "i-const"
#   # value: 10
#
# --------------------------------------------------------------------------
# B) BRANCH SWEEP
# --------------------------------------------------------------------------
# Each generated tree replaces branch_factors of every excitatory population
# (polarity "excitatory" or no polarity) in every population_network layer
# (model.core.architecture.excitatory_branch_factors for structured E/I
# cores). Remove any sweep_config axis on those branch_factors first: the tree
# overwrites it, and conditions that differ only in that axis become
# identical runs. A factor b at depth d gives d levels of b branches. Depths
# and factors are axis values: literal lists or explicit ranges (section 3).
#
# branch_sweep_mode options:
#
#   "uniform_sweep"   - Every depth with every branch factor (default mode)
#     dendrite_tree_depth: {range: {start: 1, stop: 4, step: 1}}
#     dendrite_branches_per_layer: {values: [2, 3]}
#     Example: depths 1-4 x factors 2, 3 -> 8 trees ([2], [3], [2, 2], ...)
#
#   "depth_sweep"     - Vary the depth with one branch factor at every level
#     dendrite_tree_depth: {range: {start: 2, stop: 5, step: 1}}
#     uniform_branches_per_layer: 4
#     Example: [4, 4], [4, 4, 4], [4, 4, 4, 4], [4, 4, 4, 4, 4] -> 4 trees
#
#   "width_sweep"     - Vary the branch factor at a fixed depth
#     fixed_dendrite_tree_depth: 3
#     dendrite_branches_per_layer: {range: {start: 2, stop: 8, step: 2}}
#     Example: [2, 2, 2], [4, 4, 4], [6, 6, 6], [8, 8, 8] -> 4 trees
#
#   "pattern_sweep"   - Named branching patterns across depths
#     dendrite_tree_depth: {range: {start: 2, stop: 4, step: 1}}
#     base_branches: 3
#     branch_patterns:
#       - "uniform"      # base_branches at every level, e.g. [3, 3, 3]
#       - "decreasing"   # base_branches, base_branches - 1, ..., at least 1, e.g. [3, 2, 1]
#     Example: 3 depths x 2 patterns -> 6 trees
#     Two more patterns ignore base_branches: "increasing" (1, 2, ..., depth)
#     and "pyramid" (1, 2, ... up to level depth // 2, then depth - level:
#     [1, 2, 1] at depth 3, [1, 2, 3, 1] at depth 4).
#
#   "custom_configs"  - Explicit trees, each a mapping with depth and branches
#     custom_branch_configs:
#       - {depth: 3, branches: [4, 4, 4]}
#       - {depth: 3, branches: [8, 4, 2]}
#       - {depth: 3, branches: [2, 4, 8]}
#     Example: 3 trees, each used as written
#
# COMBINING E/I FILTER + BRANCH SWEEP:
#   Set the E/I mode and branch_sweep_mode together. The total grid is:
#     (sweep_config Cartesian product, with the E/I axes reduced to the
#      pairs the filter keeps)
#       x (branch sweep trees)
#       x (sweep_variants)
#       x seeds_per_condition
#
# --------------------------------------------------------------------------

filter_config:
  # E/I filtering (disabled by default)
  mode: "all"                                # "all" | "ei-sum" | "ei-ratio" | "e-const" | "i-const" | "branch_sweep"
  # value: 50                                # Target value (required by the E/I modes)
  # tolerance: 0                             # Allowed deviation (required by ei-sum and ei-ratio; 0 = exact)

  # Branch sweep (disabled by default). Before uncommenting these lines,
  # delete the populations.1.branch_factors axis in sweep_config, which the
  # trees replace (2 x 2 E/I conditions x 4 trees = 16 conditions):
  # branch_sweep_mode: "depth_sweep"
  # dendrite_tree_depth: {range: {start: 1, stop: 4, step: 1}}
  # uniform_branches_per_layer: 3


# ============================================================================
# 5. BASE CONFIG -- Training Configuration Template
# ============================================================================
# The complete training config shared by all sweep conditions, in the schema
# of config_exp.yaml. The sweep axes overwrite the values at their paths in
# each generated config.

base_config:
  config_version: 3

  # ---------- Experiment ----------
  experiment:
    seed: 42                                 # Replaced in each generated config by base_seed + replicate index
    train_valid_split: 0.8

    checkpointing:
      enabled: false
      save_every_n_epochs: 10

  # ---------- Data ----------
  data:
    dataset_name: "mnist"
    base_dir: ""

    processing:
      flatten: true
      normalize: true

  # ---------- Model ----------
  model:
    task: "classification"

    encoder:
      type: "identity"
      params:
        input_dim: 784
        input_shape: [1, 28, 28]
        latent_dim: null

    core:
      type: "population_network"
      population_network:
        use_transfer: false
        transfer_params: {}
        layers:
          - name: "layer0"
            readout_population: "e"
            population_defaults:
              ff_excitatory_synapses: 30
              ff_inhibitory_synapses: 15
              rec_excitatory_synapses: 0
              rec_inhibitory_synapses: 0
              somatic_synapses: true
              use_shunting: true
              use_additive_normalization: false
              reactivate: true
              reactivation_type: "param_tanh"
              reactivation_init_policy: "occupancy_quantile"
              dbl_init_method: "analytical_expectation"
              weight_transform: "softplus"
              topk_type: "indexed_rewire"
              topk_init_method: "xavier_normal"
              indexed_rewire_frequency: 100
              indexed_rewire_quantile: 0.05
              indexed_rewire_until_step: null
              indexed_output_chunk_size: 2048
              blocklinear_gradient_scaling: "none"
              reactivation_gradient_scaling: "none"
              efficient_blocklinear: true
            populations:
              - name: "i"
                polarity: "inhibitory"
                n_neurons: 32
                branch_factors: [1]
                population:
                  ff_inhibitory_synapses: 0
              - name: "e"
                polarity: "excitatory"
                n_neurons: 128
                branch_factors: [4, 4]
            connections:
              - source: "input"
                target: "i"
              - source: "input"
                target: "e"
              - source: "i"
                target: "e"

    decoder:
      type: "MLP"
      params:
        input_dim: null
        hidden_dims: [32, 16]
        activation: "relu"
        output_dim: 10

  # ---------- Training ----------
  training:

    main:
      strategy: "standard"

      common:
        epochs: 200
        batch_size: 512
        shuffle: true
        grad_clip_value: 5.0
        loss_function: "ce"
        early_stopping: false
        patience: 500
        load_best_state_dict: true
        plot_losses: false
        suppress_prints: false
        print_every: 10
        use_amp: false
        enable_nan_checking: false
        synapse_decay_rate: 0.01
        weight_boosting: true

        # With split_params: true the optimizer trains the sparse synapses,
        # BlockLinear couplings, reactivation gates and decoder at their group
        # rates; lr covers only the parameters outside those groups (none in
        # this model).
        param_groups:
          lr: 0.001
          split_params: true
          topk_lr: 0.001
          blocklinear_lr: 0.0001
          reactivation_lr: 0.0001
          decoder_lr: 0.001

      regularization:
        l1_weight: 0.0
        l2_weight: 0.0
        enforce_ei_weight_ratio: false

      pruning:
        enabled: false

      strategies:
        standard: {}

  # ---------- Analysis ----------
  # Analysis sections use the analyzer names, as in config_exp.yaml. The
  # performance analyzer writes performance/final.json, which
  # dendritic-analyze and the rerun tool read; keep it enabled.
  analysis:
    performance:
      enabled: true
      training: true
      params:
        accuracy: true
        auc: true
        categorical_loglikelihood: true
        mse: false
        cosine_similarity: false

    information:
      enabled: false
      training: false

    correlation:
      enabled: false
      training: false

    ablation:
      enabled: false
      training: false

    synapse_turnover:                        # Enabling it requires training: true (it compares snapshots taken during training)
      enabled: false
      training: false

    noise_perturbation:
      enabled: false
      training: false

    weight:
      enabled: false
      training: false

    single_layer_contribution:
      enabled: false
      training: false

    synaptic_activation:
      enabled: false
      training: false

    branch_activation:
      enabled: false
      training: false

    compartment_statistics:
      enabled: false
      training: false

    compartment_snr:
      enabled: false
      training: false

    multiplicative_gain:
      enabled: false
      training: false

  # ---------- Outputs ----------
  outputs:
    run_name: "sweep_run"                    # Prefix of the sweep directory and the Slurm job name
    results_dir: "outputs"                   # Base directory of the sweep directory; each run writes to <sweep_dir>/results/config_<index>

  # ---------- Distributed ----------
  distributed:
    mode: none                               # ddp with launcher "torchrun"; fsdp with the FSDP training_script


# ============================================================================
# EXAMPLES -- Common Sweep Configurations
# ============================================================================
# Each example replaces the sweep_config and filter_config sections above;
# keep base_config, experiment_settings and slurm_config. Results count
# conditions; the generated configs are conditions x seeds_per_condition.
# Examples 5, 6 and 7 need the base_config of the example config they name.
#
# --------------------------------------------------------------------------
# Example 1: Sparse-synapse learning rate x batch size
# --------------------------------------------------------------------------
# sweep_config:
#   training.main.common.param_groups.topk_lr: [0.0001, 0.001, 0.01]
#   training.main.common.batch_size: [128, 256, 512]
# filter_config:
#   mode: "all"
# Result: 3 x 3 = 9 conditions
# (param_groups.lr sets no parameter of this model while split_params is
#  true; set split_params: false to train every parameter at one rate.)
#
# --------------------------------------------------------------------------
# Example 2: Population-network E/I synapse sweep with sum constraint
# --------------------------------------------------------------------------
# sweep_config:
#   model.core.population_network.layers.0.population_defaults.ff_excitatory_synapses: [10, 20, 30, 40]
#   model.core.population_network.layers.0.population_defaults.ff_inhibitory_synapses: [10, 20, 30, 40]
# filter_config:
#   mode: "ei-sum"
#   value: 50
#   tolerance: 0
# Result: 4 E/I pairs with E + I = 50: (10, 40), (20, 30), (30, 20), (40, 10)
#
# --------------------------------------------------------------------------
# Example 3: Population size and morphology comparison
# --------------------------------------------------------------------------
# sweep_config:
#   model.core.population_network.layers.0.populations.1.n_neurons: [64, 128]
#   model.core.population_network.layers.0.populations.1.branch_factors:
#     - [3, 3]
#     - [4, 4]
# filter_config:
#   mode: "all"
# Result: 2 x 2 = 4 conditions
#
# --------------------------------------------------------------------------
# Example 4: Population-network branch depth sweep
# --------------------------------------------------------------------------
# sweep_config:
#   {}
# filter_config:
#   mode: "branch_sweep"
#   branch_sweep_mode: "depth_sweep"
#   dendrite_tree_depth: {range: {start: 1, stop: 6, step: 1}}
#   uniform_branches_per_layer: 3
# Result: excitatory branch_factors [3], [3, 3], ..., [3, 3, 3, 3, 3, 3]
# (6 conditions)
#
# --------------------------------------------------------------------------
# Example 5: Recurrent tau and delay sweep
# --------------------------------------------------------------------------
# sweep_config:
#   model.core.population_network.layers.0.dt: [0.5, 1.0]
#   model.core.population_network.layers.0.population_defaults.tau_base: [10.0, 20.0, 40.0]
#   model.core.population_network.layers.0.connections.3.probability: [0.3, 0.6, 0.9]
# filter_config:
#   mode: "all"
# Result: 2 x 3 x 3 = 18 conditions. Use the base_config of
# configs/examples/population_network_taus_and_delays.yaml: a recurrent layer
# whose fourth connection (connections.3) is the delayed pyr -> pyr
# connection. tau_base has no effect in a feedforward layer such as the one
# above, and connections.3 does not exist there.
#
# --------------------------------------------------------------------------
# Example 6: Spiking population sweep
# --------------------------------------------------------------------------
# sweep_config:
#   model.core.population_network.layers.0.population_defaults.spike_threshold: [0.25, 0.5]
#   model.core.population_network.layers.0.population_defaults.spike_tau: [12.0, 24.0]
# filter_config:
#   mode: "all"
# Result: 2 x 2 = 4 conditions. Use the base_config of
# configs/examples/population_network_spiking.yaml, whose populations spike
# (population_defaults.dynamics_mode: "spike").
#
# --------------------------------------------------------------------------
# Example 7: Synapse-type kinetics sweep
# --------------------------------------------------------------------------
# sweep_config:
#   model.core.population_network.layers.0.population_defaults.synapse_types.excitatory.1.fraction: [0.1, 0.25, 0.4]
#   model.core.population_network.layers.0.population_defaults.synapse_types.excitatory.1.tau_decay: [40.0, 70.0, 100.0]
# filter_config:
#   mode: "all"
# Result: 3 x 3 = 9 conditions. Use the base_config of
# configs/examples/population_network_synapse_types_ampa_nmda_gaba.yaml, where
# excitatory.1 is the NMDA type. The fractions of one polarity are normalized
# to sum to 1, so the NMDA fraction axis also changes the AMPA share.
