# Test configuration with SLURM overrides
model:
  task: classification
  encoder_network:
    type: identity
    parameters: {}
  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 256
        inhibitory_dim: 256
      excitatory_layer_sizes: [512, 256, 128]
      inhibitory_layer_sizes: [128, 64, 32]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [2, 1]
      ee_synapses_per_branch_per_layer: [32, 16, 8]
      ei_synapses_per_branch_per_layer: [16, 8, 4]
      ie_synapses_per_branch_per_layer: [20, 10, 5]
      ii_synapses_per_branch_per_layer: [8, 4, 2]
      somatic_synapses: true
      use_shunting: true
      topk_init_method: xavier_normal
      topk_strategy: standard
      topk_type: standard
      reactivate: true
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_type: param_tanh
      reactivation_strategy: standard
      blocklinear_strategy: standard
      efficient_blocklinear: true
      adaptive_initialization: true
  decoder_network:
    type: MLP
    parameters:
      output_dim: 10
      hidden_dims: [256, 128]

task:
  dataset: cifar10
  data_path: /n/holylfs06/LABS/kempner_shared/Lab/data
  parameters:
    flatten: true
    n_classes: 10
  
train:
  seed: 0
  train_valid_split: 0.9
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.0001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 50
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      plot_losses: true

outputs:
  run_name: test_slurm_model
  dir: results/

# SLURM configuration section - only system/person-dependent settings
slurm_config:
  output_dir: "/n/holylabs/LABS/kempner_dev/Users/hsafaai/custom_logs"
  conda_env: "dendritic_env"
  conda_env_path: "/n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env/etc/profile.d/conda.sh"
  modules_to_load: 
    - "python/3.12.5-fasrc01"
    - "cuda/12.4.1-fasrc01" 
    - "cudnn/8.9.2.26_cuda12-fasrc01"
  training_script: "scripts/train_experiments.py"
  account: "kempner_dev"
  partition: "kempner_h100"
  run_name: "custom_slurm_job_name" 