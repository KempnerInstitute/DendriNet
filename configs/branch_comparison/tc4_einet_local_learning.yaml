experiment:
  seed: 42
  train_valid_split: 0.8
  enable_profiling: false
  enable_hooks: true
  checkpointing:
    enabled: false
data:
  dataset_name: cifar10
  base_dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/Code/dendritic-modeling/data
  processing:
    flatten: true
    normalize: true
    label_noise_rate: 0.0
model:
  task: classification
  encoder:
    type: identity
  decoder:
    type: MLP
    params:
      hidden_dims: []
      activation: relu
      output_dim: 10
  core:
    type: dendritic_shunting
    architecture:
      excitatory_layer_sizes:
      - 256
      inhibitory_layer_sizes: []
      excitatory_branch_factors:
      - 4
      - 4
      inhibitory_branch_factors:
      - 1
    connectivity:
      ee_synapses_per_branch_per_layer:
      - 60
      ei_synapses_per_branch_per_layer:
      - 0
      ie_synapses_per_branch_per_layer:
      - 30
      ii_synapses_per_branch_per_layer:
      - 0
    transfer:
      input_mode: 0
      independent_pathways: false
    morphology:
      somatic_synapses: false
      use_shunting: true
      weight_transform: softplus
    sparsity:
      init_method: xavier_normal
      type: standard
    reactivation:
      enabled: true
      type: param_tanh
      init_m: 1.0
      init_b: 0.5
    blocklinear:
      gradient_scaling: false
wandb:
  use_wandb: false
outputs:
  run_name: branch_comparison
  results_dir: results
training:
  main:
    strategy: local_ca
    common:
      epochs: 200
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      loss_function: cat_nll
      early_stopping: false
      patience: 200
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 10
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    learning_strategy_config:
      rule_variant: 5f
      error_mode: auto
      error_broadcast_mode: per_soma
      decoder_update_mode: local
      update_reactivation: true
      update_inactive_weights: false
      normalize_by_batch: true
      clip_grad_value: 5.0
      three_factor:
        use_conductance_scaling: true
        use_driving_force: true
        theta: 0.0
        e_rev_exc: 1.0
        e_rev_inh: 0.0
      four_factor:
        rho_mode: dot
        rho_estimator: ema
        ema_alpha: 0.1
      five_factor:
        phi_mode: conditional
        phi_estimator: conditional_ema
        phi_ridge_lambda: 0.001
analysis:
  performance:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  information:
    enabled: true
    training: false
    params:
      selection:
        components:
        - basic
        - pairwise
        - conditional
        scopes:
        - layer
        - einet
        signal_variants:
        - network
      compute:
        max_samples: 2000
        include_vinf: true
        normalize_mi: false
        verbose: false
        computation_level: single_branch
        branch_aggregation: mean
      estimator:
        method: kraskov
        kraskov:
          n_neighbors: 10
      baselines:
        random_weights:
          n_shuffles: 0
          seed: 42
        label_shuffle_null:
          n_shuffles: 0
          seed: 0
  weight:
    enabled: true
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      computation_level: single_branch
      branch_aggregation: mean
      per_layer_analysis: true
      per_einet_analysis: true
      per_neuron_analysis: false
      analyze_excitatory: true
      analyze_inhibitory: true
      compute_mean: true
      compute_variance: true
      compute_percentiles: false
      compute_min_max: true
      compute_dendritic_strength: true
      weight_threshold: 1.0e-06
  compartment_statistics:
    enabled: true
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      inputs: true
      activations: true
      global_analysis: true
      layer_analysis: true
      branch_analysis: true
      compute_mean: true
      compute_variance: true
      compute_percentiles: true
      compute_min_max: true
      compute_entropy: true
      per_class_analysis: false
      n_samples: 1000
  compartment_snr:
    enabled: true
    training: false
    params:
      input_analysis: true
      layer_analysis: true
      branch_analysis: true
  ablation:
    enabled: true
    training: false
    params:
      selection:
        levels:
        - layer
        targets:
        - all_synapses
        - excitation
        - inhibition
        metrics:
        - accuracy
        - auc
        - categorical_loglikelihood
      methods:
        ablation_methods:
        - lesion
        - shuffle
        - mean_clamp
        shuffle_seed: 0
        clamp_statistic: mean
  noise_perturbation:
    enabled: true
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 1.0
      gaussian_noise: true
      gaussian_sdevs:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 1.0
      n_samples: 5
      accuracy: true
      auc: true
      categorical_loglikelihood: true
  synapse_turnover:
    enabled: true
    training: true
    params:
      snapshot_interval: 1
      synaptic_analysis: true
      save_synaptic_report: true
  multiplicative_gain:
    enabled: false
  receptive_field:
    enabled: false
  synaptic_activation:
    enabled: false
  branch_activation:
    enabled: false
  single_layer_contribution:
    enabled: false
  correlation:
    enabled: false
