# ============================================================================
# EFFICIENT IMPLEMENTATIONS TEST CONFIGURATION
# ============================================================================
# Tests efficient_blocklinear and topk_ultrafast performance optimizations

model:
  task: classification
  
  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]
  
  core_network:
    type: EINet
    parameters:
      input_dim: 784            # MNIST flattened input dimension
      # Transfer function parameters
      transfer_params:
        input_mode: 0             # Raw input to excitatory only
        independent_pathways: false
        output_activation: none
        
      # Larger network to benefit from efficient implementations
      excitatory_layer_sizes: [256, 128, 64]
      inhibitory_layer_sizes: [64, 32, 16]
      excitatory_branch_factors: [8, 4, 2]  # More branches to test blocklinear efficiency
      inhibitory_branch_factors: [4, 2, 1]
      
      # Connection patterns - no cross-pathway for input_mode 0
      ee_synapses_per_branch_per_layer: [32]
      ei_synapses_per_branch_per_layer: [16]
      ie_synapses_per_branch_per_layer: [1]   # Minimum 1 even if not used
      ii_synapses_per_branch_per_layer: [1]   # Minimum 1 even if not used
      
      # Network features
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters with stochastic for ultrafast testing
      topk_type: stochastic        # Use stochastic to test topk_ultrafast
      topk_init_method: xavier_normal
      topk_noise_level: 0.1
      topk_temperature: 0.5
      topk_ultrafast: true         # ENABLE ULTRAFAST TOPK
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      
      # EFFICIENT IMPLEMENTATIONS - MAIN FEATURES
      efficient_blocklinear: true   # ENABLE EFFICIENT BLOCKLINEAR
      adaptive_initialization: true
      print_hooks: false

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [128, 64]
      activation: relu
      output_dim: 10
      use_batch_norm: false
      dropout_rate: 0.0

train:
  run_name: "efficient_implementations_test"
  seed: 42
  train_valid_split: 0.8
  
  # Performance settings
  enable_amp: true              # Combine with other optimizations
  enable_profiling: true        # Measure performance impact
  profiling_output_dir: "outputs/profiling/efficient_test/"
  enable_hooks: true
  performance_mode: false
  use_fsdp: false
  
  # Encoder (skip for identity)
  encoder:
    trainer:
      epochs: 0
      batch_size: 128
  
  # Main training
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 15
      batch_size: 256           # Good size for efficiency testing
      early_stopping: false
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 3

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: true
  project: "dendritic-performance-tests"
  group: "efficient-implementations"
  tags: ["efficient-blocklinear", "topk-ultrafast", "optimizations"]

# Analysis to validate correctness
analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      memory_usage: true
      throughput: true
      gpu_utilization: true
      profiling_integration: true
  
  information_analysis:
    enabled: true
    training: false
    params:
      mutual_information: true
      entropy: true
      save_plots: false
      samples: 500

outputs:
  dir: "./outputs/efficient_test/"

compute:
  device: "auto"
  memory:
    gradient_checkpointing: false
    empty_cache_freq: 100
    max_memory_fraction: 0.9 