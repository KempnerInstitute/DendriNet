model:
  task: classification 
  probabilistic: True
  network:
    type: "EINet" #"EINet", "MLP"
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [10] #512
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [1,1] #64
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: xavier_normal
      use_shunting: true
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh"
      gradient_strategy: block_conductance_dynamic  #"none", "distal_upweight_by_idx", "block_conductance_dynamic"
      enable_branch_outputs: true   ### alows DendriNetWithOutputs to keep activations etc
      output_layer: bool = false  ### adding an output classifier layer FC to final dendrinet layer
      output_dim: int = 10

train:
  learning_strategy: "mle" #"mle", "freeze_layers", "local_credit_assignment", "two_step", "two_step_kl"    --> local learning rules should start with local_...
  run_name: "mnist_einet"
  seed: 0
  train_valid_split: 0.8
  lr: 0.01
  epochs: 50
  batch_size: 128
  grad_clip_value: 5
  epochs_per_layer: 50  ## this is only for "freeze_layers" and any other method which has sequential single layer training
  pretrain_epochs: 10   ## for "two_step"
  weight_decay_rate: 0.1

task:
  dataset: "mnist"
  parameters: {}
  # dataset: "orientation_bars"   # or "mnist", "line", "center_surround", etc.
  # parameters:
  #   train_size: 8000
  #   valid_size: 1000
  #   test_size:  1000
  #   image_size: 16   # relevant for orientation_bars
  #   n_orient_classes: 8

wandb:
  entity: 
  project: #"dendritic_mnist_test"
  group:   #"debug"
  tags:    #[mnist_1]
  use_wandb: false 

visualization:
  enabled: true
  save_path: 
  visualize_epochs: [10, 50]  # list of epochs at which to produce intermediate visualizations
  plots:
    - "weights"      # Plot dendritic or EI-net weights
    - "activations"  # Plot per-digit activation distribution
    #- "gradients"    # Plot synapse or branch gradients
    #- "branch_info"  # mutual information
    #- "ablation"     # ablation
