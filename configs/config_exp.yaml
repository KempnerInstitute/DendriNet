
# ============================================================================
# STANDARD DENDRITIC MODELING EXPERIMENT CONFIGURATION
# ============================================================================
# This is the main configuration file for running single dendritic modeling
# experiments on single GPUs with moderate-sized models.
#
# USAGE:
#   Standard single-GPU training:
#   python src/dendritic_modeling/scripts/training/train_experiments.py configs/config_exp.yaml
#
#   With command line overrides:
#   python src/dendritic_modeling/scripts/training/train_experiments.py configs/config_exp.yaml --output_dir /path/to/results --run_name my_experiment
#
#   Available command line options:
#   --output_dir: Override output directory
#   --run_name: Override experiment name
#   --learning_strategy: Override learning strategy (mle, freeze_branches, two_step, etc.)
#
# NOTE: For large models requiring multi-GPU/FSDP training, use config_exp_fsdp.yaml instead.
# NOTE: For parameter sweeps, use unified_all_sweeps_example.yaml instead.

model:
  task: classification  # Options: "classification", "regression"

  # ==========================================
  # ENCODER NETWORK (Input Processing Stage)
  # ==========================================
  encoder_network:
    type: identity  # Options: "identity", "mlpautoencoder", "cnnautoencoder", "mlpvariationalautoencoder", "cnnvariationalautoencoder"
    parameters:
      input_dim: null             # For MLP encoders
      input_shape: [3, 32, 32]   # For CNN encoders [channels, height, width]
      encoder_hidden_dims: [128, 64]  # Hidden dimensions for MLP encoders
      encoder_kernel_sizes: [3, 3]    # Kernel sizes for CNN encoders
      encoder_strides: [2, 2]         # Strides for CNN encoders
      latent_dim: null            # For autoencoders
      latent_shape: null          # For CNN autoencoders [channels, height, width]
      decoder_hidden_dims: [64, 128]  # Hidden dimensions for autoencoder decoders
      activation: relu            # Activation function

  # ==========================================
  # CORE NETWORK (Main Processing Stage)
  # ==========================================
  core_network:
    type: EINet  # Options: "EINet", "MLP", "MatchedParamMLP", "EffectiveMatchedParamMLP"
    parameters:
      # Core network structure
      #input_dim: 784

      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: false
        excitatory_dim: null        # Dimensions for excitatory pathways (input_mode 1)
        inhibitory_dim: null        # Dimensions for inhibitory pathways (input_mode 1)
        output_activation: null     # Options: "sigmoid", "relu", "tanh", "softplus", null

      # ==========================================
      # MORPHOLOGICAL ARCHITECTURE
      # ==========================================
      excitatory_layer_sizes: [20]         # Neurons per excitatory layer
      inhibitory_layer_sizes: []         # Neurons per inhibitory layer
      excitatory_branch_factors: [3,3]       # Branches per excitatory neuron (fixed: should match layer count)
      inhibitory_branch_factors: []       # Branches per inhibitory neuron (fixed: was empty)

      # Synaptic connectivity patterns
      ee_synapses_per_branch_per_layer: [10]   # Excitatory-to-excitatory synapses
      ei_synapses_per_branch_per_layer: [0]   # No E→I connections since no inhibitory neurons exist
      ie_synapses_per_branch_per_layer: [1]   # Input→E inhibitory synapses (input_mode=1 provides inhibitory signals)
      ii_synapses_per_branch_per_layer: [0]   # No I→I connections since no inhibitory neurons exist

      # Morphological features
      somatic_synapses: true      # Include somatic (non-dendritic) synapses
      use_shunting: true          # Use shunting inhibition

      # Weight transformation for positive weights
      weight_transform: exp       # Options: "exp", "relu", "softplus"
      dbl_init_method: analytical_expectation

      # ==========================================
      # TOPK SPARSITY PARAMETERS
      # ==========================================
      topk_init_method: xavier_normal    # Weight initialization method
      topk_noise_level: 0.0              # Noise level for stochastic TopK
      topk_type: standard              # Options: "standard", "stochastic", "variance", "deepst"
      topk_temperature: 0.0              # Stochastic selection sharpness (0.1-1.0)
      topk_strategy: conductance_dynamic # TopK gradient scaling strategy

      # ==========================================
      # REACTIVATION PARAMETERS
      # ==========================================
      reactivate: true                   # Enable reactivation functions
      reactivation_type: param_tanh      # Reactivation function type
      reactivation_init_m: 1.5           # Reactivation parameter m
      reactivation_init_b: 0.5           # Reactivation parameter b
      reactivation_strategy: inverse     # Gradient scaling strategy

      # ==========================================
      # BLOCK LINEAR PARAMETERS
      # ==========================================
      blocklinear_strategy: conductance_dynamic # BlockLinear gradient scaling
      efficient_blocklinear: false        # Use memory-efficient implementation

      # ==========================================
      # IMPLEMENTATION OPTIMIZATIONS
      # ==========================================
      adaptive_initialization: false      # Network-aware weight scaling
      print_hooks: false                 # Print gradient statistics in hooks

      # ==========================================
      # DEEPST SPECIFIC PARAMETERS
      # ==========================================
      excitatory_target_density: 0.1     # Target density for excitatory connections
      inhibitory_target_density: 0.1     # Target density for inhibitory connections
      use_noise: true                    # Apply Gaussian noise during rewiring
      sigma: 0.05                        # Standard deviation of Gaussian noise
      rewiring_mode: global              # Options: "global", "local", "constant_branch"
      rewire_frequency: 1                # Rewiring frequency (every N epochs)
      synapses_per_branch: null          # For constant_branch mode
      freeze_excitatory_connectivity: false  # Freeze excitatory connectivity
      freeze_inhibitory_connectivity: false  # Freeze inhibitory connectivity
      init_method: xavier_normal         # Weight initialization method
      weight_threshold: 1e-6             # Pruning threshold

  # ==========================================
  # DECODER NETWORK (Output Processing Stage)
  # ==========================================
  decoder_network:
    type: MLP  # Options: "MLP", "identity"
    parameters:
      input_dim: null           # Will be set automatically
      hidden_dims: [16]     # Hidden layer dimensions
      activation: relu          # Activation function
      output_dim: 10          # Will be set automatically

# ============================================================================
# TRAINING CONFIGURATION - VALIDATED PARAMETERS ONLY
# ============================================================================
train:
  seed: 42
  train_valid_split: 0.8



  # ==========================================
  # PERFORMANCE OPTIMIZATION SETTINGS
  # ==========================================
  enable_amp: false             # Enable automatic mixed precision
  enable_profiling: false       # Enable PyTorch profiler
  profiling_output_dir: "results/profiling/"
  enable_hooks: true            # Enable hooks for analysis (set false for max speed)

  # FSDP (Fully Sharded Data Parallel) Configuration
  use_fsdp: false               # Enable FSDP for large models (>100M parameters)
  fsdp_config: null             # FSDP configuration (null to disable, detailed config below when enabled)
  # When use_fsdp: true, uncomment and configure the following:
  # fsdp_config:
  #   sharding_strategy: "FULL_SHARD"      # Options: "FULL_SHARD", "SHARD_GRAD_OP", "NO_SHARD", "HYBRID_SHARD"
  #   mixed_precision: true                # Use FP16 for parameters, gradients, and buffers
  #   cpu_offload: false                   # Offload parameters to CPU (slower but saves GPU memory)
  #   min_num_params: 1000000             # Wrap layers with more than this many parameters
  #   reduce_communication_overhead: true  # Enable communication optimizations
  #   limit_all_gathers: true             # Reduce memory pressure during communication
  #   forward_prefetch: true              # Prefetch parameters for forward pass
  #   sync_module_states: true            # Synchronize module states across ranks
  #   use_orig_params: true              # Important for dendritic models
  #   backward_prefetch: "BACKWARD_PRE"   # Options: "BACKWARD_PRE", "BACKWARD_POST", null
  #   gradient_checkpointing: false       # Trade compute for memory (slower but uses less memory)

  # ==========================================
  # CHECKPOINTING
  # ==========================================
  checkpointing:
    enabled: false
    save_every_n_epochs: 10
    checkpoint_dir: "results/checkpoints/"

  # ==========================================
  # ENCODER TRAINING CONFIGURATION
  # ==========================================
  encoder:
    load_save_root: ./.trained_encoder_networks/  # Hash-based encoder model cache directory
    lr: 0.001
    trainer:
      loss_function: mse        # Loss function for encoder
      epochs: 50               # Encoder pre-training epochs
      early_stopping: false    # Early stopping
      patience: 10             # Patience
      batch_size: 128          # Batch size
      shuffle: true            # Shuffle data
      grad_clip_value: 5.0     # Gradient clipping
      load_best_state_dict: true
      plot_losses: false
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false
      # Performance optimization flags (disabled by default for speed)
      enable_nan_checking: false      # Enable NaN detection during training (expensive)
      enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)
      pretrain_epochs: 50
      target_voltage: 0.5
      kl_weight: 0.1
      reverse_training: false
      epochs_per_layer: 50
      epochs_per_branch: 50
      final_tune_epochs: 10

  # ==========================================
  # MAIN NETWORK TRAINING
  # ==========================================
  main:
    learning_strategy: standard # Options: "standard", "voltage_stabilization", "homeostatic_control", "freeze_layers", "freeze_branches", "local_ca", "two_step"
                               # Supports regularization, pruning, and parameter group features
    weight_decay_rate: 0.01     # Use optimizer.weight_decay for internal optimizer creation

    # Parameter groups with different learning rates
    param_groups:
      lr: 0.001                 # Default learning rate
      split_params: true        # Split parameters into groups
      topk_lr: 0.001           # Learning rate for TopK layers
      blocklinear_lr: 0.0001   # Learning rate for BlockLinear layers
      reactivation_lr: 0.0001  # Learning rate for reactivation layers
      decoder_lr: 0.0001       # Learning rate for decoder network

    trainer:
      loss_function: ce        # Loss function
      epochs: 50               # Main training epochs
      early_stopping: false    # Early stopping
      patience: 10             # Patience
      batch_size: 128          # Batch size
      shuffle: true            # Shuffle data
      grad_clip_value: 5.0     # Gradient clipping
      checkpointing: false
      checkpoint_interval: 10
      load_best_state_dict: true
      plot_losses: true
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false
      # Performance optimization flags (disabled by default for speed)
      enable_nan_checking: false      # Enable NaN detection during training (expensive)
      enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)

      # ==========================================
      # STRATEGY-SPECIFIC CONFIG BLOCKS
      # ==========================================
      voltage_stabilization_config:
        pretrain_epochs: 50
        stabilize_mode: vout
        freeze_reactivation: true
        target_voltage: 0.5
        loss_metric: "mse"

      homeostatic_control_config:
        pretrain_epochs: 50
        stabilize_mode: vinf
        freeze_reactivation: false
        target_voltage: 0.5
        loss_metric: "mse"

      freeze_layers_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_layer: 50
        final_tune_epochs: 10

      freeze_branches_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_branch: 50
        final_tune_epochs: 10

      freeze_branch_kl_config:
        pretrain_epochs: 10
        reverse_training: false
        epochs_per_branch: 50
        final_tune_epochs: 10
        kl_weight: 0.1


    # ==========================================
    # ADVANCED TRAINING FEATURES
    # ==========================================
    # Regularization, pruning, and flexible optimizer configuration
    # All features default to disabled, so no impact unless explicitly enabled

    # Internal optimizer configuration (alternative to external optimizer creation)
    # Note: When provided, respects param_groups learning rates above
    # optimizer:
    #   name: "adam"                    # Options: "adam", "sgd", "rmsprop", "adamw"
    #   lr: 0.001                      # Learning rate (used when param_groups.split_params=false)
    #   weight_decay: 0.0001           # Built-in L2 regularization (global)
    #   momentum: 0.9                  # For SGD
    #   betas: [0.9, 0.999]           # For Adam/AdamW
    #   eps: 1e-8                      # For Adam/AdamW

    # Unified regularization configuration
    regularization:
      l1_weight: 0.0               # Global L1 regularization strength (used when split_params=false)
      l2_weight: 0.0                # Global L2 regularization strength (used when split_params=false)
      selective:                     # Selective application
        layers: []                   # List of layer indices (empty = all layers)
        branches: []                 # List of branch names (empty = all branches)
        weight_types: ["all"]        # Options: "all", "recurrent", "input", "output", "linear"

      # Parameter group specific regularization
      split_params: true             # Split parameters into groups for differential regularization
      param_group_weights:
        # Apply different regularization to different parameter groups (when split_params=true)
        topk:                       # TopK layers
          l1_weight: 0.0          # L1 for TopK layers
          l2_weight: 0.0          # L2 for TopK layers
        blocklinear:                # BlockLinear layers
          l1_weight: 0.0            # No L1 for BlockLinear
          l2_weight: 0.0          # No L2 for BlockLinear
        reactivation:               # Reactivation layers
          l1_weight: 0.0         # No L1 for reactivation
          l2_weight: 0.0            # No L2 for reactivation
        decoder:                    # Decoder network
          l1_weight: 0.0          # No L1 for decoder
          l2_weight: 0.0          # No L2 for decoder

      # E/I Weight Ratio Regularization
      enforce_ei_weight_ratio: false      # Enable E/I weight ratio regularization
      target_ei_weight_ratio: 1.5         # Target excitatory/inhibitory weight ratio
      ei_ratio_loss_weight: 0.1           # Regularization strength (fraction of total loss)
      ei_ratio_scope: "per_branch"        # Options: "per_branch", "per_layer", "global"
      ei_ratio_metric: "mean"             # Options: "mean", "median", "rms"

    # Pruning configuration
    pruning:
      enabled: false                 # Enable pruning
      threshold: 2               # Prune weights with abs(value) < threshold
      selective:                     # Selective application
        layers: []                   # List of layer indices (empty = all layers)
        branches: []                 # List of branch names (empty = all branches)
        weight_types: ["excitatory", "inhibitory"]        # Options: "all", "excitatory", "inhibitory", "recurrent", "input", "output", "linear"
      re_evaluate_after: false        # Re-evaluate model after pruning
      dynamic_pruning: false         # Whether to prune during training
      pruning_frequency: 10          # Epochs between dynamic pruning (if enabled)

    # Reporting configuration
    reporting:
      report_non_pruned: true        # Print detailed pruning report
      save_pruning_stats: false       # Save pruning statistics to file
      detailed_branch_report: true   # Include per-branch statistics
      redo_analysis_after_pruning: false  # Redo all analyses after pruning for comparison

# ============================================================================
# DATASET/TASK CONFIGURATION - VALIDATED DATASETS ONLY
# ============================================================================
task:
  # Validated dataset options (from datasets/__init__.py and synthetic_datasets.py)
  dataset: cifar10
  # Options:
  # - Standard: "mnist", "cifar10", "imagenet"
  # - Modified MNIST: "mnist_modulo10", "random_flip_mnist"

  data_path: ""  # Custom data path

  # Dataset-specific parameters
  parameters:
    # Common parameters
    # train_size: 8000
    # valid_size: 1000
    # test_size: 1000
    flatten: true
    normalize: false

    # # Synthetic dataset parameters
    # image_size: 16           # For image-based synthetic datasets
    # n_orient_classes: 8      # For orientation_bars
    # n_bits: 8               # For multi_xor

    # # Generated dataset parameters
    # base_dataset: mnist      # For poisson_generator
    # rate_multiplier: 1       # For poisson_generator
    # input_dim: 10           # For orthonet
    # n_layers: 5             # For orthonet
    # nonlinearity: sigmoid   # For orthonet: "sigmoid", "tanh", None
    # repeat_layers: false    # For orthonet
    # noise_std: 0.1          # For orthonet

# ============================================================================
# WANDB LOGGING - VALIDATED PARAMETERS ONLY
# ============================================================================
wandb:
  entity:
  project:
  group:
  tags: []
  use_wandb: false

# ============================================================================
# ANALYSIS CONFIGURATION - VALIDATED MODULES ONLY
# ============================================================================
analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  information_analysis:
    enabled: true
    training: false
    params:
      method: kraskov           # Options: "kraskov", "sklearn", "copula", "auto"
      max_samples: null         # Limit samples for computation
      n_neighbors: 10           # For kraskov k-NN estimator
      n_bins: 20               # For sklearn histogram
      copula_type: gaussian     # For copula method
      compute_basic_mi: true    # I(E;C), I(I;C), I(Vout;C)
      compute_pairwise_mi: true # I(E;I), I(E;Vout), I(I;Vout)
      compute_conditional_mi: true # I(E;I|C), I(E;Vout|C), etc.
      compute_pid: false        # Partial Information Decomposition
      pid_binarize: true
      pid_binarize_method: median # Options: "median", "mean", "quantile"
      pid_binarize_threshold: 0.5
      include_vinf: true        # Include soma activation
      normalize_mi: false       # Normalize by entropy
      verbose: false

      # Computation Level Control - determines the granularity of information analysis
      computation_level: layer_branch   # Options: "single_branch", "layer_branch", "all_branch"
                                     # "single_branch": Individual branches (most granular and accurate)
                                     # "layer_branch": Layer-level aggregation (treats each layer as a unit)
                                     # "all_branch": Full network aggregation (most efficient)

      # Branch aggregation method - only used when computation_level is "layer_branch" or "all_branch"
      branch_aggregation: multivariate     # Options: "mean", "multivariate", "sample"


      # Enhanced analysis modes
      per_neuron_analysis: false   # If true, compute MI for each neuron separately
      per_einet_analysis: false    # If true, analyze E and I networks separately
      per_layer_analysis: false    # If true, compute enhanced analysis per layer

  synapse_turnover_analysis:
    enabled: true
    training: true
    snapshot_interval: 5  # frequency of snapshots
    synaptic_analysis: true        # Enable synaptic connectivity analysis
    save_synaptic_report: true     # Save synaptic analysis to file

  noise_perturbation_analysis:
    enabled: true
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  ablation_analysis:   ## needs test for the upstream values
    enabled: true
    training: false
    params:
      layer_ablation: true
      compartment_ablation: false
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  weight_analysis:
    enabled: true
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      computation_level: "single_branch"
      branch_aggregation: "mean"
      per_layer_analysis: true
      per_einet_analysis: true
      per_neuron_analysis: false

      analyze_excitatory: true
      analyze_inhibitory: true
      analyze_branch_output: false
      compute_mean: true
      compute_variance: true
      compute_percentiles: false
      compute_min_max: true
      compute_dendritic_strength: true
      weight_threshold: 1e-6

  synaptic_activation_analysis:
    enabled: true
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: true
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5


  single_layer_contribution:
    enabled: true
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  correlation_analysis:    ## needs to be tested
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
outputs:
  run_name: exp_run
  dir: results/
  dataset_dir: data                         # Optional: separate directory for shared datasets
