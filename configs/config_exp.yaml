model:
  task: classification  # Options: "classification", "regression"
  encoder_network:
    type: CNNAutoencoder # MLPAutoencoder, CNNAutoencoder, MLPVariationalAutoencoder, CNNVariationalAutoencoder, identity, none
    parameters:
      encoder_hidden_dims: [64]
      encoder_kernel_sizes: [3]
      encoder_strides: [2]
      latent_dim: 200
      decoder_hidden_dims: [64]
      activation: relu
  core_network:
    type: EINet #"EINet", "MLP"
    parameters:
      # transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 100
        inhibitory_dim: 100
      # configuration parameters
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [40]
      excitatory_branch_factors: [2,2]
      inhibitory_branch_factors: []
      ee_synapses_per_branch_per_layer: [100]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]
      somatic_synapses: true
      use_shunting: true
      # topk parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0 # Added parameter for TopK noise
      topk_type: standard # Options: "standard", "stochastic", "variance", "deepst"
      topk_temperature: 0.5 # Controls the stochastic selection sharpness (0.1-1.0)
      topk_ultrafast: true # Enable faster implementation for stochastic TopK
      # reactivation parameters
      reactivate: true
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh", "param_linear_sigmoid"
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      # gradient scaling parameters
      reactivation_strategy: inverse # "none", "inverse"
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic # "none", "distal_upweight_by_idx", "conductance_dynamic"
      print_hooks: false # Whether to print gradient statistics in hooks
      # DEEPST specific parameters
      excitatory_target_density: 0.1   # Target density for excitatory connections (fraction of active synapses)
      inhibitory_target_density: 0.1   # Target density for inhibitory connections (fraction of active synapses)
      use_noise: true                  # Whether to apply Gaussian noise during rewiring
      sigma: 0.05                      # Standard deviation of Gaussian noise for random walk
      rewiring_mode: "global"          # Rewiring strategy: "global" (any synapse), "local" (nearby), "constant_branch" (fixed per branch)
      rewire_frequency: 1              # How often to apply rewiring (every N training steps)
      synapses_per_branch: None        # Number of synapses per branch (required for 'constant_branch' mode)
      freeze_excitatory_connectivity: false  # Whether to freeze excitatory synapse locations (only update weights)
      freeze_inhibitory_connectivity: false  # Whether to freeze inhibitory synapse locations (only update weights)
      init_method: "xavier_normal"     # Weight initialization method for DEEPST connections
      weight_threshold: 1e-6           # Threshold below which weights are considered zero for pruning
  decoder_network:
    hidden_dims: [32, 16]
    activation: relu
    output_dim: 10

train:
  learning_strategy: standard # Options: "standard", "freeze_layers", "freeze_branches", "voltage_stabilization", "two_step", "two_step_kl"
  seed: 0
  train_valid_split: 0.8
  optim_dict:
    lr: 0.01  # default learning rate if split_params is false
    split_params: true  # whether to split parameters into groups (only used for EINet)
    encoder_net_lr: 0.001  # learning rate for input network
    transfer_fn_lr: 0.001  # learning rate for transfer function
    topk_lr: 0.001  # learning rate for topk layers
    blocklinear_lr: 0.001  # learning rate for blocklinear layers
    reactivation_lr: 0.001  # learning rate for reactivation layers
    decoder_lr: 0.001  # learning rate for decoder network

  weight_decay_rate: 0.1  # Standard weight decay

  # Input network training configuration
  encoder_net_trainer:
    # for all learning strategies:
    loss_function: mse
    epochs: 10
    early_stopping: false
    patience: 10
    batch_size: 128
    shuffle: true
    grad_clip_value: 5.0
    load_best_state_dict: true
    plot_losses: true
    suppress_prints: false
    print_every: 10

  main_trainer:
    # for all learning strategies:
    loss_function: ce
    epochs: 10
    early_stopping: false
    patience: 10
    batch_size: 128
    shuffle: true
    grad_clip_value: 5.0
    load_best_state_dict: true
    plot_losses: true
    suppress_prints: false
    print_every: 10
    # Performance optimization flags (disabled by default for speed)
    enable_nan_checking: false      # Enable NaN detection during training (expensive)
    enable_adaptive_clipping: false # Enable adaptive gradient clipping (expensive)
    # for learning strategies other than standard:
    pretrain_epochs: 10
    target_voltage: 0.5
    kl_weight: 0.1
    reverse_training: false
    epochs_per_layer: 10
    epochs_per_branch: 10
    final_tune_epochs: 10

task:
  dataset: cifar10 #mnist, cifar10, mnist_modulo10, random_flip_mnist
  data_path:
