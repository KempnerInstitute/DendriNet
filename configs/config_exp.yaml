model:
  task: classification
  probabilistic: false  # This is only for the final EINet model
  network:
    type: EINet #"EINet", "MLP"
    parameters:
      # configuration parameters
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [40]
      excitatory_branch_factors: [6,6]
      inhibitory_branch_factors: []
      ee_synapses_per_branch_per_layer: [100]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]
      somatic_synapses: true
      use_shunting: true
      # topk parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.2 # Added parameter for TopK noise
      topk_type: standard # Options: "standard", "stochastic", "variance"
      topk_temperature: 0.5 # Controls the stochastic selection sharpness (0.1-1.0)
      topk_ultrafast: true # Enable faster implementation for stochastic TopK
      # reactivation parameters
      reactivate: false
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh"
      # gradient scaling parameters
      reactivation_strategy: inverse # "none", "inverse"
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic # "none", "distal_upweight_by_idx", "conductance_dynamic"
      print_hooks: false # Whether to print gradient statistics in hooks
      # output parameters
      enable_branch_outputs: false   ### alows DendriNetWithOutputs to keep activations etc
      output_layer: false  ### adding an output classifier layer FC to final dendrinet layer
      output_dim: 10

      # input mode (0=original, 1=exc=x+inh=x, 2=input_net)
      input_mode: 0
      # If we set input_mode=2, the following get used for input network:
      input_net_dict:
        type: "MLPInputTransform"  # Type of input network: "MLPInputTransform", "AlexNetTransform", etc.
        hidden_dims: [] #[512, 256, 128]     # Hidden layer dimensions for better capacity
        output_dim: 128             # Output dimension for both excitatory and inhibitory pathways

train:
  run_name: exp_run
  learning_strategy: mle # Options: "mle", "freeze_layers", "local_credit_assignment", "two_step", "two_step_kl", "voltage_stabilization"
  seed: 0
  train_valid_split: 0.8
  lr: 0.01  # Standard learning rate for Adam
  epochs: 1
  batch_size: 1024  # Smaller batch size for better generalization
  grad_clip_value: 5  # Reasonable gradient clipping
  epochs_per_layer: 50  ## this is only for "freeze_layers" and any other method which has sequential single layer training
  final_tune_epochs: 10  ## Number of epochs for final fine-tuning after layer-by-layer training

  # Parameters for two_step and voltage_stabilization strategies
  warmup_epochs: 1  # or however many you want
  stability_target_voltage: 0.5  # the target "voltage"

  weight_decay_rate: 0.1  # Standard weight decay
  # Input network training configuration
  input_net_training:
    training_mode: "sequential"     # "joint" (train everything together) or "sequential" (train input_net first, then dendrinet)
    # Options for sequential training mode
    train_input_net: true    # Whether to train the input network or use pre-trained weights
    input_net_epochs: 20     # Fewer epochs needed with better training

    # Independent head training options
    train_heads_independently: false  # Whether to train excitatory and inhibitory heads independently

    # Inhibitory head training objective
    inhibitory_head_objective: "classification"  # Options: "classification", "diversity", "combined"
    diversity_weight: 0.5              # Weight for diversity loss (alpha)

    # Options for pre-trained weights (when train_input_net is false)
    pretrained_options:
      source: "file"           # "file", "pytorch", "none"
      weights_path: ""         # Path to weights file if source is "file"
      pytorch_model: ""        # Name of PyTorch model if source is "pytorch"

task:
  dataset: random_flip_mnist #mnist, cifar10, mnist_modulo10, random_flip_mnist
  data_path:
  parameters: {}
  # dataset: "line", "center_surround", "orientation_bars", "multi_xor", "mnist", "mnist_modulo10", "mnist_switch2",
            #"mnist_switch10", "info_shunting", "noise_resilience", "feature_selectivity", "context_gating",
            #"learning_dynamics", "hierarchical_processing", "cifar10"
  # parameters:
  #   train_size: 8000
  #   valid_size: 1000
  #   test_size:  1000
  #   image_size: 16   # relevant for orientation_bars
  #   n_orient_classes: 8

wandb:
  entity:
  project: "dendritic_cifar10"
  group: "debug"
  tags: [cifar10]
  use_wandb: false

visualization:
  enabled: false
  visualize_epochs: [10, 30]  # list of epochs at which to produce intermediate visualizations
  plots:
    - weights      # Plot dendritic or EI-net weights
    - activations  # Plot per-digit activation distribution
    - gradients    # Plot synapse or branch gradients
    - branch_ablation  # Enable branch-level ablation analysis
    - layer_ablation   # Enable layer-level ablation analysis
    #- profiles     # Plot dendritic compartment profiles
    #- branch_info  # mutual information

outputs:
  dir: ./outputs/
