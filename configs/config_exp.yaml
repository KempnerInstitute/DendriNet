# ============================================================================
# DENDRITIC MODELING FRAMEWORK -- COMPLETE CONFIGURATION REFERENCE
# ============================================================================
# Every parameter accepted by the framework is listed below with its default
# value and the full set of valid options.
#
# USAGE:
#   python src/dendritic_modeling/scripts/training/train_experiments.py configs/config_exp.yaml
#
#   Command-line overrides:
#   --output_dir /path    --run_name my_exp    --learning_strategy local_ca
#
# For multi-GPU / FSDP training use config_exp_fsdp.yaml.
# For parameter sweeps use sweep_config.yaml.

# ============================================================================
# EXPERIMENT SETUP
# ============================================================================
experiment:
  seed: 42                              # int: Random seed
  train_valid_split: 0.8                # float: Train/validation ratio (0.0--1.0)
  fast_mode: false                      # bool: Fast mode (reduced computation)
  deterministic: true                   # bool: Deterministic CUDA ops
  cudnn_benchmark: false                # bool: cuDNN auto-tuner benchmark
  allow_tf32: false                     # bool: Allow TF32 on Ampere+ GPUs
  float32_matmul_precision: "highest"   # str: "highest" | "high" | "medium"
  enable_profiling: false               # bool: PyTorch profiler
  profiling_output_dir: "results/profiling/"  # str: Profiler output directory
  enable_hooks: true                    # bool: Gradient hooks for analysis

  checkpointing:
    enabled: false                      # bool: Save model checkpoints
    save_every_n_epochs: 10             # int: Checkpoint frequency (positive integer)
    checkpoint_dir: "results/checkpoints/"  # str: Checkpoint directory

# ============================================================================
# DATA
# ============================================================================
data:
  # Standard vision: "cifar10" | "mnist" | "fashion_mnist" | "imagenet"
  # Synthetic vision: "poisson_generator" | "multixor" | "orientation_bars" | "orthonet" | "mnist_modulo10" | "random_flip_mnist"
  # Sequence / recurrent: "sequential_mnist" | "copy_task" | "adding_problem" | "variable_delay_dms" | "multi_frequency" | "hierarchical_temporal" | "context_dependent_decision" | "context_dependent_decision_hard" | "switching_context_decision" | "timescale_generalization"
  # Neural data: "stringer_v1"
  # Theoretical: "correlated_gaussian" | "nonlinear_interaction" | "linear_separable" | "nonlinear_separable" | "block_correlated" | "balanced_information"
  dataset_name: "cifar10"
  base_dir: ""                          # str: Override dataset root (empty = default)

  # ---------- Data processing ----------
  processing:
    flatten: true                       # bool: Flatten spatial dims to 1-D
    normalize: false                    # bool: Normalize inputs
    label_noise_rate: 0.0               # float: Fraction of training labels to randomize (0.0 = clean)

  # ---------- Dataset-specific params ----------
  dataset_params:
    mnist_modulo10:
      shuffle_iterations: 2             # int: Number of shuffle iterations
    random_flip_mnist:
      flip_probability: 0.5             # float: Probability of flipping each pixel
    poisson_generator:
      base_dataset: "mnist"             # str: Underlying dataset
      multiplicative_gain: true         # bool: Apply multiplicative gain
      fixed_gain_factor: null           # float | null: Fixed gain (null = random)
      max_gain_factor: null             # float | null: Upper bound for gain
      max_gain_tau_ratio: null          # float | null: Tau-based gain ratio
      uniform_gain: true                # bool: Uniform gain distribution
      poisson_sampling: true            # bool: Poisson spike sampling
      stimulus_duration: 1.0            # float: Stimulus duration (seconds)
    multixor:
      n_bits: 8                         # int: Number of XOR input bits
    orientation_bars:
      n_orient_classes: 8               # int: Number of orientation classes
    orthonet:
      input_dim: 784                    # int: Input dimensionality
      n_layers: 5                       # int: Number of orthogonal layers
      nonlinearity: "sigmoid"           # str: Nonlinearity type
      repeat_layers: false              # bool: Repeat layers cyclically
      noise_std: 0.1                    # float: Additive noise std
    imagenet:
      transform_preset: "legacy_resize"      # str: "legacy_resize" (compat) | "pretrained" (torchvision backbone)
      allow_fake_data: false                 # bool: Explicit fake ImageNet smoke data only
      allow_flatten_materialize: false       # bool: Opt in before flattening full ImageNet tensors
      train_samples_per_class: null     # int | null: Subsample train (null = all)
      val_samples_per_class: null       # int | null: Subsample val (null = all)

    # ---------- Sequence dataset params ----------
    sequential_mnist:
      mode: "pixel"                     # str: "pixel" | "row"
      normalize: false                  # bool: Normalize inputs
    copy_task:
      n_samples: 10000                  # int: Number of samples
      seq_len: 10                       # int: Sequence length
      delay: 10                         # int: Delay before recall
      n_symbols: 8                      # int: Number of symbols
    adding_problem:
      n_samples: 10000                  # int: Number of samples
      seq_len: 100                      # int: Sequence length
    variable_delay_dms:
      n_samples: 10000                  # int: Number of samples
      stimulus_dim: 16                  # int: Stimulus dimensionality
      stimulus_duration: 10             # int: Stimulus presentation steps
      min_delay: 5                      # int: Minimum delay steps
      max_delay: 50                     # int: Maximum delay steps
      probe_duration: 10                # int: Probe presentation steps
    context_dependent_decision:
      n_samples: 10000                  # int: Number of samples
      signal_dim: 16                    # int: Signal dimensionality
      context_duration: 10              # int: Context cue steps
      integration_duration: 30          # int: Integration window steps
      coherence_levels: [0.1, 0.2, 0.4, 0.8]  # list[float]: Coherence levels
      noise_std: 0.1                    # float: Noise standard deviation
      variable_delay: false             # bool: Variable delay between context and integration
    timescale_generalization:
      stimulus_dim: 16                  # int: Stimulus dimensionality
      stimulus_duration: 10             # int: Stimulus presentation steps
      min_delay: 5                      # int: Minimum delay steps
      max_delay: 50                     # int: Maximum delay steps
      probe_duration: 10                # int: Probe presentation steps

# ============================================================================
# MODEL
# ============================================================================
model:
  task: "classification"                # str: "classification" | "regression"

  # ---------- Encoder ----------
  encoder:
    type: "identity"                    # str: "identity" | "conv_autoencoder" | "pretrained" | "pathway_router"
    load_save_root: "./trained_encoder_networks/"  # str: Directory for trained encoders
    params:
      input_dim: null                   # int | null: Explicit input dim (null = infer)
      input_shape: [3, 32, 32]          # list[int]: [C, H, W] input shape
      encoder_hidden_dims: [128, 64]    # list[int]: Hidden dims for conv encoder
      encoder_kernel_sizes: [3, 3]      # list[int]: Kernel sizes per conv layer
      encoder_strides: [2, 2]           # list[int]: Strides per conv layer
      latent_dim: null                  # int | null: Latent space dim (null = infer)
      latent_shape: null                # list[int] | null: Latent spatial shape
      decoder_hidden_dims: [64, 128]    # list[int]: Hidden dims for conv decoder
      activation: "relu"               # str: "relu" | "gelu" | "tanh" | "sigmoid"
      router_mode: "fixed"             # str: "fixed" | "learned" | "random"
      pathway_groups: []               # list[list[int]]: Indices per pathway group
      shared_indices: []               # list[int]: Input indices shared across pathways
      n_pathways: 2                    # int: Number of pathways
      pathway_dim: null                # int | null: Per-pathway dim (null = auto)
      pathway_dims: []                 # list[int]: Explicit per-pathway dims
      router_activation: "none"        # str: "none" | "softmax" | "sigmoid"
      learned_router_temperature: 1.0  # float: Temperature for learned router
      learned_router_init_scale: 4.0   # float: Init scale for learned router

  # ---------- Core network ----------
  core:
    # Legacy EI (feedforward / recurrent-capable via core.recurrent_ei or connectivity.rec_*):
    #   "einet" | "dendritic_shunting" | "dendritic_additive" | "dendritic_normalized_additive" | "flat_shunting" | "flat_additive" | "flat_normalized_additive" | "dendritic_mlp" | "flat_mlp"
    # Unified EI (recommended): "unified_ei" | "ei_unified"
    # Recurrent unified-EI aliases:
    #   "rnn_dendritic_shunting" | "rnn_dendritic_additive" | "rnn_dendritic_normalized_additive" | "rnn_flat_shunting" | "rnn_flat_additive" | "rnn_flat_normalized_additive"
    # Baseline RNN: "gru" | "lstm" | "vanilla_rnn" | "rnn"
    # Point neuron MLP: "mlp" | "point_mlp" | "total_param_mlp" | "active_param_mlp" | "ss_mlp" | "ss_mlp_flat"
    # Spatial dendritic pretrained-replacement cores:
    #   "hierarchical_dendritic_tensor_map" | "dendritic_tensor_map" | "tensor_map"
    #       -> pretrained-replacement baseline/control: use pretrained prefix/suffix, but initialize a new dendritic core;
    #          flatten prefix tensor, run EINet, and optionally project core_dim -> flat suffix input dim
    #   "hierarchical_dendritic_conv" | "spatial_dendritic_conv"
    #       -> local spatial dendritic operator for convolutional suffixes
    # Transformer-replacement FFN: "dendritic_ffn" (dendritic MLP replacing a transformer MLP block)
    # Classical: "alexnet" | "cnn" | "cnn_down" | "cnn_up" | "identity" | "none"
    type: "einet"

    # ---- Architecture ----
    architecture:
      excitatory_layer_sizes: [20]      # list[int]: Neurons per excitatory layer
      inhibitory_layer_sizes: []        # list[int]: Neurons per inhibitory layer
      excitatory_branch_factors: [3, 3, 3, 3]  # list[int]: Branches per excitatory neuron per layer
      inhibitory_branch_factors: [1]    # list[int]: Branches per inhibitory neuron per layer
      input_projection_dims: []         # list[int]: Per-layer input projection dims (empty = none)
      inhibitory_network_type: "dendritic"  # str: "dendritic" | "mlp"
      mlp_inhibitory_network_params:    # dict: MLP inhibitory network params
        hidden_dims: [200]              # list[int]: MLP hidden layer sizes
        activation: "relu"              # str: MLP activation function

    # ---- Connectivity ----
    connectivity:
      ee_synapses_per_branch_per_layer: [40]  # list[int]: E->E synapses per branch per layer
      ei_synapses_per_branch_per_layer: [0]   # list[int]: E->I synapses per branch per layer
      ie_synapses_per_branch_per_layer: [10]  # list[int]: I->E synapses per branch per layer
      ii_synapses_per_branch_per_layer: [0]   # list[int]: I->I synapses per branch per layer
      rec_ee_synapses_per_branch: [0]   # list[int]: Recurrent E->E synapses per branch per layer
      rec_ie_synapses_per_branch: [0]   # list[int]: Recurrent I->E synapses per branch per layer
      rec_ei_synapses_per_branch: [0]   # list[int]: Recurrent E->I synapses per branch per layer
      rec_ii_synapses_per_branch: [0]   # list[int]: Recurrent I->I synapses per branch per layer
      structured:
        enabled: false                  # bool: Hard mask allowed synapse locations before TopK/DeepST
        seed: null                      # int | null: Random seed for sampled masks
        method: "bernoulli"             # str: "bernoulli" | "fixed_indegree" | "distance"
        probability: null               # float | list[float] | null: Default Bernoulli p
        indegree: null                  # int | list[int] | null: Default fixed incoming degree
        distance_kernel: "none"         # str: "none" | "gaussian" | "exponential"
        distance_sigma: 1.0             # float: Spatial kernel width for distance masks
        pathways: {}                    # dict: Optional per-pathway overrides: ee, ie, ei, ii, rec_ee, rec_ie, rec_ei, rec_ii

    # ---- Transfer function ----
    transfer:
      input_mode: 1                     # int: Input routing mode (1, 2, 3, ...)
      allow_direct_inhibitory_stream: true  # bool: Explicitly use transferred inhibitory stream without I cells
      independent_pathways: false       # bool: Independent pathway processing
      excitatory_dim: null              # int | null: Override excitatory dim
      inhibitory_dim: null              # int | null: Override inhibitory dim
      output_activation: null           # str | null: Output activation (null = none)
      inhibitory_mode: "first"          # str: "none" | "first" | "all"

    # ---- Morphology ----
    morphology:
      somatic_synapses: false           # bool: Direct somatic synapses
      use_shunting: true                # bool: Shunting inhibition
      use_additive_normalization: false  # bool: Normalize voltage in additive mode
      allow_self_recurrence: true       # bool: Allow same-neuron recurrent self-connections in translated recurrent cores
      weight_transform: "softplus"      # str: "exp" | "softplus" | "relu" | "identity"
      dbl_init_method: "analytical_expectation"  # str: "analytical_expectation" | "uniform" | "ones"

    # ---- Sparsity ----
    sparsity:
      init_method: "xavier_normal"      # str: "xavier_normal" | "kaiming_normal" | "uniform"
      noise_level: 0.0                  # float: Additive noise on init
      type: "standard"                  # str: "standard" | "stochastic" | "variance" | "deepst" | "indexed" | "indexed_dynamic" | "dense_to_sparse" (legacy "topk" -> "standard")
      weight_norm_order: null           # int | null: Weight norm order (null = off)
      gamma: 1.0                        # float: TopK gamma
      temperature: 0.0                  # float: TopK temperature (0 = hard)
      gradient_scaling: "none"          # str: "none" | "fan_in" | "fan_out"
      deepst:
        excitatory_target_density: 0.1  # float: Target sparsity for excitatory
        inhibitory_target_density: 0.1  # float: Target sparsity for inhibitory
        use_noise: true                 # bool: Noise in rewiring
        sigma: 0.05                     # float: Rewiring noise std
        rewiring_mode: "global"         # str: "global" | "local"
        rewire_frequency: 1             # int: Rewire every N epochs
        synapses_per_branch: null       # int | null: Fixed synapse budget (null = auto)
        freeze_excitatory_connectivity: false  # bool: Freeze E connectivity
        freeze_inhibitory_connectivity: false  # bool: Freeze I connectivity
        init_method: "xavier_normal"    # str: Init method for DeepST
        weight_threshold: 0.000001      # float: Minimum weight threshold

    # ---- Reactivation ----
    reactivation:
      enabled: true                     # bool: Enable reactivation function
      type: "param_tanh"                # str: "param_tanh" | "relu" | "sigmoid" | "none"
      init_policy: "occupancy_quantile"
      init_m: 1.5                       # float: Initial slope (m)
      init_b: 0.5                       # float: Initial bias (b)
      gradient_scaling: "none"          # str: "none" | "fan_in" | "fan_out"

    # ---- BlockLinear ----
    blocklinear:
      gradient_scaling: "none"          # str: "none" | "fan_in" | "fan_out"
      efficient: false                  # bool: Use memory-efficient implementation

    # ---- Implementation ----
    implementation:
      adaptive_initialization: false    # bool: Adaptive weight initialization
      adaptive_initialization_policy: "preserve_shunting_center"  # str: "preserve_shunting_center" | "legacy_scale"
      adaptive_target_conductance: 5.0   # float: Conductance budget for adaptive initialization
      print_hooks: false                # bool: Print hook debug info
      store_routing: false              # bool: Store routing (alpha) info for analysis

    # ---- Spatial (for hierarchical_dendritic_conv core type) ----
    # Used only when the pretrained replacement suffix still expects spatial input.
    # Geometry is user-specified here; it is not inferred from an arbitrary replaced block.
    spatial:
      kernel_size: 3                    # int: Receptive field size (unfold kernel)
      stride: 1                         # int: Stride for unfold
      padding: 0                        # int: Padding before unfold (set = kernel_size//2 for same-size)

    # ---- Synapse types / receptor kinetics (opt-in recurrent cores) ----
    synapse_types:
      enabled: false                    # bool: Enable receptor/conductance-style synapse mixtures
      excitatory:
        - name: "AMPA"                  # str: Synapse/receptor name
          fraction: 1.0                 # float: Mixture weight within excitatory input
          tau: null                     # float | null: Single exponential tau (legacy if null)
          tau_rise: null                # float | null: Double-exponential rise tau
          tau_decay: null               # float | null: Double-exponential decay tau
          reversal_potential: 1.0       # float: Driving-force reversal potential
          nonlinearity: "linear"        # str: "linear" | "relu" | "sigmoid" | "tanh" | "softplus"
          conductance_power: 1.0        # float: Optional conductance exponent
          magnesium_block: false        # bool: Alias for voltage_gate="nmda_magnesium"
          voltage_gate: "none"          # str: "none" | "nmda_magnesium" | "sigmoid"
          mg_concentration: 1.0         # float: NMDA magnesium concentration
          mg_scale: 3.57                # float: NMDA Mg-block scale
          mg_slope: 16.13               # float: NMDA Mg-block voltage slope
          mg_v_offset: 0.0              # float: NMDA Mg-block voltage offset
          voltage_scale_mv: 100.0       # float: Unitless branch voltage -> mV scale for voltage gates
          stp:
            enabled: false              # bool: Enable short-term plasticity gate
            u0: 0.2                     # float: Baseline utilization
            tau_u: 200.0                # float: Facilitation recovery tau
            tau_x: 700.0                # float: Depression recovery tau
            facilitation: 0.0           # float: Facilitation strength
            depression: 1.0             # float: Depression strength
            differentiable_state: false  # bool: Let BPTT flow through STP state history
      inhibitory:
        - name: "GABA_A"
          fraction: 1.0
          tau: null
          tau_rise: null
          tau_decay: null
          reversal_potential: 0.0
          nonlinearity: "linear"
          conductance_power: 1.0
          voltage_gate: "none"

    # ---- Soma dynamics (opt-in recurrent cores) ----
    dynamics:
      mode: "rate"                      # str: "rate" | "spike"; rate preserves legacy behavior
      threshold: 1.0                    # float: LIF spike threshold when mode="spike"
      reset: 0.0                        # float: LIF reset voltage
      tau: 20.0                         # float: LIF membrane tau
      refractory_steps: 0               # int: Refractory steps after spike
      surrogate_beta: 10.0              # float: Surrogate-gradient sharpness
      readout: "spikes"                 # str: "spikes" | "rate" | "membrane"
      readout_tau: 20.0                 # float: Rate-decoded spike trace tau

    # ---- Population network / named populations (core.type: population_network) ----
    population_network:
      use_transfer: false               # bool: use legacy TransferLayer before first population layer
      transfer_params: {}               # dict: input_mode, independent_pathways, output_activation, etc.
      output_mode: "last"               # str: "last" | "mean" | "all" for recurrent sequence output
      input_projection_dims: []         # list[int]: Optional input projection MLP dims
      connection_seed: null             # int | null: Default seed for probabilistic masks
      store_routing: false              # bool: Store routing metadata for compatible analyses
      layers: []                        # list[dict]: {name, recurrent, readout_population, population_defaults, populations, connections}

    # Old core.recurrent/BranchConfig payloads are deprecated and intentionally
    # omitted from this template. Use unified_ei, recurrent_ei, or baseline_rnn.

    # ---- Unified EI (dict, structure depends on architecture) ----
    unified_ei: {}                      # dict: Unified E-I architecture config payload

    # ---- Recurrent EI (dict, for EINet-family recurrent mode) ----
    recurrent_ei: {}                    # dict: Recurrent EINetwork config payload

    # ---- Baseline RNN (dict, for gru/lstm/vanilla_rnn) ----
    baseline_rnn: {}                    # dict: Baseline recurrent core config payload

  # ---------- Decoder ----------
  decoder:
    type: "MLP"                         # str: "MLP" | "linear"
    params:
      input_dim: 20                     # int: Input dim (auto-set from core output)
      hidden_dims: [16]                 # list[int]: Hidden layer dims
      activation: "relu"               # str: "relu" | "gelu" | "tanh" | "sigmoid"
      output_dim: 10                    # int: Number of output classes/dims

  # ---------- Pretrained replacement ----------
  pretrained_replacement:
    enabled: false                      # bool: Replace layers in pretrained backbone
    backbone: "alexnet"                 # str: "alexnet" | "resnet18" | "resnet50" | "vgg16" | etc.
    weights: "IMAGENET1K_V1"            # str | null: Pretrained weights identifier
    input_shape: [3, 224, 224]          # list[int]: [C, H, W] expected by backbone
    # Replacement contract:
    #   tensor_map core -> use when suffix expects flat input
    #   dendritic_conv core -> use when suffix expects spatial input
    replace:
      start: ""                         # str: First replaced layer name (inclusive)
      end: ""                           # str: Last replaced layer name (inclusive)
    omit_layers: []                     # list[str]: Layers to omit from encoder/decoder
    trainability:
      encoder:
        mode: "frozen"                  # str: "frozen" | "trainable"
      decoder:
        mode: "trainable"              # str: "frozen" | "trainable"

# ============================================================================
# TRAINING
# ============================================================================
training:

  # ---------- Encoder training ----------
  encoder:
    # Strategies: "standard" | "multi_stage" | "local_ca" | "fa" | "dfa" | "shunting_fa" | "shunting_dfa" | "recurrent" | "voltage_stabilization" | "homeostatic_control" | "freeze_layers" | "freeze_branches" | "freeze_branch_kl"
    strategy: "standard"

    common:
      epochs: 500                       # int: Training epochs
      batch_size: 512                   # int: Batch size
      num_workers: null                 # int | null: DataLoader workers (null = auto)
      pin_memory: null                  # bool | null: Pin batches when useful (null = auto)
      persistent_workers: null          # bool | null: Keep workers alive (requires num_workers > 0)
      prefetch_factor: null             # int | null: DataLoader prefetch factor (requires num_workers > 0)
      shuffle: true                     # bool: Shuffle training data
      grad_clip_value: 5.0              # float: Gradient clipping value
      loss_function: "log_mse"          # str: "ce" | "mse" | "log_mse" | "bce"
      early_stopping: true              # bool: Enable early stopping
      patience: 100                     # int: Early stopping patience (epochs)
      load_best_state_dict: true        # bool: Load best model after training
      plot_losses: false                # bool: Plot loss curves
      suppress_prints: false            # bool: Suppress training prints
      print_every: 10                   # int: Print frequency (epochs)
      use_amp: false                    # bool: Use automatic mixed precision
      lr_schedule: "none"               # str: "none" | "cosine" | "step" | "exponential"
      lr_warmup_epochs: 0               # int: LR warmup epochs
      enable_nan_checking: false        # bool: Check for NaN gradients
      enable_adaptive_clipping: false   # bool: Adaptive gradient clipping
      weight_decay_rate: 0.01           # float: Weight decay rate
      weight_boosting: false            # bool: Weight boosting
      param_groups:
        lr: 0.01                        # float: Base learning rate
        split_params: true              # bool: Split params into groups
        topk_lr: 0.001                  # float: TopK parameter LR
        blocklinear_lr: 0.0001          # float: BlockLinear parameter LR
        reactivation_lr: 0.0001         # float: Reactivation parameter LR
        decoder_lr: 0.001               # float: Decoder LR
        encoder_lr: null                # float | null: Encoder LR (null = frozen / default LR)

    strategies:
      standard: {}                      # StandardStrategyConfig (uses common config only)

      multi_stage:
        analyze_between_stages: true    # bool: Run analysis between stages
        use_best_from_each_stage: true  # bool: Use best checkpoint from each stage
        continue_on_failure: false      # bool: Continue on stage failure
        stages:                         # list[dict]: Stage definitions
          - learning_strategy: "standard"
            epochs: 100
            batch_size: 512
            save_checkpoint: false
            param_groups:
              lr: 0.01
              split_params: true
              topk_lr: 0.001
              blocklinear_lr: 0.0001
              reactivation_lr: 0.0001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: true
              patience: 500
          - learning_strategy: "local_ca"
            epochs: 100
            batch_size: 512
            reset_optimizer: false
            save_checkpoint: false
            param_groups:
              lr: 0.0001
              split_params: true
              topk_lr: 0.0001
              blocklinear_lr: 0.00001
              reactivation_lr: 0.00001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: false

      voltage_stabilization:
        pretrain_epochs: 100            # int: Pre-training epochs
        stabilize_mode: "vout"          # str: "vout" | "vinf"
        freeze_reactivation: true       # bool: Freeze reactivation during stabilization
        target_voltage: 0.5             # float: Target voltage
        loss_metric: "mse"              # str: "mse" | "mae"
        # NOTE: this is the older autograd-based warm-up trainer.
        # For the strictly local counterpart, use local_ca with
        # learning_strategy_config.rule_variant = "3f_vh" / "4f_vh" / "5f_vh".

      homeostatic_control:
        pretrain_epochs: 100            # int: Pre-training epochs
        stabilize_mode: "vinf"          # str: "vinf" | "vout"
        freeze_reactivation: false      # bool: Freeze reactivation
        target_voltage: 0.5             # float: Target voltage
        loss_metric: "mse"              # str: "mse" | "mae"

      freeze_layers:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train layers in reverse order
        epochs_per_layer: 50            # int: Epochs per layer
        final_tune_epochs: 10           # int: Final fine-tuning epochs

      freeze_branches:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train branches in reverse order
        epochs_per_branch: 50           # int: Epochs per branch
        final_tune_epochs: 10           # int: Final fine-tuning epochs

      freeze_branch_kl:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train branches in reverse order
        epochs_per_branch: 50           # int: Epochs per branch
        final_tune_epochs: 10           # int: Final fine-tuning epochs
        kl_weight: 0.1                  # float: KL divergence loss weight

    # ---- Learning strategy config (for encoder.strategy = "local_ca") ----
    # Uses the same schema as training.main.learning_strategy_config below.
    learning_strategy_config: null      # LocalRuleConfig | null

  # ---------- Main training ----------
  main:
    # Strategies: "standard" | "multi_stage" | "local_ca" | "fa" | "dfa" | "shunting_fa" | "shunting_dfa" | "recurrent" | "voltage_stabilization" | "homeostatic_control" | "freeze_layers" | "freeze_branches" | "freeze_branch_kl"
    strategy: "standard"

    common:
      epochs: 1000                      # int: Training epochs
      batch_size: 512                   # int: Batch size
      num_workers: null                 # int | null: DataLoader workers (null = auto)
      pin_memory: null                  # bool | null: Pin batches when useful (null = auto)
      persistent_workers: null          # bool | null: Keep workers alive (requires num_workers > 0)
      prefetch_factor: null             # int | null: DataLoader prefetch factor (requires num_workers > 0)
      shuffle: true                     # bool: Shuffle training data
      grad_clip_value: 2.0              # float: Gradient clipping value
      loss_function: "ce"               # str: "ce" | "mse" | "log_mse" | "bce"
      early_stopping: true              # bool: Enable early stopping
      patience: 500                     # int: Early stopping patience (epochs)
      load_best_state_dict: true        # bool: Load best model after training
      plot_losses: true                 # bool: Plot loss curves
      suppress_prints: false            # bool: Suppress training prints
      print_every: 10                   # int: Print frequency (epochs)
      use_amp: false                    # bool: Use automatic mixed precision
      lr_schedule: "none"               # str: "none" | "cosine" | "step" | "exponential"
      lr_warmup_epochs: 0               # int: LR warmup epochs
      enable_nan_checking: false        # bool: Check for NaN gradients
      enable_adaptive_clipping: false   # bool: Adaptive gradient clipping
      weight_decay_rate: 0.01           # float: Weight decay rate
      weight_boosting: false            # bool: Weight boosting
      param_groups:
        lr: 0.01                        # float: Base learning rate
        split_params: true              # bool: Split params into groups
        topk_lr: 0.001                  # float: TopK parameter LR
        blocklinear_lr: 0.0001          # float: BlockLinear parameter LR
        reactivation_lr: 0.0001         # float: Reactivation parameter LR
        decoder_lr: 0.001               # float: Decoder LR
        encoder_lr: null                # float | null: Encoder LR (null = frozen / default LR)

    optimizer:
      name: "adam"                      # str: "adam" | "sgd" | "rmsprop" | "adamw"
      lr: 0.001                         # float: Optimizer learning rate
      weight_decay: 0.0                 # float: Built-in L2 regularization (global)
      momentum: 0.9                     # float: Momentum (SGD only)
      betas: [0.9, 0.999]              # list[float]: Adam/AdamW betas
      eps: 0.00000001                   # float: Adam/AdamW epsilon

    regularization:
      l1_weight: 0.0                    # float: L1 regularization strength (0 = off)
      l2_weight: 0.0                    # float: L2 regularization strength (0 = off)
      selective:
        layers: []                      # list[int]: Layer indices (empty = all)
        branches: []                    # list[str]: Branch names (empty = all)
        weight_types: ["all"]           # list[str]: Weight types to regularize
      split_params: false               # bool: Differential regularization per param group
      param_group_weights:
        topk:
          l1_weight: 0.0               # float: TopK L1 weight
          l2_weight: 0.0               # float: TopK L2 weight
        blocklinear:
          l1_weight: 0.0               # float: BlockLinear L1 weight
          l2_weight: 0.0               # float: BlockLinear L2 weight
        reactivation:
          l1_weight: 0.0               # float: Reactivation L1 weight
          l2_weight: 0.0               # float: Reactivation L2 weight
        decoder:
          l1_weight: 0.0               # float: Decoder L1 weight
          l2_weight: 0.0               # float: Decoder L2 weight
      enforce_ei_weight_ratio: false    # bool: Enable E/I weight ratio regularization
      target_ei_weight_ratio: 0.5       # float: Target E/I weight ratio
      ei_ratio_loss_weight: 0.5         # float: E/I ratio regularization strength
      ei_ratio_scope: "per_branch"      # str: "per_branch" | "per_layer" | "global"
      ei_ratio_metric: "mean"           # str: "mean" | "median" | "rms"

    pruning:
      enabled: false                    # bool: Enable pruning
      threshold: 2                      # float: Prune weights with abs < threshold
      selective:
        layers: []                      # list[int]: Layer indices (empty = all)
        branches: []                    # list[str]: Branch names (empty = all)
        weight_types: ["excitatory", "inhibitory"]  # list[str]: Weight types to prune
      re_evaluate_after: false          # bool: Re-evaluate after pruning
      dynamic_pruning: false            # bool: Prune during training
      pruning_frequency: 10             # int: Epochs between dynamic pruning
      report_non_pruned: true           # bool: Report non-pruned synapse count
      save_pruning_stats: false         # bool: Save pruning statistics
      detailed_branch_report: true      # bool: Detailed per-branch pruning report
      redo_analysis_after_pruning: false  # bool: Redo analyses after pruning

    strategies:
      standard: {}                      # StandardStrategyConfig (uses common config only)

      multi_stage:
        analyze_between_stages: true    # bool: Run analysis between stages
        use_best_from_each_stage: true  # bool: Use best checkpoint from each stage
        continue_on_failure: false      # bool: Continue on stage failure
        stages:                         # list[dict]: Stage definitions
          - learning_strategy: "standard"
            epochs: 100
            batch_size: 512
            save_checkpoint: false
            param_groups:
              lr: 0.01
              split_params: true
              topk_lr: 0.001
              blocklinear_lr: 0.0001
              reactivation_lr: 0.0001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: true
              patience: 500
          - learning_strategy: "local_ca"
            epochs: 100
            batch_size: 512
            reset_optimizer: false
            save_checkpoint: false
            param_groups:
              lr: 0.0001
              split_params: true
              topk_lr: 0.0001
              blocklinear_lr: 0.00001
              reactivation_lr: 0.00001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: false

      voltage_stabilization:
        pretrain_epochs: 100            # int: Pre-training epochs
        stabilize_mode: "vout"          # str: "vout" | "vinf"
        freeze_reactivation: true       # bool: Freeze reactivation
        target_voltage: 0.5             # float: Target voltage
        loss_metric: "mse"              # str: "mse" | "mae"

      homeostatic_control:
        pretrain_epochs: 100            # int: Pre-training epochs
        stabilize_mode: "vinf"          # str: "vinf" | "vout"
        freeze_reactivation: false      # bool: Freeze reactivation
        target_voltage: 0.5             # float: Target voltage
        loss_metric: "mse"              # str: "mse" | "mae"

      recurrent:
        grad_clip: 1.0                  # float: Recurrent gradient norm clip (0 = off)
        use_amp: false                  # bool: Recurrent mixed precision
        lr_schedule: "none"             # str: "none" | "cosine"
        lr_warmup_epochs: 0             # int: Warmup epochs for recurrent LR schedule

      freeze_layers:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train layers in reverse
        epochs_per_layer: 50            # int: Epochs per layer
        final_tune_epochs: 10           # int: Final fine-tuning epochs

      freeze_branches:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train branches in reverse
        epochs_per_branch: 50           # int: Epochs per branch
        final_tune_epochs: 10           # int: Final fine-tuning epochs

      freeze_branch_kl:
        pretrain_epochs: 10             # int: Pre-training epochs
        reverse_training: false         # bool: Train branches in reverse
        epochs_per_branch: 50           # int: Epochs per branch
        final_tune_epochs: 10           # int: Final fine-tuning epochs
        kl_weight: 0.1                  # float: KL divergence weight

    # ---- Learning strategy config (for local_ca rules) ----
    learning_strategy_config:
      rule_variant: "3f"                # str: "3f" | "4f" | "5f" | "stdp" | "3f_vh" | "4f_vh" | "5f_vh"
      error_mode: "auto"               # str: "auto" | "mse" | "ce" | "bce"
      error_broadcast_mode: "scalar"    # str: "scalar" | "per_soma" | "local_mismatch" | "low_rank" | "path_transport" | "pathway_vector"
      error_noise_sigma: 0.0           # float: Additive Gaussian noise on broadcast error (0 = off)
      broadcast_rank: 4                 # int: Rank for low-rank vectorized broadcast
      broadcast_init_scale: 1.0         # float: Scale for low-rank random broadcast
      pathway_broadcast_residual: 0.25  # float: Blend with direct local error
      pathway_activity_gate_strength: 1.0  # float: Modulate by local pathway activity
      broadcast_bandwidth: "full"       # str: "full" | "sign_only" | "quantized" | "sparse_topk"
      broadcast_bits: 8                 # int: Quantization bits (2, 4, 8); for bandwidth="quantized"
      broadcast_topk_fraction: 0.3      # float: Fraction to keep; for "sparse_topk"

      three_factor:
        dynamics_mode: "auto"           # str: "auto" | "conductance" | "additive"
        use_conductance_scaling: true   # bool: Scale by R_tot = 1/g_tot
        use_driving_force: true         # bool: Use (E_rev - V_n) driving force
        theta: 0.0                      # float: Leak reversal potential
        e_rev_exc: 1.0                  # float: Excitatory reversal potential
        e_rev_inh: 0.0                  # float: Inhibitory reversal (shunting)
        additive_gain_mode: "none"      # str: "none" | "input_dependent" | "running_stats" | "learned_gain"
        additive_stats_ema_alpha: 0.01  # float: EMA rate for running_stats mode

      four_factor:
        rho_mode: "pearson"             # str: "pearson" | "dot" | "none"
        rho_estimator: "ema"            # str: "ema" | "augment" | "ema+augment"
        ema_alpha: 0.05                 # float: EMA smoothing rate
        layer_wise_rho_scale: 1.0       # float: rho / sqrt(layer_depth)
        augment_k: 8                    # int: Number of augmented samples
        augment_noise_sigma: 0.01       # float: Augmentation noise level

      five_factor:
        phi_mode: "conditional"         # str: "conditional" | "variance"
        phi_estimator: "conditional_ema"  # str: "conditional_ema" | "variance_ema"
        phi_ridge_lambda: 0.001         # float: Ridge regularization
        layer_wise_phi_scale: 1.0       # float: phi / sqrt(layer_depth)
        rls_forgetting: 0.99            # float: RLS forgetting factor
        phi_clamp_min: 0.25             # float: Stability clamp min
        phi_clamp_max: 4.0              # float: Stability clamp max

      morphology_aware:
        use_path_propagation: false     # bool: Path-integrated propagation
        path_factor_mode: "per_branch"  # str: "per_branch" | "scalar_mean"
        morphology_modulator_mode: "none"  # str: "none" | "depth" | "centrality"
        morphology_depth_offset: 1.0    # float: Alpha parameter for depth modulation
        morphology_centrality_metric: "betweenness"  # str: Centrality metric
        use_dendritic_normalization: false  # bool: Normalize by sum of conductances
        use_branch_type_rules: false    # bool: Apical vs basal differentiation
        apical_branch_scale: 1.0        # float: Scale for apical branches
        basal_branch_scale: 1.0         # float: Scale for basal branches
        use_branch_length_modulation: false  # bool: Branch length modulation
        use_branch_role_rules: false    # bool: Router-derived branch roles
        branch_role_source: "router_pathways"  # str: Branch role source
        specialized_branch_scale: 1.0   # float: Specialized branch scale
        mixed_branch_scale: 1.0         # float: Mixed branch scale
        branch_role_power: 1.0          # float: Branch role power
        branch_role_alignment_weight: 0.0  # float: Alignment weight

      hsic:
        enabled: false                  # bool: Enable HSIC
        weight: 0.0                     # float: HSIC loss weight
        self_weight: 1.0                # float: Self-decorrelation weight
        target_weight: 1.0              # float: Target-correlation weight
        target_source: "labels"         # str: "labels" | "logits"
        kernel: "linear"                # str: "linear" | "rbf" | "polynomial"
        sigma: 1.0                      # float: RBF bandwidth
        degree: 2                       # int: Polynomial degree
        coef0: 1.0                      # float: Polynomial coefficient
        grad_clip_value: 0.0            # float: HSIC gradient clip (0 = off)
        warmup_epochs: 0                # int: HSIC warmup epochs
        apply_last_layer_only: false    # bool: HSIC last layer only

      stdp:
        enabled: false                  # bool: Enable trace-based STDP as auxiliary rule; auto true for rule_variant="stdp"
        apply_to: ["exc", "rec_exc"]    # list[str]: "exc" | "inh" | "rec_exc" | "rec_inh"
        activity_mode: "relu"           # str: "relu" | "identity" | "binary" | "abs"
        pre_threshold: 0.0              # float: Presynaptic activity threshold
        post_threshold: 0.0             # float: Postsynaptic activity threshold
        tau_pre: 20.0                   # float: Presynaptic trace tau
        tau_post: 20.0                  # float: Postsynaptic trace tau
        a_plus: 1.0                     # float: Potentiation scale
        a_minus: 0.5                    # float: Depression scale
        learning_rate_scale: 1.0        # float: Multiplier on optimizer LR for STDP update
        inhibitory_update_sign: -1.0    # float: Sign multiplier for inhibitory pathways
        use_error_modulation: false     # bool: Modulate STDP by broadcast task error
        error_modulation_mode: "scalar_abs"  # str: "scalar_abs" | "scalar_signed"
        clamp_update: 0.0               # float: Absolute update clamp (0 = off)
        detach_traces: true             # bool: Detach local traces from autograd graph

      inhibitory_homeostasis:
        enabled: false                  # bool: Enable inhibitory homeostasis
        mode: "r_tot"                   # str: "r_tot" | "voltage"
        weight: 0.0                     # float: Homeostasis loss weight
        target_r_tot: 0.35              # float: Target total resistance
        target_voltage: 0.15            # float: Target voltage

      voltage_homeostasis:
        enabled: false                  # bool: Enable strictly local voltage-centering
        weight: 0.0                     # float: Local voltage-homeostasis weight
        target_voltage: 0.5             # float: Midpoint target voltage
        # NOTE: *_vh rule aliases auto-enable this block with a conservative
        # default (weight=0.02, target_voltage=0.5) unless you override it here.

      gate_homeostasis:
        enabled: false                  # bool: Enable local gate-occupancy auxiliary update
        center_weight: 0.0              # float: Weight for mean gate occupancy target
        saturation_weight: 0.0          # float: Weight for saturation-control target
        target_mean: 0.5                # float: Desired mean reactivation gate value
        target_saturation: 0.2          # float: Desired fraction of saturated gates
        low_threshold: 0.1              # float: Low gate threshold for saturation metric
        high_threshold: 0.9             # float: High gate threshold for saturation metric
        saturation_slope: 20.0          # float: Smooth saturation indicator slope

      update_inactive_weights: false    # bool: Update inactive weights
      update_reactivation: true         # bool: Update reactivation params
      explicit_inhibitory_update_mode: "local_ca"  # str: "local_ca" | "freeze" for explicit I-cell dendrites
      encoder_update_mode: "none"       # str: "backprop" | "none"
      decoder_update_mode: "backprop"   # str: "backprop" | "local" | "none"
      freeze_encoder_epochs: 0          # int: Freeze encoder for N epochs
      freeze_reactivation_epochs: 0     # int: Freeze reactivation for N epochs
      freeze_decoder_epochs: 0          # int: Freeze decoder for N epochs
      training_schedule: null           # list | null: Custom training schedule
      clip_grad_value: 5.0              # float: Gradient clipping value
      normalize_by_batch: true          # bool: Normalize updates by batch size

# ============================================================================
# ANALYSIS
# ============================================================================
analysis:
  # Shared dataset-iteration policy for all analysis modules.
  # Recommended defaults:
  #   auto        -> best default; small datasets behave like the old path
  #                  because they stay materialized, large datasets stream.
  #   materialize -> closest match to the old exact single-GPU path; hook-based
  #                  analyses use one full batch when dataset slicing is supported.
  #   stream      -> safest choice for large datasets such as ImageNet.
  # Models may be moved temporarily to the requested analysis device, but the
  # original device and train/eval mode are restored automatically afterward.
  runtime:
    training:
      mode: "auto"                      # str: "auto" | "materialize" | "stream"
      batch_size: 256                   # int: Analysis batch size
      num_workers: 4                    # int: DataLoader workers
      pin_memory: true                  # bool: Pin memory for GPU transfer (auto-disabled on CPU analysis)
      max_batches: null                 # int | null: Optional cheap/training-time cap (null = all batches)
      max_samples: null                 # int | null: Hard cap for expensive analyses that still accumulate CPU tensors
      materialize_threshold_mb: 1024    # int: Auto-mode threshold (MB); keeps small single-GPU datasets materialized
    final:
      mode: "auto"                      # str: "auto" | "materialize" | "stream"
      batch_size: 256                   # int: Analysis batch size
      num_workers: 4                    # int: DataLoader workers
      pin_memory: true                  # bool: Pin memory for GPU transfer (auto-disabled on CPU analysis)
      max_batches: null                 # int | null: Optional cap (usually leave null for final analysis)
      max_samples: null                 # int | null: Use when heavy analyses must inspect only a bounded subset
      materialize_threshold_mb: 1024    # int: Auto-mode threshold (MB); use materialize for exact old small-dataset behavior

  # ---------- Performance ----------
  performance:
    enabled: true                       # bool: Enable performance analysis
    training: false                     # bool: Run during training
    params:
      accuracy: true                    # bool: Compute accuracy
      auc: true                         # bool: Compute AUC
      categorical_loglikelihood: true   # bool: Compute categorical log-likelihood
      mse: false                        # bool: Compute MSE
      cosine_similarity: false          # bool: Compute cosine similarity
    training_splits: ["train", "valid", "test"]  # list[str]: Splits to evaluate during training analysis
    final_splits: ["train", "valid", "test"]     # list[str]: Splits to evaluate during final analysis

  # ---------- Information ----------
  information:
    enabled: true                       # bool: Enable information analysis
    training: false                     # bool: Run during training
    params:
      # -- New grouped structure (preferred) --
      selection:
        components: []                  # list[str]: "basic" | "pairwise" | "conditional" | "gaussian_fisher" | "pid" | "ablation_aligned" | "layer_proxies" | "upstream_unique_cmi"
        scopes: []                      # list[str]: "layer" | "einet" | "neuron"
        signal_variants: []             # list[str]: "network" | "lda" | "random"
        views: []                       # list[str]: Deprecated alias for scopes
      compute:
        max_samples: null               # int | null: Limit samples (null = all)
        include_vinf: true              # bool: Include soma activation
        normalize_mi: false             # bool: Normalize by H(C)
        output_units: "bits"            # str: "bits" | "nats"
        verbose: false                  # bool: Verbose output
        computation_level: "single_branch"  # str: "single_branch" | "layer_branch" | "all_branch"
        branch_aggregation: "mean"      # str: "mean" | "multivariate" | "sample"
        layer_total_topk: 10            # int: K for topK_sum metrics
        gaussian_fisher:
          aggregation: "sum"            # str: "sum" | "mean" | "max"
          mi_transform: "half_log1p"    # str: "half_log1p" | "log1p" | "none"
          eps: 0.00000001               # float: Numerical epsilon
          ridge: null                   # float | null: Ridge parameter (null = use eps)
        per_neuron_analysis: false      # bool: (deprecated) Per-neuron MI
        per_einet_analysis: false       # bool: (deprecated) Per-EI-net MI
        per_layer_analysis: false       # bool: (deprecated) Per-layer MI
        compute_lda_weights: false      # bool: (deprecated) Compute LDA variants
      estimator:
        method: "kraskov"               # str: "kraskov" | "decoder" | "binned" | "sklearn" | "copula" | "auto"
        kraskov:
          n_neighbors: 10               # int: Number of KSG neighbors
        binned:
          n_bins: 20                    # int: Number of bins
          binning_strategy: "quantile"  # str: "quantile" | "uniform"
          bias_correction: "none"       # str: "none" | "miller_madow"
        decoder:
          cv_folds: 5                   # int: Cross-validation folds
          C: 1.0                        # float: Regularization parameter
          standardize: true             # bool: Standardize features
          seed: 0                       # int: Random seed
          continuous:
            strategy: "none"            # str: "none" | "binned" | "gaussian"
            max_total_dim: 2            # int: Max total dim for continuous MI/CMI
            gaussian_ridge: 0.000001    # float: Covariance ridge
        copula:
          type: "gaussian"              # str: "gaussian" | "kernel" | "dvc"
        sklearn:
          n_bins: 20                    # int: Number of bins
          bandwidth: null               # float | null: KDE bandwidth (null = auto)
      baselines:
        random_weights:
          n_shuffles: 0                 # int: Number of random-weight shuffles (0 = off)
          seed: 0                       # int: Random seed
        label_shuffle_null:
          n_shuffles: 0                 # int: Number of label permutations (0 = off)
          seed: 0                       # int: Random seed
          components: ["basic"]         # list[str]: "basic" | "pairwise" | "conditional" | "ablation_aligned" | "layer_proxies" | "upstream_unique_cmi" | "all"
      pid:
        binarize: true                  # bool: Binarize for PID
        binarize_method: "median"       # str: "median" | "mean" | "quantile"
        binarize_threshold: 0.5         # float: Binarization threshold

      # -- Legacy flat keys (deprecated) --
      method: "kraskov"                 # str: (deprecated) -> estimator.method
      max_samples: null                 # int | null: (deprecated) -> compute.max_samples
      n_neighbors: 10                   # int: (deprecated) -> estimator.kraskov.n_neighbors
      n_bins: 20                        # int: (deprecated) -> estimator.binned.n_bins
      copula_type: "gaussian"           # str: (deprecated) -> estimator.copula.type
      decoder_cv_folds: 5              # int: (deprecated) -> estimator.decoder.cv_folds
      decoder_C: 1.0                   # float: (deprecated) -> estimator.decoder.C
      decoder_standardize: true        # bool: (deprecated) -> estimator.decoder.standardize
      decoder_seed: 0                  # int: (deprecated) -> estimator.decoder.seed
      decoder_continuous_strategy: "none"  # str: (deprecated) -> estimator.decoder.continuous.strategy
      decoder_continuous_max_total_dim: 2  # int: (deprecated) -> estimator.decoder.continuous.max_total_dim
      decoder_gaussian_ridge: 0.000001  # float: (deprecated) -> estimator.decoder.continuous.gaussian_ridge
      binning_strategy: "quantile"     # str: (deprecated) -> estimator.binned.binning_strategy
      binning_bias_correction: "none"  # str: (deprecated) -> estimator.binned.bias_correction
      mi_null_shuffles: 0              # int: (deprecated) -> baselines.label_shuffle_null.n_shuffles
      mi_null_seed: 0                  # int: (deprecated) -> baselines.label_shuffle_null.seed
      compute_basic_mi: true           # bool: (deprecated) -> selection.components
      compute_pairwise_mi: true        # bool: (deprecated) -> selection.components
      compute_conditional_mi: true     # bool: (deprecated) -> selection.components
      components: []                   # list[str]: (deprecated) -> selection.components
      compute_ablation_aligned_mi: true  # bool: (deprecated) -> selection.components
      compute_upstream_unique_cmi: false  # bool: (deprecated) -> selection.components
      compute_layer_total_proxies: true  # bool: (deprecated) -> selection.components
      layer_total_topk: 10             # int: (deprecated) -> compute.layer_total_topk
      scopes: []                       # list[str]: (deprecated) -> selection.scopes
      views: []                        # list[str]: (deprecated) -> selection.scopes
      pid_binarize: true               # bool: (deprecated) -> pid.binarize
      pid_binarize_method: "median"    # str: (deprecated) -> pid.binarize_method
      pid_binarize_threshold: 0.5      # float: (deprecated) -> pid.binarize_threshold
      include_vinf: true               # bool: (deprecated) -> compute.include_vinf
      normalize_mi: false              # bool: (deprecated) -> compute.normalize_mi
      verbose: false                   # bool: (deprecated) -> compute.verbose
      computation_level: "single_branch"  # str: (deprecated) -> compute.computation_level
      branch_aggregation: "mean"       # str: (deprecated) -> compute.branch_aggregation
      per_neuron_analysis: false       # bool: (deprecated) -> selection.scopes
      per_einet_analysis: false        # bool: (deprecated) -> selection.scopes
      per_layer_analysis: false        # bool: (deprecated) -> selection.scopes
      compute_lda_weights: false       # bool: (deprecated) -> selection.signal_variants
      signal_variants: []              # list[str]: (deprecated) -> selection.signal_variants
      lda_n_shuffles: 0               # int: (deprecated) -> baselines.random_weights.n_shuffles

  # ---------- Correlation ----------
  correlation:
    enabled: false                      # bool: Enable correlation analysis
    training: false                     # bool: Run during training
    params:
      # -- New grouped structure (preferred) --
      selection:
        components: []                  # list[str]: "total" | "noise" | "signal" | "tuning"
        pairs: []                       # list[str]: "EE" | "II" | "EI" | "E_output" | "I_output" | "output_output"
        scopes: []                      # list[str]: "layer" | "einet" | "neuron"
      compute:
        computation_level: "layer_branch"  # str: "synaptic" | "single_branch" | "layer_branch" | "all_branch"
        max_samples: 5000               # int | null: Limit samples
        batch_process: true             # bool: Batch processing for memory
        per_layer_analysis: true        # bool: Per-layer breakdown
        per_einet_analysis: true        # bool: Per-EI-net breakdown
        per_neuron_analysis: false      # bool: Per-neuron breakdown
      sampling:
        n_synapse_pairs: 10000          # int: Synapse pairs to sample (synaptic level)
        sampling_strategy: "stratified" # str: "random" | "stratified" | "importance"
        stratified_categories: ["within_branch", "within_layer", "across_layer"]  # list[str]
        max_pairs_per_category: 1000    # int: Max pairs per stratified category
      # -- Legacy flat keys (deprecated) --
      computation_level: "layer_branch" # str: (deprecated) -> compute.computation_level
      components: []                    # list[str]: (deprecated) -> selection.components
      pairs: []                         # list[str]: (deprecated) -> selection.pairs
      scopes: []                        # list[str]: (deprecated) -> selection.scopes
      compute_noise_correlations: true  # bool: (deprecated) Within-class correlations
      compute_signal_correlations: true # bool: (deprecated) Between-class correlations
      compute_total_correlations: true  # bool: (deprecated) All-data correlations
      compute_tuning_curves: true       # bool: (deprecated) Class selectivity
      analyze_EE: true                  # bool: (deprecated) E-E correlations
      analyze_II: true                  # bool: (deprecated) I-I correlations
      analyze_EI: true                  # bool: (deprecated) E-I correlations
      analyze_E_output: true            # bool: (deprecated) E-output correlations
      analyze_I_output: true            # bool: (deprecated) I-output correlations
      analyze_output_output: true       # bool: (deprecated) Output-output correlations
      per_layer_analysis: true          # bool: (deprecated) -> compute.per_layer_analysis
      per_einet_analysis: true          # bool: (deprecated) -> compute.per_einet_analysis
      per_neuron_analysis: false        # bool: (deprecated) -> compute.per_neuron_analysis
      n_synapse_pairs: 10000            # int: (deprecated) -> sampling.n_synapse_pairs
      sampling_strategy: "stratified"   # str: (deprecated) -> sampling.sampling_strategy
      stratified_categories: ["within_branch", "within_layer", "across_layer"]
      max_pairs_per_category: 1000      # int: (deprecated) -> sampling.max_pairs_per_category
      max_samples: 5000                 # int | null: (deprecated) -> compute.max_samples
      batch_process: true               # bool: (deprecated) -> compute.batch_process

  # ---------- Ablation ----------
  ablation:
    enabled: false                      # bool: Enable ablation analysis
    training: false                     # bool: Run during training
    params:
      selection:
        levels: []                      # list[str]: "layer" | "compartment"
        targets: []                     # list[str]: "all_synapses" | "excitation" | "inhibition" | "upstream"
        metrics: []                     # list[str]: "accuracy" | "auc" | "categorical_loglikelihood" | "mse" | "cosine_similarity" | "pred_label_mi_bits"
      methods:
        ablation_methods: ["lesion"]    # list[str]: "lesion" | "shuffle" | "mean_clamp"
        shuffle_seed: 0                 # int: Seed for shuffle ablation
        clamp_statistic: "mean"         # str: "mean" | "median"

  # ---------- Synapse turnover ----------
  synapse_turnover:
    enabled: false                      # bool: Enable synapse turnover analysis
    training: false                     # bool: Run during training
    params:
      snapshot_interval: 1              # int: Snapshot frequency (epochs)
      synaptic_analysis: true           # bool: Compute connectivity summaries
      save_synaptic_report: true        # bool: Write report to disk

  # ---------- Noise perturbation ----------
  noise_perturbation:
    enabled: false                      # bool: Enable noise perturbation analysis
    training: false                     # bool: Run during training
    params:
      uniform_noise: true               # bool: Uniform noise sweeps
      uniform_magnitudes: [0.1, 0.2]    # list[float]: Uniform noise magnitudes
      gaussian_noise: true              # bool: Gaussian noise sweeps
      gaussian_sdevs: [0.1, 0.2]       # list[float]: Gaussian noise std devs
      n_samples: 10                     # int: Noisy replicates per setting
      accuracy: true                    # bool: Compute accuracy
      auc: true                         # bool: Compute AUC
      categorical_loglikelihood: true   # bool: Compute categorical log-likelihood
      mse: true                         # bool: Compute MSE
      cosine_similarity: true           # bool: Compute cosine similarity

  # ---------- Adversarial robustness ----------
  adversarial_robustness:
    enabled: false                      # bool: Enable adversarial robustness (FGSM)
    training: false                     # bool: Run during training
    params:
      epsilons: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3]  # list[float]: FGSM epsilon values
      batch_size: 256                   # int: Evaluation batch size

  # ---------- Weight analysis ----------
  weight:
    enabled: false                      # bool: Enable weight analysis
    training: false                     # bool: Run during training
    params:
      synapse_weights: true             # bool: Analyze synapse weights
      branch_weights: true              # bool: Analyze branch-to-output weights
      computation_level: "single_branch"  # str: "single_branch" | "layer_branch" | "all_branch"
      branch_aggregation: "mean"        # str: "mean" | "multivariate" | "sample"
      per_layer_analysis: true          # bool: Per-layer breakdown
      per_einet_analysis: true          # bool: Per-EI-net breakdown
      per_neuron_analysis: false        # bool: Per-neuron breakdown (expensive)
      analyze_excitatory: true          # bool: Analyze E weights
      analyze_inhibitory: true          # bool: Analyze I weights
      analyze_branch_output: true       # bool: Analyze branch-to-output weights
      compute_mean: true                # bool: Compute mean weights
      compute_variance: true            # bool: Compute weight variance
      compute_percentiles: true         # bool: Compute percentiles
      compute_min_max: true             # bool: Compute min/max
      compute_dendritic_strength: true  # bool: Compute total dendritic strength
      weight_threshold: 0.000001        # float: Minimum active weight

  # ---------- Compartment statistics ----------
  compartment_statistics:
    enabled: false                      # bool: Enable compartment statistics
    training: false                     # bool: Run during training
    params:
      synapse_weights: true             # bool: Analyze synapse weights
      branch_weights: true              # bool: Analyze branch weights
      inputs: true                      # bool: Analyze inputs
      activations: true                 # bool: Analyze activations
      global_analysis: true             # bool: Global-level statistics
      layer_analysis: true              # bool: Layer-level statistics
      branch_analysis: true             # bool: Branch-level statistics
      compute_mean: true                # bool: Compute mean
      compute_variance: true            # bool: Compute variance
      compute_percentiles: true         # bool: Compute percentiles
      compute_min_max: true             # bool: Compute min/max
      compute_entropy: true             # bool: Compute entropy
      per_class_analysis: false         # bool: Per-class statistics
      n_samples: null                   # int | null: Limit samples (null = all)

  # ---------- Compartment SNR ----------
  compartment_snr:
    enabled: false                      # bool: Enable compartment SNR analysis
    training: false                     # bool: Run during training
    params:
      input_analysis: true              # bool: Input-level statistics
      global_analysis: true             # bool: Global statistics
      layer_analysis: true              # bool: Layer statistics
      branch_analysis: true             # bool: Branch statistics
      global_aggregation: true          # bool: Aggregate global statistics
      layer_aggregation: true           # bool: Aggregate layer statistics
      branch_aggregation: true          # bool: Aggregate branch statistics
      epsilon: 0.000001                 # float: Numerical epsilon

  # ---------- Multiplicative gain ----------
  multiplicative_gain:
    enabled: false                      # bool: Enable multiplicative gain analysis
    training: false                     # bool: Run during training
    params:
      uniform_gain: true                # bool: Uniform gain sweep
      gain_min: 0.0                     # float: Minimum gain
      gain_max: 10.0                    # float: Maximum gain
      n_steps: 10                       # int: Number of gain steps
      logspace: false                   # bool: Log-spaced gain values
      accuracy: false                   # bool: Compute accuracy
      auc: false                        # bool: Compute AUC
      categorical_loglikelihood: false  # bool: Compute categorical log-likelihood
      mse: false                        # bool: Compute MSE
      cosine_similarity: false          # bool: Compute cosine similarity

  # ---------- Receptive field ----------
  receptive_field:
    enabled: false                      # bool: Enable receptive field visualization
    training: false                     # bool: Run during training
    params:
      n_rows: 2                         # int: Grid rows for plotting
      n_cols: 2                         # int: Grid columns for plotting
      rf_shape: null                    # list[int] | null: Shared RF shape [H, W]
      exc_rf_shape: null                # list[int] | null: Excitatory RF shape [H, W]
      inh_rf_shape: null                # list[int] | null: Inhibitory RF shape [H, W]
      fig_save_format: png              # str: Figure extension, e.g. png or pdf
      compute_activation_tuning: false  # bool: Class-tuning summaries from branch activations
      save_raw_data: true               # bool: Save raw RF tensor checkpoint
      load_raw_data: false              # bool: Reuse raw RF checkpoint if present
      raw_filename: null                # str | null: Override raw RF checkpoint filename
      epsilon: 0.00000001               # float: Numerical epsilon for tuning ratios

  # ---------- Single-layer contribution ----------
  single_layer_contribution:
    enabled: false                      # bool: Enable single-layer contribution analysis
    training: false                     # bool: Run during training
    params:
      excitation_contribution: true     # bool: Excitation-only contribution
      inhibition_contribution: true     # bool: Inhibition-only contribution
      both_contribution: true           # bool: Combined E+I contribution
      accuracy: true                    # bool: Compute accuracy
      auc: true                         # bool: Compute AUC
      categorical_loglikelihood: true   # bool: Compute categorical log-likelihood
      mse: true                         # bool: Compute MSE
      cosine_similarity: true           # bool: Compute cosine similarity

  # ---------- Synaptic activation ----------
  synaptic_activation:
    enabled: false                      # bool: Enable synaptic activation analysis
    training: false                     # bool: Run during training
    params:
      network_summary: true             # bool: Network-level summary
      layer_summary: true               # bool: Layer-level summary
      branch_summary: true              # bool: Branch-level summary
      raw_summary: true                 # bool: Raw activation summary
      logspace: false                   # bool: Log-space reporting
      downsample: true                  # bool: Downsample activations
      samples: 5                        # int: Samples to keep

  # ---------- Branch activation ----------
  branch_activation:
    enabled: false                      # bool: Enable branch activation analysis
    training: false                     # bool: Run during training
    params:
      synapse_activations: true         # bool: Log synapse activations
      branch_activations: true          # bool: Log branch activations
      network_summary: true             # bool: Network-level summary
      layer_summary: true               # bool: Layer-level summary
      branch_summary: true              # bool: Branch-level summary
      raw_summary: true                 # bool: Raw activation summary
      logspace: false                   # bool: Log-space reporting
      downsample: true                  # bool: Downsample activations
      samples: 5                        # int: Samples to keep

  # ---------- Local rule components ----------
  local_rule_components:
    enabled: false                      # bool: Enable LocalCA component-factor logging
    training: false                     # bool: Run during training for epoch trajectories
    params:
      max_samples: 1024                 # int | null: Examples per snapshot
      include_dendritic: true           # bool: Include branch-to-parent conductance terms
      include_broadcast: true           # bool: Log scalar/per-soma broadcast-error proxy
      broadcast_mode: "scalar"          # str: "scalar" | "per_soma"
      error_mode: "auto"                # str: "auto" | "ce" | "mse" | "none"
      e_rev_exc: 1.0                    # float: Excitatory reversal for driving force
      e_rev_inh: 0.0                    # float: Inhibitory reversal for driving force
      save_json: true                   # bool: Save per-snapshot JSON
      save_csv: true                    # bool: Save per-snapshot CSV
      append_training_csv: true         # bool: Append training snapshots to trajectory.csv

  # ---------- Spike train ----------
  spike_train:
    enabled: false                      # bool: Enable LIF spike-train analysis
    training: false                     # bool: Run during training for epoch trajectories
    params:
      dt: 1.0                           # float: Time per recurrent step for rate reporting
      threshold: 0.5                    # float: Binarization threshold for recorded spike outputs
      max_samples: 512                  # int | null: Cap examples used for analysis
      include_raster: true              # bool: Include compact raster event lists
      max_raster_samples: 8             # int: Number of examples to include in raster events
      include_per_timestep_rate: true   # bool: Include population firing-rate traces over time

  # ---------- Routing ----------
  routing:
    enabled: false                      # bool: Enable routing analysis (recurrent models only)
    training: false                     # bool: Run during training

# ============================================================================
# WEIGHTS & BIASES
# ============================================================================
wandb:
  use_wandb: false                      # bool: Enable W&B logging
  entity: ""                            # str: W&B entity (team/user)
  project: "dendritic-sweeps"           # str: W&B project name
  group: "unified_sweep"                # str: W&B run group
  tags: ["debug"]                       # list[str]: W&B tags

# ============================================================================
# OUTPUTS
# ============================================================================
outputs:
  run_name: "ei_sweep"                  # str: Experiment run name
  results_dir: "results"                # str: Results output directory

# ============================================================================
# DISTRIBUTED TRAINING
# Node/GPU counts are controlled by SLURM (--nodes, --gpus-per-node) or by
# the launcher CLI argument, NOT by this config.
# ============================================================================
distributed:
  # "none" = single GPU, "ddp" = DistributedDataParallel, "fsdp" = FullyShardedDataParallel
  # For ddp/fsdp, launch via torchrun or SLURM srun; node/GPU counts are set by
  # the launcher (--nproc_per_node, --nodes), NOT by this config.
  mode: "none"                          # str: "none" | "ddp" | "fsdp"

  # DDP has no configurable parameters in this framework -- just set mode: "ddp"
  # and PyTorch handles the rest (gradient sync, broadcast, etc.).

  # FSDP settings (only used when mode = "fsdp")
  fsdp:
    # FULL_SHARD: shard params + grads + optimizer across all ranks (lowest memory)
    # SHARD_GRAD_OP: shard grads + optimizer only (faster, more memory)
    # NO_SHARD: no sharding (equivalent to DDP)
    # HYBRID_SHARD: shard within node, replicate across nodes (multi-node sweet spot)
    sharding_strategy: "FULL_SHARD"       # str: "FULL_SHARD" | "SHARD_GRAD_OP" | "NO_SHARD" | "HYBRID_SHARD"
    mixed_precision: true                 # bool: FSDP mixed precision (BF16 compute, FP32 reduce)
    cpu_offload: false                    # bool: Offload params to CPU (saves GPU memory, slower)
    min_num_params: 1000000               # int: Min params to shard a module
    reduce_communication_overhead: true   # bool: Reduce communication overhead
    limit_all_gathers: true              # bool: Limit concurrent all-gathers
    forward_prefetch: true                # bool: Prefetch next FSDP unit in forward
    sync_module_states: true              # bool: Sync module states on init (broadcast rank 0)
    use_orig_params: true                 # bool: Use original param references (needed for param groups)
    backward_prefetch: "BACKWARD_PRE"     # str: "BACKWARD_PRE" | "BACKWARD_POST"
    gradient_checkpointing: false         # bool: Activation checkpointing (trade compute for memory)
