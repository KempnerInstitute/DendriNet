wandb:
  entity:
  project: "dendritic_cifar10"
  group: "debug"
  tags: [cifar10]
  use_wandb: false

visualization:
  enabled: false
  visualize_epochs: [10, 30]  # list of epochs at which to produce intermediate visualizations
  plots:
    - weights      # Plot dendritic or EI-net weights
    - activations  # Plot per-digit activation distribution
    - gradients    # Plot synapse or branch gradients
    - branch_ablation  # Enable branch-level ablation analysis
    - layer_ablation   # Enable layer-level ablation analysis
    #- profiles     # Plot dendritic compartment profiles
    #- branch_info  # mutual information

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
  ei_info_analysis:
    enabled: false  # Whether to enable EI mutual information analysis
    training: false  # Whether to enable EI mutual information analysis during training
    params:
      compute_mi_E_I: true
      compute_mi_EI_Vout: true
      compute_sr_EI_Vout: true
      compute_mi_EI_label: true
      n_neighbors: 10
  synapse_turnover_analysis:
    enabled: false  # Whether to enable synapse turnover analysis
    training: false  # Whether to enable synapse turnover analysis during training
  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      categorical_loglikelihood: true
  ablation_analysis:
    enabled: false
    training: false
    params:
      ablate_synapses: true
      ablate_inhibition: true
      ablate_branches: true
      accuracy: true
      categorical_loglikelihood: true
  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  # Single layer contribution analysis (formerly layer_ablation)
  # Isolates each layer to test what it can achieve on its own
  single_layer_contribution:
    enabled: true  # whether to enable single layer contribution analysis
    training: false  # Whether to run during training
    params:
      save_plots: true
      save_csv: true

  # Synaptic ablation analysis (formerly branch_ablation)
  # Removes specific synapses while keeping the rest of the network intact
  synaptic_ablation:
    enabled: false  # Whether to enable synaptic ablation analysis
    training: false  # Whether to run during training
    params:
      ablation_type: "whole_layer"  # Options: "whole_layer" or "single_branch"
      layers_to_analyze: []  # Empty list means analyze all layers, or specify [0, 1, 2]
      mode: "direct"  # Options: "direct" (zero weights) or "full"
      save_plots: true
      save_csv: true

  # Branch information analysis
  # Computes mutual information between branch components (E, I, V, C)
  branch_information:
    enabled: false  # Whether to enable branch information analysis
    training: false  # Whether to run during training
    params:
      n_neighbors: 10  # Number of neighbors for MI estimation
      use_dvc: false  # Whether to use DVC_tensorflow copula entropy (if false, uses sklearn)
      save_plots: true
      save_csv: true
      compute_metrics:
        - "I_E_C"    # I(E;C) - Excitatory inputs and class
        - "I_I_C"    # I(I;C) - Inhibitory inputs and class
        - "I_V_C"    # I(V;C) - Branch outputs and class
        - "I_E_I"    # I(E;I) - Excitatory and inhibitory inputs
        - "I_E_V"    # I(E;V) - Excitatory inputs and branch outputs
        - "I_I_V"    # I(I;V) - Inhibitory inputs and branch outputs
        - "I_E_I_given_C"      # E-I interactions given class
        - "I_E_V_given_C"      # E-V interactions given class
        - "I_I_V_given_C"      # I-V interactions given class
      # If compute_metrics is omitted, all 9 metrics are computed by default

      # Copula parameters for DVC_tensorflow
      copula_params:
        cases: 1000         # Number of samples for entropy estimation
        iterations: 10      # Number of iterations for convergence
        alpha: 0.05         # Confidence level
        vine_type: c-vine   # Type of vine copula: "d-vine", "c-vine", "r-vine"
        families: kercop    # Copula families to use
        knots: 30           # Number of knots for non-parametric copula
outputs:
  dir: ./outputs/
