model:
  task: classification
  probabilistic: True
  network:
    type: "EINet"
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24,24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1,1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: "xavier_normal" #"kaiming_normal"
      use_shunting: true

      init_gain: 1.0
      init_inhib_offset: 3
      reactivation_initial_m: 1.2
      reactivation_initial_b: 1.0

      gradient_strategy: "distal_upweight" #"none", "distal_upweight", "distal_upweight_by_idx", "freeze_layer" , "uniform_scale"
      gradient_scale_factor: 2

      weight_decay_rate: 0.1

      local_learning: "none" #"none", "backprop_alignment"
      local_loss_weight: 2 #0.5

train:
  run_name: "mnist_einet"
  seed: 42
  train_valid_split: 0.8
  lr: 0.01
  epochs: 50
  batch_size: 500
  grad_clip_value: 5
  weight_decay: 0.0  # for the built-in Adam L2, typically set 0 if we use custom
  epochs_per_layer: 50 ### this is for when we use "freeze_layer for gradient_strategy"

task:
  dataset: "mnist"
  parameters: {}

wandb:
  entity: houman_safaai-harvard-university 
  project: "dendritic_mnist_new_config"
  group: "debug"
  tags: [mnist_1]

settings:
  visualizations: False

analysis:
  enable_ablation: true
  enable_mutual_info: false


# Explanation of the Methods:
# 	1.	Vanilla Backprop
# → The original code had no gradient manipulation: gradient_strategy: "none".
# 	2.	Uniform Gradient Scaling
# → Multiplies each layer’s gradient by a constant gradient_scale_factor. 
# 	3.	Distal Upweight
# → A new approach: if we have multiple dendritic branch layers, the code can multiply gradient more strongly at distal layers that typically lose signal. 
# 	4.	Freeze-Layers
# → A brand‐new method I introduced: train each dendritic layer in sequence, freezing the others, to ensure it sees a strong error signal.
# 	5.	Local Learning Rules

# 	6.	Initialization Tweaks
# → New parameters init_gain (multiplier for Xavier/Kaiming) and init_inhib_offset (log‐space shift for inhibitory weights). These help keep the network from saturating the denominator of the shunting formula right from the start.
# 	7.	Reactivation Scaling
# → we can set reactivation_initial_m and reactivation_initial_b so that the tanh layer does not saturate at the beginning.
# 	8.	Weight Decay
# → Now read from YAML (train.weight_decay). Tied to the built‐in PyTorch optimizer or CustomWeightDecayOptimizer.


# 1.	model.network.parameters.gradient_strategy
# "none", "uniform_scale", "distal_upweight", or "freeze_layers"
# 	2.	model.network.parameters.gradient_scale_factor
# A float, e.g. 1.0
# 	3.	model.network.parameters.weight_decay_rate
# A float for custom weight decay in the network, e.g. 0.05
# 	4.	model.network.parameters.local_learning
# "none" or "backprop_alignment"
# 	5.	model.network.parameters.local_loss_weight
# A float, e.g. 0.5
# 	6.	model.network.parameters.init_gain
# A float for weight initialization scale, e.g. 1.0
# 	7.	model.network.parameters.init_inhib_offset
# A float for inhibitory offset in log space, e.g. -0.5
# 	8.	analysis.enable_ablation
# Boolean; if true, ablate after training
# 	9.	analysis.enable_mutual_info
# Boolean; if true, compute layerwise MI
# 	10.	train.*
# Standard fields (epochs, batch_size, lr, etc.)