model:
  task: classification #classification or einet_nll
  probabilistic: True
  network:
    type: "EINet"
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [512]
      inhibitory_layer_sizes: [200]
      excitatory_branch_factors: [64]
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: xavier_normal
      use_shunting: true

      init_gain: 1.0
      init_inhib_offset: 1.3
      reactivation_initial_m: 2
      reactivation_initial_b: 0.5

      reactivation_type: param_tanh_only_m  # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh"
      train_reactivation_b_only: false

      gradient_strategy: block_conductance_dynamic  #"none", "distal_upweight_by_idx", "block_conductance_dynamic"
      gradient_scale_factor: 2

      weight_decay_rate: 0.1

      enable_branch_outputs: true

      output_layer: bool = true
      output_dim: int = 10

train:
  learning_strategy: "two_step_kl" #"mle", "freeze_layers", "local_credit_assignment", "two_step", "two_step_kl"
  run_name: "mnist_einet"
  seed: 0
  train_valid_split: 0.8
  lr: 0.01
  epochs: 50
  batch_size: 128
  grad_clip_value: 5
  epochs_per_layer: 50  ## this is only for "freeze_layers" and any other method which has sequential single layer training
  pretrain_epochs: 10   ## for "two_step"
  maintrain_epochs: 50  ## for "two_step"
  visualize_epochs: [1, 10, 50]  # list of epochs at which to produce intermediate visualizations

task:
  dataset: "mnist"
  parameters: {}
  
  # dataset: "orientation_bars"   # or "mnist", "line", "center_surround", etc.
  # parameters:
  #   train_size: 8000
  #   valid_size: 1000
  #   test_size:  1000
  #   image_size: 16   # relevant for orientation_bars
  #   n_orient_classes: 8

wandb:
  entity: ## wandb entity
  project: "dendritic_mnist_test"
  group: "debug"
  tags: [mnist_1]
  use_wandb: true

visualization:
  enabled: true
  save_path: # output path for plots
  plots:
    - "weights"      # Plot dendritic or EI-net weights
    - "activations"  # Plot per-digit activation distribution
    - "gradients"    # Plot synapse or branch gradients
    - "branch_info"  # mutual information
    - "ablation"     # ablation


#    plot_eposhs: [10 200]]

# python scripts/train_experiments.py .vscode/config_exp.yaml


# Explanation of the Methods:
#  1. Vanilla Backprop -> gradient_strategy: "none"
#  2. Uniform Gradient Scaling -> "uniform_scale"
#  3. Distal Upweight -> "distal_upweight" or "distal_upweight_by_idx"
#  4. Freeze-Layers -> "freeze_layer"
#  5. (Removed local learning)
#  6. Initialization Tweaks -> init_gain, init_inhib_offset, etc.
#  7. Reactivation Scaling -> reactivation_initial_m, reactivation_initial_b, reactivation_type
#  8. 'visualization' block -> if 'enabled', will produce certain plots