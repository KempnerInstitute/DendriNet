model:
  task: classification
  probabilistic: true  # This is only for the final EINet model
  network:
    type: EINet #"EINet", "MLP"
    parameters:
      excitatory_layer_sizes: [10] 
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [2,2] 
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [2]
      ii_synapses_per_branch_per_layer: [0]
      topk_init_method: xavier_normal

      use_shunting: true
      
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh"
      reactivation_strategy: inverse # "none", "inverse"
      blocklinear_strategy: block_conductance_dynamic # "none", "distal_upweight_by_idx", "block_conductance_dynamic"
      
      enable_branch_outputs: false   ### alows DendriNetWithOutputs to keep activations etc
      output_layer: false  ### adding an output classifier layer FC to final dendrinet layer
      output_dim: 10
      
      # input mode (0=original, 1=exc=x+inh=x, 2=input_net)
      input_mode: 0
      # If we set input_mode=2, the following get used for input network:
      input_net_dict:
        type: "MLPInputTransform"  # Type of input network: "MLPInputTransform", "AlexNetTransform", etc.
        hidden_dims: [] #[512, 256, 128]     # Hidden layer dimensions for better capacity
        output_dim: 128             # Output dimension for both excitatory and inhibitory pathways
        
train:
  learning_strategy: mle # Options: "mle", "freeze_layers", "local_credit_assignment", "two_step", "two_step_kl", "voltage_stabilization"
  run_name: mnist_einet
  seed: 0 
  train_valid_split: 0.8
  lr: 0.01  # Standard learning rate for Adam
  epochs: 50
  batch_size: 1024  # Smaller batch size for better generalization
  grad_clip_value: 5  # Reasonable gradient clipping
  epochs_per_layer: 50  ## this is only for "freeze_layers" and any other method which has sequential single layer training
  pretrain_epochs: 10   ## For "two_step" and warmup phase of "voltage_stabilization"
  
  # Voltage stabilization parameters
  target_voltage: 0.5   # Target voltage for voltage stabilization warm-up (default 0.5)
  
  weight_decay_rate: 0.1  # Standard weight decay
  
  # Input network training configuration
  input_net_training:
    training_mode: "sequential"     # "joint" (train everything together) or "sequential" (train input_net first, then dendrinet)
    # Options for sequential training mode
    train_input_net: true    # Whether to train the input network or use pre-trained weights
    input_net_epochs: 20     # Fewer epochs needed with better training
    
    # Independent head training options
    train_heads_independently: false  # Whether to train excitatory and inhibitory heads independently
    
    # Inhibitory head training objective
    inhibitory_head_objective: "classification"  # Options: "classification", "diversity", "combined"
    diversity_weight: 0.5              # Weight for diversity loss (alpha)

    # Options for pre-trained weights (when train_input_net is false)
    pretrained_options:
      source: "file"           # "file", "pytorch", "none"
      weights_path: ""         # Path to weights file if source is "file"
      pytorch_model: ""        # Name of PyTorch model if source is "pytorch"
      
task:
  dataset: mnist #mnist, cifar10
  data_path: 
