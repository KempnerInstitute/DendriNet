model:
  task: classification  # classification or regression
  probabilistic: True
  network:
    type: "EINet" # EINet, or FeedForward
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24, 24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1, 1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: xavier_normal 
      use_shunting: true

      init_gain: 1.0
      init_inhib_offset: 1.3
      reactivation_initial_m: 2
      reactivation_initial_b: 0.5

      reactivation_type: param_tanh  # "none", "param_tanh", "relu", "sigmoid", "tanh"
      train_reactivation_b_only: true  # if true, freeze m, train only b

      gradient_strategy: none #"none", "distal_upweight", "distal_upweight_by_idx", "freeze_layer" , "uniform_scale"
      gradient_scale_factor: 1

      weight_decay_rate: 0.1

      local_learning: none #"none", "backprop_alignment"
      local_loss_weight: 0 #0.5

train:
  run_name: "mnist_einet"
  seed: 0
  train_valid_split: 0.8
  lr: 0.01
  epochs: 50
  batch_size: 1000
  grad_clip_value: 5
  weight_decay: 0.0  # for the built-in Adam L2, typically set 0 if we use custom
  epochs_per_layer: 50 ### this is for when we use "freeze_layer" for gradient_strategy

  two_step_training: false  # true or false
  pretrain_epochs: 5
  maintrain_epochs: 45

task:
  dataset: "mnist"
  parameters: {}

wandb:
  entity: houman_safaai-harvard-university
  project: "dendritic_mnist_new_config"
  group: "debug"
  tags: [mnist_1]

settings:
  visualizations: False

analysis:
  enable_ablation: true
  enable_mutual_info: false



# 1. model.network.parameters.gradient_strategy 
#    # "none", "uniform_scale", "distal_upweight", "freeze_layers"
# 2. model.network.parameters.gradient_scale_factor 
#    # A float, e.g. 1.0
# 3. model.network.parameters.weight_decay_rate 
#    # A float, e.g. 0.05
# 4. model.network.parameters.local_learning 
#    # "none" or "backprop_alignment"
# 5. model.network.parameters.local_loss_weight 
#    # A float, e.g. 0.5
# 6. model.network.parameters.init_gain 
#    # A float for weight initialization scale, e.g. 1.0
# 7. model.network.parameters.init_inhib_offset 
#    # A float, e.g. -0.5
# 8. analysis.enable_ablation 
#    # Boolean
# 9. analysis.enable_mutual_info 
#    # Boolean
# 10. train.*
#    # Standard (epochs, batch_size, lr, etc.)
# 11. reactivation_type
#    # "none", "param_tanh", "relu", "sigmoid", "tanh"
# 12. train.two_step_training
#    # If true, do a separate pretrain (pretrain_epochs) + main (maintrain_epochs).
#    # If false, just do normal training for "epochs".