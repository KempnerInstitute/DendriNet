model:
  task: classification
  probabilistic: True
  network: 
    type: "EINet"
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [2,2,10,10]
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24,24,24,24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1,1,1,1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: "xavier_normal"
      use_shunting: true

      # NEW or EXTENDED:
      init_gain: 1.0             # global scale factor in initialization
      init_inhib_offset: 0.0     # offset in log space for inhibitory vs. excit.

      reactivation_initial_m: 1.5 # sets initial log_m or something
      reactivation_initial_b: 1.0 # sets initial log_b

      gradient_strategy: "none"  # "none", "uniform_scale", "distal_upweight", "freeze_layers"
      gradient_scale_factor: 1.0 # if "uniform_scale" or "distal_upweight"

      weight_decay_rate: 0.1    # how strongly we do the custom weight decay
train:
  run_name: "mnist_einet"
  seed: 42
  train_valid_split: 0.8
  lr: 0.01
  epochs: 100
  batch_size: 500
  grad_clip_value: 0.5


task:
  dataset: "mnist"
  parameters: {}
    # train_size: 8192
    # valid_size: 512
    # test_size: 512
    # image_size: 10
    # seed: 0


wandb:
  entity: houman_safaai-harvard-university # <---- Add your entity
  project: dendritic_mnist_sweep
  group: debug
  tags: [mnist_1]

settings:
  visualizations: False



# Explanation of the Methods:
# 	1.	Vanilla Backprop
# → The original code had no gradient manipulation: gradient_strategy: "none".
# 	2.	Uniform Gradient Scaling
# → Multiplies each layer’s gradient by a constant gradient_scale_factor. This partially existed in your code as scale_layer_gradients; we’ve extended it so you can toggle the factor from config.
# 	3.	Distal Upweight
# → A new approach: if you have multiple dendritic branch layers, the code can multiply gradient more strongly at distal layers that typically lose signal. (Implementation example: “scale factor depends on layer depth.”)
# 	4.	Freeze-Layers
# → A brand‐new method we introduced: train each dendritic layer in sequence, freezing the others, to ensure it sees a strong error signal.
# 	5.	Local Learning Rules
# → In theory, you can define partial local objectives. We included partial scaffolding (scale_layer_gradients hooks). A full local‐learning approach is not yet fully implemented, but can be toggled by a config field if you eventually code it.
# 	6.	Initialization Tweaks
# → New parameters init_gain (multiplier for Xavier/Kaiming) and init_inhib_offset (log‐space shift for inhibitory weights). These help keep the network from saturating the denominator of the shunting formula right from the start.
# 	7.	Reactivation Scaling
# → You can set reactivation_initial_m and reactivation_initial_b so that the tanh layer does not saturate at the beginning.
# 	8.	Weight Decay
# → Now read from YAML (train.weight_decay). Tied to the built‐in PyTorch optimizer or your CustomWeightDecayOptimizer.
