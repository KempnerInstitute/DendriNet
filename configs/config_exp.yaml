# config.yaml

model:
  task: classification
  probabilistic: False
  network:
    type: "einet"
    parameters:
      input_dim: 784
      excitatory_layer_sizes: [10]
      inhibitory_layer_sizes: [20]
      excitatory_branch_factors: [1,2,2]
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1]
      ii_synapses_per_branch_per_layer: []
      topk_init_method: "xavier_normal"
      use_shunting: true

train:
  train_valid_split: 0.8
  lr: 0.01
  epochs: 100
  batch_size: 500
  grad_clip_value: 1
  weight_decay: 0.0

task:
  dataset: "mnist"   # or "mnist", "center_surround", etc.
  parameters: {}
    # train_size: 8000
    # valid_size: 1000
    # test_size: 1000
    # seed: 10

wandb:
  entity: houman_safaai-harvard-university  # <---- Add your entity
  project: "dendritic_modeling_new"
  group: "debug"
  tags: ["mnist_1"]

settings:
  visualizations: False