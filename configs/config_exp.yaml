wandb:
  use_wandb: false                      # Enable W&B logging (true/false)
  entity: ""                            # W&B entity/team (string)
  project: "dendritic-sweeps"           # W&B project (string)
  group: "unified_sweep"                # W&B group (string)
  tags: ["debug"]                       # W&B tags (list of strings)
  enabled: true                         # Enable W&B features (true/false)

# ============================================================================
# OUTPUTS
# ============================================================================
outputs:
  run_name: "ei_sweep"                  # Experiment name (string)
  results_dir: "outputs"                # Results directory (string)

# ============================================================================
# DISTRIBUTED / FSDP
# ============================================================================
fsdp:
  use_fsdp: false                       # Enable FSDP (true/false)
  sharding_strategy: "FULL_SHARD"       # "FULL_SHARD", "SHARD_GRAD_OP", "NO_SHARD", "HYBRID_SHARD"
  mixed_precision: true                 # Mixed precision (true/false)
  cpu_offload: false                    # CPU offload (true/false)
  min_num_params: 1000000               # Min params for FSDP wrapping (positive int)
  reduce_communication_overhead: true   # (true/false)
  limit_all_gathers: true              # (true/false)
  forward_prefetch: true               # (true/false)
  sync_module_states: true             # (true/false)
  use_orig_params: true                # (true/false)
  backward_prefetch: "BACKWARD_PRE"    # "BACKWARD_PRE", "BACKWARD_POST", null
  gradient_checkpointing: false        # (true/false)
