wandb:
  entity:
  project: "dendritic_cifar10"
  group: "debug"
  tags: [cifar10]
  use_wandb: false

visualization:
  enabled: false
  visualize_epochs: [10, 30]  # list of epochs at which to produce intermediate visualizations
  plots:
    - weights      # Plot dendritic or EI-net weights
    - activations  # Plot per-digit activation distribution
    - gradients    # Plot synapse or branch gradients
    - branch_ablation  # Enable branch-level ablation analysis
    - layer_ablation   # Enable layer-level ablation analysis
    #- profiles     # Plot dendritic compartment profiles

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false

  synapse_turnover_analysis:
    enabled: true  # Whether to enable synapse turnover analysis
    training: true  # Whether to enable synapse turnover analysis during training
    snapshot_interval: 5  # frequency of snapshots (from iss294)
    synaptic_analysis: true        # Enable synaptic connectivity analysis (from iss294)
    save_synaptic_report: true     # Save synaptic analysis to file (from iss294)
  noise_perturbation_analysis:
    enabled: true
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true                        # Added from iss294
      categorical_loglikelihood: true
      mse: false                       # Added from iss294  
      cosine_similarity: false         # Added from iss294
  ablation_analysis:
    enabled: true
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true                        # Added from iss294
      categorical_loglikelihood: true
      mse: true                        # Added from iss294
      cosine_similarity: true          # Added from iss294
  weight_analysis:
    enabled: true
    training: false
    params:
      synapse_weights: true
      branch_weights: true
  synaptic_activation_analysis:
    enabled: true
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2
  branch_activation_analysis:
    enabled: true
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2

  # Single layer contribution analysis (formerly layer_ablation)
  # Isolates each layer to test what it can achieve on its own
  single_layer_contribution:
    enabled: false  # whether to enable single layer contribution analysis
    training: false  # Whether to run during training
    params:
      save_plots: true
      save_csv: true

  # NEW: Integrated information-theoretic analysis using multivariate methods
  information_analysis:
    enabled: true
    training: false
    params:
      # Estimation method for mutual information computation
      method: "kraskov"  # Use kraskov (k-NN) for better accuracy
      
      # Maximum number of samples to use (for faster computation)
      max_samples: null  # Use all samples for better accuracy
      
      # Method-specific parameters
      n_neighbors: 10       # For Kraskov k-NN estimator (higher = more accurate but slower)
      n_bins: 20           # For sklearn histogram method (more bins = finer resolution)
      copula_type: "gaussian"  # For copula method: "gaussian", "t", "clayton", "frank"
      
      # Which information metrics to compute
      compute_basic_mi: true       # Basic MI: I(E;C), I(I;C), I(Vout;C), I(Vinf;C), I(E,I;C)
      compute_pairwise_mi: true    # ENABLED - Pairwise MI: I(E;I), I(E;Vout), I(I;Vout), I(E;Vinf), I(I;Vinf), I(Vout;Vinf)
      compute_conditional_mi: false # Keep disabled for speed - Conditional MI: I(E;I|C), I(E;Vout|C), I(I;Vout|C), I(E;Vinf|C), I(I;Vinf|C)
      compute_pid: false           # Partial Information Decomposition (requires external library)
      
      # PID-specific options (only used if compute_pid is true)
      pid_binarize: true          # Whether to binarize data for PID computation
      pid_binarize_method: "median" # Binarization method: "median", "mean", "quantile"
      pid_binarize_threshold: 0.5  # Threshold for quantile method
      
      # Additional options
      include_vinf: true     # Include soma activation (Vinf) in analysis
      normalize_mi: false    # Normalize MI values by entropy H(C)
      verbose: false        # Print detailed progress during computation

      # Enhanced Information Analysis Configuration
      computation_level: layer_branch   # Options: "single_branch", "layer_branch", "all_branch"
      branch_aggregation: mean           # Options: "mean", "multivariate", "sample"
      
      # Enhanced analysis modes
      per_neuron_analysis: false   # Compute MI for each neuron individually  
      per_einet_analysis: false    # Analyze E and I networks separately
      per_layer_analysis: false    # Compute enhanced analysis per layer

outputs:
  run_name: exp_run
  dir: 
