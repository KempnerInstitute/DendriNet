
model:
  task: classification  # Options: "classification", "regression"

  encoder_network:
    type: identity # MLPAutoencoder, CNNAutoencoder, MLPVariationalAutoencoder, CNNVariationalAutoencoder, identity, none
    parameters:
      input_shape: [3, 32, 32]
      latent_shape: [16, 8, 8]  # (channels, height, width) for latent representation
      encoder_hidden_dims: [64]
      decoder_hidden_dims: [64]
      activation: relu

  core_network:
    type: EINet #"EINet", "MLP"
    parameters:
      # transfer function parameters
      transfer_params:
        input_mode: 0
        independent_pathways: false
        excitatory_dim: []
        inhibitory_dim: []
        output_activation: none  # Options: sigmoid, relu, tanh, softplus, none (constrains transfer outputs)
        
      # configuration parameters
      excitatory_layer_sizes: [10,10,10]
      inhibitory_layer_sizes: [10,10,10]
      excitatory_branch_factors: [5, 5, 5]  # This is correct - represents branches per neuron
      inhibitory_branch_factors: [5, 5, 5]
      ee_synapses_per_branch_per_layer: [5]
      ei_synapses_per_branch_per_layer: [5]  # Changed from 200 to 20 (less than 40 inhibitory neurons)
      ie_synapses_per_branch_per_layer: [2]
      ii_synapses_per_branch_per_layer: [2]   # Changed from 0 to 5 (must be positive)
      somatic_synapses: true
      use_shunting: true
      # topk parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0 # Added parameter for TopK noise
      topk_type: standard # Options: "standard", "stochastic", "variance", "deepst"
      topk_temperature: 0.5 # Controls the stochastic selection sharpness (0.1-1.0)
      topk_ultrafast: true # Enable faster implementation for stochastic TopK
      # reactivation parameters
      reactivate: true
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh", "param_linear_sigmoid"
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      # gradient scaling parameters
      reactivation_strategy: inverse # "none", "inverse"
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic # "none", "distal_upweight_by_idx", "conductance_dynamic"
      efficient_blocklinear: true  # Whether to use efficient blocklinear implementation
      adaptive_initialization: true  # Use network-aware weight scaling to prevent NaN in large architectures
      print_hooks: false # Whether to print gradient statistics in hooks
      # DEEPST specific parameters
      excitatory_target_density: 0.1   # Target density for excitatory connections (fraction of active synapses)
      inhibitory_target_density: 0.1   # Target density for inhibitory connections (fraction of active synapses)
      use_noise: true                  # Whether to apply Gaussian noise during rewiring
      noise_std: 0.01                  # Standard deviation of Gaussian noise
      rewiring_frequency: 10           # How often to perform rewiring (every N epochs)
      use_momentum: true               # Whether to use momentum in rewiring decisions
      momentum_factor: 0.9             # Momentum factor for rewiring (0.0-1.0)
      use_batch_norm: false            # Whether to use batch normalization in layers
      use_dropout: false               # Whether to use dropout in layers
      dropout_rate: 0.1                # Dropout rate (if use_dropout is true)
      use_weight_decay: true           # Whether to apply weight decay to connections
      weight_decay_factor: 0.0001      # Weight decay factor for connections
      use_activity_regularization: false # Whether to use activity regularization
      activity_reg_factor: 0.01        # Activity regularization factor
      use_connection_pruning: false    # Whether to prune weak connections
      pruning_threshold: 0.01          # Threshold for connection pruning
      use_homeostasis: false           # Whether to use homeostatic mechanisms
      homeostasis_target: 0.1          # Target activity level for homeostasis
      homeostasis_rate: 0.001          # Learning rate for homeostatic adaptation
  decoder_network:
    type: MLP # Options: "MLP", "CNN", "none"
    parameters:
      hidden_dims: [32, 16]
      activation: relu
      output_dim: 10
      
train:
  seed: 0
  train_valid_split: 0.8

  # Encoder (input network) training configuration
  encoder:
    load_save_root: saved_models/encoder
    lr: 0.001
    trainer:
      # for all learning strategies:
      loss_function: mse
      epochs: 50
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
  
  # Main network training configuration
  main:
    learning_strategy: standard  # Options: "standard", "freeze_layers", "freeze_branches", "voltage_stabilization", "two_step", "two_step_kl"
    weight_decay_rate: 0.1

    param_groups:
      lr: 0.01  # default learning rate if split_params is false
      split_params: true  # whether to split parameters into groups (only used for EINet)
      topk_lr: 0.001  # learning rate for topk layers (transfer_fn_lr merged)
      blocklinear_lr: 0.001  # learning rate for blocklinear layers
      reactivation_lr: 0.001  # learning rate for reactivation layers
      decoder_lr: 0.001  # learning rate for decoder network

    trainer:
      # for all learning strategies:
      loss_function: cat_nll
      epochs: 500
      early_stopping: false
      patience: 10
      batch_size: 500
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
      # for learning strategies other than standard:
      pretrain_epochs: 10
      target_voltage: 0.5
      kl_weight: 0.1
      reverse_training: false
      epochs_per_layer: 10
      epochs_per_branch: 10
      final_tune_epochs: 10

