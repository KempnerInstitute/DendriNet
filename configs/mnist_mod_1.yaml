model:
  input_dim: 1568
  excitatory_layer_sizes: [10]
  inhibitory_layer_sizes: [20]
  excitatory_branch_factors: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]
  inhibitory_branch_factors: []
  reactivate: true
  somatic_synapses: true
  ee_synapses_per_branch_per_layer: [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100]
  ei_synapses_per_branch_per_layer: [100]
  ie_synapses_per_branch_per_layer: [2]
  ii_synapses_per_branch_per_layer: []
  topk_init_method: "xavier_uniform"
  initialization_mode: "default"  #  "default" #Options: "scaled" or "default"
  gradient_scale: false

train:
  train_valid_split: 0.8
  lr: 0.01
  epochs: 100
  batch_size: 1024
  grad_clip_value: 0.5

wandb:
  entity: houman_safaai-harvard-university # <---- Add your entity
  project: dendritic_modeling_pr
  group: debug
  tags: [mnist_1]

