# Visual Properties Configuration
# This file defines templates for biologically-inspired visual neurons

retina_dog:
  weight_template: "center_surround"
  params:
    cell_type: "on-center"
    center_size: 5
    surround_size: 11
  stimulus:
    type: "white_noise"
    params:
      size: 64
      std: 0.1
  criterion:
    metric: "dog_r2"
    threshold: 0.7

V1_OSI:
  weight_template: "gabor"
  params:
    orientation: 45
    wavelength: 8
    sigma: 3.0
  stimulus:
    type: "grating"
    params:
      size: 64
      spatial_frequency: 0.125
      orientations: [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180]
  criterion:
    metric: "osi"
    threshold: 0.4

V1_DSI:
  weight_template: "gabor"
  params:
    orientation: 0
    wavelength: 8
    sigma: 3.0
  stimulus:
    type: "moving_bar"
    params:
      size: 64
      bar_width: 4
      directions: [0, 45, 90, 135, 180, 225, 270, 315]
      n_frames: 10
  criterion:
    metric: "dsi"
    threshold: 0.0

V1_endstop:
  weight_template: "end_stopped"
  params:
    preferred_length: 20
    orientation: 90
  stimulus:
    type: "length_sweep_bars"
    params:
      size: 64
      bar_width: 4
      lengths: [4, 8, 12, 16, 20, 24, 28, 32, 40, 48]
      orientation: 90
  criterion:
    metric: "lsi"
    threshold: 0.0 