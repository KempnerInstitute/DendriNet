# Total parameters: 34.38B (fits on 2 nodes with 8 H100 GPUs)
# Memory per GPU: 38.68 GB (48% utilization)

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
    
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 2048  # Reduced transfer function output
        inhibitory_dim: 2048  # Reduced transfer function output
      
      # Single layer with many neurons but reasonable for 2 nodes
      excitatory_layer_sizes: [4096]   # Reduced from 8192
      inhibitory_layer_sizes: [0]      # No inhibitory neurons
      
      # Deep dendritic tree - 4 levels
      excitatory_branch_factors: [4, 4, 2, 2]  # 64 branches per neuron (reduced from 128)
      inhibitory_branch_factors: []
      
      # Reasonable synapses per branch
      ee_synapses_per_branch_per_layer: [32]    # Further reduced
      ei_synapses_per_branch_per_layer: []      # No inhibitory neurons
      ie_synapses_per_branch_per_layer: [32]    # Further reduced
      ii_synapses_per_branch_per_layer: []      # No inhibitory neurons
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      topk_strategy: conductance_dynamic
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: inverse
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
      
      # DEEPST parameters (if using topk_type: deepst)
      excitatory_target_density: 0.1
      inhibitory_target_density: 0.1
      use_noise: true
      noise_std: 0.01
      rewiring_frequency: 10
      use_momentum: true
      momentum_factor: 0.9
    
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [2048, 1024, 512]  # Decoder for 4K neurons
      activation: relu
      output_dim: 10  # CIFAR-10 has 10 classes

train:
  seed: 42
  train_valid_split: 0.8
  
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      epochs: 0
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.0001  # Lower learning rate for larger model
      split_params: true
      topk_lr: 0.00005
      blocklinear_lr: 0.00005
      reactivation_lr: 0.00005
      decoder_lr: 0.0001
    
    trainer:
      loss_function: cat_nll
      epochs: 100
      early_stopping: true
      patience: 10
      batch_size: 256  # 16 per GPU across 16 GPUs for 4 nodes
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 50

task:
  dataset: cifar10
  data_path: 
  parameters: 
    flatten: true
    normalize: true

wandb:
  entity: 
  project: "dendritic_cifar10_4nodes"
  group: "single_layer_64k"
  tags: [cifar10, 4nodes, single_layer, deep_dendrites]
  use_wandb: false

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      
  information_analysis:
    enabled: true
    training: false
    params:
      method: "kraskov"
      max_samples: 1000
      n_neighbors: 10
      compute_basic_mi: true
      compute_per_branch: true
      branch_aggregation: none

outputs:
  run_name: exc_only_64k_4nodes
  dir: results/ 