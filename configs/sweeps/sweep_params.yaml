# sweep_params.yaml

slurm_config:
  output_dir:
  conda_env_path:
  modules_to_load: ["python/3.12.5-fasrc01", "cuda/12.4.1-fasrc01", "cudnn/8.9.2.26_cuda12-fasrc01"]
  max_concurrent_jobs: 8
  training_script: "/" # path of train_experiments.py
  config_filename_init: "test_config"
  account: 
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 200GB
  time: "0:30:00"
  partition: 
  run_name: "dendritic_model_sweep_job"

train_config:
  model:
    task: "classification"
    base:
      output_layer: true
      output_dim: 10
    network:
      type: "EINet"
      parameters:
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [40]
        excitatory_branch_factors: [6,6]
        inhibitory_branch_factors: []
        reactivate: false
        somatic_synapses: true
        ee_synapses_per_branch_per_layer: [100]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
        topk_init_method: "xavier_normal"
        topk_noise_level: 0.2  # Added to match config_exp.yaml
        topk_strategy: "standard"  # Options: "standard", "stochastic", "variance"
        topk_temperature: 0.5  # Controls the stochastic selection sharpness (0.1-1.0)
        topk_ultrafast: true  # Enable faster implementation for stochastic TopK
        use_shunting: true

        reactivation_type: "param_tanh"
        reactivation_strategy: "inverse"
        blocklinear_strategy: "block_conductance_dynamic"

        input_mode: 0
        input_net_dict:
          type: "CNNInputTransform"  # Type of input network: "IndexInputTransform", "MLPInputTransform", "AlexNetTransform", etc.
          hidden_dims: [] #[512, 256, 128]     # Hidden layer dimensions for better capacity
          excitatory_dim: 256             # Output dimension for excitatory input network
          inhibitory_dim: 64             # Output dimension for inhibitory input network
          # CNNInputTransform arguments
          input_shape: [3, 32, 32]
          excitatory_hidden_dims: [8]
          inhibitory_hidden_dims: [4]
          excitatory_kernel_sizes: [5]
          inhibitory_kernel_sizes: [9]
          excitatory_strides: [1]
          inhibitory_strides: [1]

  train:
    learning_strategy: "standard"
    run_name: "dendritic_sweep_run"
    seed: 0
    train_valid_split: 0.8
    optim_dict:
      lr: 0.01  # default learning rate if split_params is false
      split_params: true  # whether to split parameters into groups (only used for EINet)
      input_net_lr: 0.01  # learning rate for input network
      topk_lr: 0.01  # learning rate for topk layers
      blocklinear_lr: 0.001  # learning rate for blocklinear layers
      reactivation_lr: 0.001  # learning rate for reactivation layers
      output_layer_lr: 0.001  # learning rate for output layer
    weight_decay_rate: 0.1
    input_net_training:
      training_mode: "sequential"
      train_input_net: true
      input_net_epochs: 20
      train_heads_independently: false
      inhibitory_head_objective: "classification"
      diversity_weight: 0.5
      pretrained_options:
        source: "file"
        weights_path: ""
        pytorch_model: ""
    trainer:
      # for all learning strategies:
      loss_function: "categorical_nll"
      epochs: 50
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
      # for learning strategies other than standard:
      pretrain_epochs: 50
      target_voltage: 0.5
      reverse_training: false
      epochs_per_layer: 50
      epochs_per_branch: 50
      final_tune_epochs: 10

  task:
    dataset: "cifar10"
    data_path:
    parameters: {flatten: true, normalize: false}

  wandb:
    entity:
    project: "dendritic_cifar10"
    group: "debug"
    tags: [cifar10]
    use_wandb: false

  visualization:
    enabled: false
    visualize_epochs: [10, 30]
    plots:
      - weights
      - activations
      - gradients
      - branch_ablation
      - layer_ablation

  analysis:
    performance_analysis:
      enabled: true
      training: false
      params:
        accuracy: true
        categorical_loglikelihood: true
        mse: false
    # NEW: Integrated information-theoretic analysis using multivariate methods
    information_analysis:
      enabled: true
      training: false
      params:
        # Estimation method for mutual information computation
        method: "kraskov"  # Options: "kraskov" (k-NN), "sklearn" (histogram/kernel), "copula" (copula-based)

        max_samples: null

        # Method-specific parameters
        n_neighbors: 10       # For Kraskov k-NN estimator (higher = more accurate but slower)
        n_bins: 20           # For sklearn histogram method (more bins = finer resolution)
        copula_type: "gaussian"  # For copula method: "gaussian", "t", "clayton", "frank"
        
        # Which information metrics to compute
        compute_basic_mi: true       # Basic MI: I(E;C), I(I;C), I(Vout;C), I(E,I;C)
        compute_pairwise_mi: true    # Pairwise MI: I(E;I), I(E;Vout), I(I;Vout)
        compute_conditional_mi: true  # Conditional MI: I(E;I|C), I(E;Vout|C), I(I;Vout|C)
        compute_pid: false           # Partial Information Decomposition (requires external PID library)
        
        # PID-specific settings (only used if compute_pid=true)
        pid_binarize: true              # Whether to binarize data for PID computation
        pid_binarize_method: "median"   # Binarization method: "median", "mean", "quantile"
        pid_binarize_threshold: 0.5     # Threshold for "quantile" method (0-1)
        
        # Additional options
        include_vinf: true     # Include soma activation (Vinf) in analysis
        normalize_mi: false    # Normalize MI values by entropy H(C)
        verbose: false        # Print detailed progress during computation

        compute_per_branch: true
        branch_aggregation: none

    synapse_turnover_analysis:
      enabled: false
      training: false
    noise_perturbation_analysis:
      enabled: false
      training: false
      params:
        uniform_noise: true
        uniform_magnitudes: [0.1, 0.2]
        gaussian_noise: true
        gaussian_sdevs: [0.1, 0.2]
        n_samples: 10
        accuracy: true
        categorical_loglikelihood: true
    ablation_analysis:
      enabled: false
      training: false
      params:
        layer_ablation: true
        compartment_ablation: true
        ablate_all_synapses: true
        ablate_excitation: true
        ablate_inhibition: true
        ablate_upstream: true
        accuracy: true
        categorical_loglikelihood: true
    weight_analysis:
      enabled: false
      training: false
      params:
        synapse_weights: true
        branch_weights: true
    synaptic_activation_analysis:
      enabled: false
      training: false
      params:
        network_summary: true
        layer_summary: true
        branch_summary: true
        raw_summary: true
        logspace: false
        downsample: true
        samples: 5
    branch_activation_analysis:
      enabled: false
      training: false
      params:
        synapse_activations: true
        branch_activations: true
        network_summary: true
        layer_summary: true
        branch_summary: true
        raw_summary: true
        logspace: false
        downsample: true
        samples: 5


  outputs:
    dir:

sweep_config:
  # Network architecture sweeps
  model.network.parameters.excitatory_layer_sizes: [[10], [20], [30]]
  model.network.parameters.inhibitory_layer_sizes: [[40], [60], [80]]
  model.network.parameters.excitatory_branch_factors: [[6,6], [8,8], [10,10]]

  # TopK strategy and parameter sweeps
  model.network.parameters.topk_strategy: ["standard", "stochastic", "variance"]
  model.network.parameters.topk_noise_level: [0.0, 0.1, 0.2, 0.5]
  model.network.parameters.topk_temperature: [0.1, 0.3, 0.5, 0.7, 1.0]  # Different temperature values
  model.network.parameters.topk_ultrafast: [true, false]  # Test both implementations

  # Training strategy sweeps
  train.learning_strategy: ["mle", "freeze_layers", "local_credit_assignment", "two_step", "two_step_kl", "voltage_stabilization"]
  train.lr: [0.01, 0.005, 0.001]
  train.batch_size: [512, 1024, 2048]
  train.epochs: [30, 50, 70]

  # Input network training sweeps
  train.input_net_training.training_mode: ["sequential", "joint"]
  train.input_net_training.train_heads_independently: [true, false]
  train.input_net_training.inhibitory_head_objective: ["classification", "diversity", "combined"]
  train.input_net_training.diversity_weight: [0.3, 0.5, 0.7]

#python scripts/generate_sweep_configs.py configs sweep_params.yaml
