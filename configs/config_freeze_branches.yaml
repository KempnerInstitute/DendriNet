model:
  task: classification
  probabilistic: false  # This is only for the final EINet model
  network:
    type: EINet #"EINet", "MLP"
    parameters:
      excitatory_layer_sizes: [10] 
      inhibitory_layer_sizes: [40]
      excitatory_branch_factors: [6,6,6,6,6]  # 5 branch factors - these will be trained individually
      inhibitory_branch_factors: [1]
      reactivate: false
      somatic_synapses: false
      ee_synapses_per_branch_per_layer: [100]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]
      topk_init_method: xavier_normal

      use_shunting: true
      
      reactivation_type: param_tanh # "none", "param_tanh", "param_tanh_only_m", "relu", "sigmoid", "tanh"
      reactivation_strategy: inverse # "none", "inverse"
      blocklinear_strategy: block_conductance_dynamic # "none", "distal_upweight_by_idx", "block_conductance_dynamic"
      
      enable_branch_outputs: true   # Needed to access branch activations for training
      output_layer: false
      output_dim: 10
      
      # input mode (0=original, 1=exc=x+inh=x, 2=input_net)
      input_mode: 0
      # If we set input_mode=2, the following get used for input network:
      input_net_dict:
        type: "MLPInputTransform"
        hidden_dims: []
        output_dim: 128
        
train:
  # Train each dendritic branch individually from soma to input
  # This strategy allows fine-grained control of the dendritic computation
  learning_strategy: freeze_branches  
  seed: 0 
  train_valid_split: 0.8
  lr: 0.03 # Standard learning rate for Adam
  epochs: 20
  batch_size: 100  # Smaller batch size for better generalization
  grad_clip_value: 5  # Reasonable gradient clipping
  epochs_per_layer: 5  # Now represents epochs per branch  
  final_tune_epochs: 5  # Final full-network tuning
  pretrain_epochs: 10  # Not used for this strategy but available for with_pretraining variants
  
  # Parameters for two_step and voltage_stabilization strategies
  warmup_epochs: 1
  stability_target_voltage: 0.5

  weight_decay_rate: 0.1 # Standard weight decay
  # Input network training configuration
  input_net_training:
    training_mode: "sequential"
    train_input_net: true
    input_net_epochs: 20
    train_heads_independently: false
    inhibitory_head_objective: "classification"
    diversity_weight: 0.5
    pretrained_options:
      source: "file"
      weights_path: ""
      pytorch_model: ""
      
task:
  dataset: random_flip_mnist
  data_path: /n/holylabs/LABS/kempner_dev/Users/hsafaai/datasets/datasets
  parameters: {}
    
wandb:
  entity: houman_safaai-harvard-university
  project: "dendritic_branch_training"
  group: "freeze_branches"
  tags: [dendritic, branch_training]
  use_wandb: true
  
visualization:
  enabled: true
  visualize_epochs: [1, 5, 10]
  plots:
    - dendritic_ablation_all

outputs:
  dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/results/dendritic_modeling/results 