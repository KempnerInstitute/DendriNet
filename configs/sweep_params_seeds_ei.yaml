# sweep_params_seeds_ei.yaml
# This config demonstrates a sweep of EE and IE synapse counts with multiple seeds

slurm_config:
  account: kempner_dev
  run_name: dendritic_ei_sweep
  output_dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/results/dendritic-modeling/outputs
  create_subdir_with_timestamp: true  # This will create a subdirectory with ei_timestamp
  subdir_prefix: "ei_"  # Prefix for the timestamped subdirectory
  run_subfolders:  # Create these subdirectories within the timestamped directory
    - configs
    - results
    - plots
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  time: 1:00:00
  mem: 1200GB
  partition: kempner_h100
  max_concurrent_jobs: 4
  modules_to_load:
    - python/3.12.5-fasrc01
    - cuda/12.4.1-fasrc01
    - cudnn/8.9.2.26_cuda12-fasrc01
  conda_env_path: /n/home13/hsafaai/.conda/envs/dendritic_env
  training_script: src/dendritic_modeling/train_experiments.py
  config_filename_init: ei_sweep_config

experiment_settings:
  # Use 5 seeds per parameter combination
  seeds_per_condition: 5
  base_seed: 42

train_config:
  model:
    task: "classification"
    probabilistic: false
    network:
      type: "EINet"
      parameters:
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [40]
        excitatory_branch_factors: [10,10,10,10]
        inhibitory_branch_factors: [1]
        reactivate: false
        somatic_synapses: true
        ee_synapses_per_branch_per_layer: [100]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
        topk_init_method: "xavier_normal"
        topk_noise_level: 0.2
        topk_type: "standard"
        topk_temperature: 0.5
        topk_ultrafast: true
        topk_strategy: "conductance_dynamic"
        use_shunting: true
        reactivation_type: "param_tanh"
        reactivation_strategy: "inverse"
        blocklinear_strategy: "conductance_dynamic"
        print_hooks: false
        enable_branch_outputs: false
        output_layer: false
        output_dim: 10
        input_mode: 0
        input_net_dict:
          type: "MLPInputTransform"
          hidden_dims: []
          output_dim: 128

  train:
    learning_strategy: "mle"
    run_name: "dendritic_ei_sweep"
    seed: 0  # This will be overridden for each run
    train_valid_split: 0.8
    lr: 0.01
    epochs: 100
    batch_size: 1024
    grad_clip_value: 5
    epochs_per_layer: 50
    final_tune_epochs: 10
    warmup_epochs: 1
    stability_target_voltage: 0.5
    weight_decay_rate: 0.1
    input_net_training:
      training_mode: "sequential"
      train_input_net: true
      input_net_epochs: 20
      train_heads_independently: false
      inhibitory_head_objective: "classification"
      diversity_weight: 0.5
      pretrained_options:
        source: "file"
        weights_path: ""
        pytorch_model: ""

  task:
    dataset: "mnist_modulo10"
    data_path:
    parameters: {}

  wandb:
    entity:
    project: "dendritic_modeling_sweeps_ei"
    group: "ei_sweep"
    tags: [sweep, ei, multiple_seeds]
    use_wandb: true

  visualization:
    enabled: false
    visualize_epochs: [10, 30]
    plots:
      - weights
      - activations
      - gradients
      - branch_ablation
      - layer_ablation

sweep_config:
  # EE and IE synapse parameters - both sweep from 0 to 50 in steps of 5
  model.network.parameters.ee_synapses_per_branch_per_layer: [
    [1], [6], [11], [16], [21], [26], [31], [36], [41], [46], [51]
  ]
  model.network.parameters.ie_synapses_per_branch_per_layer: [
    [1], [6], [11], [16], [21], [26], [31], [36], [41], [46], [51]
  ]

  # This sweep has:
  # - 11 EE values × 11 IE values = 121 parameter combinations
  # - Each combination runs with 5 seeds
  # - Total configurations: 121 × 5 = 605 configs
