# sweep_params_seeds_ei.yaml
# This config demonstrates a sweep of EE and IE synapse counts with multiple seeds

slurm_config:
  account: kempner_dev
  run_name: dendritic_ei_sweep
  output_dir:
  create_subdir_with_timestamp: true  # This will create a subdirectory with ei_timestamp
  subdir_prefix: "ei_"  # Prefix for the timestamped subdirectory
  run_subfolders:  # Create these subdirectories within the timestamped directory
    - configs
    - results
    - plots
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 10
  time: 0:30:00
  mem: 400GB
  partition: kempner_h100
  max_concurrent_jobs: 8
  modules_to_load:
    - python/3.12.5-fasrc01
    - cuda/12.4.1-fasrc01
    - cudnn/8.9.2.26_cuda12-fasrc01
  conda_env_path:
  training_script: src/dendritic_modeling/train_experiments.py
  config_filename_init: ei_sweep_config

experiment_settings:
  # Use 5 seeds per parameter combination
  seeds_per_condition: 5
  base_seed: 42

train_config:
  model:
    task: "classification"
    probabilistic: false
    network:
      type: "EINet"
      parameters:
        excitatory_layer_sizes: [10]
        inhibitory_layer_sizes: [40]
        excitatory_branch_factors: [2,2]
        inhibitory_branch_factors: [1]
        reactivate: true
        somatic_synapses: true
        ee_synapses_per_branch_per_layer: [100]
        ei_synapses_per_branch_per_layer: [200]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
        topk_init_method: "xavier_normal"
        topk_noise_level: 0.0
        topk_type: "standard"
        topk_temperature: 0.5
        topk_ultrafast: true
        topk_strategy: "conductance_dynamic"
        use_shunting: true
        reactivation_type: "param_tanh"
        reactivation_strategy: "inverse"
        blocklinear_strategy: "conductance_dynamic"
        print_hooks: false
        output_layer: false
        output_dim: 10
        input_mode: 0
        input_net_dict:
          type: "CNNInputTransform"  # Type of input network: "IndexInputTransform", "MLPInputTransform", "AlexNetTransform", etc.
          hidden_dims: [] #[512, 256, 128]     # Hidden layer dimensions for better capacity
          excitatory_dim: 256             # Output dimension for excitatory input network
          inhibitory_dim: 64             # Output dimension for inhibitory input network
          # CNNInputTransform arguments
          input_shape: [3, 32, 32]
          excitatory_hidden_dims: [8]
          inhibitory_hidden_dims: [4]
          excitatory_kernel_sizes: [5]
          inhibitory_kernel_sizes: [9]
          excitatory_strides: [1]
          inhibitory_strides: [1]

  train:
    learning_strategy: "mle"
    run_name: "dendritic_ei_sweep"
    seed: 0  # This will be overridden for each run
    train_valid_split: 0.8
    optim_dict:
      lr: 0.01  # default learning rate if split_params is false
      split_params: true  # whether to split parameters into groups (only used for EINet)
      input_net_lr: 0.001  # learning rate for input network
      topk_lr: 0.001  # learning rate for topk layers
      blocklinear_lr: 0.001  # learning rate for blocklinear layers
      reactivation_lr: 0.001  # learning rate for reactivation layers
      output_layer_lr: 0.001  # learning rate for output layer
    weight_decay_rate: 0.1
    input_net_training:
      training_mode: "sequential"
      train_input_net: true
      input_net_epochs: 20
      train_heads_independently: false
      inhibitory_head_objective: "classification"
      diversity_weight: 0.5
      pretrained_options:
        source: "file"
        weights_path: ""
        pytorch_model: ""
    trainer:
      # for all learning strategies:
      loss_function: "mse"
      epochs: 50
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 10
      # for learning strategies other than standard:
      pretrain_epochs: 50
      target_voltage: 0.5
      reverse_training: false
      epochs_per_layer: 50
      epochs_per_branch: 50
      final_tune_epochs: 10

  task:
    dataset: "cifar10"
    data_path:
    parameters: {flatten: true, normalize: false}

  wandb:
    entity:
    project: "dendritic_modeling_sweeps_ei"
    group: "ei_sweep"
    tags: [sweep, ei, multiple_seeds]
    use_wandb: false

  visualization:
    enabled: false
    visualize_epochs: [10, 30]
    plots:
      - weights
      - activations
      - gradients
      - branch_ablation
      - layer_ablation

  analysis:
    performance_analysis:
      enabled: true
      training: false
      params:
        accuracy: true
        categorical_loglikelihood: true
        mse: false
    ei_info_analysis:
      enabled: false
      training: false
      params:
        compute_mi_E_I: true
        compute_mi_EI_Vout: true
        compute_sr_EI_Vout: true
        compute_mi_EI_label: true
        n_neighbors: 10
    synapse_turnover_analysis:
      enabled: false
      training: false
    noise_perturbation_analysis:
      enabled: false
      training: false
      params:
        uniform_noise: true
        uniform_magnitudes: [0.1, 0.2]
        gaussian_noise: true
        gaussian_sdevs: [0.1, 0.2]
        n_samples: 10
        accuracy: true
        categorical_loglikelihood: true
    ablation_analysis:
      enabled: false
      training: false
      params:
        ablate_all_synapses: true
        ablate_excitation: true
        ablate_inhibition: true
        ablate_branches: true
        accuracy: true
        categorical_loglikelihood: true
    weight_analysis:
      enabled: false
      training: false
      params:
        synapse_weights: true
        branch_weights: true
    synaptic_activation_analysis:
      enabled: false
      training: false
      params:
        network_summary: true
        layer_summary: true
        branch_summary: true
        raw_summary: true
        logspace: false
        downsample: true
        samples: 5
    branch_activation_analysis:
      enabled: false
      training: false
      params:
        synapse_activations: true
        branch_activations: true
        network_summary: true
        layer_summary: true
        branch_summary: true
        raw_summary: true
        logspace: false
        downsample: true
        samples: 5

    # Single layer contribution analysis (formerly layer_ablation)
    # Isolates each layer to test what it can achieve on its own
    single_layer_contribution:
      enabled: true  # whether to enable single layer contribution analysis
      training: false  # Whether to run during training
      params:
        save_plots: true
        save_csv: true

    # Synaptic ablation analysis (formerly branch_ablation)
    # Removes specific synapses while keeping the rest of the network intact
    synaptic_ablation:
      enabled: true  # Whether to enable synaptic ablation analysis
      training: false  # Whether to run during training
      params:
        ablation_type: "whole_layer"  # Options: "whole_layer" or "single_branch"
        layers_to_analyze: []  # Empty list means analyze all layers, or specify [0, 1, 2]
        mode: "direct"  # Options: "direct" (zero weights) or "full"
        save_plots: true
        save_csv: true

    # Branch information analysis
    # Computes mutual information between branch components (E, I, V, C)
    branch_information:
      enabled: true  # Whether to enable branch information analysis
      training: false  # Whether to run during training
      params:
        n_neighbors: 10  # Number of neighbors for MI estimation
        use_dvc: true  # Enable DVC_tensorflow for better MI computation
        save_plots: true
        save_csv: true
        # Configurable metrics to compute
        compute_metrics:
          #- "I_E_C"    # I(E;C) - Excitatory inputs and class
          #- "I_I_C"    # I(I;C) - Inhibitory inputs and class
          #- "I_V_C"    # I(V;C) - Branch outputs and class
          # - "I_E_I"    # I(E;I) - Excitatory and inhibitory inputs
          # - "I_E_V"    # I(E;V) - Excitatory inputs and branch outputs
          # - "I_I_V"    # I(I;V) - Inhibitory inputs and branch outputs
          # - "I_E_I_given_C" # I(E;I|C) - E and I given class
          # - "I_E_V_given_C" # I(E;V|C) - E and V given class
          # - "I_I_V_given_C" # I(I;V|C) - I and V given class

        # Per-branch vs pooled computation
        compute_per_branch: true  # If true, compute MI per branch and average; if false, pool all branches

        # Copula parameters for DVC_tensorflow
        copula_params:
          cases: 1000         # Number of samples for entropy estimation
          iterations: 10      # Number of iterations for convergence
          alpha: 0.05         # Confidence level
          vine_type: c-vine   # Type of vine copula: "d-vine", "c-vine", "r-vine"
          use_nonparametric: false  # Whether to use non-parametric kernel copula (true) or parametric Gaussian (false)
          knots: 30           # Number of knots for non-parametric copula (only used when use_nonparametric=true)
          opt_method: LL1     # Optimization method for non-parametric: "LL1", "LL2", etc.
          batch_paral: 1      # Batch parallelization for non-parametric fitting

sweep_config:
  # EE and IE synapse parameters - both sweep from 0 to 50 in steps of 5
  model.network.parameters.ee_synapses_per_branch_per_layer: [
    [1], [6], [11], [16], [21], [26], [31], [36], [41], [46], [51]
  ]
  model.network.parameters.ie_synapses_per_branch_per_layer: [
    [1], [6], [11], [16], [21], [26], [31], [36], [41], [46], [51]
  ]
  model.network.parameters.excitatory_branch_factors: [
    [2, 2], [2, 3], [2, 4], [2, 5], [2, 6], [2, 2, 2], [2, 2, 2, 2], [2, 2, 2, 2, 2]
  ] 
  model.network.parameters.use_shunting: [true, false, "MLP"]
  # This sweep has:
  # - 11 EE values × 11 IE values = 121 parameter combinations
  # - Each combination runs with 5 seeds
  # - Total configurations: 121 × 5 = 605 configs
