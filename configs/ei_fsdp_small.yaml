# Small EI Network for FSDP Testing
# This configuration should fit comfortably on a single GPU

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
  
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 1536  # Half of 3072 (CIFAR10 flattened)
        inhibitory_dim: 1536  # Half of 3072
      
      # Small architecture
      excitatory_layer_sizes: [512, 256, 128, 10]
      inhibitory_layer_sizes: [256, 128, 64, 32]  # Added 32 to match length
      excitatory_branch_factors: [8, 4, 2, 1]
      inhibitory_branch_factors: [4, 2, 1, 1]  # Added 1 to match length
      
      # Moderate synapse counts
      ee_synapses_per_branch_per_layer: [200, 100, 50, 10]
      ei_synapses_per_branch_per_layer: [100, 50, 25, 10]  # Added 10
      ie_synapses_per_branch_per_layer: [50, 25, 10, 5]   # Added 5
      ii_synapses_per_branch_per_layer: [25, 10, 5, 2]    # Added 2
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
  
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [32, 16]
      activation: relu
      output_dim: 10

train:
  seed: 0
  train_valid_split: 0.8
  
  encoder: null
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.0005
      blocklinear_lr: 0.0005
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 10
      early_stopping: true
      patience: 5
      batch_size: 64  # Per GPU batch size
      shuffle: true
      grad_clip_value: 1.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 1

task:
  dataset: cifar10
  data_path: ./data
  parameters:
    num_classes: 10
    train_size: 10000
    valid_size: 2000
    test_size: 2000
    flatten: true
    normalize: true

# Disable analysis for initial testing
analysis:
  performance_analysis:
    enabled: false
  information_analysis:
    enabled: false
  weight_analysis:
    enabled: false
  ablation_analysis:
    enabled: false

outputs:
  run_name: ei_fsdp_small
  dir: results/

wandb:
  use_wandb: false 