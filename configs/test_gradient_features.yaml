# ============================================================================
# GRADIENT FEATURES TEST CONFIGURATION
# ============================================================================
# Tests gradient clipping, scaling strategies, and gradient accumulation features

model:
  task: classification
  
  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]
  
  core_network:
    type: EINet
    parameters:
      input_dim: 784            # MNIST flattened input dimension
      # Transfer function parameters
      transfer_params:
        input_mode: 0             # Raw input to excitatory only
        independent_pathways: false
        output_activation: none
        
      # Deep network to test gradient flow
      excitatory_layer_sizes: [128, 96, 64, 32]
      inhibitory_layer_sizes: [32, 24, 16, 8]
      excitatory_branch_factors: [4, 4, 4, 2]
      inhibitory_branch_factors: [2, 2, 2, 1]
      
      # Connection patterns - no cross-pathway for input_mode 0
      ee_synapses_per_branch_per_layer: [16]
      ei_synapses_per_branch_per_layer: [8]
      ie_synapses_per_branch_per_layer: [1]   # Minimum 1 even if not used
      ii_synapses_per_branch_per_layer: [1]   # Minimum 1 even if not used
      
      # Network features
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_type: standard
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # GRADIENT SCALING STRATEGIES - MAIN FEATURES TO TEST
      reactivation_strategy: inverse            # Test inverse scaling
      topk_strategy: conductance_dynamic        # Test conductance scaling
      blocklinear_strategy: conductance_dynamic # Test block linear scaling
      
      # Implementation settings
      efficient_blocklinear: true
      adaptive_initialization: true
      print_hooks: true             # Enable to see gradient statistics

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [64, 32]
      activation: relu
      output_dim: 10
      use_batch_norm: false
      dropout_rate: 0.0

train:
  run_name: "gradient_features_test"
  seed: 42
  train_valid_split: 0.8
  
  # Performance settings
  enable_amp: true
  enable_profiling: false       # Disable to focus on gradient features
  enable_hooks: true            # Keep for gradient monitoring
  performance_mode: false
  use_fsdp: false
  
  # Encoder (skip for identity)
  encoder:
    trainer:
      epochs: 0
      batch_size: 128
  
  # Main training with gradient features
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 12
      batch_size: 128           # Smaller batch for gradient testing
      early_stopping: false
      shuffle: true
      grad_clip_value: 5.0      # TEST GRADIENT CLIPPING
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 2

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: true
  project: "dendritic-performance-tests"
  group: "gradient-features"
  tags: ["gradient-clipping", "gradient-scaling", "training-stability"]

# Analysis to monitor gradient behavior
analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      memory_usage: true
      throughput: true
      gpu_utilization: true
  
  information_analysis:
    enabled: true
    training: false
    params:
      mutual_information: true
      entropy: true
      save_plots: false
      samples: 500

outputs:
  dir: "./outputs/gradient_test/"

compute:
  device: "auto"
  memory:
    gradient_checkpointing: false
    empty_cache_freq: 100
    max_memory_fraction: 0.9 