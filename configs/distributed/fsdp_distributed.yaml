# ============================================================================
# Multi-GPU FSDP Training on ImageNet
# ============================================================================
# Trains a DendriNet core inside AlexNet using FullyShardedDataParallel.
# Node/GPU counts are set by the SLURM launcher, not this config.
#
# Launch (single node, 4 GPUs):
#   torchrun --nproc_per_node=4 \
#     src/dendritic_modeling/scripts/training/train_experiments_fsdp.py \
#     configs/distributed/fsdp_distributed.yaml
#
# Launch (multi-node via SLURM):
#   See configs/sweep_config.yaml for SLURM template generation.
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: false
  checkpointing:
    enabled: true
    save_every_n_epochs: 10
    checkpoint_dir: "outputs/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: ""                              # Set to your local ImageNet root
  processing:
    flatten: false
    normalize: true
  dataset_params:
    imagenet:
      transform_preset: "pretrained"
      loader_backend: "auto"                  # "auto" | "torchvision" | "imagefolder"; imagefolder is fastest for train/val class trees
      allow_flatten_materialize: false

model:
  task: "classification"
  vision_replacement:
    enabled: true
    backbone: "alexnet"
    weights: "IMAGENET1K_V1"
    input_shape: [3, 224, 224]
    target_modules:
      - "classifier.1"
      - "classifier.2"
      - "classifier.3"
      - "classifier.4"
      - "classifier.5"
    trainability:
      encoder:
        mode: "frozen"
      decoder:
        mode: "trainable"
  core:
    type: "hierarchical_dendritic_tensor_map"
    architecture:
      excitatory_layer_sizes: [512]
      inhibitory_layer_sizes: [128]
      excitatory_branch_factors: [4, 4]
      inhibitory_branch_factors: [1]
    connectivity:
      ee_synapses_per_branch_per_layer: [60]
      ei_synapses_per_branch_per_layer: [20]
      ie_synapses_per_branch_per_layer: [20]
      ii_synapses_per_branch_per_layer: [0]
    morphology:
      use_shunting: true
      weight_transform: "softplus"
    reactivation:
      enabled: true
      type: "param_tanh"
      init_policy: "occupancy_quantile"

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "standard"
    common:
      epochs: 100
      batch_size: 64                    # per-GPU batch size (effective = 64 * n_gpus)
      num_workers: 8                    # per-rank ImageNet workers
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: true
      patience: 20
      use_amp: true                     # mixed precision for speed
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.01
    optimizer:
      name: "adamw"
      weight_decay: 0.01
    strategies:
      standard: {}

analysis:
  runtime:
    final:
      mode: "stream"                    # large-image analysis under FSDP: stream by default
      batch_size: 128
      in_order: false
  performance:
    enabled: true
    params:
      accuracy: true
    final_splits: ["train", "valid", "test"]

wandb:
  use_wandb: false

outputs:
  run_name: "fsdp_alexnet"
  results_dir: "outputs"

# ---------- Distributed settings ----------
distributed:
  mode: "fsdp"                          # "none" | "ddp" | "fsdp"
  fsdp:
    # Sharding strategies:
    #   FULL_SHARD    - shard params + grads + optimizer (lowest memory, most communication)
    #   SHARD_GRAD_OP - shard grads + optimizer only (faster, uses more memory)
    #   NO_SHARD      - no sharding (equivalent to DDP, largest memory)
    #   HYBRID_SHARD  - shard within node, replicate across nodes (best for multi-node)
    sharding_strategy: "FULL_SHARD"
    mixed_precision: true               # BF16 compute, FP32 reduce
    cpu_offload: false                  # offload params to CPU (saves GPU RAM, slower)
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: true
    use_orig_params: true               # needed for param groups
    backward_prefetch: "BACKWARD_PRE"   # "BACKWARD_PRE" | "BACKWARD_POST"
    gradient_checkpointing: false       # trade compute for memory
