# Large ImageNet dendritic model configuration for 16 GPU FSDP training
# Designed to utilize ~16 H100 GPUs efficiently

model:
  task: classification
  encoder_network:
    type: identity
    parameters: {}
  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 4096  # Large enough to utilize multiple GPUs
        inhibitory_dim: 4096
      # Large architecture for 16 GPU training
      excitatory_layer_sizes: [8192, 4096, 2048, 1024, 512]
      inhibitory_layer_sizes: [2048, 1024, 512, 256, 128]
      excitatory_branch_factors: [4, 4, 2, 2]  # 64 branches total
      inhibitory_branch_factors: [4, 2, 2, 1]  # 16 branches total
      ee_synapses_per_branch_per_layer: [128, 96, 64, 48, 32]
      ei_synapses_per_branch_per_layer: [64, 48, 32, 24, 16]
      ie_synapses_per_branch_per_layer: [96, 64, 48, 32, 16]
      ii_synapses_per_branch_per_layer: [48, 32, 24, 16, 8]
      somatic_synapses: true
      use_shunting: true
      topk_init_method: xavier_normal
      topk_strategy: standard
      topk_type: standard
      reactivate: true
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_type: param_tanh
      reactivation_strategy: standard
      blocklinear_strategy: standard
      efficient_blocklinear: true
      adaptive_initialization: true
  decoder_network:
    type: MLP
    parameters:
      output_dim: 1000  # ImageNet classes
      hidden_dims: [2048, 1024, 512]

task:
  dataset: imagenet
  data_path: /n/holylfs06/LABS/kempner_shared/Lab/data/imagenet
  parameters:
    flatten: true
    n_classes: 1000
  
train:
  seed: 42
  train_valid_split: 0.9
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.0005
      blocklinear_lr: 0.0005
      reactivation_lr: 0.0005
      decoder_lr: 0.002
    
    trainer:
      loss_function: cat_nll
      epochs: 200
      batch_size: 32  # Per GPU batch size - total batch size will be 32*16=512
      shuffle: true
      grad_clip_value: 1.0
      plot_losses: true

outputs:
  run_name: imagenet_16gpu_large_dendritic
  dir: results/

# WandB configuration
wandb:
  use_wandb: true
  project: dendritic-imagenet-large
  entity: ""  # Will use default
  name: imagenet_16gpu_large_dendritic
  tags: [imagenet, dendritic, large-scale, 16gpu, FSDP]
  notes: "Large-scale dendritic model training on ImageNet with 16 GPUs using FSDP"

# SLURM configuration for 16 GPU training
slurm_config:
  output_dir: "/n/holylabs/LABS/kempner_dev/Users/hsafaai/logs"
  conda_env: "dendritic_env"
  conda_env_path: "/n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env/etc/profile.d/conda.sh"
  modules_to_load: 
    - "python/3.12.5-fasrc01"
    - "cuda/12.4.1-fasrc01" 
    - "cudnn/8.9.2.26_cuda12-fasrc01"
  training_script: "scripts/train_large_model_fsdp.py"
  account: "kempner_dev"
  partition: "kempner_h100"
  run_name: "imagenet_16gpu_large_dendritic"

# Expected resource usage:
# - Model size: ~50-100M active parameters, ~1-2B total stored parameters
# - Memory per GPU: ~20-40GB with FSDP
# - Training time: ~48-72 hours for 200 epochs
# - Total batch size: 512 (32 per GPU * 16 GPUs) 