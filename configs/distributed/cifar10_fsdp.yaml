# Realistic CIFAR-10 dendritic model configuration for 16 GPU FSDP training
# Designed for input_mode=1 (excitatory-only) with dendritic branching

model:
  task: classification
  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 0
        independent_pathways: false
        # excitatory_dim and inhibitory_dim will auto-calculate:
        # For CIFAR-10 flattened: input_dim = 3*32*32 = 3,072
        # excitatory_dim = input_dim/2 = 1,536
        # inhibitory_dim = input_dim/2 = 1,536 (creates inhibitory inputs from transfer function)
        # output_activation: sigmoid  # Options: sigmoid, relu, tanh, softplus, none (constrains transfer outputs)
        
      # Large excitatory layer to utilize 16 GPUs (scaled for CIFAR-10)
      excitatory_layer_sizes: [500,500,500]  # Reduced from [1000,1000,1000]
      inhibitory_layer_sizes: [500,500,500]  # Reduced from [1000,1000,1000]
      
      # Increased branching for more parameters
      excitatory_branch_factors: [3, 3, 3]  # Reduced from [4, 4, 4, 4]
      inhibitory_branch_factors: [3, 3, 3]  # Reduced from [4, 4, 4, 4]
      
      # Rich connectivity
      ee_synapses_per_branch_per_layer: [50]  # Reduced from [100]
      ei_synapses_per_branch_per_layer: [10]   # Reduced from [20]
      ie_synapses_per_branch_per_layer: [50]     # Reduced from [100]
      ii_synapses_per_branch_per_layer: [10]     # Reduced from [20]
      
      somatic_synapses: true
      
      use_topk: true
      use_shunting: true  # No shunting without inhibitory neurons
      topk_init_method: xavier_normal
      topk_strategy: standard
      topk_type: standard
      topk_ultrafast: false  # Enable ultrafast implementation
      topk_temperature: 0.5  # Controls randomness (0.1-1.0)
      reactivate: true
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_type: param_tanh
      reactivation_strategy: standard
      blocklinear_strategy: standard
      efficient_blocklinear: true
      adaptive_initialization: true
  
  encoder_network:
    type: Identity
    parameters: {}
  
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [1024, 512]  # Smaller decoder for CIFAR-10
      output_dim: 10  # CIFAR-10 classes
      activation: relu
      dropout: 0.0
      norm_type: layer

task:
  dataset: cifar10 #mnist, cifar10, mnist_modulo10, random_flip_mnist
  data_path: /n/netscratch/kempner_dev/hsafaai/data
  parameters: {flatten: true, normalize: false}

train:
  seed: 42  # Random seed for reproducibility
  train_valid_split: 0.8  # Split ratio for train/validation
  
  main:
    learning_strategy: standard  # Add this from reference config
    weight_decay_rate: 0.01  # This goes under main, not trainer
    
    trainer:
      type: fsdp  # standard, fsdp
      loss_function: cat_nll  # Add this from reference config
      batch_size: 500  # Per GPU - reduced for memory constraints
      epochs: 500  # More epochs for CIFAR-10
      optimizer: adamw
      scheduler: cosine
      warmup_epochs: 10
      grad_clip_value: 5.0  # Changed from gradient_clip to match reference
      early_stopping: false
      patience: 10
      shuffle: true
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
      save_every_n_epochs: 100  # Save checkpoint every N epochs
      # FSDP-specific parameters
      use_mixed_precision: true
      cpu_offload: false
      backward_prefetch: true
      limit_all_gathers: true
      forward_prefetch: true
      
    # Add the missing param_groups configuration
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.001
      
    checkpointer:
      save_latest: true
      save_every: 10
      
  # Add encoder section even though we're using Identity encoder
  encoder:
    load_save_root: saved_models/encoder
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0  # No training needed for Identity encoder
      batch_size: 128
      
# WandB configuration moved to top level
wandb:
  entity: houman_safaai-harvard-university  # Update this if needed
  project: dendritic-cifar10
  group: "fsdp_experiments"
  tags: ["cifar10", "4gpu", "excitatory-only", "fsdp"]
  use_wandb: true

# Outputs configuration
outputs:
  run_name: cifar10_fsdp_4gpu
  dir: results/
        
# Run configuration for job generation and outputs
run_config:
  dir: results/
  conda_env_path: /n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env/etc/profile.d/conda.sh
  modules_to_load:
    - cuda/12.4.1-fasrc01
    - cudnn/8.9.2.26_cuda12-fasrc01
  training_script: src/dendritic_modeling/scripts/train_experiments_fstp.py
  account: kempner_dev
  partition: kempner_eng
  run_name: cifar10_fstp_kempner_eng
  gpu_per_node: 4  # Number of GPUs per node (1-4) 