# Realistic ImageNet dendritic model configuration for 16 GPU FSDP training
# Designed for input_mode=1 (excitatory-only) with dendritic branching

model:
  task: classification
  core_network:
    type: EINet
    parameters:
      transfer_params:
        input_mode: 1
        independent_pathways: true
        # excitatory_dim and inhibitory_dim will auto-calculate:
        # For ImageNet flattened: input_dim = 3*224*224 = 150,528
        # excitatory_dim = input_dim/2 = 75,264
        # inhibitory_dim = input_dim/2 = 75,264 (creates inhibitory inputs from transfer function)
        # output_activation: sigmoid  # Options: sigmoid, relu, tanh, softplus, none (constrains transfer outputs)
      
      # Larger single excitatory layer to utilize more GPUs
      excitatory_layer_sizes: [400000]  # Much larger for 16 GPUs
      inhibitory_layer_sizes: []  # Empty for input_mode=1
      
      # Increased branching for more parameters
      excitatory_branch_factors: [8, 8, 4, 4, 2, 2]  # 8*8*4*4*2*2 = 16384 branches
      inhibitory_branch_factors: []
      
      # Increased synapses per branch for more parameters
      ee_synapses_per_branch_per_layer: [256]  # Rich connectivity
      ei_synapses_per_branch_per_layer: [40]   # Excitatory to inhibitory from transfer function
      ie_synapses_per_branch_per_layer: []     # No inhibitory-excitatory (input_mode=1) 
      ii_synapses_per_branch_per_layer: []     # No inhibitory-inhibitory (input_mode=1)
      
      somatic_synapses: true
      
      use_topk: true
      use_shunting: false  # No shunting without inhibitory neurons
      topk_init_method: xavier_normal
      topk_strategy: standard
      topk_type: standard
      reactivate: true
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_type: param_tanh
      reactivation_strategy: standard
      blocklinear_strategy: standard
      efficient_blocklinear: true
      adaptive_initialization: true
  
  encoder_network:
    type: Identity
    parameters: {}
  
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [2048, 1024]  # Larger decoder for more parameters
      output_dim: 1000  # ImageNet classes
      activation: relu
      dropout: 0.0
      norm_type: layer

task:
  dataset: imagenet
  data_path: /n/holylfs06/LABS/kempner_shared/Lab/data/imagenet_1k  # Updated to actual ImageNet path
  parameters:
    flatten: true
    transform:
      train:
        - type: resize
          size: 256
        - type: center_crop
          size: 224
        - type: normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
      eval:
        - type: resize
          size: 256
        - type: center_crop
          size: 224
        - type: normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

train:
  main:
    trainer:
      type: fsdp  # Specify FSDP trainer explicitly
      batch_size: 64  # Per GPU
      epochs: 100
      lr: 0.0001  # Reduced for stability with large model
      optimizer: adamw
      weight_decay: 0.01
      scheduler: cosine
      warmup_epochs: 5
      gradient_clip: 1.0
      
      # FSDP-specific parameters
      use_mixed_precision: true
      cpu_offload: false
      backward_prefetch: true
      limit_all_gathers: true
      forward_prefetch: true
      
    checkpointer:
      save_latest: true
      save_every: 5
      
    logger:
      use_wandb: true  # Enable WandB logging
      wandb:
        project: dendritic-imagenet
        name: imagenet_16gpu_realistic
        notes: "16 GPU ImageNet training with input_mode=1 (excitatory-only) architecture"
        tags: ["imagenet", "16gpu", "excitatory-only", "fsdp"]
        
outputs:
  run_name: imagenet_16gpu_realistic
  dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/outputs

# SLURM configuration for job generation
run_config:
  output_dir: /n/holylabs/LABS/kempner_dev/Users/hsafaai/logs
  conda_env: dendritic_env
  conda_env_path: /n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env/etc/profile.d/conda.sh
  modules_to_load:
    - python/3.12.5-fasrc01
    - cuda/12.4.1-fasrc01
    - cudnn/8.9.2.26_cuda12-fasrc01
  training_script: scripts/train_large_model_fsdp.py
  account: kempner_dev
  partition: kempner_h100
  run_name: imagenet_16gpu_realistic 