# ============================================================================
# Canonical Recurrent Population Network: Pyr / PV / SST
# ============================================================================
# A recurrent microcircuit written with the same layers/populations/connections
# schema as feedforward population networks. Same-step edges provide the input
# drive; delayed edges carry previous-timestep population feedback.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_recurrent_pyr_pv_sst.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "population_network"
    population_network:
      output_mode: "last"
      layers:
        - name: "microcircuit"
          recurrent: true
          readout_population: "pyr"
          dt: 1.0
          connection_seed: 42
          population_defaults:
            ff_excitatory_synapses: 3
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 2
            rec_inhibitory_synapses: 1
            somatic_synapses: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
          populations:
            - name: "pyr"
              polarity: "excitatory"
              n_neurons: 32
              branch_factors: [2, 2]
            - name: "pv"
              polarity: "inhibitory"
              n_neurons: 8
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
            - name: "sst"
              polarity: "inhibitory"
              n_neurons: 8
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
          connections:
            - source: "input"
              target: "pyr"
            - source: "input"
              target: "pv"
            - source: "input"
              target: "sst"
            - source: "pyr"
              target: "pyr"
              timing: "delayed"
              probability: 0.75
            - source: "pv"
              target: "pyr"
              timing: "delayed"
              probability: 0.65
            - source: "sst"
              target: "pyr"
              timing: "delayed"
              probability: 0.35
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 2
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      weight_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      standard: {}
      recurrent: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
  routing:
    enabled: true
    training: false
  dendritic_timetraces:
    enabled: true
    training: false
    params:
      n_timesteps: 40
      save_figures: true

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_recurrent_pyr_pv_sst"
  results_dir: "outputs"

distributed:
  mode: none
