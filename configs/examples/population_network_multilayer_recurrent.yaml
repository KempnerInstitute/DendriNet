# ============================================================================
# Population Network: Two Recurrent Layers with Internal and Cross-Layer Edges
# ============================================================================
# Each layer has multiple populations. Same-step edges express feedforward/local
# wiring; delayed edges express recurrent state. Qualified sources like
# layer0.e0 let layer1 consume any earlier layer population explicitly.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_multilayer_recurrent.yaml
# ============================================================================

experiment:
  seed: 45
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "population_network"
    population_network:
      output_mode: "last"
      store_routing: true
      layers:
        - name: "layer0"
          recurrent: true
          readout_population: "e0"
          dt: 1.0
          connection_seed: 45
          population_defaults:
            ff_excitatory_synapses: 3
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
            blocklinear_strategy: "none"
            reactivation_strategy: "none"
            efficient_blocklinear: false
            tau_base: 25.0
            tau_ratio: 2.0
          populations:
            - name: "e0"
              polarity: "excitatory"
              n_neurons: 32
              branch_factors: [2, 2]
              population:
                ff_inhibitory_synapses: 1
                rec_excitatory_synapses: 2
                rec_inhibitory_synapses: 1
            - name: "pv0"
              polarity: "inhibitory"
              n_neurons: 8
              branch_factors: [1]
              population:
                tau_base: 5.0
          connections:
            - source: "input"
              target: "pv0"
            - source: "input"
              target: "e0"
            - source: "pv0"
              target: "e0"
            - source: "e0"
              target: "e0"
              timing: "delayed"
              probability: 0.6
            - source: "pv0"
              target: "e0"
              timing: "delayed"
              probability: 0.7
        - name: "layer1"
          recurrent: true
          readout_population: "e1"
          dt: 1.0
          connection_seed: 46
          population_defaults:
            ff_excitatory_synapses: 3
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
            blocklinear_strategy: "none"
            reactivation_strategy: "none"
            efficient_blocklinear: false
            tau_base: 30.0
            tau_ratio: 2.0
          populations:
            - name: "e1"
              polarity: "excitatory"
              n_neurons: 24
              branch_factors: [2, 2]
              population:
                ff_inhibitory_synapses: 2
                rec_excitatory_synapses: 2
                rec_inhibitory_synapses: 1
            - name: "pv1"
              polarity: "inhibitory"
              n_neurons: 6
              branch_factors: [1]
              population:
                tau_base: 5.0
            - name: "sst1"
              polarity: "inhibitory"
              n_neurons: 6
              branch_factors: [2]
              population:
                tau_base: 15.0
          connections:
            - source: "layer0.e0"
              target: "pv1"
            - source: "layer0.e0"
              target: "sst1"
            - source: "layer0.e0"
              target: "e1"
            - source: "layer0.pv0"
              target: "e1"
            - source: "pv1"
              target: "e1"
            - source: "sst1"
              target: "e1"
            - source: "layer0.e0"
              target: "e1"
              timing: "delayed"
              probability: 0.5
            - source: "e1"
              target: "e1"
              timing: "delayed"
              probability: 0.6
            - source: "pv1"
              target: "e1"
              timing: "delayed"
              probability: 0.7
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 5
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      weight_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      recurrent: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
  routing:
    enabled: true
    training: false

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_multilayer_recurrent"
  results_dir: "outputs"

distributed:
  mode: none
