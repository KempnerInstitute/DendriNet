# Example configuration with profiling enabled
# This config demonstrates how to enable torch.profiler for hotspot analysis

train:
  run_name: "ei_model_with_profiling"
  seed: 42
  enable_profiling: true  # Enable torch.profiler for performance analysis
  
  main:
    learning_strategy: "standard"
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      
    trainer:
      epochs: 10  # Shorter run for profiling
      batch_size: 64
      early_stopping: true
      patience: 5
      use_amp: false  # Disable AMP for clearer profiling results
      loss_function: "cat_nll"
      print_every: 1

  encoder:
    load_save_root: "outputs/encoders"
    trainer:
      epochs: 5
      batch_size: 256
      loss_function: "mse"

model:
  task: "classification"
  
  encoder_network:
    type: "Identity"
    parameters:
      input_dim: 784  # Will be set automatically
      
  core_network:
    type: "ExcitationInhibitionNetwork"
    parameters:
      excitatory_layer_sizes: [256, 128]
      inhibitory_layer_sizes: [64, 32]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [1, 1]
      
  decoder_network:
    type: "LinearDecoder"
    parameters:
      hidden_dims: [64]
      output_dim: 10

task:
  dataset: "mnist"
  batch_size: 64
  num_workers: 2

analysis:
  information_analysis:
    enabled: true
    batch_size: 100
    
outputs:
  dir: "outputs/profiling_example"
  
wandb:
  use_wandb: false  # Disable for cleaner profiling 