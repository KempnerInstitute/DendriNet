# ============================================================================
# Multi-Population Feedforward E/I DendriNet on MNIST
# ============================================================================
# Demonstrates the opt-in multi-population layer backend. The classical
# feedforward E/I layer is represented as two named populations with
# directional same-step connectivity: input -> I, input -> E, and I -> E.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/multi_population_ei_feedforward.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: false
  checkpointing:
    enabled: false

data:
  dataset_name: "mnist"
  processing:
    flatten: true
    normalize: true

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "multi_population_ei"
    multi_population:
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 30
            ff_inhibitory_synapses: 15
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            reactivate: true
            reactivation_type: "param_tanh"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
          populations:
            - name: "i"
              polarity: "inhibitory"
              n_neurons: 32
              branch_factors: [1]
            - name: "e"
              polarity: "excitatory"
              n_neurons: 128
              branch_factors: [4, 4]
          connections:
            - source: "input"
              target: "i"
            - source: "input"
              target: "e"
            - source: "i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 10

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "standard"
    common:
      epochs: 50
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 20
      load_best_state_dict: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true

wandb:
  use_wandb: false

outputs:
  run_name: "multi_population_ei_feedforward"
  results_dir: "outputs"

distributed:
  mode: none
