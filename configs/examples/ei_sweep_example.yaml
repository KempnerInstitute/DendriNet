# =============================================================================
# EI (Excitation-Inhibition) Sweep Configuration Example
# =============================================================================
# This configuration shows ALL available options for EI parameter sweeps.
# Uncomment and modify sections as needed for your experiments.

# Output directory for sweep results
output_dir: "output"

# SLURM cluster configuration
slurm_config:
  job_name: "ei_sweep_run"
  account: "kempner_dev"           # Your cluster account
  partition: "kempner"             # Cluster partition
  time: "02:00:00"                 # Wall time (HH:MM:SS)
  nodes: 1                         # Number of nodes
  ntasks_per_node: 1               # Tasks per node
  gpus_per_node: 1                 # GPUs per node
  cpus_per_task: 8                 # CPUs per task
  mem: "32GB"                      # Memory allocation
  max_concurrent_jobs: 15          # Maximum number of array jobs to run simultaneously
  modules_to_load:                 # Environment modules
    - "python/3.12.5-fasrc01"
    - "cuda/12.4.1-fasrc01"
    - "cudnn/8.9.2.26_cuda12-fasrc01"
  conda_env_path: "/n/netscratch/kempner_dev/hsafaai/conda_envs/dendritic_env"  # Your conda environment
  training_script: "src/dendritic_modeling/scripts/training/train_experiments.py"

# Experiment settings
experiment_settings:
  seeds_per_condition: 3           # Number of random seeds per parameter combination
  base_seed: 42                    # Base seed for reproducibility

# EI parameters to sweep over
sweep_config:
  # Excitatory synapses per branch per layer
  model.core_network.parameters.ee_synapses_per_branch_per_layer: [5, 10, 15, 20, 25]
  
  # Inhibitory synapses per branch per layer  
  model.core_network.parameters.ie_synapses_per_branch_per_layer: [2, 5, 8, 10, 12]
  
  # Whether to use shunting inhibition (can include "MLP" for network comparison)
  model.core_network.parameters.use_shunting: [True, False]
  # model.core_network.parameters.use_shunting: [True, False, "MLP"]  # Include MLP comparison

# Filter parameter combinations (CHOOSE ONE MODE)
filter_config:
  # MODE 1: Generate all combinations (default)
  mode: "all"
  
  # MODE 2: Fix E+I sum (balanced networks with constant total input)
  # mode: "ei-sum"
  # target_sum: 20              # E + I must equal this value
  
  # MODE 3: Fix excitation value (study inhibition effects)
  # mode: "e-const"
  # target_e: 15               # Fixed E value, I varies
  
  # MODE 4: Fix inhibition value (study excitation effects)
  # mode: "i-const"
  # target_i: 8                # Fixed I value, E varies
  
  # MODE 5: Fix E/I ratio (study balanced vs imbalanced networks)
  # mode: "ei-ratio"
  # target_ratio: 2.0          # Target E/I ratio
  # tolerance: 0.2             # Acceptable deviation from target ratio

# Base training configuration (will be used for all sweep conditions)
base_config:
  model:
    task: classification             # Options: "classification", "regression"
    
    # ==========================================
    # ENCODER NETWORK (Input Processing Stage)
    # ==========================================
    encoder_network:
      type: identity                 # Options: "identity", "mlpautoencoder", "cnnautoencoder"
      parameters:
        input_dim: null
        input_shape: [3, 32, 32]     # For CNN encoders [channels, height, width]
        encoder_hidden_dims: [128, 64]
        latent_dim: null
        activation: relu
    
    # ==========================================
    # CORE NETWORK (Main Processing Stage) 
    # ==========================================
    core_network:
      type: "EINet"                  # Options: "EINet", "MLP", "MatchedParamMLP"
      parameters:
        # Transfer function parameters
        transfer_params:
          input_mode: 1
          independent_pathways: false
          excitatory_dim: null
          inhibitory_dim: null
          output_activation: null
        
        # Layer sizes
        excitatory_layer_sizes: [64, 32, 16]
        inhibitory_layer_sizes: [32, 16, 8]
        
        # Branch factors (dendrites per neuron)
        excitatory_branch_factors: [2, 2, 1]
        inhibitory_branch_factors: [1, 1, 1]
        
        # Synaptic connectivity (these will be overridden by sweep)
        ee_synapses_per_branch_per_layer: [10]  # Will be swept
        ei_synapses_per_branch_per_layer: [8]   # E->I connections
        ie_synapses_per_branch_per_layer: [5]   # Will be swept  
        ii_synapses_per_branch_per_layer: [3]   # I->I connections
        
        # Morphological features
        somatic_synapses: True         # Allow direct somatic connections
        use_shunting: True             # Will be overridden by sweep
        
        # TopK sparsity parameters
        topk_init_method: xavier_normal
        topk_noise_level: 0.0
        topk_type: standard
        topk_temperature: 0.0
        topk_strategy: conductance_dynamic
        
        # Reactivation parameters
        reactivate: true               # Enable reactivation functions
        reactivation_type: param_tanh
        reactivation_init_m: 1.5
        reactivation_init_b: 0.5
        reactivation_strategy: inverse
        
        # Block linear parameters
        blocklinear_strategy: conductance_dynamic
        efficient_blocklinear: false
        
        # Implementation optimizations
        adaptive_initialization: false
        print_hooks: false
    
    # ==========================================
    # DECODER NETWORK (Output Processing Stage)
    # ==========================================
    decoder_network:
      type: MLP                      # Options: "MLP", "identity"
      parameters:
        input_dim: null              # Will be set automatically
        hidden_dims: [32, 16]       # Hidden layer dimensions
        activation: relu
        output_dim: 10               # Will be set automatically
        
# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
train:
  seed: 0
  train_valid_split: 0.8
  
  # Performance optimization settings
  enable_amp: false
  enable_profiling: false
  enable_hooks: true
  
  # Checkpointing
  checkpointing:
    enabled: false
    save_every_n_epochs: 10
    checkpoint_dir: "outputs/checkpoints/"
  
  # Encoder training configuration
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 50
      early_stopping: false
      patience: 10
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false
  
  # Main network training
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01         # L2 regularization
    
    # Parameter groups with different learning rates
    param_groups:
      lr: 0.001                      # Default learning rate
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.0001
    
    trainer:
      loss_function: ce              # Loss function
      epochs: 100                    # Maximum epochs
      early_stopping: false         # Early stopping
      patience: 15                   # Patience
      batch_size: 128                # Batch size
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      save_path: null
      suppress_prints: false
      print_every: 10
      use_amp: false

# ============================================================================
# DATASET/TASK CONFIGURATION
# ============================================================================
task:
  dataset: multixor                  # Dataset: multixor, mnist, cifar10, etc.
  data_path: ""
  parameters:
    flatten: true
    normalize: false

# ============================================================================
# WANDB LOGGING
# ============================================================================
wandb:
  entity: 
  project: 
  group: 
  tags: []
  use_wandb: false

# ============================================================================
# ANALYSIS CONFIGURATION
# ============================================================================
analysis:
  performance_analysis:
    enabled: true
    training: true
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
      
  information_analysis:
    enabled: false                    # Enable for MI analysis (expensive)
    training: false
    params:
      method: kraskov                 # Options: "kraskov", "sklearn", "copula", "auto"
      max_samples: null               # Limit samples for computation
      n_neighbors: 10                 # For kraskov k-NN estimator
      n_bins: 20                      # For sklearn histogram
      copula_type: gaussian           # For copula method
      compute_basic_mi: true          # I(E;C), I(I;C), I(Vout;C)
      compute_pairwise_mi: true       # I(E;I), I(E;Vout), I(I;Vout)
      compute_conditional_mi: true    # I(E;I|C), I(E;Vout|C), etc.
      compute_pid: false              # Partial Information Decomposition
      pid_binarize: true
      pid_binarize_method: median     # Options: "median", "mean", "quantile"
      pid_binarize_threshold: 0.5
      include_vinf: true              # Include soma activation
      normalize_mi: false             # Normalize by entropy
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean        # Options: "mean", "max", "sum", "first", "none"

  synapse_turnover_analysis:
    enabled: false                    # Enable for synaptic plasticity analysis
    training: true
    snapshot_interval: 5              # Frequency of snapshots
    
  noise_perturbation_analysis:
    enabled: false                    # Enable for noise robustness testing
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
    
  ablation_analysis:
    enabled: false                    # Enable for component importance analysis
    training: false
    params:
      layer_ablation: true
      compartment_ablation: false
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
    
  weight_analysis:
    enabled: false                    # Enable for weight distribution analysis
    training: false
    params:
      synapse_weights: true
      branch_weights: true
    
  synaptic_activation_analysis:
    enabled: false                    # Enable for synaptic activity analysis
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
    
  branch_activation_analysis:
    enabled: false                    # Enable for dendritic activity analysis
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
    
  single_layer_contribution:
    enabled: false                    # Enable for layer importance analysis
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
    
  correlation_analysis:
    enabled: false                    # Enable for correlation studies
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
outputs:
  run_name: ei_sweep_run
  dir: results/