# ============================================================================
# Recurrent DendriNet with delayed soma-to-dendrite feedback
# ============================================================================
# Demonstrates optional previous-timestep soma output feeding back into
# dendritic branch levels. Disabled-by-default models remain unchanged.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/recurrent_soma_feedback.yaml
# ============================================================================

experiment:
  seed: 46
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "population_graph"
    population_graph:
      readout_population: "pyr"
      output_mode: "last"
      dt: 1.0
      connection_seed: 46
      population_defaults:
        ff_excitatory_synapses: 3
        ff_inhibitory_synapses: 0
        rec_excitatory_synapses: 2
        rec_inhibitory_synapses: 1
        somatic_synapses: true
        reactivate: true
        dbl_init_method: "default"
        weight_transform: "exp"
        soma_feedback_enabled: true
        soma_feedback_mode: "additive"      # additive, shunting, gated
        soma_feedback_source: "output"      # output, voltage, spike_readout
        soma_feedback_levels: "non_soma"    # non_soma, all, distal, proximal, soma, none
        soma_feedback_strength: 0.15
        soma_feedback_learnable_strength: true
        soma_feedback_per_level: true
        soma_feedback_init_std: 0.01
      cell_types:
        - name: "pyr"
          polarity: "excitatory"
          n_neurons: 32
          branch_factors: [2, 2]
        - name: "pv"
          polarity: "inhibitory"
          n_neurons: 8
          branch_factors: [1]
      connections:
        - source: "pv"
          target: "pyr"
          probability: 0.7
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 5
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
  routing:
    enabled: true
    training: false
