# ============================================================================
# PURE BENCHMARKING CONFIGURATION
# ============================================================================
# This configuration is optimized for maximum performance benchmarking.
# All analysis and monitoring features are disabled for pure speed testing.
#
# Use this to:
# - Test maximum training throughput
# - Benchmark different hardware configurations  
# - Compare performance across model sizes
# - Validate scaling behavior
# ============================================================================

model:
  task: classification
  base:
    output_layer: true
    output_dim: 10
  
  network:
    type: EINet
    params:
      input_dim: 784
      hidden_dims: [1024, 512, 256]  # Larger for meaningful benchmark
      
      ei_params:
        ei_balance: 0.8
        branches_per_neuron: 6
        synapses_per_branch: 96
        topk_value: 48
        input_mode: 1
        independent_pathways: true

train:
  run_name: "benchmark_performance_test"
  
  # ==========================================
  # MAXIMUM PERFORMANCE SETTINGS
  # ==========================================
  
  # All performance optimizations enabled
  enable_amp: true              # Mixed precision for speed
  enable_profiling: false       # Disabled - adds overhead
  enable_hooks: false           # Disabled - analysis overhead removed
  performance_mode: true        # Maximum performance mode
  use_fsdp: false              # Single GPU benchmark
  
  # Optimized training parameters
  main:
    trainer:
      epochs: 20                # Fewer epochs for throughput testing
      batch_size: 512           # Large batch for max throughput
      learning_rate: 0.001
      early_stopping: false     # Disabled for consistent benchmarking
      patience: 10
      grad_clip_value: 5.0
    
    optimizer:
      type: "adam"
      params:
        lr: 0.001
        weight_decay: 0.0001
        betas: [0.9, 0.999]
        eps: 1e-8
    
    # No scheduler for benchmark simplicity
    scheduler: null
  
  # No checkpointing to avoid I/O overhead
  checkpointing:
    enabled: false
  
  # No model saving during benchmark
  save_model: false
  save_results: false
  
  # Minimal logging for performance
  suppress_prints: true
  print_every: 50               # Very infrequent printing
  plot_losses: false

task:
  dataset: mnist
  
  preprocessing:
    normalize: true
    augmentation: false         # No augmentation for consistent timing
  
  data_loader:
    auto_optimize: true         # Will optimize for large dataset
  
  validation_split: 0.1         # Minimal validation for speed

# Minimal W&B logging (or disable completely)
wandb:
  enabled: false                # Disabled for pure benchmarking
  # If you need logging, uncomment and configure:
  # enabled: true
  # project: "dendritic-benchmarks"
  # entity: "your-wandb-entity"
  # tags: ["benchmark", "performance"]
  # log_freq: 1000              # Very infrequent logging
  # log_gradients: false
  # log_parameters: false
  # log_activations: false

# All analysis disabled for maximum performance
analysis:
  enabled: false                # Completely disabled
  
  # If you need minimal analysis, enable specific modules:
  # enabled: true
  # respect_hook_settings: true  # Will be skipped due to performance_mode
  # 
  # performance_analysis:
  #   enabled: true
  #   training: false
  #   params:
  #     memory_usage: true
  #     throughput: true
  #     gpu_utilization: true

outputs:
  dir: "./outputs/benchmarks/"
  
  # No cleanup during benchmarking
  cleanup:
    enabled: false

compute:
  device: "auto"
  
  memory:
    gradient_checkpointing: false  # Disabled for speed
    empty_cache_freq: 1000        # Very infrequent cache clearing
    max_memory_fraction: 0.95     # Use maximum available memory
  
  # No distributed settings for single GPU benchmark
  distributed: null

# ============================================================================
# BENCHMARKING NOTES
# ============================================================================
#
# PERFORMANCE METRICS TO MONITOR:
# - Samples per second
# - GPU utilization (should be >95%)
# - Memory usage
# - Time per epoch
# - Total training time
#
# SCALING BENCHMARKS:
# 1. Model Size Scaling:
#    - Increase hidden_dims: [512, 256, 128] → [2048, 1024, 512]
#    - Increase branches_per_neuron: 4 → 8 → 16
#    - Increase synapses_per_branch: 64 → 128 → 256
#
# 2. Batch Size Scaling:
#    - Test batch_size: 128, 256, 512, 1024, 2048
#    - Find optimal batch size for your hardware
#
# 3. Dataset Scaling:
#    - MNIST (small): Current config
#    - CIFAR10 (medium): input_dim=3072, output_dim=10
#    - CIFAR100 (larger): input_dim=3072, output_dim=100
#
# 4. Hardware Comparisons:
#    - Different GPU models
#    - Different CPU core counts
#    - Memory bandwidth effects
#
# EXPECTED THROUGHPUT (approximate):
# - Single GPU V100: ~5000-8000 samples/sec
# - Single GPU A100: ~8000-12000 samples/sec
# - CPU only: ~500-1000 samples/sec
#
# OPTIMIZATION CHECKLIST:
# ✓ Mixed precision enabled (enable_amp: true)
# ✓ Large batch size for GPU utilization
# ✓ All analysis disabled (analysis.enabled: false)
# ✓ All hooks disabled (performance_mode: true)
# ✓ No checkpointing I/O overhead
# ✓ No W&B logging overhead
# ✓ No plotting overhead
# ✓ No gradient checkpointing (trades speed for memory)
# ✓ Maximum memory utilization
# ============================================================================ 