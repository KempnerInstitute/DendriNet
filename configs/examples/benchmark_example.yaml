
model:
  task: classification
  
  # No encoder for pure benchmarking
  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]  # MNIST input
  
  # Core EI network optimized for benchmarking
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        output_activation: none
        
      # Larger architecture for meaningful benchmark
      excitatory_layer_sizes: [50, 40, 30]        # Large layers for benchmark
      inhibitory_layer_sizes: [15, 12, 8]         # Corresponding inhibitory layers
      excitatory_branch_factors: [6, 6, 4]        # More branches for complexity
      inhibitory_branch_factors: [3, 3, 2]        # Inhibitory branches
      
      # Rich connectivity for benchmarking
      ee_synapses_per_branch_per_layer: [12]      # More synapses per branch
      ei_synapses_per_branch_per_layer: [6]       # E-to-I connections
      ie_synapses_per_branch_per_layer: [3]       # I-to-E connections
      ii_synapses_per_branch_per_layer: [2]       # I-to-I connections
      
      # Morphological features
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_type: standard
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      
      # Implementation optimizations
      efficient_blocklinear: true
      adaptive_initialization: true
      print_hooks: false

  # Simple decoder for benchmark
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [16]         # Minimal decoder
      activation: relu
      output_dim: 10           # MNIST classes
      use_batch_norm: false
      dropout_rate: 0.0

train:
  
  # ==========================================
  # MAXIMUM PERFORMANCE SETTINGS
  # ==========================================
  
  # All performance optimizations enabled
  enable_amp: true              # Mixed precision for speed
  enable_profiling: false       # Disabled - adds overhead
  enable_hooks: false           # Disabled for maximum speed
  use_fsdp: false              # Single GPU benchmark
  
  # Skip encoder training for benchmarking
  encoder:
    load_save_root: saved_models/encoder
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0                 # Skip encoder training for identity encoder
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: true
      print_every: 50
  
  # Optimized training parameters
  main:
    learning_strategy: standard  # Supports regularization and pruning features
    weight_decay_rate: 0.1
    
    # Advanced training features (disabled by default for benchmarking)
    optimizer:
      name: "adam"
      lr: 0.001
      weight_decay: 0.1
    regularization:
      l1_weight: 0.0              # Disabled for benchmarking
      l2_weight: 0.0
    pruning:
      enabled: false              # Disabled for benchmarking
    reporting:
      report_non_pruned: false    # Disabled for benchmarking
      save_pruning_stats: false
      detailed_branch_report: false
    
    # Parameter groups optimized for speed
    param_groups:
      lr: 0.001                 # Default learning rate
      split_params: true        # Split parameters into groups (EINet)
      topk_lr: 0.001           # Learning rate for TopK layers
      blocklinear_lr: 0.001    # Learning rate for BlockLinear layers
      reactivation_lr: 0.001   # Learning rate for reactivation layers
      decoder_lr: 0.001        # Learning rate for decoder network
    
    trainer:
      loss_function: cat_nll    # Loss function for classification
      epochs: 20                # Fewer epochs for throughput testing
      batch_size: 512           # Large batch for max throughput
      early_stopping: false     # Disabled for consistent benchmarking
      patience: 10
      grad_clip_value: 5.0
      shuffle: true
      load_best_state_dict: true
      plot_losses: false        # Disabled for performance
      suppress_prints: true
      print_every: 50           # Very infrequent printing
  
  # No checkpointing to avoid I/O overhead
  checkpointing:
    enabled: false
  
  # No model saving during benchmark (these are not valid TrainConfig parameters)
  # save_model: false
  # save_results: false
  
  # Note: suppress_prints is not a valid TrainConfig parameter
  # Minimal logging configured in trainer configs above

task:
  dataset: mnist
  data_path: ""
  parameters:
    normalize: true
    augmentation: false         # No augmentation for consistent timing
    auto_optimize: true         # Will optimize for large dataset
    validation_split: 0.1       # Minimal validation for speed

# Minimal W&B logging (or disable completely)
wandb:
  enabled: false                # Disabled for pure benchmarking
  # If you need logging, uncomment and configure:
  # enabled: true
  # project: "dendritic-benchmarks"
  # entity: "your-wandb-entity"
  # tags: ["benchmark", "performance"]
  # log_freq: 1000              # Very infrequent logging
  # log_gradients: false
  # log_parameters: false
  # log_activations: false

# All analysis disabled for maximum performance
analysis:
  # All analyses disabled for maximum benchmarking performance
  performance_analysis:
    enabled: false
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  
  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean
  
  synapse_turnover_analysis:
    enabled: false
    training: false
    
  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  
  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  
  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      
  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
      
  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
      
  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
      
  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true


outputs:
  run_name: "benchmark_performance_test"
  dir: "./outputs/benchmarks/"
  dataset_dir: ""                         # Optional: separate directory for shared datasets
  
