# ============================================================================
# Population Network Normalized Additive MNIST DendriNet
# ============================================================================
# Population-format normalized additive MNIST example. It keeps legacy
# input_mode=1 transfer semantics while making additive inhibition explicit at
# the population level:
#   use_shunting: false
#   use_additive_normalization: true
#   reactivation_init_policy: occupancy_quantile
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_normalized_additive_mnist.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: false
  checkpointing:
    enabled: false

data:
  dataset_name: "mnist"
  processing:
    flatten: true
    normalize: true

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "population_network"
    population_network:
      use_transfer: true
      transfer_params:
        input_mode: 1
        independent_pathways: false
        output_activation: "relu"
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 30
            ff_inhibitory_synapses: 15
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: false
            use_shunting: false
            use_additive_normalization: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            reactivation_occupancy_quantile_low: 0.1
            reactivation_occupancy_quantile_high: 0.9
            reactivation_occupancy_target_low: 0.1
            reactivation_occupancy_target_high: 0.9
            reactivation_init_m: 1.5
            reactivation_init_b: 0.5
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
            blocklinear_strategy: "none"
            reactivation_strategy: "none"
            efficient_blocklinear: false
          populations:
            - name: "e"
              polarity: "excitatory"
              n_neurons: 128
              branch_factors: [4, 4]
          connections:
            - source: "input_e"
              target: "e"
            - source: "input_i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 10

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "standard"
    common:
      epochs: 50
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 20
      load_best_state_dict: true
      recalibrate_reactivation_every: 0
      weight_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_normalized_additive_mnist"
  results_dir: "outputs"

distributed:
  mode: none
