# ============================================================================
# Population Network Local Credit Assignment on MNIST
# ============================================================================
# Trains a population network with local credit-assignment rules instead of
# end-to-end backpropagation through the core. The decoder is still trained
# with backpropagation.
#
# Run:
#   dendritic-train configs/examples/population_network_local_learning_mnist.yaml
# ============================================================================

config_version: 4

experiment:
  seed: 42
  train_valid_split: 0.8
  checkpointing:
    enabled: false

data:
  dataset_name: "mnist"
  processing:
    flatten: true
    normalize: false

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    biological_neuron: false  # Preserve this example's historical model contract.
    type: "population_network"
    population_network:
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 40
            ff_inhibitory_synapses: 10
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_memory_efficient: true
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "indexed_rewire"
            topk_init_method: "xavier_normal"
            indexed_index_dtype: "auto"
            indexed_projection_backend: "recompute"
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: null
            indexed_output_chunk_size: 2048
            efficient_blocklinear: true
          populations:
            - name: "i"
              polarity: "inhibitory"
              n_neurons: 32
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
            - name: "e"
              polarity: "excitatory"
              n_neurons: 128
              branch_factors: [3, 3]
          connections:
            - source: "input"
              target: "i"
            - source: "input"
              target: "e"
            - source: "i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "local_ca"
    common:
      epochs: 200
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 100
      load_best_state_dict: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    # Local rule settings for training.main.strategy: local_ca. The shorthands
    # "3f_vh" / "4f_vh" / "5f_vh" add the local voltage-homeostasis term to
    # the three-, four- or five-factor rule.
    learning_strategy_config:
      rule_variant: "4f_vh"
      error_mode: "auto"
      error_broadcast_mode: "per_soma_shared"
      broadcast_bandwidth: "full"       # "full" | "sign_only" | "quantized" | "sparse_topk"
      # local_ca only: how explicit inhibitory populations learn. "local_ca"
      # updates them with the rule used for the excitatory dendrites; "freeze"
      # keeps them fixed while the excitatory cells' I-to-E synapses still learn.
      explicit_inhibitory_update_mode: "local_ca"
      three_factor:
        dynamics_mode: "auto"
        use_conductance_scaling: true
        use_driving_force: true
      four_factor:
        rho_mode: "dot"
        rho_estimator: "ema"
        ema_alpha: 0.05
      voltage_homeostasis:
        enabled: true
        weight: 0.02
        target_voltage: 0.5
      hsic:
        enabled: true
        weight: 0.01
        kernel: "rbf"
      decoder_update_mode: "backprop"

analysis:
  performance:
    enabled: true
    params:
      accuracy: true
  information:
    enabled: true
    params:
      selection:
        components: ["basic"]
      estimator:
        method: "kraskov"
  synapse_turnover:
    enabled: true
    training: true
    params:
      snapshot_interval: 10


outputs:
  run_name: "population_network_local_learning_mnist"
  results_dir: "outputs"

distributed:
  mode: none
