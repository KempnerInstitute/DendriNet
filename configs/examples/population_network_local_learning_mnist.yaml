# ============================================================================
# Population Network Local Credit Assignment on MNIST
# ============================================================================
# Trains a DendriNet with biologically plausible local learning rules instead
# of end-to-end backpropagation through the core. The decoder is still trained
# with backprop.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_local_learning_mnist.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "mnist"
  processing:
    flatten: true
    normalize: false

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "population_network"
    population_network:
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 40
            ff_inhibitory_synapses: 10
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            reactivation_init_m: 1.5
            reactivation_init_b: 0.5
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
          populations:
            - name: "i"
              polarity: "inhibitory"
              n_neurons: 32
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
            - name: "e"
              polarity: "excitatory"
              n_neurons: 128
              branch_factors: [3, 3]
          connections:
            - source: "input"
              target: "i"
            - source: "input"
              target: "e"
            - source: "i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 10

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "local_ca"
    common:
      epochs: 200
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 100
      load_best_state_dict: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    # Canonical local rule config for training.main.strategy = "local_ca".
    # You can also use the readable shorthand "3f_vh" / "4f_vh" / "5f_vh"
    # to enable the strictly local voltage-homeostasis modifier.
    learning_strategy_config:
      rule_variant: "4f_vh"
      error_mode: "auto"
      error_broadcast_mode: "per_soma"
      broadcast_bandwidth: "full"       # "full" | "sign_only" | "quantized" | "sparse_topk"
      # LocalCA-only policy for explicit inhibitory DendriNet populations:
      # "local_ca" updates them with the same rule used for E-cell dendrites;
      # "freeze" leaves them fixed while E-cell I-to-E synapses still learn.
      explicit_inhibitory_update_mode: "local_ca"
      three_factor:
        dynamics_mode: "auto"
        use_conductance_scaling: true
        use_driving_force: true
      four_factor:
        rho_mode: "dot"
        rho_estimator: "ema"
        ema_alpha: 0.05
      voltage_homeostasis:
        enabled: true
        weight: 0.02
        target_voltage: 0.5
      hsic:
        enabled: true
        weight: 0.01
        kernel: "rbf"
      decoder_update_mode: "backprop"

analysis:
  performance:
    enabled: true
    params:
      accuracy: true
  information:
    enabled: true
    params:
      selection:
        components: ["basic"]
      estimator:
        method: "kraskov"
  synapse_turnover:
    enabled: true
    training: true
    params:
      snapshot_interval: 10

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_local_learning_mnist"
  results_dir: "outputs"

distributed:
  mode: none
