# Multiple non-adjacent FFNs distilled together. Launch with torchrun. The full
# frozen teacher and every replacement are replicated on every rank.
experiment:
  seed: 4102

model:
  task: language_modeling
  transformer_replacement:
    enabled: true
    model_name: allenai/OLMo-2-0425-1B
    layers: [0, 4, 8, 12, 15]
    target_module: mlp
    layers_attr: model.layers
    input_transform: identity
    preserve_device_dtype: true
    model_kwargs:
      trust_remote_code: true
      torch_dtype: auto
    replacement_kwargs:
      kind: gated_dendritic_ffn
      gate_activation: silu
      teacher_topk_init: true
      output_topk: 6144
      output_init_std: 0.02
      pre_norm: false
  core:
    type: dendritic_ffn
    population_network:
      input_transform: identity
      layers:
        - name: transformer_mlp
          readout_population: ffn
          population_defaults:
            ff_excitatory_synapses: 1536
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: false
            reactivate: false
            weight_transform: identity
            topk_type: indexed_rewire
            topk_init_method: xavier_normal
            indexed_seed: 4102
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: 200
            indexed_output_chunk_size: 256
            efficient_blocklinear: true
          populations:
            - name: ffn
              polarity: excitatory
              n_neurons: 8192
              branch_factors: []
          connections:
            - source: input
              target: ffn

training:
  main:
    optimizer:
      name: adamw
      lr: 0.00003
      weight_decay: 0.0
  transformer_replacement:
    enabled: true
    mode: layerwise_distillation
    teacher_source: hf_text
    train_target: replacement_only
    layers: [0, 4, 8, 12, 15]
    distributed_mode: ddp
    device: auto
    dtype: bfloat16
    use_amp: false
    sequence_length: 128
    train_samples: 16384
    valid_samples: 32
    batch_size: 1
    max_steps: 400
    eval_every: 50
    log_every: 10
    loss: relative_mse
    cosine_weight: 0.1
    reactivation_calibration_enabled: false
    checkpoint_every: 50
    replacement_checkpoint_encoding: bitmask
    save_dir: results/examples/olmo2_1b_multi_ffn_layerwise_ddp
    save_replacements: true
    text:
      dataset_name: allenai/dolmino-mix-1124
      dataset_config: default
      split: train
      text_field: text
      streaming: true
      shuffle_seed: 4102
      shuffle_buffer_size: 10000
      validation_documents: 64
      tokenizer_name: allenai/OLMo-2-0425-1B
      max_documents: 4000
