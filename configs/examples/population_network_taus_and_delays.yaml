# ============================================================================
# Population Network: Taus and Delayed Recurrent Edges
# ============================================================================
# Shows where temporal constants live:
# - layer dt controls the recurrent update step
# - population tau_base/tau_ratio or level_taus control dendritic trace decay
# - connection timing: delayed reads previous-timestep population outputs
# - synapse_types tau_rise/tau_decay control receptor-like conductance traces
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_taus_and_delays.yaml
# ============================================================================

experiment:
  seed: 44
  train_valid_split: 0.8
  enable_hooks: false
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "population_network"
    population_network:
      output_mode: "last"
      layers:
        - name: "microcircuit"
          recurrent: true
          readout_population: "pyr"
          dt: 0.5
          connection_seed: 44
          population_defaults:
            ff_excitatory_synapses: 3
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "indexed_rewire"
            topk_init_method: "xavier_normal"
            indexed_seed: 44
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: null
            indexed_output_chunk_size: 2048
            blocklinear_strategy: "none"
            reactivation_strategy: "none"
            efficient_blocklinear: true
            tau_base: 20.0
            tau_ratio: 2.0
            learnable_tau: false
            synapse_types:
              enabled: true
              excitatory:
                - name: "AMPA"
                  fraction: 0.75
                  tau_rise: 0.5
                  tau_decay: 2.0
                  reversal_potential: 1.0
                - name: "NMDA"
                  fraction: 0.25
                  tau_rise: 3.0
                  tau_decay: 70.0
                  reversal_potential: 1.0
                  magnesium_block: true
              inhibitory:
                - name: "GABA_A"
                  fraction: 1.0
                  tau_rise: 1.0
                  tau_decay: 7.0
                  reversal_potential: 0.0
          populations:
            - name: "pyr"
              polarity: "excitatory"
              n_neurons: 32
              branch_factors: [2, 2]
              population:
                ff_inhibitory_synapses: 1
                rec_excitatory_synapses: 2
                rec_inhibitory_synapses: 1
            - name: "pv"
              polarity: "inhibitory"
              n_neurons: 8
              branch_factors: [1]
              population:
                level_taus: [5.0, 5.0]
          connections:
            - source: "input"
              target: "pyr"
            - source: "input"
              target: "pv"
            - source: "pv"
              target: "pyr"
            - source: "pyr"
              target: "pyr"
              timing: "delayed"
              probability: 0.6
            - source: "pv"
              target: "pyr"
              timing: "delayed"
              probability: 0.7
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 5
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      weight_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      recurrent: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_taus_and_delays"
  results_dir: "outputs"

distributed:
  mode: none
