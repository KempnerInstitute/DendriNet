# ============================================================================
# Spiking population graph DendriNet
# ============================================================================
# Demonstrates LIF soma dynamics with a rate-decoded spike trace for the
# downstream classifier.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/recurrent_spiking_population_graph.yaml
# ============================================================================

experiment:
  seed: 45
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "population_graph"
    population_graph:
      readout_population: "pyr"
      output_mode: "last"
      dt: 1.0
      connection_seed: 45
      population_defaults:
        ff_excitatory_synapses: 3
        ff_inhibitory_synapses: 0
        rec_excitatory_synapses: 2
        rec_inhibitory_synapses: 1
        somatic_synapses: true
        reactivate: true
        dbl_init_method: "default"
        weight_transform: "exp"
        dynamics_mode: "spike"
        spike_threshold: 0.25
        spike_reset: 0.0
        spike_tau: 12.0
        spike_refractory_steps: 1
        spike_surrogate_beta: 10.0
        spike_readout: "rate"
        spike_readout_tau: 20.0
      cell_types:
        - name: "pyr"
          polarity: "excitatory"
          n_neurons: 32
          branch_factors: [2, 2]
        - name: "pv"
          polarity: "inhibitory"
          n_neurons: 8
          branch_factors: [1]
      connections:
        - source: "pv"
          target: "pyr"
          probability: 0.7
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 5
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
  routing:
    enabled: true
    training: false
  spike_train:
    enabled: true
    training: false
    params:
      max_samples: 128
      include_raster: true
      max_raster_samples: 8
      include_per_timestep_rate: true

wandb:
  use_wandb: false

outputs:
  run_name: "recurrent_spiking_population_graph"
  results_dir: "outputs"

distributed:
  mode: none
