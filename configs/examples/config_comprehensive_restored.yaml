# ============================================================================
# ANALYSIS CONFIGURATION - RESTORED & ENHANCED
# ============================================================================
analysis:
  # NEW: Performance-aware analysis
  enabled: true
  respect_hook_settings: true  # Skip analysis if hooks disabled

  # RESTORED: All original analysis modules
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false
      # NEW: Additional performance metrics
      memory_usage: true
      throughput: true
      gpu_utilization: true

  synapse_turnover_analysis:
    enabled: false
    training: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      categorical_loglikelihood: true

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      categorical_loglikelihood: true

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 2

  single_layer_contribution:
    enabled: false
    training: false
    params:
      save_plots: true
      save_csv: true

  # RESTORED: Information-theoretic analysis with all parameters
  information_analysis:
    enabled: false
    training: false
    params:
      method: "kraskov"           # Estimation method
      max_samples: 100           # Maximum samples for computation
      n_neighbors: 10            # For Kraskov k-NN estimator
      n_bins: 20                # For histogram method
      copula_type: "gaussian"    # For copula method
      
      # Information metrics to compute
      compute_basic_mi: true
      compute_pairwise_mi: false
      compute_conditional_mi: false
      compute_pid: false
      
      # PID-specific options
      pid_binarize: true
      pid_binarize_method: "median"
      pid_binarize_threshold: 0.5
      
      # Additional options
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: none

