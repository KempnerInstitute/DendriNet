# Simplified Configuration Example
# Demonstrates reduced verbosity and better defaults

# Model: EINet with sensible defaults
model:
  task: classification
  
  core_network:
    type: EINet
    parameters:
      # Architecture (most common settings)
      excitatory_layer_sizes: [32, 16]
      inhibitory_layer_sizes: [24, 12] 
      excitatory_branch_factors: [4, 2]
      inhibitory_branch_factors: [2, 1]
      
      # Connectivity (reasonable defaults)
      ee_synapses_per_branch_per_layer: [20, 15]
      ei_synapses_per_branch_per_layer: [30, 20]
      ie_synapses_per_branch_per_layer: [5, 3]
      
      # Transfer function (simple setup)
      transfer_params:
        input_mode: 0
        independent_pathways: false
      
      # Use defaults for most other parameters
      reactivate: true
      use_shunting: true
      topk_type: standard

# Training: Focus on key parameters
train:
  seed: 42
  run_name: "simplified_experiment"
  
  main:
    learning_strategy: standard
    
    trainer:
      epochs: 20
      batch_size: 64
      use_amp: false  # Enable for speed on compatible hardware
      grad_clip_value: 5.0

# Dataset: Essential settings only
task:
  dataset: mnist
  parameters:
    flatten: true

# Minimal analysis and output settings
analysis:
  run_analysis: false

wandb:
  use_wandb: false

outputs:
  dir: "results/" 