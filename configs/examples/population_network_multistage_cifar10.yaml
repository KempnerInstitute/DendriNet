# ============================================================================
# Population Network Multi-stage Training on CIFAR-10
# ============================================================================
# Stage 1: Standard backprop for 100 epochs (fast convergence)
# Stage 2: Local credit assignment for 100 epochs (biologically plausible)
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/population_network_multistage_cifar10.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: true
    save_every_n_epochs: 50
    checkpoint_dir: "outputs/checkpoints/"

data:
  dataset_name: "cifar10"
  processing:
    flatten: true
    normalize: true

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "population_network"
    population_network:
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 40
            ff_inhibitory_synapses: 10
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
          populations:
            - name: "i"
              polarity: "inhibitory"
              n_neurons: 64
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
            - name: "e"
              polarity: "excitatory"
              n_neurons: 256
              branch_factors: [3, 3]
          connections:
            - source: "input"
              target: "i"
            - source: "input"
              target: "e"
            - source: "i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [64]
      output_dim: 10

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "multi_stage"
    common:
      epochs: 200                       # fallback if stage doesn't specify
      batch_size: 512
      loss_function: "ce"
      grad_clip_value: 5.0
      param_groups:
        lr: 0.001
        split_params: true
    optimizer:
      name: "adam"
    strategies:
      multi_stage:
        analyze_between_stages: true
        use_best_from_each_stage: true
        continue_on_failure: false
        stages:
          - learning_strategy: "standard"
            stage_name: "backprop_warmup"
            epochs: 100
            batch_size: 512
            save_checkpoint: true
            param_groups:
              lr: 0.001
              split_params: true
              topk_lr: 0.001
              blocklinear_lr: 0.0001
              reactivation_lr: 0.0001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: true
              patience: 50
          - learning_strategy: "local_ca"
            stage_name: "vhomeo_warmup"
            epochs: 40
            batch_size: 512
            reset_optimizer: true
            save_checkpoint: true
            param_groups:
              lr: 0.0002
              split_params: true
              topk_lr: 0.0002
              blocklinear_lr: 0.00002
              reactivation_lr: 0.00002
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: false
            local_rule_config:
              rule_variant: "5f_vh"
              error_broadcast_mode: "per_soma"
              voltage_homeostasis:
                enabled: true
                weight: 0.05
                target_voltage: 0.5
          - learning_strategy: "local_ca"
            stage_name: "local_finetuning"
            epochs: 60
            batch_size: 512
            reset_optimizer: true
            save_checkpoint: true
            param_groups:
              lr: 0.0001
              split_params: true
              topk_lr: 0.0001
              blocklinear_lr: 0.00001
              reactivation_lr: 0.00001
              decoder_lr: 0.001
            trainer_config:
              loss_function: "ce"
              early_stopping: false
            local_rule_config:
              rule_variant: "5f_vh"
              error_broadcast_mode: "per_soma"
              voltage_homeostasis:
                enabled: true
                weight: 0.01
                target_voltage: 0.5

analysis:
  performance:
    enabled: true
    params:
      accuracy: true
      auc: true
  information:
    enabled: true
    params:
      selection:
        components: ["basic"]
  ablation:
    enabled: true
    params:
      selection:
        levels: ["layer"]
        targets: ["excitation", "inhibition"]
        metrics: ["accuracy"]

wandb:
  use_wandb: false

outputs:
  run_name: "population_network_multistage_cifar10"
  results_dir: "outputs"

distributed:
  mode: none
