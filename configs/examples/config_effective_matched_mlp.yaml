# Example configuration for EffectiveMatchedParamMLP
# This demonstrates the new sparse-matched MLP that accounts for TopK sparsity

model:
  task: classification
  encoder_network:
    type: identity
    parameters: {}
  core_network:
    type: EffectiveMatchedParamMLP  # New sparse-matched MLP type
    parameters:
      # Same EINet parameters used for effective parameter calculation
      input_dim: 784
      excitatory_layer_sizes: [256, 128, 10]
      inhibitory_layer_sizes: [128, 64]
      excitatory_branch_factors: [4, 2]
      inhibitory_branch_factors: [2, 1]
      ee_synapses_per_branch_per_layer: [20, 10]
      ei_synapses_per_branch_per_layer: [10, 5]
      ie_synapses_per_branch_per_layer: [5, 3]
      # MLP-specific parameters
      activation: relu
      reactivate: true
      somatic_synapses: true
  decoder_network:
    type: identity
    parameters: {}

task:
  dataset: mnist
  data_path: ./data
  parameters:
    flatten: true

train:
  seed: 42
  train_valid_split: 0.8
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.001
      split_params: false
    
    trainer:
      loss_function: cat_nll
      epochs: 20
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0

outputs:
  run_name: effective_matched_mlp_example
  dir: results/

# Analysis comparison with other models
analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean

  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true
      save_plots: true 