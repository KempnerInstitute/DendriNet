# ============================================================================
# FSDP (Fully Sharded Data Parallel) EXAMPLE CONFIGURATION
# ============================================================================
# This configuration demonstrates FSDP training for large dendritic models
# across multiple GPUs. Use this for models too large to fit on a single GPU.
#
# Usage:
#   Single node, multiple GPUs:
#   torchrun --nproc_per_node=4 src/dendritic_modeling/scripts/train_experiments.py configs/examples/fsdp_example.yaml
#
#   Multiple nodes:
#   torchrun --nnodes=2 --nproc_per_node=4 --master_addr=NODE0_IP --master_port=29500 \
#            src/dendritic_modeling/scripts/train_experiments.py configs/examples/fsdp_example.yaml
# ============================================================================

model:
  task: classification
  
  # Encoder network for preprocessing
  encoder_network:
    type: identity  # No preprocessing for direct FSDP training
    parameters:
      input_shape: [3, 32, 32]  # CIFAR100 input

  # Core EI network - large for FSDP demonstration
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        output_activation: none
        
      # Large morphological architecture for FSDP
      excitatory_layer_sizes: [100, 80, 60, 40]    # Large layers for multi-GPU
      inhibitory_layer_sizes: [25, 20, 15, 10]     # Corresponding inhibitory layers
      excitatory_branch_factors: [8, 8, 6, 4]      # More branches for complexity
      inhibitory_branch_factors: [4, 4, 3, 2]      # Inhibitory branches
      
      # Rich connectivity for large model
      ee_synapses_per_branch_per_layer: [16]       # More synapses per branch
      ei_synapses_per_branch_per_layer: [8]        # E-to-I connections
      ie_synapses_per_branch_per_layer: [4]        # I-to-E connections
      ii_synapses_per_branch_per_layer: [2]        # I-to-I connections
      
      # Morphological features
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_type: standard
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # Gradient scaling
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      
      # Implementation optimizations
      efficient_blocklinear: true
      adaptive_initialization: true
      print_hooks: false

  # Decoder network
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [64, 32]  # Decoder layers
      activation: relu
      output_dim: 100        # CIFAR100 classes
      use_batch_norm: false
      dropout_rate: 0.0

train:
  run_name: "fsdp_large_ei_cifar100"
  
  # ==========================================
  # FSDP-SPECIFIC SETTINGS
  # ==========================================
  use_fsdp: true              # Enable FSDP
  
  # FSDP configuration
  fsdp_config:
    mixed_precision: true     # Use mixed precision with FSDP
    gradient_checkpointing: true  # Save memory by recomputing gradients
    cpu_offload: false        # Keep on GPU for speed (set true if memory constrained)
    sharding_strategy: "full" # "full" or "grad_op" sharding
    min_num_params: 1000000   # Minimum parameters to shard a module
  
  # Performance optimizations for large scale
  enable_amp: true            # Mixed precision (works with FSDP)
  enable_profiling: false     # Disable profiling for max performance
  enable_hooks: true          # Keep analysis capability for research insights
  
  # Encoder training (skip for identity encoder)
  encoder:
    load_save_root: saved_models/encoder
    lr: 0.001
    trainer:
      loss_function: mse
      epochs: 0               # Skip encoder training for identity encoder
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 10
  
  # Training parameters optimized for large models
  main:
    learning_strategy: standard  # Learning strategy for EI network
    weight_decay_rate: 0.1
    
    # Parameter groups with different learning rates
    param_groups:
      lr: 0.0005              # Default learning rate
      split_params: true      # Split parameters into groups (EINet)
      topk_lr: 0.0001         # Lower LR for TopK layers in large models
      blocklinear_lr: 0.0002  # Lower LR for BlockLinear layers
      reactivation_lr: 0.0003 # Learning rate for reactivation layers
      decoder_lr: 0.0005      # Learning rate for decoder network
    
    trainer:
      loss_function: cat_nll  # Loss function for classification
      epochs: 50              # Fewer epochs for large model experimentation
      batch_size: 64          # Per-GPU batch size (effective = 64 * num_gpus)
      early_stopping: true
      patience: 10
      grad_clip_value: 1.0    # More conservative gradient clipping
      shuffle: true
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 5          # More frequent logging for monitoring
  
  # Checkpointing is crucial for long FSDP runs
  checkpointing:
    enabled: true
    save_every_n_epochs: 5    # More frequent checkpoints
    checkpoint_dir: "outputs/fsdp_checkpoints/"
    keep_last_n: 3           # Keep fewer checkpoints to save space
  
  # save_model: true     # Not a valid TrainConfig parameter
  # save_results: true   # Not a valid TrainConfig parameter
  
  # Note: suppress_prints is not a valid TrainConfig parameter
  # Logging configuration is handled in trainer configs above

task:
  dataset: cifar100          # More complex dataset for large model
  data_path: ""
  parameters:
    normalize: true
    augmentation: true       # Data augmentation for better generalization
    auto_optimize: true      # Will use more workers for large datasets
    validation_split: 0.1    # Smaller validation split for more training data

wandb:
  enabled: true
  project: "dendritic-fsdp-experiments"
  entity: "your-wandb-entity"
  tags: ["fsdp", "large-model", "ei-network", "cifar100"]
  # notes: "Large EI network trained with FSDP on multiple GPUs"  # Not a valid WandbConfig parameter
  
  log_freq: 50               # Less frequent logging to reduce overhead
  log_gradients: false       # Disable gradient logging for performance
  log_parameters: false      # Disable parameter logging for performance
  log_activations: false

analysis:
  # Focus on essential analysis for large models
  performance_analysis:
    enabled: true
    training: false          # Run post-training to avoid slowdown
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
  
  information_analysis:
    enabled: true
    training: false
    params:
      method: kraskov
      max_samples: 500
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: false
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean
  
  synapse_turnover_analysis:
    enabled: false
    training: false
    
  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  
  # Disable expensive analysis for large models
  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
  
  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true
      
  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
      
  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5
      
  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true
      
  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true
      save_plots: true

outputs:
  run_name: "fsdp_large_ei_cifar100"
  dir: "./outputs/fsdp_runs/"  # Separate directory for FSDP runs
  
  # Note: cleanup and subdirs are not valid OutputsConfig parameters

# Note: compute configuration is not part of the main Config class
# These settings would be handled by the training scripts directly

# ============================================================================
# FSDP USAGE NOTES
# ============================================================================
#
# SYSTEM REQUIREMENTS:
# - PyTorch >= 1.13 with FSDP support
# - Multiple GPUs (minimum 2, recommended 4-8)
# - Sufficient CPU memory for data loading
# - Fast interconnect between GPUs (NVLink recommended)
#
# PERFORMANCE TIPS:
# - Adjust batch_size based on GPU memory and model size
# - Enable gradient_checkpointing if running out of memory
# - Use cpu_offload only if absolutely necessary (slower)
# - Monitor GPU utilization - should be >90% during training
#
# SCALING GUIDELINES:
# - 2-4 GPUs: Use this config as-is
# - 8+ GPUs: Increase batch_size to 128-256 per GPU
# - Multiple nodes: Ensure high-speed interconnect between nodes
#
# TROUBLESHOOTING:
# - Out of memory: Enable cpu_offload or reduce batch_size
# - Slow training: Disable unnecessary analysis during training
# - Communication issues: Check network configuration and timeouts
# ============================================================================ 