# ============================================================================
# FSDP (Fully Sharded Data Parallel) EXAMPLE CONFIGURATION
# ============================================================================
# This configuration demonstrates FSDP training for large dendritic models
# across multiple GPUs. Use this for models too large to fit on a single GPU.
#
# Usage:
#   Single node, multiple GPUs:
#   torchrun --nproc_per_node=4 src/dendritic_modeling/scripts/train_experiments.py configs/examples/fsdp_example.yaml
#
#   Multiple nodes:
#   torchrun --nnodes=2 --nproc_per_node=4 --master_addr=NODE0_IP --master_port=29500 \
#            src/dendritic_modeling/scripts/train_experiments.py configs/examples/fsdp_example.yaml
# ============================================================================

model:
  task: classification
  base:
    output_layer: true
    output_dim: 100  # CIFAR100 for more complexity
  
  network:
    type: EINet
    params:
      input_dim: 3072  # CIFAR100: 32x32x3
      hidden_dims: [2048, 1024, 512, 256]  # Large architecture
      
      ei_params:
        ei_balance: 0.8
        branches_per_neuron: 8    # More branches for complexity
        synapses_per_branch: 128  # More synapses per branch
        topk_value: 64           # Higher connectivity
        input_mode: 1
        independent_pathways: true

train:
  run_name: "fsdp_large_ei_cifar100"
  
  # ==========================================
  # FSDP-SPECIFIC SETTINGS
  # ==========================================
  use_fsdp: true              # Enable FSDP
  
  # FSDP configuration
  fsdp_config:
    mixed_precision: true     # Use mixed precision with FSDP
    gradient_checkpointing: true  # Save memory by recomputing gradients
    cpu_offload: false        # Keep on GPU for speed (set true if memory constrained)
    sharding_strategy: "full" # "full" or "grad_op" sharding
    min_num_params: 1000000   # Minimum parameters to shard a module
  
  # Performance optimizations for large scale
  enable_amp: true            # Mixed precision (works with FSDP)
  enable_profiling: false     # Disable profiling for max performance
  enable_hooks: true          # Keep analysis capability
  performance_mode: false     # Keep analysis for research insights
  
  # Training parameters optimized for large models
  main:
    trainer:
      epochs: 50              # Fewer epochs for large model experimentation
      batch_size: 64          # Per-GPU batch size (effective = 64 * num_gpus)
      learning_rate: 0.0005   # Lower LR for large models
      early_stopping: true
      patience: 10
      grad_clip_value: 1.0    # More conservative gradient clipping
    
    optimizer:
      type: "adamw"           # AdamW often better for large models
      params:
        lr: 0.0005
        weight_decay: 0.01    # Higher weight decay for regularization
        betas: [0.9, 0.95]    # Beta2 often tuned lower for large models
        eps: 1e-8
    
    scheduler:
      type: "cosine"
      params:
        T_max: 50
        eta_min: 0.00001
  
  # Checkpointing is crucial for long FSDP runs
  checkpointing:
    enabled: true
    save_every_n_epochs: 5    # More frequent checkpoints
    checkpoint_dir: "outputs/fsdp_checkpoints/"
    keep_last_n: 3           # Keep fewer checkpoints to save space
  
  save_model: true
  save_results: true
  
  # Logging
  suppress_prints: false
  print_every: 5             # More frequent logging for monitoring
  plot_losses: true

task:
  dataset: cifar100          # More complex dataset for large model
  
  preprocessing:
    normalize: true
    augmentation: true       # Data augmentation for better generalization
  
  data_loader:
    auto_optimize: true      # Will use more workers for large datasets
  
  validation_split: 0.1      # Smaller validation split for more training data

wandb:
  enabled: true
  project: "dendritic-fsdp-experiments"
  entity: "your-wandb-entity"
  tags: ["fsdp", "large-model", "ei-network", "cifar100"]
  notes: "Large EI network trained with FSDP on multiple GPUs"
  
  log_freq: 50               # Less frequent logging to reduce overhead
  log_gradients: false       # Disable gradient logging for performance
  log_parameters: false      # Disable parameter logging for performance
  log_activations: false

analysis:
  enabled: true
  respect_hook_settings: true
  
  # Focus on essential analysis for large models
  performance_analysis:
    enabled: true
    training: false          # Run post-training to avoid slowdown
    params:
      memory_usage: true
      throughput: true
      gpu_utilization: true
      distributed_metrics: true  # FSDP-specific metrics
  
  information_analysis:
    enabled: true
    training: false
    params:
      mutual_information: true
      entropy: true
      information_flow: true
      save_plots: true
      samples: 500           # Fewer samples for faster analysis
  
  # Disable expensive analysis for large models
  ablation_analysis:
    enabled: false
  
  connectivity_analysis:
    enabled: true
    training: false
    params:
      sparsity_patterns: true
      connection_strength: true
      topk_analysis: true

outputs:
  dir: "./outputs/fsdp_runs/"  # Separate directory for FSDP runs
  
  cleanup:
    enabled: true
    old_runs_days: 14        # Shorter retention for large files
    wandb_cleanup: true
  
  subdirs:
    models: "models/"
    logs: "logs/"
    analysis: "analysis/"
    visualizations: "plots/"
    profiling: "profiling/"
    checkpoints: "checkpoints/"

compute:
  device: "auto"             # Will use all available GPUs
  
  memory:
    gradient_checkpointing: true   # Essential for large models
    empty_cache_freq: 50          # More frequent cache clearing
    max_memory_fraction: 0.85     # Leave some memory for FSDP overhead
  
  distributed:
    backend: "nccl"               # Best for multi-GPU training
    timeout_minutes: 60           # Longer timeout for large model communication
    find_unused_parameters: false # FSDP handles this automatically

# ============================================================================
# FSDP USAGE NOTES
# ============================================================================
#
# SYSTEM REQUIREMENTS:
# - PyTorch >= 1.13 with FSDP support
# - Multiple GPUs (minimum 2, recommended 4-8)
# - Sufficient CPU memory for data loading
# - Fast interconnect between GPUs (NVLink recommended)
#
# PERFORMANCE TIPS:
# - Adjust batch_size based on GPU memory and model size
# - Enable gradient_checkpointing if running out of memory
# - Use cpu_offload only if absolutely necessary (slower)
# - Monitor GPU utilization - should be >90% during training
#
# SCALING GUIDELINES:
# - 2-4 GPUs: Use this config as-is
# - 8+ GPUs: Increase batch_size to 128-256 per GPU
# - Multiple nodes: Ensure high-speed interconnect between nodes
#
# TROUBLESHOOTING:
# - Out of memory: Enable cpu_offload or reduce batch_size
# - Slow training: Disable unnecessary analysis during training
# - Communication issues: Check network configuration and timeouts
# ============================================================================ 