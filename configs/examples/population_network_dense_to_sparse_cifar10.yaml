# ============================================================================
# Population Network Dense-to-Sparse CIFAR-10 DendriNet
# ============================================================================
# Demonstrates developmental dense-to-sparse pruning from the population
# configuration surface.
#
# Run:
#   dendritic-train configs/examples/population_network_dense_to_sparse_cifar10.yaml
# ============================================================================

config_version: 4

experiment:
  seed: 42
  train_valid_split: 0.8
  checkpointing:
    enabled: false

data:
  dataset_name: "cifar10"
  processing:
    flatten: true
    normalize: false  # pixels in [0, 1]: shunting conductances need non-negative input

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    biological_neuron: false  # Preserve this example's historical model contract.
    type: "population_network"
    population_network:
      use_transfer: true
      transfer_params:
        independent_pathways: false
        output_activation: "relu"
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 60
            ff_inhibitory_synapses: 30
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: false
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "dense_to_sparse"
            topk_init_method: "xavier_normal"
            dense_to_sparse_initial_density: 1.0
            dense_to_sparse_start_step: 0
            dense_to_sparse_end_step: 4000
            dense_to_sparse_update_interval: 50
            dense_to_sparse_schedule: "cubic"
            dense_to_sparse_freeze_on_end: true
            dense_to_sparse_advance_on_forward: true
            dense_to_sparse_prune_metric: "weight"
            blocklinear_gradient_scaling: "none"
            reactivation_gradient_scaling: "none"
            efficient_blocklinear: true
          populations:
            - name: "e"
              polarity: "excitatory"
              n_neurons: 256
              branch_factors: [4, 4]
          connections:
            - source: "input_e"
              target: "e"
            - source: "input_i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [64]
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "standard"
    common:
      epochs: 200
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      synapse_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true


outputs:
  run_name: "population_network_dense_to_sparse_cifar10"
  results_dir: "outputs"

distributed:
  mode: none
