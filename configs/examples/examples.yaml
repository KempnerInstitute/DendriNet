# Single-GPU H100 limit profiling workload generated by ProfilePilot.
# Axis: network_depth=5,dendrite=[3,3]; 10000E/1250I per layer; 5 CIFAR10 epochs.
experiment:
  seed: 42
  train_valid_split: 0.8
  fast_mode: true
  deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  float32_matmul_precision: high
  enable_profiling: false
  enable_hooks: false
  checkpointing:
    enabled: false
data:
  dataset_name: cifar10
  base_dir: data
  processing:
    flatten: true
    normalize: true
model:
  task: classification
  encoder:
    type: identity
    params:
      input_dim: 3072
  core:
    type: population_network
    population_network:
      use_transfer: true
      transfer_params:
        input_mode: 0
        independent_pathways: false
        output_activation: relu
      layers:
      - name: layer0
        readout_population: e0
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: false
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          indexed_seed: 7100
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          blocklinear_strategy: none
          reactivation_strategy: none
          efficient_blocklinear: true
        populations:
        - name: i0
          polarity: inhibitory
          n_neurons: 1250
          branch_factors:
          - 1
          population:
            ff_inhibitory_synapses: 0
        - name: e0
          polarity: excitatory
          n_neurons: 10000
          branch_factors:
          - 3
          - 3
        connections:
        - source: input
          target: i0
        - source: input
          target: e0
        - source: i0
          target: e0
      - name: layer1
        readout_population: e1
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: false
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          indexed_seed: 7101
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          blocklinear_strategy: none
          reactivation_strategy: none
          efficient_blocklinear: true
        populations:
        - name: i1
          polarity: inhibitory
          n_neurons: 1250
          branch_factors:
          - 1
          population:
            ff_inhibitory_synapses: 0
        - name: e1
          polarity: excitatory
          n_neurons: 10000
          branch_factors:
          - 3
          - 3
        connections:
        - source: layer0.e0
          target: i1
        - source: layer0.e0
          target: e1
        - source: layer0.i0
          target: e1
        - source: i1
          target: e1
      - name: layer2
        readout_population: e2
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: false
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          indexed_seed: 7102
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          blocklinear_strategy: none
          reactivation_strategy: none
          efficient_blocklinear: true
        populations:
        - name: i2
          polarity: inhibitory
          n_neurons: 1250
          branch_factors:
          - 1
          population:
            ff_inhibitory_synapses: 0
        - name: e2
          polarity: excitatory
          n_neurons: 10000
          branch_factors:
          - 3
          - 3
        connections:
        - source: layer1.e1
          target: i2
        - source: layer1.e1
          target: e2
        - source: layer1.i1
          target: e2
        - source: i2
          target: e2
      - name: layer3
        readout_population: e3
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: false
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          indexed_seed: 7103
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          blocklinear_strategy: none
          reactivation_strategy: none
          efficient_blocklinear: true
        populations:
        - name: i3
          polarity: inhibitory
          n_neurons: 1250
          branch_factors:
          - 1
          population:
            ff_inhibitory_synapses: 0
        - name: e3
          polarity: excitatory
          n_neurons: 10000
          branch_factors:
          - 3
          - 3
        connections:
        - source: layer2.e2
          target: i3
        - source: layer2.e2
          target: e3
        - source: layer2.i2
          target: e3
        - source: i3
          target: e3
      - name: layer4
        readout_population: e4
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 10
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: false
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          reactivation_init_m: 1.5
          reactivation_init_b: 0.5
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          indexed_seed: 7104
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          blocklinear_strategy: none
          reactivation_strategy: none
          efficient_blocklinear: true
        populations:
        - name: i4
          polarity: inhibitory
          n_neurons: 1250
          branch_factors:
          - 1
          population:
            ff_inhibitory_synapses: 0
        - name: e4
          polarity: excitatory
          n_neurons: 10000
          branch_factors:
          - 3
          - 3
        connections:
        - source: layer3.e3
          target: i4
        - source: layer3.e3
          target: e4
        - source: layer3.i3
          target: e4
        - source: i4
          target: e4
  decoder:
    type: MLP
    params:
      hidden_dims:
      - 512
      - 256
      activation: relu
      output_dim: 10
training:
  encoder:
    strategy: standard
    common:
      epochs: 0
  main:
    strategy: standard
    common:
      epochs: 5
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: ce
      early_stopping: false
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 5
      num_workers: 16
      pin_memory: false
      persistent_workers: true
      prefetch_factor: 4
      profile_dataloader: false
      use_amp: true
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: adam
    regularization:
      l1_weight: 0.0
      l2_weight: 0.0
    strategies:
      standard: {}
analysis:
  performance:
    enabled: false
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true
  information_analysis:
    enabled: false
  branch_activation_analysis:
    enabled: false
  synaptic_activation_analysis:
    enabled: false
  ablation_analysis:
    enabled: false
  weight_analysis:
    enabled: false
wandb:
  use_wandb: false
outputs:
  run_name: profilepilot_sglimit5_h100_cifar10_ei_5layer_bf33_10000e1250i
  results_dir: ../ProfilePilot/profile-runs/dendritic-modeling/single_gpu_limit_5epoch/training-outputs
distributed:
  mode: none
  fsdp:
    sharding_strategy: FULL_SHARD
    mixed_precision: true
    mixed_precision_dtype: bf16
    param_dtype: bf16
    reduce_dtype: bf16
    buffer_dtype: bf16
    cpu_offload: false
    min_num_params: 100000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: BACKWARD_PRE
    gradient_checkpointing: true