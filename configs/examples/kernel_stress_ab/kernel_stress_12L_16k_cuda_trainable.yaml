# TRAINABLE variant of kernel_stress_12L_16k_cuda.yaml. Differs from its parent
# in exactly two knobs, both required:
#
#   reactivation_init_policy: analytical -> fixed
#   reactivation_init_m:      1.5        -> 4.0
#
# Why. The parent converges onto EXACTLY chance (2.3027 vs ln(10)=2.30259): a
# batch-std probe shows input-dependence contracting ~6.3x PER LAYER (~sqrt(K),
# K=40 -- the shunt averages ~K synaptic inputs, so relative fluctuations fall
# as 1/sqrt(K); a law-of-large-numbers collapse). After 12 layers the output
# retains 8e-09 of the signal and the readout learns the uniform prior.
#
# Why policy=fixed: under `analytical`, _apply_reactivation_init() overwrites m
# and IGNORES reactivation_init_m -- an earlier variant set m=2.5 and silently
# trained at m=1.5 (verified via init_gate_stats.json). Only `fixed` honors it.
#
# Why m=4.0, measured not derived (probe_signal_death.py --sweep-m): the viable
# window is a KNIFE EDGE --
#     m=3.5 -> 1.5e-03 of input signal (collapse)   m=4.0 -> 4.4e-02 (survives)
#     m=4.5 -> exactly 0.0 (hard saturation: every unit pinned to its rail)
# Two analytic candidates both failed the sweep: m=2.5 (still collapsed,
# 1.2e-06) and m=12.6 from the sqrt(K) gain argument (saturated, 0.0).
#
# Every stress dimension is untouched: 12 layers, 16000E/2000I, K=40, branch
# [3,3], 123M params, 116M contacts -- identical memory and compute profile.
# UNVERIFIED for training until a 5-epoch run drops below 2.3026.
