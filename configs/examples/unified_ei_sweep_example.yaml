# Example EI Sweep Configuration for Unified Framework
# ===================================================
# 
# This configuration demonstrates how to set up an EI parameter sweep
# using the new unified sweep framework.

# Output configuration
output_dir: "output"

# SLURM job configuration
slurm_config:
  job_name: "unified_ei_sweep"
  account: "kempner_dev"
  partition: "kempner"
  time: "02:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  cpus_per_task: 4
  mem: "32G"
  modules_to_load:
    - "cuda/12.1.0-fasrc01"
  conda_env_path: "/path/to/conda/envs/dendritic_env"
  training_script: "src/dendritic_modeling/scripts/train_experiments.py"

# Experiment settings
experiment_settings:
  seeds_per_condition: 3
  base_seed: 42

# Parameters to sweep
sweep_config:
  model.network.parameters.ee_synapses_per_branch_per_layer: [10, 20, 30, 40, 50]
  model.network.parameters.ie_synapses_per_branch_per_layer: [10, 20, 30, 40, 50]
  model.network.parameters.use_shunting: [true, false, "MLP"]

# Optional: EI filtering configuration
filter_config:
  mode: "all"  # Options: "all", "ei-sum", "e-const", "i-const", "ei-ratio"
  # value: 52    # Required for filtering modes other than "all"
  # tolerance: 0.1  # For ei-ratio mode

# Base training configuration
base_config:
  task:
    dataset: "multixor"
    parameters:
      num_samples: 5000
      
  model:
    network:
      type: "EINet"
      parameters:
        num_layers: 3
        num_branches_per_layer: 10
        input_dim: null  # Will be set automatically
        output_dim: null  # Will be set automatically
        
  train:
    optimizer: "adam"
    learning_rate: 0.001
    batch_size: 64
    num_epochs: 100
    run_name: "unified_ei_sweep"
    
  outputs:
    dir: "output"
    save_model: true
    save_analysis: true 