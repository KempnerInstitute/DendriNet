# ============================================================================
# Standard CIFAR-10 DendriNet using the multi-population E/I schema
# ============================================================================
# Population-format mirror of standard_cifar10.yaml. This keeps the old
# [4, 4] morphology and 60E/30I synapse counts. Because the old config uses
# input_mode=1, no explicit I cells are built; the transfer layer's inhibitory
# stream drives the E dendrites directly.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/standard_cifar10_multi_population_ei.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: false
  checkpointing:
    enabled: false

data:
  dataset_name: "cifar10"
  processing:
    flatten: true
    normalize: true

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "multi_population_ei"
    multi_population:
      use_transfer: true
      transfer_params:
        input_mode: 1
        independent_pathways: false
        output_activation: "relu"
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 60
            ff_inhibitory_synapses: 30
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: false
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_m: 1.5
            reactivation_init_b: 0.5
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "standard"
            topk_init_method: "xavier_normal"
            blocklinear_strategy: "none"
            reactivation_strategy: "none"
            efficient_blocklinear: false
          populations:
            - name: "e"
              polarity: "excitatory"
              n_neurons: 256
              branch_factors: [4, 4]
          connections:
            - source: "input_e"
              target: "e"
            - source: "input_i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [64]
      activation: "relu"
      output_dim: 10

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "standard"
    common:
      epochs: 200
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true

wandb:
  use_wandb: false

outputs:
  run_name: "standard_cifar10_multi_population_ei"
  results_dir: "outputs"

distributed:
  mode: none
