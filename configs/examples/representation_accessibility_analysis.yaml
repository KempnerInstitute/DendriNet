# Standalone post-training analysis profile for PopulationNetwork checkpoints.
# Fit probes on validation, evaluate once on test, and average technical draws
# within each checkpoint before statistical inference across training seeds.
analysis:
  runtime:
    final:
      mode: stream
      batch_size: 256
      num_workers: 4
      max_samples: null

  representation_accessibility:
    enabled: true
    training: false
    params:
      representations: [excitatory, inhibitory, joint]
      projections:
        - name: matched16
          type: balanced_countsketch
          output_dim: 16
          draws: 5
      probes:
        - name: linear
          type: ridge
          ridge_alpha: 1.0
          n_label_shuffles: 20
        - name: nonlinear
          type: mlp
          max_projection_draws: 1
          hidden_dims: [32, 16]
          activation: relu
          alpha: 0.0001
          learning_rate_init: 0.001
          batch_size: 256
          max_iter: 300
          early_stopping: true
          validation_fraction: 0.1
          n_iter_no_change: 20
          draws: 3
          n_label_shuffles: 5
      information:
        enabled: true
        compute_joint: true
        compute_per_soma: true
        projection_names: [matched16]
        per_soma_representations: [excitatory, inhibitory]
        n_neighbors: 5
        n_label_shuffles: 5
        standardize: true
      seed: 42
