# ============================================================================
# Synthetic transformer MLP distillation smoke test
# ============================================================================
# This trains a token-wise DendriticFFNReplacement to imitate a small teacher
# MLP on random hidden states. It is intentionally small enough to run as a
# quick correctness/learning check before trying a full Hugging Face model.
# ============================================================================

experiment:
  seed: 7

model:
  task: "language_modeling"

  transformer_replacement:
    enabled: true
    layers: [0]
    target_module: "mlp"
    input_transform: "signed_split"
    replacement_kwargs:
      output_init_std: 0.05

  core:
    type: "dendritic_ffn"
    architecture:
      excitatory_layer_sizes: [32]
      excitatory_branch_factors: [2]
    connectivity:
      ee_synapses_per_branch_per_layer: [4]
      ei_synapses_per_branch_per_layer: [0]
      ie_synapses_per_branch_per_layer: [0]
      ii_synapses_per_branch_per_layer: [0]
    transfer:
      input_transform: "signed_split"
    morphology:
      use_shunting: false
      weight_transform: "softplus"
    sparsity:
      type: "indexed_dynamic"
      init_method: "xavier_normal"
      temperature: 0.25
      indexed:
        candidate_size: 8
        selection: "standard"
        seed: 11
        output_chunk_size: 512
    reactivation:
      enabled: true
      type: "param_tanh"
      init_policy: "occupancy_quantile"

training:
  main:
    optimizer:
      name: "adamw"
      lr: 0.005
      weight_decay: 0.0001

  transformer_replacement:
    enabled: true
    mode: "layerwise_distillation"
    teacher_source: "synthetic_mlp"
    train_target: "replacement_only"
    layers: [0]
    device: "auto"
    dtype: "float32"
    hidden_size: 8
    intermediate_size: 32
    sequence_length: 4
    train_samples: 512
    valid_samples: 128
    batch_size: 32
    max_steps: 120
    eval_every: 20
    log_every: 20
    loss: "mse"
    cosine_weight: 0.0
    save_dir: "results/transformer_replacement_synthetic_distillation"
    save_replacements: true
    synthetic_teacher:
      kind: "linear"
      activation: "identity"
      bias: false
      input_std: 1.0
