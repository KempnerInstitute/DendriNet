# ============================================================================
# Synthetic Transformer MLP Distillation Example
# ============================================================================
# This trains a token-wise DendriticFFNReplacement to imitate a small teacher
# MLP on random hidden states.
# ============================================================================

experiment:
  seed: 7

model:
  task: "language_modeling"

  transformer_replacement:
    enabled: true
    layers: [0]
    target_module: "mlp"
    input_transform: "signed_split"
    replacement_kwargs:
      output_init_std: 0.05

  core:
    type: "dendritic_ffn"
    population_network:
      input_transform: "signed_split"
      layers:
        - name: "transformer_mlp"
          readout_population: "ffn"
          population_defaults:
            ff_excitatory_synapses: 4
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            use_shunting: false
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_init_policy: "occupancy_quantile"
            weight_transform: "softplus"
            topk_type: "indexed_rewire"
            topk_init_method: "xavier_normal"
            indexed_seed: 11
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: null
            indexed_output_chunk_size: 512
            efficient_blocklinear: true
          populations:
            - name: "ffn"
              polarity: "excitatory"
              n_neurons: 32
              branch_factors: [2]
          connections:
            - source: "input"
              target: "ffn"

training:
  main:
    optimizer:
      name: "adamw"
      lr: 0.005
      weight_decay: 0.0001

  transformer_replacement:
    enabled: true
    mode: "layerwise_distillation"
    teacher_source: "synthetic_mlp"
    train_target: "replacement_only"
    layers: [0]
    device: "auto"
    dtype: "float32"
    hidden_size: 8
    intermediate_size: 32
    sequence_length: 4
    train_samples: 512
    valid_samples: 128
    batch_size: 32
    max_steps: 120
    eval_every: 20
    log_every: 20
    loss: "mse"
    cosine_weight: 0.0
    save_dir: "results/transformer_replacement_synthetic_distillation"
    save_replacements: true
    synthetic_teacher:
      kind: "linear"
      activation: "identity"
      bias: false
      input_std: 1.0
