# AlexNet fc6 + ReLU replacement with one functionally equivalent variant per
# indexed projection backend. Generate the variants with dendritic-sweep; see
# README.md in this directory.

slurm_config:
  run_name: "indexed_alexnet_fc6_large"
  account: ""
  partition: ""
  time: "08:00:00"
  nodes: 1
  ntasks_per_node: 1
  gpus_per_node: 1
  launcher: torchrun
  cpus_per_task: 16
  mem: 128GB
  training_script: src/dendritic_modeling/scripts/training/train_experiments.py

experiment_settings:
  seeds_per_condition: 1
  base_seed: 42
  seed_paths: [model.core.sparsity.indexed.seed]

sweep_variants:
  - name: eager
    overrides:
      model.core.sparsity.indexed.projection_backend: eager
  - name: recompute
    overrides:
      model.core.sparsity.indexed.projection_backend: recompute
  - name: triton
    overrides:
      model.core.sparsity.indexed.projection_backend: triton
  - name: cuda
    overrides:
      model.core.sparsity.indexed.projection_backend: cuda
  - name: auto
    overrides:
      model.core.sparsity.indexed.projection_backend: auto

sweep_config: {}
filter_config: {mode: default}
sweep_contract: {expected_config_count: 5}

base_config:
  experiment:
    seed: 42
    train_valid_split: 0.8
    deterministic: true
    cudnn_benchmark: false
    allow_tf32: false
    float32_matmul_precision: highest
    enable_hooks: false
    checkpointing:
      enabled: true
      save_every_n_epochs: 10
      checkpoint_dir: outputs/indexed_backends/alexnet_fc6/checkpoints

  data:
    dataset_name: imagenet
    base_dir: ""                       # Set to an ImageNet-1k root.
    processing:
      flatten: false
      normalize: true
    dataset_params:
      imagenet:
        transform_preset: pretrained
        loader_backend: auto
        allow_flatten_materialize: false

  model:
    task: classification
    vision_replacement:
      enabled: true
      backbone: alexnet
      weights: IMAGENET1K_V1
      core_source: configured
      input_shape: [3, 224, 224]
      target_modules: [classifier.1, classifier.2]
      omit_layers: [classifier.0, classifier.3]
      trainability:
        encoder: {mode: frozen}
        decoder: {mode: trainable}
    core:
      type: einet
      architecture:
        excitatory_layer_sizes: [4096]
        inhibitory_layer_sizes: [820]
        excitatory_branch_factors: [2, 2]
        inhibitory_branch_factors: [2, 2]
        inhibitory_network_type: dendritic
      connectivity:
        ee_synapses_per_branch_per_layer: [40]
        ei_synapses_per_branch_per_layer: [10]
        ie_synapses_per_branch_per_layer: [10]
        ii_synapses_per_branch_per_layer: [0]
      transfer:
        input_mode: 0
        independent_pathways: false
        output_activation: relu
      morphology:
        somatic_synapses: false
        use_shunting: true
        weight_transform: softplus
        dbl_init_method: analytical_expectation
      sparsity:
        type: indexed
        init_method: xavier_normal
        gradient_scaling: none
        indexed:
          seed: 42
          output_chunk_size: 4096
          index_dtype: int32
          workspace_mb: 128
          cache_transformed_weights: false
          projection_backend: recompute
          persistent_indices: true
          init_mode: per_rank
      reactivation:
        enabled: true
        type: param_tanh
        init_policy: analytical
        init_m: 1.5
        init_b: 0.5
        memory_efficient: true
      blocklinear:
        gradient_scaling: none
        efficient: true
      implementation:
        adaptive_initialization: false
        print_hooks: false

  training:
    encoder:
      strategy: standard
      common: {epochs: 0}
    main:
      strategy: standard
      common:
        epochs: 50
        batch_size: 64
        num_workers: 8
        pin_memory: true
        persistent_workers: true
        prefetch_factor: 4
        shuffle: true
        loss_function: cat_nll
        early_stopping: true
        patience: 20
        load_best_state_dict: true
        grad_clip_value: 5.0
        use_amp: true
        weight_decay_rate: 0.0
        weight_boosting: false
        param_groups:
          lr: 0.001
          split_params: true
          topk_lr: 0.001
          blocklinear_lr: 0.0001
          reactivation_lr: 0.0001
          decoder_lr: 0.0001
          encoder_lr: 0.0
      optimizer: {name: adam}
      strategies: {standard: {}}

  analysis:
    runtime:
      training:
        mode: stream
        batch_size: 128
        num_workers: 4
        pin_memory: true
        persistent_workers: true
        prefetch_factor: 2
        max_batches: 20
      final:
        mode: stream
        batch_size: 128
        num_workers: 4
        pin_memory: true
        persistent_workers: true
        prefetch_factor: 2
    performance:
      enabled: true
      training: false
      params:
        accuracy: true
        categorical_loglikelihood: true
      final_splits: [valid, test]

  wandb: {use_wandb: false}
  outputs:
    run_name: indexed_alexnet_fc6_large
    results_dir: outputs/indexed_backends/alexnet_fc6
  distributed: {mode: none}
