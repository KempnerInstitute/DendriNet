# ============================================================================
# SIMPLE EI NETWORK CONFIGURATION
# ============================================================================
# This is a simplified version of the comprehensive config, showing the essential
# EI network architecture without overwhelming detail. Good starting point for
# new experiments.
# ============================================================================

model:
  task: classification

  # Simple 3-stage architecture
  encoder_network:
    type: identity  # No encoder preprocessing
    parameters:
      input_shape: [3, 32, 32]

  core_network:
    type: EINet
    parameters:
      # Basic morphological structure
      excitatory_layer_sizes: [20, 15, 10]      # 3 excitatory layers
      inhibitory_layer_sizes: [5, 5, 5]         # 3 inhibitory layers
      excitatory_branch_factors: [4, 4, 4]      # 4 branches per excitatory neuron
      inhibitory_branch_factors: [2, 2, 2]      # 2 branches per inhibitory neuron
      
      # Connection patterns
      ee_synapses_per_branch_per_layer: [8]     # E-to-E connections
      ei_synapses_per_branch_per_layer: [4]     # E-to-I connections
      ie_synapses_per_branch_per_layer: [2]     # I-to-E connections  
      ii_synapses_per_branch_per_layer: [1]     # I-to-I connections
      
      # Basic parameters
      transfer_params:
        input_mode: 1              # Independent pathways
        independent_pathways: true
        output_activation: none
      
      # TopK sparsity
      topk_type: standard
      topk_init_method: xavier_normal
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      
      # Implementation
      efficient_blocklinear: true
      somatic_synapses: true
      use_shunting: true

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [16]
      activation: relu
      output_dim: 10

train:
  
  # Performance features
  enable_amp: true
  enable_hooks: true
  use_fsdp: false
  
  # Simple encoder training (skip if encoder is identity)
  encoder:
    lr: 0.001
    trainer:
      epochs: 0  # Skip encoder training for identity encoder
      batch_size: 128
  
  # Main training
  main:
    learning_strategy: standard
    
    param_groups:
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 100
      batch_size: 256
      early_stopping: true
      patience: 10
      grad_clip_value: 5.0

task:
  dataset: cifar10
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: true
  project: "simple-ei-experiments"
  tags: ["simple", "ei-network"]

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      auc: true
      mse: false
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean

  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true
      save_plots: true

outputs:
  dir: "./outputs/" 