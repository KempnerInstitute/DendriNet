# ============================================================================
# Population Network with Heterogeneous Feedforward Cell Types
# ============================================================================
# A single feedforward layer with multiple excitatory and inhibitory
# populations. Each population has its own morphology and PopulationConfig
# overrides, while all topology is written as explicit directed connections.
#
# Run:
#   dendritic-train configs/examples/population_network_heterogeneous_feedforward.yaml
# ============================================================================

config_version: 3

experiment:
  seed: 42
  train_valid_split: 0.8
  checkpointing:
    enabled: false

data:
  dataset_name: "mnist"
  processing:
    flatten: true
    normalize: false  # pixels in [0, 1]: shunting conductances need non-negative input

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "population_network"
    population_network:
      layers:
        - name: "layer0"
          readout_population: "pyr_deep"
          population_defaults:
            ff_excitatory_synapses: 20
            ff_inhibitory_synapses: 8
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_memory_efficient: true
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            use_shunting: true
            topk_type: "indexed_rewire"
            topk_init_method: "xavier_normal"
            indexed_index_dtype: "auto"
            indexed_projection_backend: "recompute"
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: null
            indexed_output_chunk_size: 2048
            efficient_blocklinear: true
          populations:
            - name: "pv"
              polarity: "inhibitory"
              n_neurons: 16
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
                tau_base: 20.0
            - name: "sst"
              polarity: "inhibitory"
              n_neurons: 16
              branch_factors: [2]
              population:
                ff_inhibitory_synapses: 0
                tau_base: 80.0
                tau_ratio: 2.0
            - name: "pyr_flat"
              polarity: "excitatory"
              n_neurons: 32
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 4
                use_shunting: false
                use_additive_normalization: true
            - name: "pyr_deep"
              polarity: "excitatory"
              n_neurons: 96
              branch_factors: [4, 3]
          connections:
            - source: "input"
              target: "pv"
            - source: "input"
              target: "sst"
            - source: "input"
              target: "pyr_flat"
            - source: "input"
              target: "pyr_deep"
            - source: "pv"
              target: "pyr_flat"
            - source: "pyr_flat"
              target: "pyr_deep"
            - source: "pv"
              target: "pyr_deep"
            - source: "sst"
              target: "pyr_deep"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "standard"
    common:
      epochs: 50
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 20
      load_best_state_dict: true
      synapse_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true


outputs:
  run_name: "population_network_heterogeneous_feedforward"
  results_dir: "outputs"

distributed:
  mode: none
