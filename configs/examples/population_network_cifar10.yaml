# ============================================================================
# Population Network CIFAR-10 128E/32I DendriNet
# ============================================================================
# CIFAR-10 feedforward example with explicit input -> I,
# input -> E, and I -> E population edges.
#
# Run:
#   dendritic-train configs/examples/population_network_cifar10.yaml
# ============================================================================

config_version: 3

experiment:
  seed: 42
  train_valid_split: 0.8
  checkpointing:
    enabled: false

data:
  dataset_name: "cifar10"
  processing:
    flatten: true
    normalize: false  # pixels in [0, 1]: shunting conductances need non-negative input

model:
  task: "classification"
  encoder:
    type: "identity"
  core:
    type: "population_network"
    population_network:
      use_transfer: true
      transfer_params:
        independent_pathways: false
        output_activation: "relu"
      layers:
        - name: "layer0"
          readout_population: "e"
          population_defaults:
            ff_excitatory_synapses: 40
            ff_inhibitory_synapses: 10
            rec_excitatory_synapses: 0
            rec_inhibitory_synapses: 0
            somatic_synapses: false
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            reactivation_memory_efficient: true
            reactivation_init_policy: "occupancy_quantile"
            dbl_init_method: "analytical_expectation"
            weight_transform: "softplus"
            topk_type: "indexed_rewire"
            topk_init_method: "xavier_normal"
            indexed_index_dtype: "auto"
            indexed_projection_backend: "recompute"
            indexed_rewire_frequency: 100
            indexed_rewire_quantile: 0.05
            indexed_rewire_until_step: null
            indexed_output_chunk_size: 2048
            blocklinear_gradient_scaling: "none"
            reactivation_gradient_scaling: "none"
            efficient_blocklinear: true
          populations:
            - name: "i"
              polarity: "inhibitory"
              n_neurons: 32
              branch_factors: [1]
              population:
                ff_inhibitory_synapses: 0
            - name: "e"
              polarity: "excitatory"
              n_neurons: 128
              branch_factors: [3, 3, 3]
          connections:
            - source: "input"
              target: "i"
            - source: "input"
              target: "e"
            - source: "i"
              target: "e"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [64]
      activation: "relu"
      output_dim: 10

training:
  main:
    strategy: "standard"
    common:
      epochs: 200
      batch_size: 512
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "ce"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      synapse_decay_rate: 0.01
      weight_boosting: true
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.001
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: true
      categorical_loglikelihood: true


outputs:
  run_name: "population_network_cifar10"
  results_dir: "outputs"

distributed:
  mode: none
