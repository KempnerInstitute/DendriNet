# ============================================================================
# SIMPLE INDEX INPUT TRANSFORM TEST - BASED ON WORKING MINIMAL CONFIG
# ============================================================================
model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]

  core_network:
    type: EINet
    parameters:
      input_dim: 784
      transfer_params:
        input_mode: 1  # INDEX INPUT MODE
        independent_pathways: true
        excitatory_dim: 392  # Split 784 into two equal parts
        inhibitory_dim: 392
        output_activation: none
        
      # SIMPLE, SMALL ARCHITECTURE TO AVOID DIMENSION ISSUES
      excitatory_layer_sizes: [16, 10]  # VERY SMALL
      inhibitory_layer_sizes: [16, 10]  # MATCH EXCITATORY
      excitatory_branch_factors: [1, 1] # MINIMAL BRANCHING
      inhibitory_branch_factors: [1, 1] # MINIMAL BRANCHING
      
      # CONSERVATIVE SYNAPSE COUNTS
      ee_synapses_per_branch_per_layer: [16, 10]  # <= layer sizes
      ei_synapses_per_branch_per_layer: [10, 10]  # <= inhibitory size
      ie_synapses_per_branch_per_layer: [16, 10]  # <= excitatory size
      ii_synapses_per_branch_per_layer: [10, 10]  # <= inhibitory size
      
      somatic_synapses: true
      use_shunting: true
      reactivate: true
      reactivation_type: param_tanh
      
      topk_type: standard
      init_method: xavier_normal

  decoder_network:
    type: MLP
    parameters:
      input_dim: 10
      output_dim: 10
      hidden_dims: []

train:
  run_name: "index_simple_test"
  seed: 0
  train_valid_split: 0.8
  enable_amp: false
  enable_profiling: false
  enable_hooks: false  # DISABLED FOR SPEED
  use_fsdp: false

  main:
    data_path: ./data
    dataset: mnist
    learning_strategy: standard
    param_groups:
      excitatory_learning_rate: 0.001
      inhibitory_learning_rate: 0.001
    weight_decay_rate: 1e-4
    trainer:
      loss_function: cat_nll
      epochs: 2  # FAST TEST
      batch_size: 128  # LARGE BATCH FOR SPEED
      lr: 0.001
      eval_step: 1
      save_step: 1000
      log_step: 100
      checkpointing: false
      use_amp: false

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: false

# ANALYSIS DISABLED FOR SPEED
analysis:
  performance_analysis:
    enabled: false
  information_analysis:
    enabled: false
  synapse_turnover_analysis:
    enabled: false
  noise_perturbation_analysis:
    enabled: false
  single_layer_contribution:
    enabled: false
  ablation_analysis:
    enabled: false
  weight_analysis:
    enabled: false
  synaptic_activation_analysis:
    enabled: false
  branch_activation_analysis:
    enabled: false
  correlation_analysis:
    enabled: false

outputs:
  run_name: index_simple_test
  dir: outputs/ 