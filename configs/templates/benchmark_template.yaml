# ============================================================================
# BENCHMARK TEMPLATE
# ============================================================================
# Optimized for maximum performance benchmarking with minimal overhead.
# ============================================================================

model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]

  core_network:
    type: EINet
    parameters:
      input_dim: 784
      transfer_params:
        input_mode: 1
        independent_pathways: true
        
      # Large architecture for meaningful benchmark
      excitatory_layer_sizes: [256, 128, 64]
      inhibitory_layer_sizes: [64, 32, 16]
      excitatory_branch_factors: [8, 4]
      inhibitory_branch_factors: [4, 2]
      
      ee_synapses_per_branch_per_layer: [32]
      ei_synapses_per_branch_per_layer: [16]
      ie_synapses_per_branch_per_layer: [8]
      ii_synapses_per_branch_per_layer: [4]
      
      somatic_synapses: true
      use_shunting: true
      reactivate: true
      reactivation_type: param_tanh
      topk_type: standard
      topk_ultrafast: true  # Enable fast implementation
      efficient_blocklinear: true  # Enable memory efficiency
      adaptive_initialization: true
      print_hooks: false  # Disable for performance

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [32]
      activation: relu

train:
  run_name: "benchmark_test"
  
  # Maximum performance settings
  enable_amp: true
  enable_profiling: false
  enable_hooks: false  # DISABLED for maximum speed
  
  encoder:
    trainer:
      epochs: 0
      
  main:
    learning_strategy: standard
    param_groups:
      lr: 0.001
      split_params: true
      
    trainer:
      loss_function: mse
      epochs: 10  # Short for benchmarking
      batch_size: 512  # Large batch for throughput
      suppress_prints: true
      print_every: 5

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  use_wandb: false  # Disabled for pure benchmarking

# All analysis disabled for maximum performance
analysis:
  performance_analysis:
    enabled: false

outputs:
  dir: "./benchmark_outputs/" 