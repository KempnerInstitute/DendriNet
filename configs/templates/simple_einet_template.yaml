# ============================================================================
# SIMPLE EINET TEMPLATE
# ============================================================================
# Basic template for EINet experiments. Replace placeholders with your values.
# ============================================================================

model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]  # MNIST input shape

  core_network:
    type: EINet
    parameters:
      input_dim: 784
      transfer_params:
        input_mode: 0
        independent_pathways: false
        output_activation: null
        
      # Simple architecture - adjust as needed
      excitatory_layer_sizes: [128, 64, 10]
      inhibitory_layer_sizes: [32, 16, 0]
      excitatory_branch_factors: [4, 2]
      inhibitory_branch_factors: [2, 1]
      
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1]
      ii_synapses_per_branch_per_layer: []
      
      somatic_synapses: true
      use_shunting: true
      reactivate: true
      reactivation_type: param_tanh
      topk_type: standard
      efficient_blocklinear: false
      adaptive_initialization: true

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [32]
      activation: relu
      output_dim: null

train:
  seed: 42
  train_valid_split: 0.8
  
  enable_amp: false
  enable_profiling: false
  enable_hooks: true
  
  encoder:
    trainer:
      epochs: 0  # Skip encoder training for identity
      
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.0001
    
    trainer:
      loss_function: mse
      epochs: 50
      batch_size: 128
      grad_clip_value: 5.0
      suppress_prints: false
      print_every: 10

task:
  dataset: "{{dataset}}"  # Replace with: mnist, cifar10, etc.
  parameters:
    flatten: true
    normalize: true

wandb:
  entity: "{{wandb_entity}}"  # Replace with your W&B entity
  project: "{{wandb_project}}"  # Replace with your project name
  use_wandb: false  # Set to true to enable logging

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      auc: true
      mse: false
      cosine_similarity: false

  synapse_turnover_analysis:
    enabled: false
    training: false

  noise_perturbation_analysis:
    enabled: false
    training: false
    params:
      uniform_noise: true
      uniform_magnitudes: [0.1, 0.2]
      gaussian_noise: true
      gaussian_sdevs: [0.1, 0.2]
      n_samples: 10
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  ablation_analysis:
    enabled: false
    training: false
    params:
      layer_ablation: true
      compartment_ablation: true
      ablate_all_synapses: true
      ablate_excitation: true
      ablate_inhibition: true
      ablate_upstream: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  weight_analysis:
    enabled: false
    training: false
    params:
      synapse_weights: true
      branch_weights: true

  synaptic_activation_analysis:
    enabled: false
    training: false
    params:
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  branch_activation_analysis:
    enabled: false
    training: false
    params:
      synapse_activations: true
      branch_activations: true
      network_summary: true
      layer_summary: true
      branch_summary: true
      raw_summary: true
      logspace: false
      downsample: true
      samples: 5

  information_analysis:
    enabled: false
    training: false
    params:
      method: kraskov
      max_samples: null
      n_neighbors: 10
      n_bins: 20
      copula_type: gaussian
      compute_basic_mi: true
      compute_pairwise_mi: true
      compute_conditional_mi: true
      compute_pid: false
      pid_binarize: true
      pid_binarize_method: median
      pid_binarize_threshold: 0.5
      include_vinf: true
      normalize_mi: false
      verbose: false
      compute_per_branch: true
      branch_aggregation: mean

  single_layer_contribution:
    enabled: false
    training: false
    params:
      excitation_contribution: true
      inhibition_contribution: true
      both_contribution: true
      accuracy: true
      auc: true
      categorical_loglikelihood: true
      mse: true
      cosine_similarity: true

  correlation_analysis:
    enabled: false
    training: false
    params:
      compute_synaptic_correlations: true
      compute_tuning_curves: true

outputs:
  run_name: "{{experiment_name}}"
  dir: "./outputs/" 