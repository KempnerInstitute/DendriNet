# ============================================================================
# SIMPLE EINET TEMPLATE
# ============================================================================
# Basic template for EINet experiments. Replace placeholders with your values.
# ============================================================================

model:
  task: classification

  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]  # MNIST input shape

  core_network:
    type: EINet
    parameters:
      input_dim: 784
      transfer_params:
        input_mode: 0
        independent_pathways: false
        output_activation: null
        
      # Simple architecture - adjust as needed
      excitatory_layer_sizes: [128, 64, 10]
      inhibitory_layer_sizes: [32, 16, 0]
      excitatory_branch_factors: [4, 2]
      inhibitory_branch_factors: [2, 1]
      
      ee_synapses_per_branch_per_layer: [24]
      ei_synapses_per_branch_per_layer: [200]
      ie_synapses_per_branch_per_layer: [1]
      ii_synapses_per_branch_per_layer: []
      
      somatic_synapses: true
      use_shunting: true
      reactivate: true
      reactivation_type: param_tanh
      topk_type: standard
      efficient_blocklinear: false
      adaptive_initialization: true

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [32]
      activation: relu
      output_dim: null

train:
  run_name: "{{experiment_name}}"  # Replace with your experiment name
  seed: 42
  train_valid_split: 0.8
  
  enable_amp: false
  enable_profiling: false
  enable_hooks: true
  
  encoder:
    trainer:
      epochs: 0  # Skip encoder training for identity
      
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.0001
      reactivation_lr: 0.0001
      decoder_lr: 0.0001
    
    trainer:
      loss_function: mse
      epochs: 50
      batch_size: 128
      grad_clip_value: 5.0
      suppress_prints: false
      print_every: 10

task:
  dataset: "{{dataset}}"  # Replace with: mnist, cifar10, etc.
  parameters:
    flatten: true
    normalize: true

wandb:
  entity: "{{wandb_entity}}"  # Replace with your W&B entity
  project: "{{wandb_project}}"  # Replace with your project name
  use_wandb: false  # Set to true to enable logging

analysis:
  performance_analysis:
    enabled: true
    params:
      accuracy: true
      categorical_loglikelihood: true

outputs:
  run_name: "{{experiment_name}}"
  dir: "./outputs/" 