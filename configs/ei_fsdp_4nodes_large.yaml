# Total parameters: 103.13B (fits on 4 nodes with 16 H100 GPUs)
# Memory per GPU: 58.01 GB (73% utilization)

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
    
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 1024  # Moderate transfer function output
        inhibitory_dim: 1024  # Moderate transfer function output
      
      # Single layer that will utilize 4 nodes effectively
      excitatory_layer_sizes: [8192]   # 8K neurons
      inhibitory_layer_sizes: [0]      # No inhibitory neurons
      
      # Deep dendritic tree - 4 levels
      excitatory_branch_factors: [8, 4, 2, 2]  # 128 branches per neuron
      inhibitory_branch_factors: []
      
      # Moderate synapses per branch to fit memory
      ee_synapses_per_branch_per_layer: [48]   # Further reduced
      ei_synapses_per_branch_per_layer: []     # No inhibitory neurons
      ie_synapses_per_branch_per_layer: [48]   # Further reduced
      ii_synapses_per_branch_per_layer: []     # No inhibitory neurons
      
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters
      topk_init_method: xavier_normal
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 0.5
      topk_ultrafast: true
      topk_strategy: conductance_dynamic
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      reactivation_strategy: inverse
      blocklinear_strategy: conductance_dynamic
      print_hooks: false
    
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [4096, 2048, 1024]  # Decoder for 8K neurons
      activation: relu
      output_dim: 10  # CIFAR-10 has 10 classes

train:
  seed: 42
  train_valid_split: 0.8
  
  encoder:
    load_save_root: null
    lr: 0.001
    trainer:
      epochs: 0
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.0001
    
    param_groups:
      lr: 0.0001
      split_params: true
      topk_lr: 0.00005
      blocklinear_lr: 0.00005
      reactivation_lr: 0.00005
      decoder_lr: 0.0001
    
    trainer:
      loss_function: cat_nll
      epochs: 100
      early_stopping: true
      patience: 10
      batch_size: 512  # 32 per GPU across 16 GPUs
      shuffle: true
      grad_clip_value: 5.0
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 50

task:
  dataset: cifar10
  data_path: 
  parameters: 
    flatten: true
    normalize: true

wandb:
  entity: 
  project: "dendritic_cifar10_4nodes"
  group: "single_layer_16k_deep"
  tags: [cifar10, 4nodes, single_layer, deep_dendrites]
  use_wandb: false

analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
      mse: false

outputs:
  run_name: exc_only_16k_4nodes
  dir: results/ 