# ============================================================================
# PERFORMANCE SUMMARY TEST CONFIGURATION
# ============================================================================
# Tests combined performance optimizations without AMP to avoid hook conflicts

model:
  task: classification
  
  encoder_network:
    type: identity
    parameters:
      input_shape: [1, 28, 28]
  
  core_network:
    type: EINet
    parameters:
      input_dim: 784
      # Transfer function parameters
      transfer_params:
        input_mode: 0             # Raw input to excitatory only
        independent_pathways: false
        output_activation: none
        
      # Medium-sized network for final performance test
      excitatory_layer_sizes: [200, 100, 50]
      inhibitory_layer_sizes: [50, 25, 12]
      excitatory_branch_factors: [6, 4, 2]
      inhibitory_branch_factors: [3, 2, 1]
      
      # Connection patterns
      ee_synapses_per_branch_per_layer: [20]
      ei_synapses_per_branch_per_layer: [10]
      ie_synapses_per_branch_per_layer: [1]   # Minimum required
      ii_synapses_per_branch_per_layer: [1]   # Minimum required
      
      # Network features
      somatic_synapses: true
      use_shunting: true
      
      # TopK parameters with stochastic + ultrafast
      topk_type: stochastic
      topk_init_method: xavier_normal
      topk_noise_level: 0.1
      topk_temperature: 0.5
      topk_ultrafast: true         # ULTRAFAST TOPK
      
      # Reactivation
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.5
      reactivation_init_b: 0.5
      
      # ALL GRADIENT SCALING STRATEGIES
      reactivation_strategy: inverse
      topk_strategy: conductance_dynamic
      blocklinear_strategy: conductance_dynamic
      
      # EFFICIENT IMPLEMENTATIONS
      efficient_blocklinear: true  # EFFICIENT BLOCKLINEAR
      adaptive_initialization: true
      print_hooks: false           # Disable to avoid AMP conflicts

  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [80, 40]
      activation: relu
      output_dim: 10
      use_batch_norm: false
      dropout_rate: 0.0

train:
  run_name: "performance_summary_test"
  seed: 42
  train_valid_split: 0.8
  
  # PERFORMANCE OPTIMIZATIONS (NO AMP to avoid hook conflicts)
  enable_amp: false             # Disable AMP to avoid hook conflicts
  enable_profiling: true        # Enable profiling for performance analysis
  profiling_output_dir: "outputs/profiling/summary_test/"
  enable_hooks: true            # Keep for gradient scaling
  performance_mode: false       # Keep analysis
  use_fsdp: false
  
  # Encoder (skip for identity)
  encoder:
    trainer:
      epochs: 0
      batch_size: 128
  
  # Main training
  main:
    learning_strategy: standard
    weight_decay_rate: 0.01
    
    param_groups:
      lr: 0.001
      split_params: true
      topk_lr: 0.001
      blocklinear_lr: 0.001
      reactivation_lr: 0.001
      decoder_lr: 0.001
    
    trainer:
      loss_function: cat_nll
      epochs: 8                 # Quick test
      batch_size: 256           # Large batch for performance
      early_stopping: false
      shuffle: true
      grad_clip_value: 5.0      # GRADIENT CLIPPING
      load_best_state_dict: true
      plot_losses: false
      suppress_prints: false
      print_every: 2

task:
  dataset: mnist
  parameters:
    flatten: true
    normalize: true

wandb:
  enabled: true
  project: "dendritic-performance-tests"
  group: "performance-summary"
  tags: ["all-optimizations", "no-amp", "ultrafast-topk", "efficient-blocklinear", "gradient-scaling"]

# Keep analysis for validation
analysis:
  performance_analysis:
    enabled: true
    training: false
    params:
      memory_usage: true
      throughput: true
      gpu_utilization: true
      profiling_integration: true
  
  information_analysis:
    enabled: true
    training: false
    params:
      mutual_information: true
      entropy: true
      save_plots: false
      samples: 300

outputs:
  dir: "./outputs/summary_test/"

compute:
  device: "auto"
  memory:
    gradient_checkpointing: false
    empty_cache_freq: 100
    max_memory_fraction: 0.9 