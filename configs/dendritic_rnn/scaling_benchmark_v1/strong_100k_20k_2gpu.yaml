    type: MLP
    params:
      hidden_dims:
      - 32
      activation: relu
      output_dim: 2
      input_normalization: layer_norm
      output_init: zero
training:
  encoder:
    strategy: standard
    common:
      epochs: 0
  main:
    strategy: recurrent
    pruning:
      enabled: false
    optimizer:
      name: adam
      lr: 0.001
      weight_decay: 0.0
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
    common:
      epochs: 150
      batch_size: 1
      shuffle: true
      grad_clip_value: 10.0
      loss_function: ce
      early_stopping: false
      patience: 10
      load_best_state_dict: false
      plot_losses: true
      suppress_prints: false
      print_every: 10
      num_workers: 0
      pin_memory: true
      persistent_workers: false
      in_order: true
      use_amp: false
      log_first_step_diagnostics: true
      lr_schedule: none
      lr_warmup_epochs: 0
      weight_decay_rate: 0.0
      weight_boosting: false
      recalibrate_reactivation_every: 0
      reactivation_update_mode: backprop
      param_groups:
        lr: 0.0
        split_params: true
        topk_lr: 0.0
        blocklinear_lr: 0.0
        reactivation_lr: 0.0
        decoder_lr: 0.001
        decoder_input_lr: 8.0e-07
analysis: {}
wandb:
  use_wandb: false
outputs:
  run_name: strong_100k_20k_2gpu
  results_dir: results/dendritic_rnn/scaling_benchmark_v1/strong_100k_20k_2gpu
  exact_run_dir: true
distributed:
  mode: fsdp
  fsdp:
    freeze_core: true
    cache_frozen_core_outputs: true
    cached_core_batch_size: 4
    sharding_strategy: FULL_SHARD
    mixed_precision: true
    mixed_precision_dtype: bf16
    param_dtype: bf16
    reduce_dtype: fp32
    buffer_dtype: bf16
    cpu_offload: false
    min_num_params: 1000000
    auto_wrap_policy: indexed_synapses
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: false
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: BACKWARD_POST
    gradient_checkpointing: false
