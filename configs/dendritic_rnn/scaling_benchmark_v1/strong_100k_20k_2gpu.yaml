  learned_output_scale: false
  fixed_output_scale: 1.0
  output_scale_mode: fixed
  encoder:
    type: identity
    params:
      input_dim: 11
      input_shape: null
  core:
    type: ei_unified
    unified_ei:
      output_mode: last
      store_routing: false
      input_projection_dims:
      - 64
      layers:
      - recurrent: true
        dt: 1.0
        excitatory:
          n_neurons: 80000
          branch_factors:
          - 3
          - 3
          - 3
          ff_excitatory_synapses_by_level:
          - 0
          - 0
          - 0
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          - 0
          - 0
          - 0
          rec_excitatory_synapses_by_level:
          - 128
          - 384
          - 1152
          - 5600
          rec_inhibitory_synapses_by_level:
          - 32
          - 96
          - 288
          - 1408
          level_taus:
          - 625.0
          - 125.0
          - 25.0
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 620004
          indexed_selection: standard
          indexed_output_chunk_size: 65536
          indexed_index_dtype: auto
          indexed_workspace_mb: 32
          indexed_cache_transformed_weights: false
          indexed_recompute_backward: false
          indexed_persistent_indices: false
          indexed_init_mode: rank0_broadcast
          blocklinear_strategy: none
          efficient_blocklinear: true
          allow_self_recurrence: false
          structured_connectivity: {}
          initialization_seed: 620003
          initialization_namespace: scaling_benchmark_v1.100k.excitatory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          adaptive_initialization: true
          adaptive_target_conductance: 100.0
          dbl_init_method: analytical_expectation
          learnable_tau: false
          use_noise: false
          dynamics_mode: rate
          dendritic_spikes_enabled: false
          soma_feedback_enabled: false
          synapse_types: {}
        inhibitory:
          n_neurons: 20000
          branch_factors: []
          ff_excitatory_synapses_by_level:
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          rec_excitatory_synapses_by_level:
          - 15968
          rec_inhibitory_synapses_by_level:
          - 4000
          level_taus:
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 620008
          indexed_selection: standard
          indexed_output_chunk_size: 65536
          indexed_index_dtype: auto
          indexed_workspace_mb: 32
          indexed_cache_transformed_weights: false
          indexed_recompute_backward: false
          indexed_persistent_indices: false
          indexed_init_mode: rank0_broadcast
          blocklinear_strategy: none
          efficient_blocklinear: true
          allow_self_recurrence: false
          structured_connectivity: {}
          initialization_seed: 620003
          initialization_namespace: scaling_benchmark_v1.100k.inhibitory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
