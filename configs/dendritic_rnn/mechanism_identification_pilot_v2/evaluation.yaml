schema_version: dendritic-rnn-mechanism-pilot-evaluation-v1

study:
  status: post_outcome_descriptive_pilot
  inference: no_null_tests_three_seed_go_no_go
  require_source_snapshot: true
  training_manifest: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/_protocol/generated/manifest.json
  training_receipt: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/_launch/training_submission_v2.json
  bank_root: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/evaluation_banks_v2
  output_root: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/evaluation_v2
  evaluation_receipt: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/_launch/evaluation_submission_v2.json
  log_root: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/_runtime_logs/evaluation
  analysis_contract: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/_protocol/analysis_contract.json
  analysis_output_root: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_rnn_runs_protected/mechanism_pilot_v2_20260723/analysis_v2
  primary_contrast: (slow_distal_rec_distal - slow_distal_rec_proximal) - (fast_distal_rec_distal - fast_distal_rec_proximal)

bank:
  task: romo_delay_comparison_positive
  split: pilot_ood
  n_trials: 4096
  frequency_values: [2.0, 2.8, 3.6, 4.4, 5.2, 6.0]
  stimulus_duration: 20
  response_duration: 8
  noise_std: 0.15
  positive_input_encoding: true
  tuning_dim: 8
  pair_sampling: balanced_second_stimulus_v1
  min_delay: 240
  max_delay: 320

evaluation:
  batch_size: 128
  metrics: [accuracy, target_log_score, target_margin]
  conditions:
    - tau_distal_slow__rec_proximal_concentrated
    - tau_distal_slow__rec_distal_concentrated
    - tau_distal_fast__rec_proximal_concentrated
    - tau_distal_fast__rec_distal_concentrated

go_no_go:
  descriptive_only: true
  require_positive_mean_for_all_metrics: true
  require_positive_accuracy_contrast_seeds: 2
  minimum_mean_accuracy_contrast: 0.01
  maximum_cell_mean_accuracy: 0.995
  minimum_cell_mean_accuracy: 0.55

runtime:
  python: /n/holylabs/kempner_dev/Users/hsafaai/dendrinet_revision_2026/environments/main_rc7_balanced_selfcontained_v1/bin/python
  source_root: src

resources:
  partition: kempner_h100_priority
  account: kempner_bsabatini_lab
  gpu_type: nvidia_h100_80gb_hbm3
  gpus: 1
  cpus_per_task: 1
  memory: 4G
  walltime: "01:00:00"
  checkpoints_per_job: 4

analysis_resources:
  partition: serial_requeue
  account: kempner_dev
  cpus_per_task: 1
  memory: 2G
  walltime: "00:30:00"
