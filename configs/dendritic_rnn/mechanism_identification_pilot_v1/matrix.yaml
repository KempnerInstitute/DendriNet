design:
  status: post_outcome_descriptive_pilot
  question: Does slow distal integration selectively improve a contact-matched, distally concentrated recurrent pathway when soma tau is fixed fast?
  primary_pilot_contrast: (slow_distal_rec_distal - slow_distal_rec_proximal) - (fast_distal_rec_distal - fast_distal_rec_proximal)
  inference: no_null_tests_three_seed_go_no_go
  level_order: distal_to_soma
  level_sizes: [576, 192, 64]
  fixed_soma_tau: 5.0
  fixed_middle_tau: 25.0
  fixed_feedforward_profile: [1, 1, 50]
  recurrent_profiles:
    proximal_concentrated: [1, 1, 55]
    distal_concentrated: [7, 1, 1]
  recurrent_active_contacts_per_profile: 4288
  candidate_tensor_shapes_matched: true
  inhibitory_population_held_fixed: true

