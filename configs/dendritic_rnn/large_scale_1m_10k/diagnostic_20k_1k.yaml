# Degree-matched learning control for diagnostic_20k_10k.yaml.
#
# Neuron count, [3,3,3] morphology, initialization, data, and optimization are
# identical. Only contacts per neuron are reduced from 10,000 to 1,000
# (800 E-source and 200 I-source) to test whether high-degree mixing removes
# trainable task signal.
experiment:
  seed: 613000
  dataset_seed: 612001
  split_seed: 612002
  model_seed: 613003
  topology_seed: 613004
  loader_seed: 612005
  evaluation_seed: 612006
  probe_seed: 612007
  train_valid_split: 1.0
  fast_mode: false
  deterministic: false
  strict_deterministic: false
  cudnn_benchmark: true
  allow_tf32: true
  float32_matmul_precision: high
  enable_amp: false
  enable_profiling: false
  enable_hooks: false
  sealed_test: true
  allow_test_data: false
  max_test_samples: 32
  record_dataset_fingerprints: true
  checkpointing:
    enabled: false

data:
  dataset_name: romo_delay_comparison_positive
  base_dir: ''
  processing:
    flatten: false
    normalize: false
  dataset_params:
    romo_delay_comparison_positive:
      train:
        frequency_values: &frequency_values
        - 2.0
        - 2.8
        - 3.6
        - 4.4
        - 5.2
        - 6.0
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 128
        min_delay: 10
        max_delay: 10
      valid:
        frequency_values: *frequency_values
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 32
        min_delay: 10
        max_delay: 10
      test:
        frequency_values: *frequency_values
        stimulus_duration: 20
        response_duration: 8
        noise_std: 0.1
        positive_input_encoding: true
        tuning_dim: 8
        pair_sampling: balanced_second_stimulus_v1
        n_samples: 32
        min_delay: 10
        max_delay: 10

model:
  task: classification
  learned_output_scale: false
  fixed_output_scale: 1.0
  output_scale_mode: fixed
  encoder:
    type: identity
    params:
      input_dim: 11
      input_shape: null
  core:
    type: ei_unified
    unified_ei:
      output_mode: last
      store_routing: false
      input_projection_dims:
      - 64
      layers:
      - recurrent: true
        dt: 1.0
        excitatory:
          n_neurons: 16000
          branch_factors:
          - 3
          - 3
          - 3
          ff_excitatory_synapses_by_level:
          - 0
          - 0
          - 0
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          - 0
          - 0
          - 0
          rec_excitatory_synapses_by_level:
          - 6
          - 19
          - 58
          - 261
          rec_inhibitory_synapses_by_level:
          - 2
          - 5
          - 14
          - 59
          level_taus:
          - 625.0
          - 125.0
          - 25.0
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 613004
          indexed_selection: standard
          indexed_output_chunk_size: 16384
          indexed_index_dtype: auto
          indexed_workspace_mb: 128
          indexed_cache_transformed_weights: true
          indexed_recompute_backward: true
          indexed_persistent_indices: false
          indexed_init_mode: rank0_broadcast
          blocklinear_strategy: none
          efficient_blocklinear: true
          allow_self_recurrence: false
          structured_connectivity: {}
          initialization_seed: 613003
          initialization_namespace: diagnostic_20k_1k.excitatory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          adaptive_initialization: false
          dbl_init_method: analytical_expectation
          learnable_tau: false
          use_noise: false
          dynamics_mode: rate
          dendritic_spikes_enabled: false
          soma_feedback_enabled: false
          synapse_types: {}
        inhibitory:
          n_neurons: 4000
          branch_factors: []
          ff_excitatory_synapses_by_level:
          - 32
          ff_inhibitory_synapses_by_level:
          - 0
          rec_excitatory_synapses_by_level:
          - 768
          rec_inhibitory_synapses_by_level:
          - 200
          level_taus:
          - 5.0
          topk_type: indexed
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          topk_strategy: none
          indexed_seed: 613008
          indexed_selection: standard
          indexed_output_chunk_size: 16384
          indexed_index_dtype: auto
          indexed_workspace_mb: 128
          indexed_cache_transformed_weights: true
          indexed_recompute_backward: true
          indexed_persistent_indices: false
          indexed_init_mode: rank0_broadcast
          blocklinear_strategy: none
          efficient_blocklinear: true
          allow_self_recurrence: false
          structured_connectivity: {}
          initialization_seed: 613003
          initialization_namespace: diagnostic_20k_1k.inhibitory
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          weight_transform: exp
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          adaptive_initialization: false
          dbl_init_method: analytical_expectation
          learnable_tau: false
          use_noise: false
          dynamics_mode: rate
          dendritic_spikes_enabled: false
          soma_feedback_enabled: false
          synapse_types: {}
  decoder:
    type: MLP
    params:
      hidden_dims:
      - 32
      activation: relu
      output_dim: 2

training:
  encoder:
    strategy: standard
    common:
      epochs: 0
  main:
    strategy: recurrent
    pruning:
      enabled: false
    optimizer:
      name: adam
      lr: 0.001
      weight_decay: 0.0
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
    common:
      epochs: 30
      batch_size: 1
      shuffle: true
      grad_clip_value: 10.0
      loss_function: ce
      early_stopping: false
      patience: 30
      load_best_state_dict: false
      plot_losses: true
      suppress_prints: false
      print_every: 1
      num_workers: 0
      pin_memory: true
      persistent_workers: false
      in_order: true
      use_amp: false
      lr_schedule: none
      lr_warmup_epochs: 0
      weight_decay_rate: 0.0
      weight_boosting: false
      recalibrate_reactivation_every: 0
      reactivation_update_mode: backprop
      param_groups:
        lr: 0.001
        split_params: false

analysis: {}
wandb:
  use_wandb: false
outputs:
  run_name: diagnostic_20k_neurons_1k_contacts
  results_dir: results/dendritic_rnn/large_scale_1m_10k/diagnostic_20k_1k
  exact_run_dir: true
distributed:
  mode: fsdp
  fsdp:
    sharding_strategy: FULL_SHARD
    mixed_precision: true
    mixed_precision_dtype: bf16
    param_dtype: bf16
    reduce_dtype: fp32
    buffer_dtype: bf16
    cpu_offload: false
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: false
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: BACKWARD_POST
    gradient_checkpointing: true
