# Test configuration for FSDP with improved numerical stability
# Lower learning rate and smaller model for testing

model:
  task: classification
  
  encoder_network:
    type: Identity
    parameters: {}
    
  core_network:
    type: EINet
    parameters:
      # Transfer function parameters
      transfer_params:
        input_mode: 1
        independent_pathways: true
        excitatory_dim: 1536  # Half of 3072 for CIFAR-10
        inhibitory_dim: 1536  
      
      # Single layer with few neurons for testing
      excitatory_layer_sizes: [512]   # Small for testing
      inhibitory_layer_sizes: [0]     # No inhibitory neurons
      
      # Simple dendritic tree
      excitatory_branch_factors: [2, 2]  # 4 branches per neuron
      inhibitory_branch_factors: []
      
      # Few synapses per branch
      ee_synapses_per_branch_per_layer: [4]  # Reduced
      ei_synapses_per_branch_per_layer: []
      ie_synapses_per_branch_per_layer: [4]  # Reduced
      ii_synapses_per_branch_per_layer: []
      
      somatic_synapses: true
      use_shunting: false  # Disable shunting to avoid division issues
      
      # TopK parameters
      topk_init_method: xavier_uniform  # More stable initialization
      topk_noise_level: 0.0
      topk_type: standard
      topk_temperature: 1.0  # Higher temperature for stability
      topk_ultrafast: true
      topk_strategy: standard
      
      # Reactivation parameters
      reactivate: true
      reactivation_type: param_tanh
      reactivation_init_m: 1.0  # Lower initial slope
      reactivation_init_b: 0.0  # Zero bias
      reactivation_strategy: inverse
      blocklinear_strategy: standard
      print_hooks: false
    
  decoder_network:
    type: MLP
    parameters:
      hidden_dims: [256, 128]
      activation: relu
      dropout: 0.1  # Add dropout for regularization
      output_dim: 10  # CIFAR-10 has 10 classes

train:
  seed: 42
  train_valid_split: 0.8
  
  encoder:
    load_save_root: null
    lr: 0.0001
    trainer:
      epochs: 0
  
  main:
    learning_strategy: standard
    weight_decay_rate: 0.001  # Increased weight decay
    
    param_groups:
      lr: 0.0001  # Much lower learning rate
      split_params: true
      topk_lr: 0.00005  # Even lower for TopK
      blocklinear_lr: 0.00005
      reactivation_lr: 0.00005
      decoder_lr: 0.0001
    
    trainer:
      loss_function: cat_nll
      epochs: 5  # Just 5 epochs for testing
      early_stopping: false
      patience: 10
      batch_size: 64  # Moderate batch size
      shuffle: true
      grad_clip_value: 1.0  # Lower gradient clipping
      load_best_state_dict: false
      plot_losses: true
      suppress_prints: false
      print_every: 1
      save_checkpoints: false  # Disable checkpoint saving
      checkpoint_dir: checkpoints/fsdp_stable_test
      device: cuda
      # Use FSDP-specific settings
      use_fsdp: true
      fsdp_config:
        sharding_strategy: FULL_SHARD
        cpu_offload: false
        mixed_precision: false
        backward_prefetch: BACKWARD_PRE
        forward_prefetch: false
        sync_module_states: true

task:
  dataset: cifar10
  data_path: 
  parameters: 
    flatten: true
    normalize: true

wandb:
  entity: 
  project: "dendritic_fsdp_test"
  group: "stable_test"
  tags: [test, fsdp, stable]
  use_wandb: false

analysis:
  performance_analysis:
    enabled: true
    training: true  # Show performance during training
    params:
      accuracy: true
      categorical_loglikelihood: false
      mse: false

outputs:
  run_name: fsdp_test_stable
  dir: results/ 