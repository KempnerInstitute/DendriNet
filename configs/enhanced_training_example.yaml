# Enhanced Training Configuration Example
# ======================================
# This configuration demonstrates all the new training features:
# - Flexible optimizer selection
# - L1/L2 regularization with selective application
# - Weight pruning with detailed reporting

model:
  task: classification
  
  # Standard model configuration
  encoder_network:
    type: identity
    
  core_network:
    type: EINet
    parameters:
      # Your standard model parameters here
      layer_sizes: [100, 50, 10]

# Enhanced training configuration
train:
  seed: 42
  train_valid_split: 0.8
  run_name: 'enhanced_training_experiment'
  
  main:
    # Use enhanced training strategy
    learning_strategy: "enhanced"
    
    # ==========================================
    # OPTIMIZER CONFIGURATION
    # ==========================================
    optimizer:
      name: "adam"                    # Options: "adam", "sgd", "rmsprop", "adamw"
      lr: 0.001                      # Learning rate
      weight_decay: 0.0001           # Built-in L2 regularization (global)
      momentum: 0.9                  # For SGD
      betas: [0.9, 0.999]           # For Adam/AdamW
      eps: 1e-8                      # For Adam/AdamW
    
    # ==========================================
    # REGULARIZATION CONFIGURATION
    # ==========================================
    regularization:
      l1_weight: 0.0001              # L1 regularization strength (0 to disable)
      l2_weight: 0.0                 # L2 regularization strength (0 to disable, use optimizer.weight_decay instead)
      selective:                     # Selective application
        layers: []                   # List of layer indices (empty = all layers)
        branches: []                 # List of branch names (empty = all branches)
        weight_types: ["recurrent", "input"]  # Types of weights to regularize
    
    # ==========================================
    # PRUNING CONFIGURATION
    # ==========================================
    pruning:
      enabled: true                  # Enable pruning
      threshold: 0.001               # Prune weights with abs(value) < threshold
      selective:                     # Selective application
        layers: []                   # List of layer indices (empty = all layers)
        branches: []                 # List of branch names (empty = all branches)  
        weight_types: ["all"]        # Types of weights to prune
      re_evaluate_after: true        # Re-evaluate model after pruning
      dynamic_pruning: false         # Whether to prune during training
      pruning_frequency: 10          # Epochs between dynamic pruning (if enabled)
    
    # ==========================================
    # REPORTING CONFIGURATION
    # ==========================================
    reporting:
      report_non_pruned: true        # Print detailed pruning report
      save_pruning_stats: true       # Save pruning statistics to file
      detailed_branch_report: true   # Include per-branch statistics
    
    # Standard trainer configuration
    trainer:
      loss_function: "cross_entropy"
      epochs: 100
      early_stopping: true
      patience: 15
      batch_size: 128
      shuffle: true
      grad_clip_value: 5.0
      plot_losses: true
      print_every: 5

# Alternative configurations for different use cases:

# Example 1: Heavy L1 regularization with aggressive pruning
# regularization:
#   l1_weight: 0.01
#   l2_weight: 0.0
#   selective:
#     weight_types: ["recurrent"]  # Only regularize recurrent weights
# pruning:
#   enabled: true
#   threshold: 0.01               # More aggressive pruning
#   selective:
#     layers: [0, 1]              # Only prune first two layers

# Example 2: SGD with momentum and selective regularization
# optimizer:
#   name: "sgd"
#   lr: 0.01
#   momentum: 0.9
#   weight_decay: 0.0001
# regularization:
#   l1_weight: 0.001
#   selective:
#     layers: [2, 3]              # Only regularize deeper layers
#     weight_types: ["input", "output"]

# Example 3: Dynamic pruning during training
# pruning:
#   enabled: true
#   threshold: 0.001
#   dynamic_pruning: true
#   pruning_frequency: 20         # Prune every 20 epochs
#   re_evaluate_after: true