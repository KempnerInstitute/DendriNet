# ============================================================================
# DeepSeek-V3 transformer MLP replacement: first dense FFN blocks
# ============================================================================
# This config mirrors the AlexNet replacement configs conceptually:
#   1. model.transformer_replacement defines the source model and target layers.
#   2. model.core defines the dendritic replacement module.
#
# It is intentionally a configuration template, not a small smoke-test config:
# loading DeepSeek-V3 requires the Hugging Face model weights and the
# corresponding hardware/memory setup.
# ============================================================================

experiment:
  seed: 42
model:
  task: language_modeling
  transformer_replacement:
    enabled: true
    model_name: deepseek-ai/DeepSeek-V3
    layers:
    - 0
    - 1
    - 2
    target_module: mlp
    layers_attr: model.layers
    input_transform: signed_split
    preserve_device_dtype: true
    model_kwargs:
      device_map: auto
      torch_dtype: auto
  core:
    type: dendritic_ffn
    population_network:
      layers:
      - name: transformer_mlp
        readout_population: ffn
        population_defaults:
          ff_excitatory_synapses: 40
          ff_inhibitory_synapses: 0
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: true
          use_shunting: true
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: analytical
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          indexed_seed: 42
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          efficient_blocklinear: true
        populations:
        - name: ffn
          polarity: excitatory
          n_neurons: 512
          branch_factors:
          - 3
          - 3
        connections:
        - source: input
          target: ffn
      input_transform: signed_split
training:
  main:
    strategy: standard
    common:
      epochs: 0
    optimizer:
      name: adamw
      lr: 0.0003
      weight_decay: 0.01
  transformer_replacement:
    enabled: false
    mode: layerwise_distillation
    teacher_source: hf_text
    train_target: replacement_only
    layers:
    - 0
    - 1
    - 2
    device: cuda
    dtype: bfloat16
    sequence_length: 128
    batch_size: 1
    max_steps: 1000
    eval_every: 100
    log_every: 10
    loss: mse
    save_dir: results/deepseek_v3_dendritic_mlp_distillation
    save_replacements: true
    text:
      text_path: /path/to/text_corpus.txt
      tokenizer_name: deepseek-ai/DeepSeek-V3
      max_tokens: 1000000
analysis:
  performance:
    enabled: false
    training: false
    params: {}
