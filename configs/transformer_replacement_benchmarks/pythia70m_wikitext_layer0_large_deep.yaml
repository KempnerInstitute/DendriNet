# Real Hugging Face benchmark: larger/deeper dendritic replacement for the
# Pythia-70M layer-0 MLP.
#
# Compared with pythia70m_wikitext_layer0.yaml, this uses more dendritic units,
# one extra branch level, more active synapses per branch, and a larger indexed
# candidate set. It tests whether added dendritic capacity improves the full
# language-model loss after replacement while preserving active sparsity.

experiment:
  seed: 406
model:
  task: language_modeling
  transformer_replacement:
    enabled: true
    model_name: EleutherAI/pythia-70m-deduped
    layers:
    - 0
    target_module: mlp
    layers_attr: gpt_neox.layers
    input_transform: signed_split
    preserve_device_dtype: true
    model_kwargs: {}
    replacement_kwargs:
      output_init_std: 0.02
  core:
    type: dendritic_ffn
    population_network:
      layers:
      - name: transformer_mlp
        readout_population: ffn
        population_defaults:
          ff_excitatory_synapses: 32
          ff_inhibitory_synapses: 0
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: true
          use_shunting: false
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: occupancy_quantile
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          indexed_seed: 406
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 2048
          efficient_blocklinear: true
        populations:
        - name: ffn
          polarity: excitatory
          n_neurons: 512
          branch_factors:
          - 2
          - 2
          - 2
        connections:
        - source: input
          target: ffn
      input_transform: signed_split
training:
  main:
    optimizer:
      name: adamw
      lr: 0.0007
      weight_decay: 0.0001
  transformer_replacement:
    enabled: true
    mode: layerwise_distillation
    teacher_source: hf_text
    train_target: replacement_only
    layers:
    - 0
    device: auto
    dtype: float32
    sequence_length: 64
    train_samples: 4096
    valid_samples: 64
    batch_size: 2
    max_steps: 800
    eval_every: 100
    log_every: 25
    loss: mse
    save_dir: results/transformer_replacement_benchmarks/pythia70m_wikitext_layer0_large_deep
    save_replacements: true
    text:
      dataset_name: wikitext
      dataset_config: wikitext-2-raw-v1
      split: train
      text_field: text
      max_documents: 600
      tokenizer_name: EleutherAI/pythia-70m-deduped
      max_tokens: 100000
