# Synthetic transformer replacement benchmark: linear teacher block.

experiment:
  seed: 101
model:
  task: language_modeling
  transformer_replacement:
    enabled: true
    layers:
    - 0
    target_module: mlp
    input_transform: signed_split
    replacement_kwargs:
      output_init_std: 0.03
  core:
    type: dendritic_ffn
    population_network:
      layers:
      - name: transformer_mlp
        readout_population: ffn
        population_defaults:
          ff_excitatory_synapses: 8
          ff_inhibitory_synapses: 0
          rec_excitatory_synapses: 0
          rec_inhibitory_synapses: 0
          somatic_synapses: true
          use_shunting: false
          use_additive_normalization: false
          reactivate: true
          reactivation_type: param_tanh
          reactivation_init_policy: occupancy_quantile
          weight_transform: softplus
          topk_type: indexed_rewire
          topk_init_method: xavier_normal
          topk_noise_level: 0.0
          indexed_seed: 101
          indexed_rewire_frequency: 100
          indexed_rewire_quantile: 0.05
          indexed_rewire_until_step: null
          indexed_output_chunk_size: 1024
          efficient_blocklinear: true
        populations:
        - name: ffn
          polarity: excitatory
          n_neurons: 128
          branch_factors:
          - 2
          - 2
        connections:
        - source: input
          target: ffn
      input_transform: signed_split
training:
  main:
    optimizer:
      name: adamw
      lr: 0.003
      weight_decay: 0.0001
  transformer_replacement:
    enabled: true
    mode: layerwise_distillation
    teacher_source: synthetic_mlp
    train_target: replacement_only
    layers:
    - 0
    device: auto
    dtype: float32
    hidden_size: 128
    intermediate_size: 512
    sequence_length: 8
    train_samples: 4096
    valid_samples: 1024
    batch_size: 64
    max_steps: 800
    eval_every: 100
    log_every: 50
    loss: mse
    save_dir: results/transformer_replacement_benchmarks/synthetic_linear_projection
    save_replacements: true
    synthetic_teacher:
      kind: linear
      activation: identity
      bias: false
      input_std: 1.0
