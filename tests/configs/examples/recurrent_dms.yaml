# ============================================================================
# Unified E-I Recurrent Network on Variable-Delay DMS Task
# ============================================================================
# Trains a recurrent dendritic E-I network (unified_ei config format) on a
# delayed match-to-sample task with variable delay lengths.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/recurrent_dms.yaml
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: true
    save_every_n_epochs: 50
    checkpoint_dir: "outputs/checkpoints/"

data:
  dataset_name: "variable_delay_dms"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    variable_delay_dms:
      n_samples: 10000
      stimulus_dim: 16
      stimulus_duration: 10
      min_delay: 5
      max_delay: 50
      probe_duration: 10

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 17                    # 16 stimulus channels + timing channel
  core:
    type: "unified_ei"
    unified_ei:
      output_mode: "last"               # "last" | "all" | "mean"
      input_projection_dims: [32]
      layers:
        - recurrent: true
          dt: 1.0
          excitatory:
            n_neurons: 64
            branch_factors: [1]
            ff_excitatory_synapses: 12
            ff_inhibitory_synapses: 4
            rec_excitatory_synapses: 8
            rec_inhibitory_synapses: 4
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 10.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
          inhibitory:
            n_neurons: 16
            branch_factors: [1]
            ff_excitatory_synapses: 12
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 8
            rec_inhibitory_synapses: 0
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 10.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
        - recurrent: true
          dt: 1.0
          excitatory:
            n_neurons: 64
            branch_factors: [1]
            ff_excitatory_synapses: 6
            ff_inhibitory_synapses: 4
            rec_excitatory_synapses: 10
            rec_inhibitory_synapses: 4
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 50.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
          inhibitory:
            n_neurons: 16
            branch_factors: [1]
            ff_excitatory_synapses: 6
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 10
            rec_inhibitory_synapses: 0
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 10.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
        - recurrent: true
          dt: 1.0
          excitatory:
            n_neurons: 64
            branch_factors: [1]
            ff_excitatory_synapses: 2
            ff_inhibitory_synapses: 4
            rec_excitatory_synapses: 12
            rec_inhibitory_synapses: 4
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 200.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
          inhibitory:
            n_neurons: 16
            branch_factors: [1]
            ff_excitatory_synapses: 2
            ff_inhibitory_synapses: 0
            rec_excitatory_synapses: 12
            rec_inhibitory_synapses: 0
            use_shunting: true
            reactivate: true
            reactivation_type: "param_tanh"
            weight_transform: "softplus"
            tau_base: 10.0
            tau_ratio: 1.0
            learnable_tau: true
            somatic_synapses: true
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2                     # match / non-match

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 300
      batch_size: 128
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      use_amp: false
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.01
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    params:
      accuracy: true
  routing:
    enabled: true
    training: false

wandb:
  use_wandb: false

outputs:
  run_name: "recurrent_dms"
  results_dir: "outputs"

distributed:
  mode: none
