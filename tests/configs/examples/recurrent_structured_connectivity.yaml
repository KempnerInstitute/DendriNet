# ============================================================================
# Recurrent EINet with structured/probabilistic connectivity masks
# ============================================================================
# Demonstrates hard topology constraints on feedforward and recurrent E/I
# pathways while keeping the standard recurrent EINet architecture.
#
# Run:
#   PYTHONPATH=src:$PYTHONPATH python \
#     src/dendritic_modeling/scripts/training/train_experiments.py \
#     configs/examples/recurrent_structured_connectivity.yaml
# ============================================================================

experiment:
  seed: 44
  train_valid_split: 0.8
  enable_hooks: true
  checkpointing:
    enabled: false

data:
  dataset_name: "context_dependent_decision"
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision:
      n_samples: 512
      signal_dim: 4
      context_duration: 6
      integration_duration: 12
      delay_duration: 2
      coherence_levels: [0.2, 0.4, 0.8]
      noise_std: 0.1

model:
  task: "classification"
  encoder:
    type: "identity"
    params:
      input_dim: 10
  core:
    type: "dendritic_shunting"
    architecture:
      excitatory_layer_sizes: [32]
      inhibitory_layer_sizes: [8]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [1]
      input_projection_dims: []
    connectivity:
      ee_synapses_per_branch_per_layer: [3]
      ie_synapses_per_branch_per_layer: [1]
      ei_synapses_per_branch_per_layer: [3]
      ii_synapses_per_branch_per_layer: [1]
      rec_ee_synapses_per_branch: [2]
      rec_ie_synapses_per_branch: [1]
      rec_ei_synapses_per_branch: [2]
      rec_ii_synapses_per_branch: [1]
      structured:
        enabled: true
        seed: 44
        pathways:
          ee:
            method: "fixed_indegree"
            indegree: 8
          ie:
            method: "bernoulli"
            probability: 0.45
          rec_ee:
            method: "bernoulli"
            probability: 0.35
          rec_ie:
            method: "bernoulli"
            probability: 0.50
    transfer:
      input_mode: 0
      inhibitory_mode: "none"
      output_activation: "relu"
    morphology:
      use_shunting: true
      somatic_synapses: true
      allow_self_recurrence: false
      weight_transform: "exp"
      dbl_init_method: "default"
    recurrent_ei:
      output_mode: "last"
      use_transfer: true
      dt: 1.0
      tau_base: 20.0
      tau_ratio: 2.0
    reactivation:
      enabled: true
      type: "param_tanh"
      init_policy: "fixed"
      init_m: 1.0
      init_b: 0.0
    sparsity:
      init_method: "xavier_normal"
      type: "standard"
  decoder:
    type: "MLP"
    params:
      hidden_dims: [32]
      activation: "relu"
      output_dim: 2

training:
  encoder:
    strategy: "standard"
    common:
      epochs: 0
  main:
    strategy: "recurrent"
    common:
      epochs: 5
      batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: "ce"
      early_stopping: false
      use_amp: false
      param_groups:
        lr: 0.001
        split_params: true
        decoder_lr: 0.005
    optimizer:
      name: "adam"
    strategies:
      standard: {}

analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
  routing:
    enabled: true
    training: false
  inhibitory_specialization:
    enabled: true
    training: false
    params:
      save_figures: true

wandb:
  use_wandb: false

outputs:
  run_name: "recurrent_structured_connectivity"
  results_dir: "outputs"

distributed:
  mode: none
