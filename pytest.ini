[pytest]
minversion = 6.0
addopts =
    -ra
    --strict-markers
    --strict-config
testpaths = tests
norecursedirs =
    .git
    .tox
    .venv
    venv
    build
    dist
    docs/_build
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    multiprocess: spawns worker processes (distributed tests); avoid on shared interactive hosts
    requires_gpu: marks tests that require GPU
    requires_git_checkout: reads the library's own Git checkout; skipped in a source archive or sdist
# Warnings are shown, not hidden: a test that expects one asserts it with
# pytest.warns. Only third-party noise outside the library is ignored.
filterwarnings =
    ignore:The argument 'device' of Tensor.(pin_memory|is_pinned)\(\) is deprecated:DeprecationWarning
    ignore:The number of unique classes is greater than:UserWarning:sklearn
