# Structured dendritic tree network. One layer of shunting dendritic neurons
# with branched excitatory trees and a small inhibitory population, built from
# the structured (section-based) core on the generated two-class task of the
# population tutorial; no download. A tutorial, not a paper recipe.
config_version: 4
experiment:
  seed: 42
  train_valid_split: 0.8
  checkpointing:
    enabled: false
data:
  dataset_name: linear_separable
  dataset_params:
    linear_separable:
      n_samples: 1024
      input_dim: 16
      ne: 8
      ni: 8
      seed: 42
model:
  task: classification
  encoder:
    type: identity
    params:
      input_dim: 16
  core:
    biological_neuron: true
    type: dendritic_shunting
    transfer:
      output_activation: nonnegative
    architecture:
      excitatory_layer_sizes: [16]
      inhibitory_layer_sizes: [4]
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [1]
    connectivity:
      ee_synapses_per_branch_per_layer: [8]
      ei_synapses_per_branch_per_layer: [4]
      ie_synapses_per_branch_per_layer: [2]
      ii_synapses_per_branch_per_layer: [0]
    morphology:
      somatic_synapses: true
      use_shunting: true
      weight_transform: softplus
      dbl_init_method: analytical_expectation
    sparsity:
      type: indexed
      init_method: xavier_normal
    reactivation:
      type: param_tanh
      init_policy: occupancy_quantile
      memory_efficient: true
  decoder:
    type: MLP
    params:
      hidden_dims:
      - 8
      activation: relu
      output_dim: 2
training:
  main:
    strategy: standard
    common:
      epochs: 30
      batch_size: 64
      reactivation_initialization_batch_size: 64
      shuffle: true
      grad_clip_value: 5.0
      loss_function: ce
      early_stopping: true
      patience: 30
      load_best_state_dict: true
      param_groups:
        lr: 0.005
        split_params: true
        topk_lr: 0.005
        blocklinear_lr: 0.0005
        reactivation_lr: 0.0005
        decoder_lr: 0.005
      plot_losses: false
    optimizer:
      name: adam
      weight_decay: 0.0
    strategies:
      standard: {}
analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
outputs:
  run_name: structured_tree_synthetic
  results_dir: outputs
distributed:
  mode: none
