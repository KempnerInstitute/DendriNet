# Recurrent decision population network. A recurrent layer of excitatory
# (pyramidal-like) and inhibitory dendritic neurons with delayed recurrent
# connections integrates noisy evidence over time and reports the context-
# dependent choice at the end of each trial; generated data, no download. A
# tutorial, not a paper recipe.
config_version: 4
experiment:
  seed: 44
  train_valid_split: 0.8
  checkpointing:
    enabled: false
data:
  dataset_name: context_dependent_decision_positive
  processing:
    flatten: false
    normalize: false
  dataset_params:
    context_dependent_decision_positive:
      n_samples: 1024
      signal_dim: 4
      context_duration: 4
      variable_integration: false
      integration_duration: 16
      delay_duration: 2
      coherence_levels: [0.1, 0.2, 0.4, 0.8]
      noise_std: 0.3
model:
  task: classification
  encoder:
    type: identity
    params:
      input_dim: 10
  core:
    biological_neuron: true
    type: population_network
    population_network:
      input_transform: nonnegative
      output_mode: last
      layers:
      - name: circuit
        recurrent: true
        dt: 1.0
        readout_population: pyr
        connection_seed: 44
        population_defaults:
          ff_excitatory_synapses: 4
          ff_inhibitory_synapses: 2
          rec_excitatory_synapses: 2
          rec_inhibitory_synapses: 1
          somatic_synapses: true
          use_shunting: true
          reactivate: true
          reactivation_type: param_tanh
          reactivation_memory_efficient: true
          reactivation_init_policy: occupancy_quantile
          dbl_init_method: analytical_expectation
          weight_transform: softplus
          topk_type: indexed
          topk_init_method: xavier_normal
          indexed_index_dtype: auto
          indexed_projection_backend: recompute
          efficient_blocklinear: true
          tau_base: 10.0
          tau_ratio: 2.0
        populations:
        - name: pyr
          polarity: excitatory
          n_neurons: 24
          branch_factors: [2, 2]
        - name: pv
          polarity: inhibitory
          n_neurons: 8
          branch_factors: [1]
          population:
            ff_inhibitory_synapses: 0
            rec_inhibitory_synapses: 0
        connections:
        - source: input
          target: pyr
        - source: input
          target: pv
        - source: pv
          target: pyr
        - source: pyr
          target: pyr
          timing: delayed
          probability: 0.6
        - source: pyr
          target: pv
          timing: delayed
  decoder:
    type: MLP
    params:
      hidden_dims:
      - 16
      activation: relu
      output_dim: 2
training:
  main:
    strategy: recurrent
    common:
      epochs: 10
      batch_size: 64
      reactivation_initialization_batch_size: 64
      shuffle: true
      grad_clip_value: 1.0
      loss_function: ce
      early_stopping: true
      patience: 10
      load_best_state_dict: true
      param_groups:
        lr: 0.005
        split_params: true
        topk_lr: 0.005
        blocklinear_lr: 0.0005
        reactivation_lr: 0.0005
        decoder_lr: 0.005
      plot_losses: false
    optimizer:
      name: adam
      weight_decay: 0.0
    strategies:
      recurrent: {}
analysis:
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      categorical_loglikelihood: true
outputs:
  run_name: recurrent_decision_population
  results_dir: outputs
distributed:
  mode: none
