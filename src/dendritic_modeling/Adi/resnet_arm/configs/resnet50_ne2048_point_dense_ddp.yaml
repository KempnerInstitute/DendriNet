# ============================================================================
# ResNet-50 + dense point neuron
# ============================================================================
#
# ResNet-50 arm. Frozen ResNet-50 through avgpool (2048-d) -> core (N_E=2048)
# -> ResNet's own pretrained fc (2048->1000) as the trainable decoder, the exact
# analogue of AlexNet's classifier.6 (fc8) in the k1 runs.
#
# Core: dense point neuron, Linear(2048->2048) + ReLU, 2048 weights/neuron
#
# K=315 is the 2x2 EINet's full synaptic budget at these shapes, derived not copied:
#   per-neuron = 6*(ee+ei) + 6*(N_I/N_E)*ie = 6*(40+10) + 6*(1/4)*10 = 300 + 15 = 315
#   N_E cancels (N_I scales with it at 4:1), which is why the AlexNet sweep gives
#   exactly 315.0000 at all eight points ne32..ne4096.
#   At N_E=2048: N_I=512, EE 491,520 + EI 122,880 + IE 30,720 = 645,120 total.
#
# Matched on synapse COUNT, not density.
#   this ResNet arm : 315 weights/neuron of a 2048-d input = 15.38% density
#   AlexNet fc7 arm : 315 weights/neuron of a 4096-d input =  7.69% density
# Same 315 per neuron in both; the ResNet input is half as wide, so each neuron
# samples twice as large a fraction of it. Applies equally to all three models
# here, so the within-arm comparison is unaffected; only cross-arm claims need it.
#
# Run with src/dendritic_modeling/Adi/resnet_arm/train_resnet_arm.py, which patches
# initialize_model. It does NOT go through pretrained.py -- see resnet_encoder.py.
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  fast_mode: true
  enable_profiling: false
  profiling_output_dir: "results/profiling/"
  enable_hooks: false
  checkpointing:
    enabled: true
    save_every_n_epochs: 25
    checkpoint_dir: "results/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  processing:
    flatten: false
    normalize: true
  dataset_params: {}

model:
  task: "classification"

  pretrained_replacement:
    enabled: true
    backbone: "resnet50"
    weights: "IMAGENET1K_V1"                       # pinned: torchvision "DEFAULT" is V2
    input_shape: [3, 224, 224]

    # NOTE: the ResNet arm does NOT use this split machinery. build_model.py constructs
    # encoder/core/decoder directly; only `weights` is read from this block.
    replace:
      start: "fc"
      end: "fc"

    omit_layers: []

    trainability:
      encoder:
        mode: "frozen"
      decoder:
        mode: "trainable"

  core:
    type: "point_neuron"

    architecture:
      excitatory_layer_sizes: [2048]                # N_E=2048, = ResNet avgpool dim
      inhibitory_layer_sizes: [512]                 # N_I=512, 4:1 ratio
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [2, 2]
      inhibitory_network_type: "dendritic"
      mlp_inhibitory_network_params:
        hidden_dims: []
        activation: "relu"

    connectivity:
      ee_synapses_per_branch_per_layer: [40]
      ei_synapses_per_branch_per_layer: [10]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]

    transfer:
      input_mode: 0
      independent_pathways: false
      excitatory_dim: null
      inhibitory_dim: null
      output_activation: null

    morphology:
      somatic_synapses: false
      use_shunting: true
      weight_transform: "softplus"
      dbl_init_method: "analytical_expectation"

    sparsity:
      init_method: "xavier_normal"
      noise_level: 0.0
      type: "standard"
      weight_norm_order: null
      gamma: 1.0
      temperature: 0.0
      gradient_scaling: "none"
      deepst:
        excitatory_target_density: 0.1
        inhibitory_target_density: 0.1
        use_noise: true
        sigma: 0.05
        rewiring_mode: "global"
        rewire_frequency: 1
        synapses_per_branch: null
        freeze_excitatory_connectivity: false
        freeze_inhibitory_connectivity: false
        init_method: "xavier_normal"
        weight_threshold: 1.0e-6

    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
      gradient_scaling: "none"

    blocklinear:
      gradient_scaling: "none"
      efficient: false

    implementation:
      adaptive_initialization: false
      print_hooks: false

training:
  encoder:
    strategy: "standard"
    common:
      lr: 0.0
      loss_function: "log_mse"
      epochs: 0
      early_stopping: false
      patience: 100
      batch_size: 256
      shuffle: false
      grad_clip_value: 5.0
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false

  main:
    strategy: "standard"
    common:
      epochs: 50
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 1
      use_amp: true
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.0001
        encoder_lr: 0.0

    regularization:
      l1_weight: 0.0
      l2_weight: 0.0
      selective:
        layers: []
        branches: []
        weight_types: ["all"]
      split_params: false
      param_group_weights:
        topk: { l1_weight: 0.0, l2_weight: 0.0 }
        blocklinear: { l1_weight: 0.0, l2_weight: 0.0 }
        reactivation: { l1_weight: 0.0, l2_weight: 0.0 }
        decoder: { l1_weight: 0.0, l2_weight: 0.0 }
      enforce_ei_weight_ratio: false
      target_ei_weight_ratio: 0.5
      ei_ratio_loss_weight: 0.5
      ei_ratio_scope: "per_branch"
      ei_ratio_metric: "mean"

    pruning:
      enabled: false
      threshold: 2
      selective:
        layers: []
        branches: []
        weight_types: ["excitatory", "inhibitory"]
      re_evaluate_after: false
      dynamic_pruning: false
      pruning_frequency: 10
      report_non_pruned: true
      save_pruning_stats: false
      detailed_branch_report: true
      redo_analysis_after_pruning: false

    strategies:
      standard: {}

analysis:
  runtime:
    training:
      mode: "stream"
      batch_size: 256
      num_workers: 4
      max_batches: 20
    final:
      mode: "stream"
      batch_size: 256
      num_workers: 4
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
    training_splits: ["valid"]
    final_splits: ["valid", "test"]
  information: { enabled: false, training: false, params: {} }
  correlation: { enabled: false, training: false, params: {} }
  ablation: { enabled: false, training: false, params: {} }
  synapse_turnover: { enabled: false, training: false, params: {} }
  noise_perturbation: { enabled: false, training: false, params: {} }
  weight: { enabled: false, training: false, params: {} }
  single_layer_contribution: { enabled: false, training: false, params: {} }
  synaptic_activation: { enabled: false, training: false, params: {} }
  branch_activation: { enabled: false, training: false, params: {} }
  compartment_statistics: { enabled: false, training: false, params: {} }
  compartment_snr: { enabled: false, training: false, params: {} }

wandb:
  use_wandb: false
  entity: ""
  project: "dendritic-sweeps"
  group: "alexnet_fc_replacement"
  tags: ["resnet50", "point_neuron", "dense", "ne2048"]

outputs:
  run_name: "resnet50_ne2048_point_dense_ddp"
  results_dir: "outputs"

distributed:
  mode: ddp
  fsdp:
    sharding_strategy: "FULL_SHARD"
    mixed_precision: true
    cpu_offload: false
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: "BACKWARD_PRE"
    gradient_checkpointing: false
