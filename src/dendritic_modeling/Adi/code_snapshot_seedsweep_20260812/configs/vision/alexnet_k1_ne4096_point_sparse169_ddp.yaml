# ============================================================================
# AlexNet K=1: N_E=4096, point neuron with 169 active weights/neuron (INPUT-FANIN matched)
# ============================================================================
#
# K=169 matches the DISTINCT input units a 2x2 EINet excitatory neuron actually reads,
# measured on the trained 51.51% checkpoint: its 6 compartments each pick 40 inputs
# INDEPENDENTLY and overlap heavily, so 240 nominal synapses touch only 168.7 distinct
# input units on average (median 169, min 130, max 200). Random picking would give 234,
# so training makes a neuron's compartments CONVERGE on a shared input subset.
# A point neuron's weights are inherently distinct, so 169 -- not 240 or 315 -- is the
# input-ACCESS match. (315 remains the correct trainable-PARAMETER match; different claim.)
#
# Previously: effective-parameter-matched sparse baseline for the 2x2 EINet.
#
# This is the SAME model as alexnet_k1_ne4096_point_noproj_ddp (the 49.27% dense
# point neuron) - same nn.Linear, same initialization, same SIGNED weights, same
# bias, same ReLU, same param group, same training protocol - with exactly one
# difference: only the 315 largest-magnitude weights per output neuron are active.
#
# Why 315 - the 2x2 EINet's FULL synaptic budget (EE + EI + IE), not EE alone:
#   EE:  16384 tips x 40 + 8192 layer1 x 40       =   983,040   (somatic_synapses: false)
#   EI:  16384 tips x 10 + 8192 layer1 x 10       =   245,760
#   IE:  (1024 inh: 4096 tips + 2048 layer1) x 10 =    61,440   (ii = 0)
#                                           total = 1,290,240
#   per excitatory neuron: 1,290,240 / 4096       =       315
#   Confirmed exact against ExcitationInhibitionNetwork.get_effective_params().
#
# Three-way comparison, all replacing fc7 only, all N_E=4096:
#   2x2 EINet             51.51%    315 synapses/neuron
#   dense point neuron    49.27%   4096 weights/neuron
#   this config                ?    315 weights/neuron
# ============================================================================

experiment:
  seed: 42
  train_valid_split: 0.8
  fast_mode: true
  enable_profiling: false
  profiling_output_dir: "results/profiling/"
  enable_hooks: false
  checkpointing:
    enabled: true
    save_every_n_epochs: 25
    checkpoint_dir: "results/checkpoints/"

data:
  dataset_name: "imagenet"
  base_dir: "/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k"
  processing:
    flatten: false
    normalize: true
  dataset_params: {}

model:
  task: "classification"

  pretrained_replacement:
    enabled: true
    backbone: "alexnet"
    weights: "IMAGENET1K_V1"
    input_shape: [3, 224, 224]

    replace:
      start: "classifier.4"                        # fc7 Linear(4096 → 4096)
      end: "classifier.5"                          # fc7 ReLU

    omit_layers: ["classifier.0", "classifier.3"]

    trainability:
      encoder:
        mode: "frozen"
      decoder:
        mode: "trainable"

  # EINet replacing fc7 — direct output to fc8, no projection layer.
  # N_E=4096 matches fc8 input dim exactly; no zero-padding needed.
  core:
    type: "signed_sparse_point_neuron"

    architecture:
      excitatory_layer_sizes: [4096]               # N_E=4096
      inhibitory_layer_sizes: [1024]               # 4:1 ratio
      excitatory_branch_factors: [2, 2]
      inhibitory_branch_factors: [2, 2]
      inhibitory_network_type: "dendritic"
      mlp_inhibitory_network_params:
        hidden_dims: []
        activation: "relu"

    connectivity:
      ee_synapses_per_branch_per_layer: [169]        # K: active weights per neuron
      ei_synapses_per_branch_per_layer: [10]
      ie_synapses_per_branch_per_layer: [10]
      ii_synapses_per_branch_per_layer: [0]

    transfer:
      input_mode: 0
      independent_pathways: false
      excitatory_dim: null
      inhibitory_dim: null
      output_activation: null

    morphology:
      somatic_synapses: false
      use_shunting: true
      weight_transform: "softplus"
      dbl_init_method: "analytical_expectation"

    sparsity:
      init_method: "xavier_normal"
      noise_level: 0.0
      type: "standard"
      weight_norm_order: null
      gamma: 1.0
      temperature: 0.0
      gradient_scaling: "none"
      deepst:
        excitatory_target_density: 0.1
        inhibitory_target_density: 0.1
        use_noise: true
        sigma: 0.05
        rewiring_mode: "global"
        rewire_frequency: 1
        synapses_per_branch: null
        freeze_excitatory_connectivity: false
        freeze_inhibitory_connectivity: false
        init_method: "xavier_normal"
        weight_threshold: 1.0e-6

    reactivation:
      enabled: true
      type: "param_tanh"
      init_m: 1.5
      init_b: 0.5
      gradient_scaling: "none"

    blocklinear:
      gradient_scaling: "none"
      efficient: false

    implementation:
      adaptive_initialization: false
      print_hooks: false

training:
  encoder:
    strategy: "standard"
    common:
      lr: 0.0
      loss_function: "log_mse"
      epochs: 0
      early_stopping: false
      patience: 100
      batch_size: 256
      shuffle: false
      grad_clip_value: 5.0
      load_best_state_dict: false
      plot_losses: false
      suppress_prints: false
      print_every: 1
      use_amp: false
      enable_nan_checking: false
      enable_adaptive_clipping: false

  main:
    strategy: "standard"
    common:
      epochs: 50
      batch_size: 256
      shuffle: true
      grad_clip_value: 5.0
      loss_function: "cat_nll"
      early_stopping: true
      patience: 50
      load_best_state_dict: true
      plot_losses: true
      suppress_prints: false
      print_every: 1
      use_amp: true
      enable_nan_checking: false
      enable_adaptive_clipping: false
      weight_decay_rate: 0.0
      weight_boosting: false
      param_groups:
        lr: 0.001
        split_params: true
        topk_lr: 0.001
        blocklinear_lr: 0.0001
        reactivation_lr: 0.0001
        decoder_lr: 0.0001
        encoder_lr: 0.0

    regularization:
      l1_weight: 0.0
      l2_weight: 0.0
      selective:
        layers: []
        branches: []
        weight_types: ["all"]
      split_params: false
      param_group_weights:
        topk: { l1_weight: 0.0, l2_weight: 0.0 }
        blocklinear: { l1_weight: 0.0, l2_weight: 0.0 }
        reactivation: { l1_weight: 0.0, l2_weight: 0.0 }
        decoder: { l1_weight: 0.0, l2_weight: 0.0 }
      enforce_ei_weight_ratio: false
      target_ei_weight_ratio: 0.5
      ei_ratio_loss_weight: 0.5
      ei_ratio_scope: "per_branch"
      ei_ratio_metric: "mean"

    pruning:
      enabled: false
      threshold: 2
      selective:
        layers: []
        branches: []
        weight_types: ["excitatory", "inhibitory"]
      re_evaluate_after: false
      dynamic_pruning: false
      pruning_frequency: 10
      report_non_pruned: true
      save_pruning_stats: false
      detailed_branch_report: true
      redo_analysis_after_pruning: false

    strategies:
      standard: {}

analysis:
  runtime:
    training:
      mode: "stream"
      batch_size: 256
      num_workers: 4
      max_batches: 20
    final:
      mode: "stream"
      batch_size: 256
      num_workers: 4
  performance:
    enabled: true
    training: false
    params:
      accuracy: true
      auc: false
      categorical_loglikelihood: true
      mse: false
      cosine_similarity: false
    training_splits: ["valid"]
    final_splits: ["valid", "test"]
  information: { enabled: false, training: false, params: {} }
  correlation: { enabled: false, training: false, params: {} }
  ablation: { enabled: false, training: false, params: {} }
  synapse_turnover: { enabled: false, training: false, params: {} }
  noise_perturbation: { enabled: false, training: false, params: {} }
  weight: { enabled: false, training: false, params: {} }
  single_layer_contribution: { enabled: false, training: false, params: {} }
  synaptic_activation: { enabled: false, training: false, params: {} }
  branch_activation: { enabled: false, training: false, params: {} }
  compartment_statistics: { enabled: false, training: false, params: {} }
  compartment_snr: { enabled: false, training: false, params: {} }

wandb:
  use_wandb: false
  entity: ""
  project: "dendritic-sweeps"
  group: "alexnet_fc_replacement"
  tags: ["alexnet","k1","signed_sparse_point_neuron","imagenet","noproj","k169","input_fanin_matched"]

outputs:
  run_name: "alexnet_k1_ne4096_point_sparse169_ddp"
  results_dir: "outputs"

distributed:
  mode: ddp
  fsdp:
    sharding_strategy: "FULL_SHARD"
    mixed_precision: true
    cpu_offload: false
    min_num_params: 1000000
    reduce_communication_overhead: true
    limit_all_gathers: true
    forward_prefetch: true
    sync_module_states: true
    use_orig_params: true
    backward_prefetch: "BACKWARD_PRE"
    gradient_checkpointing: false
