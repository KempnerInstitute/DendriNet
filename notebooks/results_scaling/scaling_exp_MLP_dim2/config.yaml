model:
  task: classification
  probabilistic: true
  network:
    type: MLP
    parameters:
      excitatory_layer_sizes:
      - 10
      inhibitory_layer_sizes:
      - 20
      excitatory_branch_factors:
      - 2
      - 2
      inhibitory_branch_factors: []
      reactivate: true
      somatic_synapses: true
      ee_synapses_per_branch_per_layer:
      - 10
      ei_synapses_per_branch_per_layer:
      - 100
      ie_synapses_per_branch_per_layer:
      - 1
      ii_synapses_per_branch_per_layer: []
      topk_init_method: xavier_normal
      use_shunting: false
      reactivation_type: param_tanh
      reactivation_strategy: inverse
      blocklinear_strategy: block_conductance_dynamic
      enable_branch_outputs: false
      output_layer: false
train:
  learning_strategy: mle
  run_name: mnist_einet
  seed: 0
  train_valid_split: 0.8
  lr: 0.01
  epochs: 20
  batch_size: 512
  grad_clip_value: 5
  epochs_per_layer: 50
  pretrain_epochs: 10
  weight_decay_rate: 0.1
task:
  dataset: cifar10
  data_path: /n/holylabs/LABS/kempner_dev/Users/hsafaai/datasets/datasets
  parameters: {}
wandb:
  entity: houman_safaai-harvard-university
  project: dendritic_cifar10
  group: debug
  tags:
  - cifar10
  use_wandb: false
visualization:
  enabled: false
  save_path: /n/holylabs/LABS/kempner_dev/Users/hsafaai/results/dendritic_modeling/results
  visualize_epochs:
  - 10
  - 30
  plots:
  - branch_info
  - ablation
