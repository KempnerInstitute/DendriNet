# Python and pip only: the library and its dependencies, including the PyTorch
# CUDA wheels, install with pip so that the tested versions can be pinned:
#
#   conda env create -f setup/environment.yml
#   conda activate dendritic_env
#   pip install -e ".[test]" -c setup/constraints/core-py310-torch2.9.1.txt
name: dendritic_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
