name: dendritic_env
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # Core Python. The package supports Python 3.10+; this env defaults to 3.11.
  - python=3.11

  # PyTorch ecosystem
  - pytorch>=2.0.0,!=2.6.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1  # Adjust CUDA version as needed

  # Core scientific computing
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-learn

  # Configuration and utilities
  - omegaconf>=2.3.0
  - pyyaml
  - python-dateutil
  - tqdm

  # Machine learning and experiment tracking
  - wandb
  - tensorboard
  - seaborn
  - plotly

  # TensorFlow (for DVC integration)
  - tensorflow>=2.16.0
  - tensorflow-probability

  # Development and analysis
  - jupyter
  - ipykernel

  # Testing dependencies
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-mock>=3.10.0
  - pytest-timeout>=2.1.0
  - pytest-xdist>=3.0.0
  - coverage
  - networkx  # For graph/network testing

  # Code quality and formatting
  - ruff=0.15.1
  - mypy>=1.0  # Removed upper bound to allow Python 3.11 compatibility
  - black=24.10.0  # Updated to fix PYSEC-2024-48 vulnerability
  - isort=5.13.2
  - pre-commit>=3.0.0

  # Documentation
  - sphinx
  - sphinx-rtd-theme

  # Install via pip (packages not available in conda)
  - pip
  - pip:
    - torchinfo
    - tf-keras
    - omegaconf>=2.3.0  # Ensure latest version via pip if conda version is old
    - mock  # Additional mocking utilities
    - sphinxcontrib-napoleon
    - myst-parser
    - nbsphinx
    - recommonmark
    - sphinx-copybutton
    - sphinxcontrib-bibtex
