<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 34px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .label { font: 600 22px "DejaVu Sans", Arial, sans-serif; fill: #16324f; }
      .body { font: 400 18px "DejaVu Sans", Arial, sans-serif; fill: #284b63; }
      .small { font: 400 16px "DejaVu Sans", Arial, sans-serif; fill: #3c5666; }
      .box { fill: #f8fbfd; stroke: #89a9bf; stroke-width: 2.5; rx: 22; }
      .accent { fill: #e8f3f8; stroke: #4b8aa8; stroke-width: 2.5; rx: 22; }
      .artifact { fill: #fff8ec; stroke: #c18b3b; stroke-width: 2.5; rx: 22; }
      .arrow { stroke: #4b6f88; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#4b6f88"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="70" class="title">Dendritic Modeling: Engineering System Overview</text>

  <rect x="60" y="130" width="220" height="130" class="accent"/>
  <text x="90" y="175" class="label">Configs</text>
  <text x="90" y="208" class="body">YAML experiments</text>
  <text x="90" y="234" class="body">Structured defaults</text>

  <rect x="340" y="130" width="240" height="130" class="box"/>
  <text x="370" y="175" class="label">Scripts + Setup</text>
  <text x="370" y="208" class="body">Canonicalize aliases</text>
  <text x="370" y="234" class="body">Initialize environment</text>

  <rect x="640" y="130" width="240" height="130" class="box"/>
  <text x="670" y="175" class="label">Datasets</text>
  <text x="670" y="208" class="body">Standard loaders</text>
  <text x="670" y="234" class="body">Synthetic tasks</text>

  <rect x="940" y="130" width="200" height="130" class="accent"/>
  <text x="970" y="175" class="label">Factory</text>
  <text x="970" y="208" class="body">Dispatch by</text>
  <text x="970" y="234" class="body">core.type</text>

  <rect x="120" y="350" width="240" height="150" class="box"/>
  <text x="150" y="395" class="label">Feedforward Cores</text>
  <text x="150" y="428" class="body">E/I networks</text>
  <text x="150" y="454" class="body">Dendritic MLPs</text>

  <rect x="420" y="350" width="360" height="150" class="accent"/>
  <text x="450" y="395" class="label">Recurrent Cores</text>
  <text x="450" y="428" class="body">Unified recurrent E/I</text>
  <text x="450" y="454" class="body">GRU / LSTM / vanilla RNN</text>

  <rect x="840" y="350" width="240" height="150" class="box"/>
  <text x="870" y="395" class="label">Training</text>
  <text x="870" y="428" class="body">Backprop</text>
  <text x="870" y="454" class="body">Local rules</text>

  <rect x="180" y="560" width="300" height="110" class="box"/>
  <text x="210" y="605" class="label">Analysis Manager</text>
  <text x="210" y="638" class="body">Reusable analyzers</text>

  <rect x="620" y="560" width="360" height="110" class="artifact"/>
  <text x="650" y="605" class="label">Artifacts</text>
  <text x="650" y="632" class="body">config.json, checkpoints, metrics,</text>
  <text x="650" y="656" class="body">init_gate_stats.json, figures</text>

  <path d="M280 195 L340 195" class="arrow"/>
  <path d="M580 195 L640 195" class="arrow"/>
  <path d="M880 195 L940 195" class="arrow"/>
  <path d="M1040 260 L1040 330 L600 330 L600 350" class="arrow"/>
  <path d="M1040 260 L1040 330 L240 330 L240 350" class="arrow"/>
  <path d="M1040 260 L1040 330 L960 330 L960 350" class="arrow"/>
  <path d="M960 500 L960 535 L820 535 L820 560" class="arrow"/>
  <path d="M600 500 L600 535 L330 535 L330 560" class="arrow"/>
  <path d="M480 615 L620 615" class="arrow"/>

  <text x="62" y="705" class="small">Shared control plane: configuration -&gt; factory -&gt; model/training -&gt; analysis/artifacts</text>
</svg>
