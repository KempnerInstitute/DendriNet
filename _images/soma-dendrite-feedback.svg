<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs>
    <style>
      .title { font: 700 28px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 500 17px "DejaVu Sans", Arial, sans-serif; fill: #45637a; }
      .card { fill: #f8fbfd; stroke: #8eafc3; stroke-width: 2; }
      .lvl { fill: #e3eefb; stroke: #2f6fb0; stroke-width: 2.2; }
      .soma { fill: #d7e8d8; stroke: #4f8a5b; stroke-width: 2.4; }
      .name { font: 700 18px "DejaVu Sans", Arial, sans-serif; fill: #143350; }
      .lbl { font: 600 15px "DejaVu Sans", Arial, sans-serif; fill: #173451; }
      .kv { font: 400 15px "DejaVu Sans", Arial, sans-serif; fill: #2d4b62; }
      .small { font: 400 13px "DejaVu Sans", Arial, sans-serif; fill: #546c7e; }
      .ff { stroke: #2f6fb0; stroke-width: 2.8; fill: none; }
      .fb { stroke: #7a5aa6; stroke-width: 2.8; fill: none; stroke-dasharray: 8 6; }
    </style>
    <marker id="ff" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2f6fb0"/></marker>
    <marker id="fb" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#7a5aa6"/></marker>
  </defs>
  <text class="title" x="40" y="42">Soma-to-dendrite feedback (apical backward effect)</text>
  <text class="subtitle" x="40" y="70">core soma_feedback: the soma output projects back onto selected dendritic levels at the next timestep, modulating their integration. Recurrent-only.</text>

  <!-- dendritic levels (distal at top) -->
  <rect class="lvl" x="120" y="110" width="240" height="60" rx="12"/>
  <text class="lbl" x="240" y="146" text-anchor="middle">level 0 (distal dendrite)</text>
  <rect class="lvl" x="120" y="210" width="240" height="60" rx="12"/>
  <text class="lbl" x="240" y="246" text-anchor="middle">level 1 (proximal dendrite)</text>
  <rect class="soma" x="120" y="320" width="240" height="64" rx="12"/>
  <text class="lbl" x="240" y="357" text-anchor="middle">soma (rate or LIF spike)</text>

  <!-- feedforward up the tree -->
  <path class="ff" d="M240,320 L240,272" marker-end="url(#ff)"/>
  <path class="ff" d="M240,210 L240,172" marker-end="url(#ff)"/>
  <text class="small" x="252" y="300">feedforward integration (distal -> soma)</text>

  <!-- feedback from soma back to levels (delayed, prev timestep) -->
  <path class="fb" d="M360,352 C470,352 470,140 362,140" marker-end="url(#fb)"/>
  <path class="fb" d="M360,360 C440,400 440,240 362,240" marker-end="url(#fb)"/>
  <text class="lbl" x="486" y="250" fill="#5b3f86">soma output (t-1)</text>
  <text class="small" x="486" y="272">projects back to feedback levels</text>

  <!-- modes panel -->
  <rect class="card" x="600" y="110" width="540" height="300" rx="16"/>
  <text class="name" x="624" y="142">Feedback modes (soma_feedback_mode)</text>
  <text class="kv" x="624" y="176">additive  : adds w_fb * soma_out to the level's branch current</text>
  <text class="kv" x="624" y="204">shunting  : adds soma_out as a conductance with reversal</text>
  <text class="kv" x="624" y="232">            (soma_feedback_reversal) -> divisive/gating effect</text>
  <text class="kv" x="624" y="260">gated     : soma_out multiplicatively gates the level</text>
  <text class="name" x="624" y="300">Controls</text>
  <text class="kv" x="624" y="330">source: soma_output | spike_readout</text>
  <text class="kv" x="624" y="356">levels: which dendritic levels receive feedback</text>
  <text class="kv" x="624" y="382">strength: scalar or per-level (learnable_strength)</text>

  <!-- behavior note -->
  <rect class="card" x="120" y="430" width="1020" height="100" rx="14"/>
  <text class="name" x="142" y="460">Why it matters</text>
  <text class="kv" x="142" y="488">A top-down loop: the neuron's own output (or spikes) returns to its dendrites one step later, letting</text>
  <text class="kv" x="142" y="512">somatic state shape subsequent dendritic integration (apical amplification / context gating). init_std=0 keeps it inert at start.</text>
</svg>
