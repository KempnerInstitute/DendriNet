<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Typed synapse kinetics in dendritic populations</title>
  <desc id="desc">Excitatory and inhibitory source streams are split into receptor-specific traces before entering the dendritic shunting or additive operator.</desc>
  <defs>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0eeff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4e1"/>
      <stop offset="100%" stop-color="#fff8f6"/>
    </linearGradient>
    <linearGradient id="neutral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="134%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#173451" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#48677e"/>
    </marker>
    <marker id="eArrow" markerWidth="13" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#2f6fb0"/>
    </marker>
    <marker id="iArrow" markerWidth="13" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#b84a43"/>
    </marker>
    <style>
      .title { font: 700 34px "DejaVu Sans", Arial, sans-serif; fill: #12324d; }
      .subtitle { font: 400 16px "DejaVu Sans", Arial, sans-serif; fill: #4e6678; }
      .card { filter: url(#shadow); stroke-width: 2.1; rx: 18; }
      .name { font: 700 19px "DejaVu Sans", Arial, sans-serif; fill: #173451; }
      .body { font: 400 13.5px "DejaVu Sans", Arial, sans-serif; fill: #334f63; }
      .small { font: 400 12.5px "DejaVu Sans", Arial, sans-serif; fill: #617587; }
      .code { font: 400 12.5px "DejaVu Sans Mono", Consolas, monospace; fill: #2d4c62; }
      .axis { stroke: #9fb2c1; stroke-width: 1.4; }
      .eCurve { stroke: #2f6fb0; stroke-width: 3; fill: none; }
      .iCurve { stroke: #b84a43; stroke-width: 3; fill: none; }
      .arrow { stroke: #48677e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .eArrow { stroke: #2f6fb0; stroke-width: 3; fill: none; marker-end: url(#eArrow); }
      .iArrow { stroke: #b84a43; stroke-width: 3; fill: none; marker-end: url(#iArrow); }
      .sum { fill: #ffffff; stroke: #cad9e5; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .formula { font: 400 15px "DejaVu Sans Mono", Consolas, monospace; fill: #1f3d52; }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#ffffff"/>
  <text class="title" x="46" y="52">Synapse types: receptor kinetics before dendritic integration</text>
  <text class="subtitle" x="46" y="80">Source-population polarity selects E or I. Within each stream, synapse_types split conductance into receptor-like traces with fractions, taus, reversals, voltage gates, and optional STP.</text>

  <rect class="card" x="48" y="138" width="180" height="92" fill="url(#neutral)" stroke="#89a8bb"/>
  <text class="name" x="74" y="172">E source stream</text>
  <text class="body" x="74" y="198">from excitatory</text>
  <text class="body" x="74" y="216">populations or input_e</text>
  <rect class="card" x="48" y="300" width="180" height="92" fill="url(#neutral)" stroke="#89a8bb"/>
  <text class="name" x="74" y="334">I source stream</text>
  <text class="body" x="74" y="360">from inhibitory</text>
  <text class="body" x="74" y="378">populations or input_i</text>

  <rect class="card" x="302" y="112" width="238" height="150" fill="url(#blueCard)" stroke="#2f6fb0"/>
  <text class="name" x="326" y="144">AMPA</text>
  <path class="axis" d="M326,226 L508,226 M326,226 L326,168"/>
  <path class="eCurve" d="M326,226 C336,226 342,174 356,174 C386,176 432,220 508,225"/>
  <text class="body" x="326" y="246">fast excitation, linear</text>
  <text class="small" x="326" y="264">fraction, tau or tau_decay</text>

  <rect class="card" x="582" y="112" width="238" height="150" fill="url(#blueCard)" stroke="#2f6fb0"/>
  <text class="name" x="606" y="144">NMDA</text>
  <path class="axis" d="M606,226 L788,226 M606,226 L606,168"/>
  <path class="eCurve" d="M606,226 C620,226 626,190 644,184 C690,170 742,192 788,214"/>
  <text class="body" x="606" y="246">slow excitation, Mg block</text>
  <text class="small" x="606" y="264">voltage-gated conductance</text>

  <rect class="card" x="302" y="278" width="238" height="150" fill="url(#redCard)" stroke="#b84a43"/>
  <text class="name" x="326" y="310">GABA_A</text>
  <path class="axis" d="M326,392 L508,392 M326,392 L326,334"/>
  <path class="iCurve" d="M326,392 C336,392 342,340 356,340 C386,342 432,386 508,391"/>
  <text class="body" x="326" y="412">fast inhibition</text>
  <text class="small" x="326" y="430">shunting or hyperpolarizing</text>

  <rect class="card" x="582" y="278" width="238" height="150" fill="url(#redCard)" stroke="#b84a43"/>
  <text class="name" x="606" y="310">GABA_B</text>
  <path class="axis" d="M606,392 L788,392 M606,392 L606,334"/>
  <path class="iCurve" d="M606,392 C620,392 626,356 644,350 C690,336 742,358 788,380"/>
  <text class="body" x="606" y="412">slow inhibition</text>
  <text class="small" x="606" y="430">long tau, lower reversal</text>

  <path class="eArrow" d="M228,184 C260,184 268,178 300,178"/>
  <path class="eArrow" d="M228,184 C268,184 536,178 580,178"/>
  <path class="iArrow" d="M228,346 C260,346 268,344 300,344"/>
  <path class="iArrow" d="M228,346 C268,346 536,344 580,344"/>

  <rect class="sum" x="888" y="128" width="228" height="112"/>
  <text class="name" x="914" y="160">E conductance bank</text>
  <text class="code" x="914" y="188">g_E = sum_r f_r g_r</text>
  <text class="body" x="914" y="214">AMPA + NMDA + custom E</text>
  <rect class="sum" x="888" y="292" width="228" height="112"/>
  <text class="name" x="914" y="324">I conductance bank</text>
  <text class="code" x="914" y="352">g_I = sum_r f_r g_r</text>
  <text class="body" x="914" y="378">GABA_A + GABA_B + custom I</text>

  <path class="eArrow" d="M820,186 L886,186"/>
  <path class="iArrow" d="M820,352 L886,352"/>

  <rect class="sum" x="1192" y="174" width="242" height="190"/>
  <text class="name" x="1218" y="208">Dendritic operator</text>
  <text class="formula" x="1218" y="240">shunting:</text>
  <text class="formula" x="1218" y="264">V = E / (1 + E + I)</text>
  <text class="formula" x="1218" y="302">additive:</text>
  <text class="formula" x="1218" y="326">V = E - I</text>
  <text class="small" x="1218" y="352">then reactivation gate per branch</text>

  <path class="arrow" d="M1116,184 C1152,184 1158,230 1190,238"/>
  <path class="arrow" d="M1116,348 C1152,348 1158,308 1190,300"/>

  <rect class="sum" x="48" y="496" width="420" height="206"/>
  <text class="name" x="74" y="530">Where synapse_types live</text>
  <text class="code" x="74" y="560">model.core.synapse_types</text>
  <text class="code" x="74" y="584">population_defaults.synapse_types</text>
  <text class="code" x="74" y="608">populations[].population.synapse_types</text>
  <text class="body" x="74" y="640">Population-level blocks override defaults, so</text>
  <text class="body" x="74" y="662">PV and SST can use different GABA kinetics.</text>
  <text class="small" x="74" y="686">Disabled synapse_types preserve the original single E/I traces.</text>

  <rect class="sum" x="526" y="496" width="432" height="206"/>
  <text class="name" x="552" y="530">Polarity and receptor type</text>
  <text class="body" x="552" y="560">Population polarity says who sends the signal:</text>
  <text class="code" x="552" y="584">pyr -> target E stream</text>
  <text class="code" x="552" y="608">pv/sst -> target I stream</text>
  <text class="body" x="552" y="640">Synapse type says how the selected stream is filtered:</text>
  <text class="code" x="552" y="664">AMPA, NMDA, GABA_A, GABA_B, custom</text>
  <text class="small" x="552" y="688">Do not create a separate population just to change receptor kinetics.</text>

  <rect class="sum" x="1016" y="496" width="418" height="206"/>
  <text class="name" x="1042" y="530">Training and gradients</text>
  <text class="body" x="1042" y="560">Receptor fractions are fixed values; the</text>
  <text class="body" x="1042" y="582">synaptic weights train through the traces.</text>
  <text class="body" x="1042" y="604">STP state follows a detached current unless</text>
  <text class="code" x="1042" y="636">stp_differentiable_state: true.</text>
  <text class="code" x="1042" y="660">Top-K selects the synapses; types filter them.</text>
  <text class="small" x="1042" y="688">For recurrent runs, traces update at each timestep.</text>
</svg>
